let CUR='now';
function go(t){
  CUR=t;
  $$('.tab').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+t));
  document.body.classList.toggle('wide',t==='admin');
  window.scrollTo(0,0);
  if(t==='now')renderNow();
  if(t==='sched')renderSched();
  if(t==='req')renderReq();
  if(t==='swap'){renderSwap();wireCoverage();}
  if(t==='edit')renderEdit();
  if(t==='admin')renderAdmin();
}
function wireTabs(){$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));}
if(ADMIN_HTML){
  const bar=$('.tabsin');
  bar.style.gridTemplateColumns='repeat(6,1fr)';
  bar.appendChild(el('button','tab',
    '<svg viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16z"/></svg>Edit')).dataset.t='edit';
  bar.appendChild(el('button','tab',
    '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Admin')).dataset.t='admin';
  document.querySelector('main').appendChild(el('section','pane')).id='pane-edit';
  document.querySelector('main').appendChild(el('section','pane')).id='pane-admin';
}
wireTabs();

/* ---------- boot ---------- */
async function bootApi(){
  await signInApi();
  if(SESSION){
    try{const s=await api('/schedule');applyEdits(s.overrides||[]);}catch(e){applyEdits([]);}
    await loadPersonData();
    renderNow();                       // the hero may now be a different shift
    if(CUR==='sched')renderSched();
  }else{
    // no API session (offline or code missing) — fall back to the baked-in snapshot
    MYREQ=(DATA.requests&&ME)?DATA.requests[ME]||{}:{};
  }
  if(CUR==='req')renderReq();
  if(CUR==='swap')renderSwap();
}
function accountBar(){
  // There was only a name chip that opened a sheet; people looked for "sign out" and found
  // nothing. Make it explicit and always present.
  let a=document.querySelector('#acctBar');
  if(!a){a=el('div','acctbar');a.id='acctBar';document.querySelector('header').appendChild(a);}
  a.innerHTML='<button class="acctwho" id="profileBtn">'+esc((ACCT&&ACCT.person)||'Signed in')+
    (ROLE==='admin'?' · admin':'')+'</button>'+
    '<button class="acctout" id="signOutBtn">Sign out</button>';
  const pb=document.querySelector('#profileBtn');
  if(pb)pb.onclick=()=>ME?openBlockStats():null;
  document.querySelector('#signOutBtn').onclick=()=>{
    try{sessionStorage.clear();localStorage.removeItem('ccpsa_me');}catch(e){}
    location.reload();
  };
}
function adminBar(){
  if(ROLE!=='admin')return;
  if(document.querySelector('#admBar'))return;
  const bar=el('div','admbar');bar.id='admBar';
  bar.innerHTML=(ME?'<button class="ab on" data-v="mine">My schedule</button>':'')+
    '<button class="ab'+(ME?'':' on')+'" data-v="admin">Admin view</button>'+
    '<button class="ab" data-v="pick">Physicians</button>';
  document.querySelector('header').appendChild(bar);
  bar.querySelectorAll('.ab').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(v==='pick'){openGate();return;}
    hideAdminView();
    bar.querySelectorAll('.ab').forEach(x=>x.classList.toggle('on',x===b));
    if(v==='admin'){showAdminView();}
    else{hideAdminView();if(ACCT&&ACCT.person){ME=ACCT.person;boot();go('now');}}
  });
}
function showAdminView(){
  if(!ADMIN_GRANT){ askStepUp(showAdminView); return; }
  let w=document.querySelector('#admWrap');
  if(!w){
    w=el('section','pane admwrap');w.id='admWrap';
    w.innerHTML='<div class="admload" id="admLoad">Loading the dashboard…</div>'+
      '<iframe id="admFrame" title="Admin dashboard"></iframe>';
    document.querySelector('main').appendChild(w);
  }
  $$('.pane').forEach(p=>p.classList.remove('on'));
  w.classList.add('on');
  document.querySelector('.tabs').style.display='none';
  document.body.classList.add('adminmode');
  sizeAdminFrame();
  if(!w.dataset.loaded){
    w.dataset.loaded='1';
    fetch(API+'/dashboard?grant='+encodeURIComponent(ADMIN_GRANT||''),
          {headers:{Authorization:'Bearer '+(SESSION&&SESSION.token)}})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
      .then(html=>{
        const f=document.querySelector('#admFrame');
        const d=f.contentDocument||f.contentWindow.document;
        d.open();d.write(html);d.close();
        const l=document.querySelector('#admLoad'); if(l)l.remove();
      })
      .catch(e=>{
        w.dataset.loaded='';
        if(String(e.message).includes('401')){
          ADMIN_GRANT=null;
          try{sessionStorage.removeItem('__grant');}catch(_){}
          askStepUp(showAdminView);
          return;
        }
        const l=document.querySelector('#admLoad');
        if(l)l.textContent='Could not load the dashboard ('+e.message+'). Try again.';
      });
  }
}
// The portal is phone-first (.wrap is 600px), so the dashboard was being squeezed into a
// phone-width column on a laptop — which is what made its text overlap. In admin mode the pane
// breaks out of that column and the frame is sized to the real viewport.
function sizeAdminFrame(){
  const f=document.querySelector('#admFrame'); if(!f)return;
  const top=f.getBoundingClientRect().top;
  const h=Math.max(320,(window.innerHeight||600)-top);
  f.style.height=h+'px';
}
window.addEventListener('resize',()=>{if(document.body.classList.contains('adminmode'))sizeAdminFrame();});
window.addEventListener('orientationchange',()=>setTimeout(sizeAdminFrame,250));

function hideAdminView(){
  const w=document.querySelector('#admWrap'); if(w)w.classList.remove('on');
  const t=document.querySelector('.tabs');
  if(t){t.style.display='';t.hidden=false;}   // Schedule / Requests / Swaps come back
  document.body.classList.remove('adminmode');
}
// Everything that belongs to ONE person. Called at boot and again whenever the admin switches
// who they are looking at, so what is on screen is always that person's own data.
let LOADED_FOR=null;
async function loadPersonData(){
  if(!SESSION)return;
  const viewing=onBehalf()?('?person='+encodeURIComponent(ME)):'';
  try{const r=await api('/requests'+viewing);MYREQ=r.requests||{};
      CFG={...(CFG||{}),deadline:r.deadline,locked:r.locked,allowance:r.allowance};}catch(e){MYREQ={};}
  await loadSwaps();
  await loadCoverage();
  if(onBehalf())MYSWAPS=(MYSWAPS||[]).filter(w=>w.fromPerson===ME||w.toPerson===ME);
  REQSAVED=null;                  // a confirmation from the previous person would be a lie
  LOADED_FOR=ME;
  if(CUR==='req')renderReq();
  if(CUR==='swap')renderSwap();
}
function boot(){
  const p=DATA.providers[ME]||{};
  if(SESSION&&ME!==LOADED_FOR)loadPersonData();
  $('#whoami').hidden=false;
  $('#whoNm').textContent=ME?((p.first?p.first.charAt(0)+'. ':'')+ME)
                            :((ACCT&&ACCT.label)||'Admin');
  accountBar();
  if(ROLE==='clinic'){ renderClinicView(); return; }
  adminBar();
  const vb=document.querySelector('#viewingBanner');
  if(ROLE==='admin'&&ME&&ACCT&&ME!==ACCT.person){
    if(!vb){
      const d=el('div','viewbar');d.id='viewingBanner';
      document.querySelector('header').appendChild(d);
    }
    document.querySelector('#viewingBanner').innerHTML=
      'Viewing <b>'+esc(fullOf(ME))+'</b> — their schedule, requests and swaps';
  }else if(vb){vb.remove();}
  if(IS_ADMIN_ONLY&&!BOOTED){BOOTED=true;showAdminView();return;}
  BOOTED=true;
  go('now');
}
/* ---------- sign in, then load ----------
   Nothing renders until the API says who you are and hands back your schedule. */

/* A device that has already passed 2FA as this person does not need the code again — the token
   is signed and expires in 90 days, so it proves that and nothing more (client 8/17). */
function rememberedDevice(){ try{return localStorage.getItem('__dev')||'';}catch(e){return '';} }
function keepDevice(tok){ if(tok){try{localStorage.setItem('__dev',tok);}catch(e){}} }
// Once per session, not once per reload: the grant lives in sessionStorage, so it survives a
// refresh but dies with the tab (client 8/17).
let ADMIN_GRANT=null;
try{ADMIN_GRANT=sessionStorage.getItem('__grant')||null;}catch(e){}
/* Entering the admin view asks for a fresh code: that is where the schedule can be changed. */
function askStepUp(then){
  sheet('Admin view',
    `<div class="sub">Enter the 6-digit code from your authenticator app to open the admin view.</div>
     <label class="lbl" for="suCode">Code</label>
     <input class="inp siCode" id="suCode" inputmode="numeric" autocomplete="one-time-code"
            maxlength="6" placeholder="000000">
     <div class="msg" id="suMsg"></div>
     <div class="btnrow"><button class="btn pri" id="suGo">Unlock</button>
       <button class="btn" id="suCancel">Cancel</button></div>`);
  const m=$('#suMsg');
  const go=async()=>{
    m.textContent='Checking…'; m.className='msg on';
    try{
      const j=await api('/stepup',{method:'POST',body:JSON.stringify({totp:$('#suCode').value.trim()})});
      ADMIN_GRANT=j.grant;
      try{sessionStorage.setItem('__grant',ADMIN_GRANT);}catch(e){}
      closeSheet(); then();
    }catch(e){
      if(e.payload&&e.payload.need==='enrol2fa'){
        m.textContent='Set up an authenticator first — open Account settings.'; m.className='msg on bad';
      }else{ m.textContent=e.message||'That code is not right.'; m.className='msg on bad'; }
    }
  };
  $('#suGo').onclick=go;
  $('#suCancel').onclick=()=>{closeSheet();markBar(ME?'mine':'pick');hideAdminView();};
  const c=$('#suCode');
  c.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go();}});
  c.addEventListener('input',()=>{if(c.value.replace(/\D/g,'').length===6)go();});
  setTimeout(()=>c.focus(),60);
}

function siShell(body){
  return `<div class="signin"><div class="siCard">
    <div class="siLogo">⚡</div>
    <h1 class="siH">My schedule</h1>
    <div class="siSub">CCPSA Critical Care</div>
    ${body}
    <div class="siMsg" id="siMsg"></div>
  </div></div>`;
}

/* Show/hide on every password box. Typing a 12+ character passphrase blind on a phone keyboard
   is where most sign-in attempts actually fail. */
function wireReveal(root){
  (root||document).querySelectorAll('input[type=password]').forEach(inp=>{
    if(inp.dataset.reveal)return;
    inp.dataset.reveal='1';
    const wrap=document.createElement('div');
    wrap.className='pwwrap';
    inp.parentNode.insertBefore(wrap,inp);
    wrap.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pweye'; b.textContent='Show';
    b.setAttribute('aria-label','Show password');
    b.onclick=()=>{
      const on=inp.type==='password';
      inp.type=on?'text':'password';
      b.textContent=on?'Hide':'Show';
      b.setAttribute('aria-label',(on?'Hide':'Show')+' password');
      inp.focus();
    };
    wrap.appendChild(b);
  });
}

function siPaint(body){
  const old=document.querySelector('.signin'); if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',siShell(body));
  wireReveal(document.querySelector('.signin'));
}
function siSay(t,bad){const m=document.querySelector('#siMsg'); if(!m)return;
  m.textContent=t||''; m.className='siMsg'+(t?' on':'')+(bad?' bad':'');}

/* ---------- live refresh ----------
   The portal used to fetch its data once at sign-in and never again, so a shift the scheduling
   lead changed this morning never reached a session opened last night — the API was right, the
   page was just holding a stale copy. Poll when the tab regains focus and on a slow interval,
   and re-render only when something has actually changed. */
let LAST_EDIT_SIG=null, REFRESH_TIMER=null;
function editSig(list){
  return (list||[]).map(o=>o.id+':'+(o.at||'')).sort().join('|');
}
async function refreshLive(force){
  if(!SESSION||!SESSION.token)return;
  try{
    const r=await fetch(API+'/portal',{headers:{Authorization:'Bearer '+SESSION.token},cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    const sig=editSig(j.edits);
    if(!force&&sig===LAST_EDIT_SIG)return;      // nothing changed — leave the view alone
    const first=LAST_EDIT_SIG===null;
    LAST_EDIT_SIG=sig;
    DATA=j.data;
    CFG={...(CFG||{}),deadline:j.deadline,locked:j.locked,lateContact:j.lateContact};
    applyEdits(j.edits||[]);
    if(!first){
      // Re-render in place. boot() lands on the schedule tab, which for an admin with no
      // schedule of their own means "Choose a physician" — so a background refresh was
      // yanking people out of the admin view every 90 seconds while they were reading it.
      const inAdmin=!!document.querySelector('#admWrap.on');
      const inGroup=!!document.querySelector('#pane-group.on');
      const inClinic=!!document.querySelector('#pane-clinic.on');
      if(inAdmin||inGroup||inClinic){
        if(inGroup)renderGroup();
        if(inClinic)renderClinicView();
        // the admin view is an iframe with its own data; leave it alone
      }else{
        boot();
        if(CUR)go(CUR);
      }
      if(MYCHANGES.length)toastLive('Your schedule was updated');
    }
  }catch(e){ /* offline: keep showing what we have */ }
}
function toastLive(msg){
  let t=document.querySelector('#liveToast');
  if(!t){t=el('div','toastbox');t.id='liveToast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3500);
}
function startLiveRefresh(){
  if(REFRESH_TIMER)clearInterval(REFRESH_TIMER);
  REFRESH_TIMER=setInterval(()=>{if(!document.hidden)refreshLive(false);},90000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshLive(false);});
  window.addEventListener('focus',()=>refreshLive(false));
}

async function loadPortal(token){
  const r=await fetch(API+'/portal',{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||'Could not load your schedule');
  DATA=j.data;
  SESSION={token,person:j.person,role:j.role};
  // The dashboard runs in a same-origin frame and reads its identity from sessionStorage, so
  // handing it the session here means signing in once covers both. Without this it showed its
  // own "Sign in" button to someone who had just signed in.
  try{
    sessionStorage.setItem('__tok',token);
    sessionStorage.setItem('__editTok',token);
    sessionStorage.setItem('__acctInfo',JSON.stringify({person:j.person,role:j.role,twoFactor:true}));
  }catch(e){}
  CFG={deadline:j.deadline,locked:j.locked,lateContact:j.lateContact,icsUrl:j.icsUrl};
  setIdentity(j.person,j.role);
  document.body.classList.remove('locked');
  const g=document.querySelector('.signin'); if(g)g.remove();
  LAST_EDIT_SIG=editSig(j.edits);
  applyEdits(j.edits||[]);
  boot(); bootApi();
  startLiveRefresh();
}

/* Step 1 — email and password only. The 6-digit code gets its own screen: putting it on the
   login form asks for something most people do not have open yet, and makes a fresh account
   look like it is missing a field. */
function stepPassword(email){
  siPaint(`
    <label class="siL" for="siEmail">Email</label>
    <input class="siI" id="siEmail" type="email" autocomplete="email" autocapitalize="none"
           spellcheck="false" value="${email?String(email).replace(/"/g,'&quot;'):''}">
    <label class="siL" for="siPw">Password</label>
    <input class="siI" id="siPw" type="password" autocomplete="current-password">
    <button class="siB" id="siGo">Sign in</button>
    <div class="siNote">No account yet? <a href="/account/">Set one up</a> · Trouble? Contact Dr. Nadon.</div>`);
  const go=async()=>{
    const em=document.querySelector('#siEmail').value.trim();
    const pw=document.querySelector('#siPw').value;
    if(!em||!pw){siSay('Enter your email and password.',true);return;}
    siSay('Signing in…');
    try{
      const r=await fetch(API+'/session',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:em,password:pw,device:rememberedDevice()})});
      const j=await r.json();
      if(r.ok){
        try{sessionStorage.setItem('__tok',j.token);}catch(e){}
        keepDevice(j.device);
        // Only offer to set up 2FA to someone who has none. A returning user on a trusted
        // device already has it and was being asked to set it up again.
        if(j.twoFactor){ await loadPortal(j.token); return; }
        stepOffer2fa(em,pw,j.token);
        return;
      }
      if(j.need==='2fa'){ step2fa(em,pw); return; }
      siSay(j.error||'Could not sign in',true);
    }catch(e){ siSay('Could not reach the server.',true); }
  };
  document.querySelector('#siGo').onclick=go;
  ['siEmail','siPw'].forEach(id=>{const e=document.querySelector('#'+id);
    e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go();}});});
  setTimeout(()=>{const e=document.querySelector('#siEmail'); if(e&&!e.value)e.focus();
                  else document.querySelector('#siPw').focus();},60);
}

/* Step 2a — this account already has an authenticator. */
function step2fa(email,pw){
  siPaint(`
    <div class="siStep">Step 2 of 2</div>
    <div class="siLead">Enter the 6-digit code from your authenticator app.</div>
    <input class="siI siCode" id="siTotp" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="000000">
    <button class="siB" id="siGo2">Verify and sign in</button>
    <button class="siGhost" id="siBack">Back</button>
    <div class="siNote">Lost your phone? Enter one of your recovery codes above instead.</div>`);
  const go=async()=>{
    const code=document.querySelector('#siTotp').value.trim();
    if(!code){siSay('Enter the code from your app.',true);return;}
    siSay('Checking…');
    try{
      const r=await fetch(API+'/session',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password:pw,totp:code,device:rememberedDevice()})});
      const j=await r.json();
      if(!r.ok){siSay(j.error||'That code is not right.',true);return;}
      try{sessionStorage.setItem('__tok',j.token);}catch(e){}
      keepDevice(j.device);
      await loadPortal(j.token);
    }catch(e){ siSay('Could not reach the server.',true); }
  };
  document.querySelector('#siGo2').onclick=go;
  document.querySelector('#siBack').onclick=()=>stepPassword(email);
  const t=document.querySelector('#siTotp');
  t.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go();}});
  t.addEventListener('input',()=>{if(t.value.replace(/\D/g,'').length===6)go();});
  setTimeout(()=>t.focus(),60);
}

/* Step 2b — no authenticator yet. Offered, not imposed: locking someone out of their own
   schedule because they have not set up 2FA yet is worse than letting them in and asking again. */
function stepOffer2fa(email,pw,token){
  siPaint(`
    <div class="siStep">One more thing</div>
    <div class="siLead">Protect your account with an authenticator app. It takes about a minute,
      and means a stolen password alone is not enough to open your schedule.</div>
    <button class="siB" id="siSetup">Set up two-factor</button>
    <button class="siGhost" id="siLater">Not now — take me to my schedule</button>`);
  document.querySelector('#siLater').onclick=()=>loadPortal(token).catch(e=>siSay(e.message,true));
  document.querySelector('#siSetup').onclick=async()=>{
    siSay('Preparing…');
    try{
      const r=await fetch(API+'/account',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({action:'reset2fa',password:pw})});
      const j=await r.json();
      if(!r.ok){siSay(j.error||'Could not start setup',true);return;}
      stepScan(email,pw,token,j);
    }catch(e){ siSay('Could not reach the server.',true); }
  };
}
function stepScan(email,pw,token,setup){
  siPaint(`
    <div class="siStep">Scan this</div>
    <div class="siLead">Google Authenticator, Authy, 1Password, or the password app on iPhone.</div>
    <div class="siQr"><img src="${setup.totpQr||''}" alt="QR code"></div>
    <div class="siKey">${setup.totpSecret||''}</div>
    <label class="siL" for="siNew">Then enter the 6-digit code</label>
    <input class="siI siCode" id="siNew" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="000000">
    <button class="siB" id="siDone">Turn on and sign in</button>
    <button class="siGhost" id="siSkip">Skip for now</button>`);
  document.querySelector('#siSkip').onclick=()=>loadPortal(token).catch(e=>siSay(e.message,true));
  const go=async()=>{
    siSay('Checking…');
    try{
      const r=await fetch(API+'/account',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({action:'confirm2fa',
                             totp:document.querySelector('#siNew').value.trim()})});
      const j=await r.json();
      if(!r.ok){siSay(j.error||'That code is not right.',true);return;}
      await loadPortal(j.token||token);
    }catch(e){ siSay('Could not reach the server.',true); }
  };
  document.querySelector('#siDone').onclick=go;
  const n=document.querySelector('#siNew');
  n.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go();}});
  setTimeout(()=>n.focus(),60);
}
function showGate(){ stepPassword(''); }

(async function start(){
  document.body.classList.add('locked');
  let tok=null; try{tok=sessionStorage.getItem('__tok');}catch(e){}
  if(tok){ try{ await loadPortal(tok); return; }catch(e){ try{sessionStorage.removeItem('__tok');}catch(_){} } }
  showGate();
})();
</script>
