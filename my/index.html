     physician and that answer arriving there is no correct link to show. This card used to
     render the previous one under the new person's name: the button read "Add Emily Horn's
     shifts" and subscribed you to Bailey's 76 shifts. A calendar subscription is not a page you

/* ---------- what a printed schedule is ----------
   One person's shifts, by month, on white paper: the date, what they are on, and the hours. Not
   the app — the app is a phone layout of cards and a tab bar, and hiding parts of it does not
   produce something anyone would pin to a fridge.

   Built at the moment of printing so it is always the schedule currently being looked at,
   including any change the scheduling lead has just made. */
const SHIFT_HOURS={noc:'7pm – 7am', icu:'7am – 7pm', swing:'1pm – 11pm', clinic:'8am – 5pm'};

window.addEventListener('afterprint',()=>{
  const h=document.querySelector('#printOnly'); if(h)h.innerHTML='';

function renderSched(){
  const pane=$('#pane-sched');

    <button class="btn ${schedView==='cal'?'pri':''}" id="vCal">Calendar</button>

  if(schedView==='cal'){
    const months=[...new Set(DATA.dates.map(i=>i.slice(0,7)))];
    months.forEach(mk=>{
      const y=+mk.slice(0,4),mo=+mk.slice(5)-1;
      const first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate();
      let n=0;DATA.dates.forEach(iso=>{if(iso.slice(0,7)===mk&&dayOf(ME,iso)&&dayOf(ME,iso).s.length)n++;});
      html+=`<div class="month"><h4><b>${MONL[mo]} ${y}</b><span>${n} shift${n===1?'':'s'}</span></h4><div class="grid7">`;
      DOW.forEach(d=>html+=`<div class="dow">${d}</div>`);
      const lead=(first.getDay()+6)%7;
      for(let i=0;i<lead;i++)html+='<div class="cell blank"></div>';
      for(let d=1;d<=dim;d++){
        const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const a=dayOf(ME,iso),rq=DATA.requests[ME]||{};
        const onReq=(rq.on||[]).includes(iso);
        const cmeReq=(rq.cme||[]).includes(iso);
        const offReq=(rq.off||[]).includes(iso)||cmeReq;
        let inner='';
        const shown=(a?a.s:[]).filter(s=>isRealShift(ME,iso,s));
        if(shown.length){
          const ds=shown.filter(s=>META(s).kind!=='noc'),ns=shown.filter(s=>META(s).kind==='noc');
          if(ds.length&&ns.length){       // 24h combo — diagonal split
            // Two colours under one label: take the ink that suits the darker half, so the
            // word cannot disappear into whichever end it happens to sit over.
            const _a=META(ds[0]).color,_b=META(ns[0]).color;
            // Whichever ink is least bad across both halves of the gradient.
            const _worst=f=>Math.min(...[_a,_b].map(c=>{const L=chipLum(c);
              return f==='#0B1220'?(L+.05)/.05:1.05/(L+.05);}));
            const _ink=_worst('#0B1220')>=_worst('#FFFFFF')?'#0B1220':'#FFFFFF';
            inner=`<span class="blk split" style="background:linear-gradient(112deg,${_a} 0 50%,${_b} 50% 100%);color:${_ink};text-shadow:0 1px 1px rgba(0,0,0,.35)" title="24-hour shift">24h</span>`;
          }else if(ns.length){
            // every night used to read "NOC" whatever the site, so a month of nights gave no
            // clue whether they were SAH, Porter or Littleton
            const nm=META(ns[0]);
            // The moon already says night, so the cell names the SITE: ☾ SAH, ☾ PTR, ☾ LAH.
            // Spelling out "SAH NOC" beside it clipped at phone width.
            const site=String(nm.short||'NOC').replace(/\s*NOC\s*/,' ').trim()||'NOC';
            inner=`<span class="blk noc" style="background:${nm.color};color:${chipInk(nm.color)}">☾ ${esc(site)}</span>`;
          }else{
            const m=META(ds[0]);
            inner=`<span class="blk" style="background:${m.color};color:${chipInk(m.color)}">${
              esc(shiftLabel(ME,iso,ds[0],true))}</span>`;
          }
        }
        if(!inner&&cmeReq)inner='<span class="blk cme">CME</span>';
        if(a&&a.r&&a.r.length)inner+='<span class="rl"></span>';
        const spoken=[`${MONL[mo]} ${d}`];
        if(shown.length)spoken.push(shown.map(x=>shiftLabel(ME,iso,x,false)).join(' and '));
        else spoken.push('no shift');
        if(onReq)spoken.push('requested on');
        else if(cmeReq)spoken.push('C M E day');
        else if(offReq)spoken.push('requested off');
        // Today gets a ring. On a month grid the eye has nothing to anchor to otherwise, and
        // "which square is now" is the question being asked before any other.
        const isNow=(iso===todayISO());
        if(isNow)spoken.unshift('Today');
        html+=`<div class="cell${shown.length?' on':''}${isNow?' today':''}" data-iso="${iso}" role="button" tabindex="0" aria-label="${esc(spoken.join(', '))}">
          <span class="n" aria-hidden="true">${d}</span>${inner}
          ${onReq?'<span class="req" aria-hidden="true">●</span>':(offReq&&!cmeReq&&!shown.length)?'<span class="req" aria-hidden="true" style="color:var(--dim)">○</span>':''}</div>`;
      }
      html+='</div></div>';
    });
    html+=`<div class="note"><b style="color:var(--ink)">Reading the calendar.</b> Colour = the unit. A moon marks an overnight;
      a split cell is a 24-hour shift. <b style="color:var(--info-ink)">CME</b> marks a CME day.
      ● is a day you asked to work, ○ a day off you requested. <b style="color:var(--signal)">Today</b>
      is ringed in green. Tap any day for the details.</div>`;
  }else{
    const all=myShifts(ME).sort(byTime);
    if(!all.length)html+='<div class="empty">Nothing scheduled this block.</div>';
    let lastMo='';
    all.forEach(s=>{
      const mk=s.iso.slice(0,7);
      if(mk!==lastMo){lastMo=mk;html+=`<h2 class="sec">${MONL[+mk.slice(5)-1]}</h2>`;}
      const a=dayOf(ME,s.iso),roles=(a.r||[]).map(r=>(DATA.roles[r]||{label:r}).label);
      html+=shiftRow(s.iso,s.shift,roles.length?`◆ ${esc(roles[0])}`:'');
    });

  // "Take it with you" lives entirely in subscribeCard now. It used to be a separate block
  // ABOVE it, whose green primary button was "Add to my phone calendar" — a one-off .ics file.
  // So the first and loudest option was the static copy, with the subscription card underneath
  // it, no matter what the card said. That is the thing Sam kept seeing.
  pane.innerHTML=html+subscribeCard();
  wireSubscribe();
  $('#vCal').onclick=()=>{schedView='cal';renderSched();};
  $('#vList').onclick=()=>{schedView='list';renderSched();};
  $$('.cell[data-iso],.row[data-iso]',pane).forEach(c=>{
    c.onclick=()=>openDay(c.dataset.iso);
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDay(c.dataset.iso);}};
  });
}

function icsStamp(iso,h,mi){return iso.replace(/-/g,'')+'T'+String(h).padStart(2,'0')+String(mi).padStart(2,'0')+'00';}
function downloadICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scheduling Wizard//CCPSA//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
           'X-WR-CALNAME:CCPSA Q4 2026 - '+fullOf(ME)];
  let n=0;
  DATA.dates.forEach(iso=>{
    const a=dayOf(ME,iso);if(!a)return;
    a.s.forEach(s=>{
      const m=META(s),hrs=DATA.kindHours[m.kind];
      const uid=`${iso}-${s.replace(/[^A-Za-z0-9]/g,'')}-${ME}@schedulingwiz`;
      L.push('BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+icsStamp(DATA.generated,0,0)+'Z');
      if(!hrs){
        L.push('DTSTART;VALUE=DATE:'+iso.replace(/-/g,''),'DTEND;VALUE=DATE:'+isoAdd(iso,1).replace(/-/g,''));
      }else{
        const[h,mi,dur]=hrs;
        const endH=h+dur, endIso=endH>=24?isoAdd(iso,1):iso;
        L.push('DTSTART:'+icsStamp(iso,h,mi),'DTEND:'+icsStamp(endIso,endH%24,mi));
      }
      L.push('SUMMARY:'+m.label,'LOCATION:'+m.sub.replace(/,/g,''),
             'DESCRIPTION:'+(m.sub+((a.r&&a.r.length)?' — also '+a.r.join(', '):'')).replace(/,/g,'\\,'),
             'END:VEVENT');
      n++;
    });
    (a.r||[]).forEach(r=>{
      const lab=(DATA.roles[r]||{label:r}).label;
      L.push('BEGIN:VEVENT','UID:'+iso+'-'+r.replace(/[^A-Za-z0-9]/g,'')+'-'+ME+'@schedulingwiz',
        'DTSTAMP:'+icsStamp(DATA.generated,0,0)+'Z',
        'DTSTART;VALUE=DATE:'+iso.replace(/-/g,''),'DTEND;VALUE=DATE:'+isoAdd(iso,1).replace(/-/g,''),
        'SUMMARY:'+lab,'DESCRIPTION:Layered role','END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  save(L.join('\r\n'),`CCPSA-${ME}-Q4-2026.ics`,'text/calendar');
}
function downloadCSV(){
  const head=['Date','Day','Shift','Where','Type','Roles'];
  const rows=[];
  DATA.dates.forEach(iso=>{
    const a=dayOf(ME,iso);if(!a)return;
    a.s.forEach(s=>{const m=META(s);
      rows.push([iso,DOW[dowOf(iso)],m.label,m.sub,m.kind,(a.r||[]).join(' / ')]);});
    if(!a.s.length&&a.r&&a.r.length)rows.push([iso,DOW[dowOf(iso)],'—','','role',a.r.join(' / ')]);
  });
  // A column nobody has anything in is a column to leave out. Most physicians hold no layered
  // role, so Roles arrived as a header over 39 empty cells — and an empty column in a
  // spreadsheet reads as missing data rather than as "does not apply here".
  const keep=head.map((_,i)=>rows.some(r=>String(r[i]||'').trim()!==''));
  const cut=r=>r.filter((_,i)=>keep[i]);
  save([cut(head)].concat(rows.map(cut))
         .map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),
       `CCPSA-${ME}-Q4-2026.csv`,'text/csv');
}
function save(txt,name,mime){
  const b=new Blob([txt],{type:mime+';charset=utf-8'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);
}

/* ---------- live API: identity, requests, swaps ---------- */
const API='https://elig-api.vercel.app/api';
const BUILD='260821.1233';           // shown in the account bar so a stale app is obvious
const TEST_BUILD=false;   // true only on the copy at /test/
let SESSION=null, CFG=null, MYREQ=null, MYSWAPS=[];
// The admin approvals queue. Declared up here with the rest of the state, not beside the code
// that fills it — adminBar() reads the count to paint its badge and runs early.

const api=async(path,opts={})=>{
  const h={'Content-Type':'application/json',...(opts.headers||{})};
  if(SESSION&&SESSION.token)h.Authorization='Bearer '+SESSION.token;
  // Tell the API which day we are pretending it is. It only honours this on the test

/* ---------- Face ID / Touch ID ----------
   A passkey is a private key the phone keeps in its own secure hardware. It never leaves the
   device and this code cannot read it; the server holds only the matching public key, so there
   is nothing in the store worth stealing. The phone will not sign unless the face or fingerprint
   matched, which is what lets this replace the password rather than sit alongside it.

   Everything below is byte-shuffling: WebAuthn deals in ArrayBuffers, JSON does not. */
const PK_SUPPORTED = !!(window.PublicKeyCredential && navigator.credentials &&
                        navigator.credentials.create);
async function pkAvailable(){
  if(!PK_SUPPORTED)return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }
}
const pkEnrolled=()=>{ try{return localStorage.getItem('ccpsa_passkey')==='1';}catch(e){return false;} };
function pkB64(buf){
  const a=new Uint8Array(buf); let s='';
  for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function pkBuf(s){
  const t=String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(t+'==='.slice((t.length+3)%4));
  const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a.buffer;
}

async function enrollPasskey(){
  const o=await api('/passkey',{method:'POST',body:JSON.stringify({action:'register-options'})});
  const pk=o.publicKey;
  pk.challenge=pkBuf(pk.challenge);
  pk.user.id=pkBuf(pk.user.id);
  pk.excludeCredentials=(pk.excludeCredentials||[]).map(c=>({...c,id:pkBuf(c.id)}));
  const cred=await navigator.credentials.create({publicKey:pk});
  if(!cred)throw new Error('No passkey was created.');
  const r=cred.response;
  // getPublicKey() hands over the key in SPKI form, which is what the server can verify with
  // directly — the alternative is decoding CBOR to reach the same bytes.
  if(!r.getPublicKey)throw new Error('This browser is too old for Face ID sign-in.');
  await api('/passkey',{method:'POST',body:JSON.stringify({
    action:'register', challengeToken:o.challengeToken, id:cred.id,
    clientDataJSON:pkB64(r.clientDataJSON),
    publicKey:pkB64(r.getPublicKey()), alg:String(r.getPublicKeyAlgorithm()),
    label:(/iPhone|iPad/.test(navigator.userAgent)?'iPhone':
           /Mac/.test(navigator.userAgent)?'Mac':'This device')})});
  try{localStorage.setItem('ccpsa_passkey','1');}catch(e){}
}

async function signInWithPasskey(){
  const post=(body)=>fetch(API+'/passkey',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(async r=>{const j=await r.json().catch(()=>({}));
                    if(!r.ok)throw new Error(j.error||'Could not sign in');return j;});
  const o=await post({action:'login-options'});
  const pk=o.publicKey; pk.challenge=pkBuf(pk.challenge);
  const cred=await navigator.credentials.get({publicKey:pk});
  if(!cred)throw new Error('Cancelled');
  const r=cred.response;
  const j=await post({action:'login', challengeToken:o.challengeToken, id:cred.id,
    clientDataJSON:pkB64(r.clientDataJSON), authenticatorData:pkB64(r.authenticatorData),
    signature:pkB64(r.signature), userHandle:pkB64(r.userHandle||new ArrayBuffer(0))});
  try{sessionStorage.setItem('__tok',j.token);
      localStorage.setItem('ccpsa_passkey','1');}catch(e){}
  keepDevice(j.device); keepGrant(j.grant);
  await loadPortal(j.token);
}

/* Offered once, and only to somebody who has JUST TYPED A PASSWORD — that is the moment the
   cost of not having this is being felt, and the moment the offer makes sense. A session
   resumed from a trusted device gets no prompt, because nothing was asked of them to prompt
   about. Never stacked on top of the notifications offer; one interruption per visit. */
let PW_TYPED=false, DID_2FA_SETUP=false;
async function maybeOfferFaceId(){
  if(!PW_TYPED||pkEnrolled()||DID_2FA_SETUP)return;
  if(document.querySelector('.sheet.on'))return;
  // Strictly after login: not over the sign-in screens, and not before the schedule is on
  // screen. Offered while a gate is still up, it reads as another hoop in signing in.
  if(document.body.classList.contains('locked'))return;
  if(document.querySelector('.signin'))return;
  let asked=false; try{asked=localStorage.getItem('ccpsa_faceask')==='1';}catch(e){}
  if(asked)return;
  if(!(await pkAvailable()))return;
  const done=()=>{ try{localStorage.setItem('ccpsa_faceask','1');}catch(e){} };
  const face=/iPhone|iPad/.test(navigator.userAgent)?'Face ID':'your fingerprint or face';
  sheet('Skip the password next time',
    `<div class="sub">You can open this with ${face} instead of typing your password. The key
       stays in this phone's secure hardware — it never leaves the device and we never see it.</div>
     <div class="sub" style="margin-top:8px">Your password still works, and still gets you in on
       any other device.</div>
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="fidYes">Turn on ${face}</button>
       <button class="btn" id="fidNo">Not now</button>
     </div>
     <div class="msg" id="fidMsg"></div>`);
  document.querySelector('#fidNo').onclick=()=>{ done(); closeSheet(); };
  document.querySelector('#fidYes').onclick=async()=>{
    const btn=document.querySelector('#fidYes'); btn.disabled=true; btn.textContent='…';
    try{ await enrollPasskey(); done(); closeSheet(); toast(face+' is on'); }
    catch(e){
      const m=String((e&&e.message)||e);
      const msg=document.querySelector('#fidMsg');
      msg.textContent=/NotAllowed|Cancel|abort/i.test(m)?'Cancelled — you can turn it on later '+
        'from the Swaps tab.':m;

/* ---------- Face ID when you come back ----------
   Staying signed in for ninety days is right for a schedule checked between patients, and wrong
   for a phone left in a taxi. Face ID resolves that: the app stays signed in, and coming back to
   it after a few hours costs a glance instead of a password.

   ONLY WHERE IT IS FREE. If no passkey is enrolled this does nothing at all — locking someone
   out behind a factor they have not set up would be the app breaking, not the app being careful.
   The password route stays on the screen for the day the face does not work, because a schedule
   nobody can open is worse than one that opens too easily. */
const RELOCK_AFTER=4*60*60*1000;                 // a shift's worth of idle, not a coffee break
function touchSeen(){ try{localStorage.setItem('ccpsa_lastseen',String(Date.now()));}catch(e){} }
function idleTooLong(){
  let t=0; try{t=+localStorage.getItem('ccpsa_lastseen')||0;}catch(e){}
  return !t||(Date.now()-t)>RELOCK_AFTER;
}
let LOCKED=false;
async function maybeLock(){
  if(LOCKED||!pkEnrolled()||!idleTooLong())return false;
  if(!(await pkAvailable()))return false;
  LOCKED=true;
  document.body.classList.add('locked');
  siPaint(`<div class="siLead"><b>Welcome back.</b> Use Face ID to open your schedule.</div>
     <button class="siB" id="lkGo">Use Face ID</button>
     <button class="siGhost" id="lkPw">Use my password instead</button>
     <div class="msg" id="lkMsg"></div>`);
  const go=async()=>{
    const m=$('#lkMsg'); m.textContent='Waiting for Face ID…'; m.className='msg on';
    try{ await signInWithPasskey(); LOCKED=false; touchSeen(); }
    catch(e){
      const t=String((e&&e.message)||e);
      m.textContent=/NotAllowed|Cancel|abort/i.test(t)?'Cancelled.':t;
      m.className='msg on bad';

/* ---------- coverage requests ----------
   Client 8/17 #2: asking everyone who *can* take the shift is the good path, so it leads.
   Picking one person stays available but is the secondary choice. First accept wins; only then
   is an admin asked. */
let COVER=[];
async function loadCoverage(){

async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return {ok:false,why:'This browser cannot do notifications.'};
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return {ok:false,why:'Notifications are blocked for this site.'};
    const reg=await navigator.serviceWorker.ready;
    const {key}=await (await fetch(API+'/push')).json();
    if(!key)return {ok:false,why:'Notifications are not configured yet.'};
    const b64=(s)=>{const p='='.repeat((4-s.length%4)%4);const r=(s+p).replace(/-/g,'+').replace(/_/g,'/');
      const raw=atob(r);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));};
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
    await api('/push',{method:'POST',body:JSON.stringify({sub:sub.toJSON()})});
    return {ok:true};
  }catch(e){ return {ok:false,why:e.message||'Could not turn on notifications.'}; }
}
/* ---------- notifications, explained ----------
   Three things decide whether a phone can be reached, and a physician can only act on one of
   them. So say which state they are in and what to do about it, rather than offering a button
   that quietly fails. */
const PUSH_SUPPORTED = ('serviceWorker' in navigator) && ('PushManager' in window);
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
async function pushState(){
  if(!PUSH_SUPPORTED) return IOS && !STANDALONE ? 'needs-install' : 'unsupported';
  if(IOS && !STANDALONE) return 'needs-install';        // iOS refuses push in a browser tab
  if(Notification.permission==='denied') return 'blocked';
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg && await reg.pushManager.getSubscription();
    if(sub && Notification.permission==='granted') return 'on';
  }catch(e){}
  return 'off';
}
/* A permanent home for Face ID, beside notifications. The one-time offer below is easy to

/* ONE CARD, ONE REQUEST. Face ID and signed-in devices were separate cards that each fetched on
   render — two round trips, two "Checking…" spinners, and a settings screen that sat blank for a
   second while three things loaded. They are one subject anyway: how you get in, and what is
   currently let in. /account {action:'devices'} already returns the passkeys, so both come back
   in a single answer. */
async function paintSignIn(){
  const box=$('#signinBody'); if(!box)return;
  const can=await pkAvailable();
  let d=null;
  try{ d=await api('/account',{method:'POST',
        body:JSON.stringify({action:'devices',...(onBehalf()?{person:ME}:{})})}); }
  catch(e){ box.textContent='Could not check.'; return; }
  const keys=d.passkeys||[];
  const face=/iPhone|iPad/.test(navigator.userAgent)?'Face ID':'Face ID or a fingerprint';

  let h='<div class="setrow"><span class="setk">'+esc(face)+'</span><span class="setv">'+
    (keys.length
      ? '<b style="color:var(--signal)">On</b> · '+keys.map(k=>esc(k.label||'a device')).join(', ')
      : (can?'Off':'This device cannot'))+'</span></div>';
  h+='<div class="setrow"><span class="setk">Last signed in</span><span class="setv">'+
    (d.lastLogin?esc(new Date(d.lastLogin).toLocaleString()):'never')+'</span></div>';
  if(d.signedOutAt)h+='<div class="setrow"><span class="setk">All devices signed out</span>'+
    '<span class="setv">'+esc(new Date(d.signedOutAt).toLocaleString())+'</span></div>';
  h+='<div class="btnrow" style="margin-top:10px">';
  if(can)h+='<button class="btn'+(keys.length?'':' pri')+'" id="faceAdd">'+
    (keys.length?'Add this device':'Turn on '+esc(face))+'</button>';
  if(keys.length)h+='<button class="btn" id="faceOff">Turn off</button>';
  h+='<button class="btn" id="devOut">Sign out all devices</button></div>';
  h+='<div class="note" style="margin-top:8px">A phone stays signed in for 90 days. If one is '+
     'lost, sign it out — your schedule is on it until you do.</div>';
  // The pane can be re-rendered while this is waiting on the server — a live refresh, a tab
  // switch, an admin changing who they are viewing. Writing into the card we started with then
  // fills a node that is no longer on the page, and the wiring below finds nothing to wire.
  if(!box.isConnected)return;
  box.innerHTML=h;

  const add=$('#faceAdd');
  if(add)add.onclick=async()=>{
    add.disabled=true; const was=add.textContent; add.textContent='…';
    try{ await enrollPasskey(); toast(face+' is on'); }
    catch(e){ const m=String((e&&e.message)||e);
              toast(/NotAllowed|Cancel|abort/i.test(m)?'Cancelled':m); }
    add.disabled=false; add.textContent=was; paintSignIn();
  };
  const off=$('#faceOff');
  if(off)off.onclick=async()=>{
    for(const k of keys){
      try{await api('/passkey',{method:'POST',body:JSON.stringify({action:'remove',id:k.id})});}catch(e){}
    }
    try{localStorage.removeItem('ccpsa_passkey');}catch(e){}
    toast(face+' turned off'); paintSignIn();
  };
  const out=$('#devOut');
  if(out)out.onclick=async()=>{
    const b=$('#devOut'); b.disabled=true; b.textContent='…';
    try{
      await api('/account',{method:'POST',
        body:JSON.stringify({action:'signOutEverywhere',...(onBehalf()?{person:ME}:{})})});
      toast('Signed out — they will have to sign in again');
      if(!onBehalf()){ try{localStorage.removeItem('__dev');sessionStorage.clear();}catch(e){}
                       setTimeout(()=>location.reload(),700); return; }
      paintSignIn();
    }catch(e){ toast(e.message||'Could not sign them out'); b.disabled=false;
               b.textContent='Sign out all devices'; }
  };
}

/* ---------- ask once, when asking makes sense ----------
   Being installed to the home screen is the moment notifications become possible on an iPhone
   and the moment someone has shown they intend to keep using this. Buried on the Swaps tab, the
   offer was never going to be found. Asked once, here, with a way to decline that sticks.

   The permission itself is still requested from a button press. A prompt fired on load is the
   fastest way to a permanent refusal — browsers hold that against the site, and there is no
   second chance. */
async function maybeOfferPush(){
  if(!STANDALONE||!PUSH_SUPPORTED)return;
  if(typeof Notification==='undefined'||Notification.permission!=='default')return;
  let asked=false; try{asked=localStorage.getItem('ccpsa_pushask')==='1';}catch(e){}
  if(asked)return;
  const done=()=>{ try{localStorage.setItem('ccpsa_pushask','1');}catch(e){} };
  sheet('Get told when something changes',
    `<div class="sub">Now that this is on your home screen, it can tell you when someone asks
       you to cover a shift, when your own request is taken, and when an admin approves it.</div>
     <div class="sub" style="margin-top:8px">Nothing else — no marketing, no daily digest.</div>
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="pshYes">Turn on notifications</button>
       <button class="btn" id="pshNo">Not now</button>
     </div>
     <div class="msg" id="pshMsg"></div>`);
  document.querySelector('#pshNo').onclick=()=>{ done(); closeSheet(); };
  document.querySelector('#pshYes').onclick=async()=>{
    const btn=document.querySelector('#pshYes'); btn.disabled=true; btn.textContent='…';
    const r=await enablePush();
    done();
    if(r.ok){ closeSheet(); toast('Notifications on'); }
    else { const m=document.querySelector('#pshMsg');
           m.textContent=r.why||'Could not turn them on'; m.className='msg on bad';
           btn.disabled=false; btn.textContent='Turn on notifications'; }
    paintNotify();
  };
}

/* Admins get a way to fire each kind at themselves. Checking that a notification reads well
   otherwise means arranging the whole three-person situation that produces it. */
function notifyTestHTML(){
  if(ROLE!=='admin')return '';
  const kinds=[['ask','Asked to cover'],['taken','Someone else took it'],
               ['approve','Needs your approval'],['claimed','Someone took yours'],
               ['approved','Approved'],['declined','Declined'],
               ['changed','Schedule changed'],['expired','No longer needed']];
  return '<details class="icsmore" style="margin-top:10px"><summary>Send yourself a test</summary>'+
    '<div class="sub" style="margin-top:6px">Goes to your devices only — nobody else is '+
    'notified.</div><div class="testgrid">'+
    kinds.map(([k,l])=>`<button class="btn" data-ntest="${k}">${esc(l)}</button>`).join('')+
    '</div><div class="msg" id="ntMsg"></div></details>';
}
function wireNotifyTest(){
  document.querySelectorAll('[data-ntest]').forEach(b=>b.onclick=async()=>{
    const m=document.querySelector('#ntMsg');
    m.textContent='Sending…'; m.className='msg on';

      const r=await api('/push',{method:'POST',body:JSON.stringify({action:'test',kind:b.dataset.ntest})});
      m.textContent=r.sent?('Sent to '+r.sent+' device'+(r.sent===1?'':'s'))
        :'No device is subscribed — turn notifications on first.';

async function paintNotify(){
  const box=document.querySelector('#notifyBody'); if(!box)return;
  const st=await pushState();
  // Awaited above; the pane may have been re-rendered underneath us since. See paintSignIn.
  if(!box.isConnected)return;
  if(st==='on'){
    box.innerHTML='<b style="color:var(--signal)">On for this device.</b> Turn them on separately '+
      'on any other phone or computer you use.';
    return;
  }
  if(st==='needs-install'){
    box.innerHTML='<b>On an iPhone or iPad, notifications only work once this is on your home '+
      'screen.</b> Tap the Share button, then <b>Add to Home Screen</b>, open it from there and '+
      'come back here.<div class="btnrow" style="margin-top:9px">'+
      '<button class="btn" id="notifyHow">Show me how</button></div>';
    const h=document.querySelector('#notifyHow'); if(h)h.onclick=()=>openInstall();
    return;
  }
  if(st==='blocked'){
    box.innerHTML='<b>Blocked in your browser settings.</b> Notifications were refused for this '+
      'site, so we cannot ask again — allow them for this site in your browser or phone '+
      'settings, then reload.';
    return;
  }
  if(st==='unsupported'){
    box.innerHTML='This browser cannot show notifications. Everything still works; you just will '+
      'not get a message on your phone.';
    return;
  }
  box.innerHTML='<div class="btnrow"><button class="btn pri" id="pushOn">Turn on notifications'+
    '</button></div><div style="margin-top:6px">Your phone will ask you to allow them.</div>';
  const pn=document.querySelector('#pushOn');
  if(!pn)return;                 // the card was replaced while this was waiting on the browser
  pn.onclick=async()=>{
    pn.disabled=true; pn.textContent='…';
    const r=await enablePush();
    if(r.ok){ toast('Notifications on'); }
    else { toast(r.why||'Could not turn them on'); pn.disabled=false; pn.textContent='Turn on notifications'; }
    paintNotify();
  };
}

function coverageCard(){
  const open=COVER.filter(o=>o.status==='open'&&(o.eligible||[]).includes(ME)&&o.fromPerson!==ME);
  // Only requests still in play. A withdrawn or expired one is finished business; leaving it
  // here is how a list becomes a pile nobody reads.
  const mine=COVER.filter(o=>o.fromPerson===ME&&['open','claimed'].includes(o.status));
  /* "Waiting on you" is the ADMIN's queue and belongs on the admin's own screen. Viewing Brian
     Ahn, it appeared on his page as though these were his to approve — they are not, and he
     cannot act on them. An admin looking at a physician is reading that physician's app. */
  const toApprove=(ROLE==='admin'&&!onBehalf())?COVER.filter(o=>o.status==='claimed'):[];
  const took=COVER.filter(o=>o.claimedBy===ME&&o.status==='claimed');
  /* DECIDED, AND NOT YET ACKNOWLEDGED. Once an admin approved it, the request vanished from
     both people's screens — the asker and the taker each left to work out from the schedule
     whether it had gone through. The outcome is the whole point of having asked, so it stays
     until somebody says they have seen it, with the name of whoever decided: "approved" with
     no author is a fact with nobody behind it. */
  const decided=COVER.filter(o=>(o.fromPerson===ME||o.claimedBy===ME)&&
    (o.status==='approved'||o.status==='declined')&&!coverSeen(o.id));
  let h='';
  if(open.length)h+=`<h2 class="sec">Can you cover?</h2>`+open.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">${esc(fullOf(o.fromPerson))} needs this covered${o.note?' — '+esc(o.note):''}</div>
      <div class="btnrow"><button class="btn pri" data-claim="${esc(o.id)}">I'll take it</button></div>
    </div>`).join('');
  if(decided.length)h+=`<h2 class="sec">Decided</h2>`+decided.map(o=>{
    const ok=o.status==='approved';
    const who=o.decidedBy?fullOf(o.decidedBy)||o.decidedBy:'an admin';
    const mine=o.fromPerson===ME;
    return `<div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub"><b style="color:var(--${ok?'signal':'alert'})">${ok?'Approved':'Declined'} by ${esc(who)}</b> —
        ${ok ? (mine ? esc(fullOf(o.claimedBy)||o.claimedBy)+' is covering this for you; it is off your schedule.'
                     : 'you are covering this for '+esc(fullOf(o.fromPerson)||o.fromPerson)+'. It is on your schedule now.')
             : (mine ? 'your shift is unchanged — you are still on it.'
                     : 'you are not covering this after all.')}</div>
      <div class="btnrow"><button class="btn" data-covok="${esc(o.id)}">OK</button></div>
    </div>`;}).join('');
  if(took.length)h+=`<h2 class="sec">You accepted</h2>`+took.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">Covering for <b>${esc(fullOf(o.fromPerson))}</b> —
        <b style="color:var(--amber)">waiting for final approval</b>. It is not on your schedule
        until an admin confirms it, and you will be told when they do.</div>
    </div>`).join('');
  if(toApprove.length)h+=`<h2 class="sec">Waiting on you</h2>`+toApprove.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub"><b>${esc(fullOf(o.claimedBy))}</b> will cover for ${esc(fullOf(o.fromPerson))}</div>
      <div class="btnrow"><button class="btn pri" data-ok="${esc(o.id)}">Approve</button>
        <button class="btn" data-no="${esc(o.id)}">Decline</button></div>
    </div>`).join('');
  if(mine.length)h+=`<h2 class="sec">Your coverage requests</h2>`+mine.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">${o.status==='open'
        ? 'Asked '+(o.eligible||[]).length+' colleague'+((o.eligible||[]).length===1?'':'s')+' — nobody has accepted yet'
        : o.status==='claimed' ? esc(fullOf(o.claimedBy))+' accepted — waiting on an admin'
        : esc(o.status)}</div>
      <div class="btnrow"><button class="btn" data-covcancel="${esc(o.id)}">Withdraw</button></div>
    </div>`).join('');
  return h;
}
/* Acknowledgement is per request and per person, so one being cleared cannot hide the next. */
function coverSeen(id){
  try{ return (localStorage.getItem('ccpsa_coverseen')||'').split(',').includes((ME||'')+':'+id); }
  catch(e){ return false; }
}
function markCoverSeen(id){
  try{
    const k=(ME||'')+':'+id;
    const cur=(localStorage.getItem('ccpsa_coverseen')||'').split(',').filter(Boolean);
    if(!cur.includes(k))cur.push(k);
    localStorage.setItem('ccpsa_coverseen',cur.slice(-60).join(','));   // a bounded list
  }catch(e){}
}

/* ---------- one notification, one decision ----------
   Tapping "Coverage needs approval" landed on the Swaps tab, which carries the approval queue,
   the coverage requests, the swap form, this person's own swaps, and the admin sign-off queue —
   five unrelated things, with the one you were told about somewhere among them. The notification
   is about a single shift and a single decision, so it opens that: the shift, who is covering
   for whom, and the two buttons. Everything else stays a tab away where it belongs. */
async function openOffer(id){
  if(!COVER.some(o=>o.id===id))await loadCoverage();
  const o=COVER.find(x=>x.id===id);
  if(!o){ toast('That request is no longer there'); return; }
  const label=esc(META(o.shift).label||o.shift)+' · '+esc(fmtD(o.date));
  const who=(p)=>esc(fullOf(p)||p);

  if(o.status==='claimed'&&ROLE==='admin'){
    sheet('Approve this cover?',
      `<div class="sub"><b>${label}</b></div>
       <div class="sub" style="margin-top:8px"><b>${who(o.claimedBy)}</b> will cover for
         <b>${who(o.fromPerson)}</b>.${o.note?' — '+esc(o.note):''}</div>
       <div class="sub" style="margin-top:8px">Approving moves the shift on the schedule and
         tells them both.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="ofOk">Approve</button>
         <button class="btn" id="ofNo">Decline</button></div>
       <div class="msg" id="ofMsg"></div>`);
    const decide=async(action)=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofOk').disabled=true; $('#ofNo').disabled=true;
      try{ await api('/coverage',{method:'PATCH',body:JSON.stringify({id:o.id,action})});
           closeSheet(); toast(action==='approve'?'Approved — the schedule is updated':'Declined');
           await loadCoverage(); await refreshLive(true); if(CUR==='swap')renderSwap();
           // Deciding from a notification leaves you standing on the desk; the card that was
           // just handled has to come off it, and the count with it.
           if(onAdminHome()){ await loadAdminQueue(); renderAdminHome(); adminBar(); } }
      catch(e){ m.textContent=e.message||'Could not save'; m.className='msg on bad';
                $('#ofOk').disabled=false; $('#ofNo').disabled=false; }
    };
    $('#ofOk').onclick=()=>decide('approve');
    $('#ofNo').onclick=()=>decide('decline');
    return;
  }

  if(o.status==='open'&&(o.eligible||[]).includes(ME)){
    sheet('Can you cover this?',
      `<div class="sub"><b>${label}</b></div>
       <div class="sub" style="margin-top:8px">${who(o.fromPerson)} needs this covered.${
         o.note?' — '+esc(o.note):''}</div>
       <div class="sub" style="margin-top:8px">An admin still has to confirm it afterwards.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="ofTake">I'll take it</button>
         <button class="btn" id="ofSkip">Not this time</button></div>
       <div class="msg" id="ofMsg"></div>`);
    $('#ofSkip').onclick=closeSheet;
    $('#ofTake').onclick=async()=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofTake').disabled=true;
      try{ const body={id:o.id,action:'claim'}; if(onBehalf())body.person=ME;
           await api('/coverage',{method:'POST',body:JSON.stringify(body)});
           closeSheet(); toast('Accepted — waiting for final approval');
           await loadCoverage(); if(CUR==='swap')renderSwap(); }
      catch(e){ m.textContent=e.message||'Could not accept'; m.className='msg on bad';
                $('#ofTake').disabled=false; }
    };
    return;
  }

  // Anything already settled: say what happened rather than opening an empty decision.
  const done=o.status==='approved'?'approved':o.status==='declined'?'declined'
            :o.status==='expired'?'expired':o.status;
  sheet('Cover request',
    `<div class="sub"><b>${label}</b></div>
     <div class="sub" style="margin-top:8px">This one is <b>${esc(done)}</b>${
       o.claimedBy?' — '+who(o.claimedBy)+' covering for '+who(o.fromPerson):''}.${
       o.decidedBy?' Decided by '+who(o.decidedBy)+'.':''}</div>
     <div class="btnrow" style="margin-top:12px"><button class="btn" id="ofClose">OK</button></div>`);
  $('#ofClose').onclick=closeSheet;
}

function wireCoverage(){
  document.querySelectorAll('[data-covok]').forEach(b=>b.onclick=()=>{
    markCoverSeen(b.dataset.covok); renderSwap();
  });
  document.querySelectorAll('[data-covcancel]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent='…';
    try{ await api('/coverage',{method:'POST',body:JSON.stringify({id:b.dataset.covcancel,action:'cancel'})});
         toast('Withdrawn — nobody is being asked any more');
         await loadCoverage(); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Withdraw'; }
  });
  document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='…';
    try{ const body={id:b.dataset.claim,action:'claim'};
         if(onBehalf())body.person=ME;      // accepting FOR the physician being viewed
         await api('/coverage',{method:'POST',body:JSON.stringify(body)});
         toast('Accepted — waiting for final approval'); await loadCoverage(); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent="I'll take it"; }
  });
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.ok||b.dataset.no, act=b.dataset.ok?'approve':'decline';
    b.disabled=true;
    try{ await api('/coverage',{method:'PATCH',body:JSON.stringify({id,action:act})});
         toast(act==='approve'?'Approved — the schedule is updated':'Declined');
         await loadCoverage(); await refreshLive(true); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; }
  });
  const rc=document.querySelector('#reqCover'); if(rc)rc.onclick=openCoverAsk;
  paintNotify();
  wireNotifyTest();
}

    `<label class="lbl" for="cvShift">Which shift</label>

     <label class="lbl" for="cvNote">Why (optional)</label>

     <div class="btnrow" style="flex-direction:column;gap:8px">

     </div>
     <div class="msg" id="cvMsg"></div>
     <div class="note">Asking everyone gets it covered fastest — only people who are free and

      `<div class="note" style="margin-top:0">Only people who can legally take this shift are listed.</div>

         `<button class="pill" data-who="${esc(p)}">${esc(p)}</button>`).join('')}</div>
       <div class="msg" id="cvMsg"></div>`);
    document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>send('direct',b.dataset.who));

function renderSwap(){
  const pane=$('#pane-swap');
  // coverage requests lead: asking everyone who can take it is the good path
  if(!ME){pane.innerHTML='<div class="empty" style="margin-top:22px">Choose a physician first.</div>';return;}
  if(!SESSION){pane.innerHTML='<div class="empty" style="margin-top:22px">Sign in again to use swaps.</div>';return;}

  const mine=myShifts(ME).sort(byTime).filter(x=>x.iso>=todayISO());
  const others=DATA.people.filter(p=>p!==ME).sort();
  const mySw=MYSWAPS.filter(s=>s.fromPerson===ME||s.toPerson===ME);

  const badge=(s)=>{
    const m={blocked:['bad','Breaks a rule'],awaiting_partner:['warn','Waiting on them'],
             awaiting_admin:['warn','Waiting on Dr. Nadon'],approved:['ok','Approved'],
             rejected:['bad','Rejected'],declined:['bad','Declined']}[s.status]||['','—'];
    return `<span class="pill ${m[0]}">${m[1]}</span>`;
  };

  pane.innerHTML=`<div class="btnrow"><button class="btn pri" id="reqCover">Request coverage</button></div>
    ${notifyCard()}${coverageCard()}
    <h2 class="sec">Ask someone to cover a shift</h2>
    ${mine.length?`
    <div class="swapform">
      <label class="l" for="swShift">Which shift of mine</label>
      <select id="swShift">${mine.slice(0,60).map(x=>`<option value="${x.iso}|${x.shift}">${fmtD(x.iso)} — ${esc(META(x.shift).label||x.shift)}</option>`).join('')}</select>
      <label class="l" for="swWho">Ask who</label>
      <select id="swWho">${others.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
      <label class="l" for="swNote">Note (optional)</label>
      <input id="swNote" placeholder="e.g. away at a conference — happy to return the favour">
      <button class="btn primary" id="swSend">Send request</button>
      <div id="swMsg" class="muted"></div>
    </div>`:'<div class="empty">No upcoming shifts to trade.</div>'}

    <h2 class="sec">My swap requests</h2>
    <div id="swList">${mySw.length?mySw.map(s=>`
      <div class="swcard">
        <div class="swtop"><b>${fmtD(s.date)}</b> — ${esc(META(s.shift).label||s.shift)} ${badge(s)}</div>
        <div class="swwho">${esc(s.fromPerson)} → ${esc(s.toPerson)}${s.note?' · '+esc(s.note):''}</div>
        ${s.problems&&s.problems.length?`<div class="swprob">${s.problems.map(x=>`<div>⚠ ${esc(x)}</div>`).join('')}</div>`:''}
        ${(s.toPerson===ME&&s.status==='awaiting_partner')?`
          <div class="swact"><button class="btn primary" data-acc="${s.id}">I can take it</button>
          <button class="btn" data-dec="${s.id}">Can’t</button></div>`:''}
      </div>`).join(''):'<div class="empty">Nothing yet.</div>'}</div>

    ${isAdmin()?'<h2 class="sec">Awaiting your sign-off</h2><div id="swAdmin"></div>':''}`;

  const send=$('#swSend');
  if(send)send.onclick=async()=>{
    const [date,shift]=$('#swShift').value.split('|');
    $('#swMsg').textContent='sending…';
    try{
      const r=await api('/swaps',{method:'POST',body:JSON.stringify({toPerson:$('#swWho').value,date,shift,note:$('#swNote').value})});
      $('#swMsg').textContent=r.swap.ruleCheck==='CLEAN'
        ? 'Sent — waiting on '+r.swap.toPerson
        : 'Blocked: '+(r.swap.problems[0]||'breaks a rule');
      await loadSwaps(); renderSwap();
    }catch(e){$('#swMsg').textContent=e.message;}
  };
  $$('[data-acc]',pane).forEach(b=>b.onclick=async()=>{
    try{await api('/swaps',{method:'PATCH',body:JSON.stringify({id:b.dataset.acc,action:'accept'})});
        await loadSwaps(); renderSwap();}catch(e){alert(e.message);}});
  $$('[data-dec]',pane).forEach(b=>b.onclick=async()=>{
    try{await api('/swaps',{method:'PATCH',body:JSON.stringify({id:b.dataset.dec,action:'decline'})});
        await loadSwaps(); renderSwap();}catch(e){alert(e.message);}});

  if(isAdmin()){
    const box=$('#swAdmin');
    const queue=MYSWAPS.filter(s=>s.status==='awaiting_admin'||s.status==='blocked');
    box.innerHTML=queue.length?queue.map(s=>`
      <div class="swcard">
        <div class="swtop"><b>${fmtD(s.date)}</b> — ${esc(META(s.shift).label||s.shift)} ${badge(s)}</div>
        <div class="swwho">${esc(s.fromPerson)} → ${esc(s.toPerson)}${s.note?' · '+esc(s.note):''}</div>
        <div class="swrule ${s.ruleCheck==='CLEAN'?'ok':'bad'}">${s.ruleCheck==='CLEAN'
          ?'✓ Passes every rule check'
          :'✗ '+s.problems.map(esc).join(' · ')}</div>
        <div class="swact">
          <button class="btn primary" data-ap="${s.id}">Approve</button>
          <button class="btn" data-rj="${s.id}">Reject</button>
          ${s.ruleCheck==='CLEAN'?'':`<button class="btn warnbtn" data-ov="${s.id}">Approve anyway</button>`}
        </div>
      </div>`).join(''):'<div class="empty">Nothing waiting.</div>';
    const act=(sel,payload)=>$$(sel,box).forEach(b=>b.onclick=async()=>{
      try{await api('/swaps',{method:'PATCH',body:JSON.stringify({id:b.dataset.ap||b.dataset.rj||b.dataset.ov,...payload})});
          await loadSwaps(); renderSwap();}catch(e){alert(e.payload&&e.payload.problems?e.payload.problems.join('\n'):e.message);}});
    act('[data-ap]',{action:'approve'});
    act('[data-rj]',{action:'reject'});
    act('[data-ov]',{action:'approve',override:true});
  }
  /* WIRING BELONGS WITH RENDERING. wireCoverage() was called from one place — the moment you
     navigate to this tab — while renderSwap() is called from nine: after loading, after a live
     refresh, after sending a request, after claiming one. Every one of those replaced the
     buttons with fresh HTML carrying no handlers, so "I'll take it" did nothing at all unless
     the tab had just been opened and nothing had happened since. Re-rendering must not be able
     to leave dead buttons behind. */
  wireCoverage();
}

}

/* ---------- day sheet ---------- */
function openDay(iso){
  if(!DATA.dates.includes(iso)){sheet(fmtLong(iso),'<div class="note" style="margin-top:0">Outside this block.</div>');return;}
  const a=dayOf(ME,iso),rq=DATA.requests[ME]||{};
  const onReq=(rq.on||[]).includes(iso),offReq=(rq.off||[]).includes(iso),cmeReq=(rq.cme||[]).includes(iso);
  let b='';
  const daySh=(a?a.s:[]).filter(s=>isRealShift(ME,iso,s));
  if(daySh.length){
    daySh.slice().sort((x,y)=>startHour(x)-startHour(y)).forEach(s=>{const m=META(s);
      const hrs=DATA.kindHours[m.kind];
      const time=!hrs?'All day':`${hrs[0]%12||12}${hrs[0]<12?'am':'pm'} – ${(hrs[0]+hrs[2])%24%12||12}${((hrs[0]+hrs[2])%24)<12?'am':'pm'}`;
      b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:${m.color}"></span>
        <span><span class="t">${esc(shiftLabel(ME,iso,s,false))}</span><span class="s">${esc(m.sub)}</span></span>
        <span class="rt">${time}</span></div>`;});
    if(a.s.filter(s=>META(s).kind!=='noc').length&&a.s.some(s=>META(s).kind==='noc'))
      b+=`<div class="note"><span class="pill warn">24-hour shift</span> Two full days off follow.</div>`;
  }else if(offReq||cmeReq){
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:var(--signal)"></span>
      <span><span class="t">Off — you asked for it</span><span class="s">${cmeReq?'CME':'Requested day off'} · granted</span></span></div>`;
  }else{
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:var(--line2)"></span>
      <span><span class="t">Not scheduled</span><span class="s">No shift this day</span></span></div>`;
  }
  (a&&a.r||[]).forEach(r=>{const rm=DATA.roles[r]||{label:r,color:'#F0ABFC'};
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:${rm.color}"></span>
      <span><span class="t">◆ ${esc(rm.label)}</span><span class="s">Layered role — on top of your shift</span></span></div>`;});
  if(onReq)b+=`<div class="note"><span class="pill ok">You asked to work</span> This was one of your request-on days.</div>`;
  if(a&&a.s.length)b+=`<div class="btnrow"><button class="btn" id="dsSwap">Find cover for this shift</button></div>`;
  sheet(fmtLong(iso),b);
  const sw=$('#dsSwap');
  // Used to close this sheet and jump to the Swaps tab — a different page, arrived at with no
  // explanation, which for an admin also lit up the admin view. Asking someone to cover a shift
  // is one decision; it belongs in one sheet, on the shift you were already looking at.
  if(sw)sw.onclick=()=>openCoverFor(iso,(a.s||[])[0],a.s||[]);
}

/* ---------- ask for cover, on the shift you are looking at ----------
   The list of who will be asked is shown BEFORE anything is sent, with a tick against each
   name. Broadcasting to everyone eligible without saying who that is means pushing a
   notification to a dozen colleagues sight unseen — which is exactly why somebody would think
   twice about using this at all. Unticking a name takes them off; the server intersects the
   list with what the rules allow, so a tick can never add somebody who cannot legally take it. */
async function openCoverFor(iso,shift,allShifts){
  const list=(allShifts&&allShifts.length?allShifts:[shift]).filter(Boolean);
  sheet('Ask someone to cover',
    `${list.length>1?`<label class="lbl" for="cvWhich">Which shift</label>
       <select class="inp" id="cvWhich">${list.map(sh=>
         `<option value="${esc(sh)}">${esc(META(sh).label||sh)}</option>`).join('')}</select>`:''}
     <div class="sub" style="margin-top:8px">${esc(fmtLong(iso))} · <b>${esc(META(shift).label||shift)}</b></div>
     <div id="cvWho" class="sub" style="margin-top:10px">Working out who can take this…</div>
     <label class="lbl" for="cvNote" style="margin-top:10px">Anything they should know (optional)</label>
     <input class="inp" id="cvNote" maxlength="200" placeholder="e.g. away at a conference">
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="cvSend" disabled>Offer to available providers</button>
     </div>
     <div class="msg" id="cvMsg"></div>`);
  const sel=$('#cvWhich');
  if(sel)sel.onchange=()=>loadCoverCandidates(iso,sel.value);
  await loadCoverCandidates(iso,shift);
}

async function loadCoverCandidates(iso,shift){
  const box=$('#cvWho'), go=$('#cvSend');
  if(!box)return;
  box.innerHTML='Working out who can take this…';
  if(go)go.disabled=true;
  try{
    const q='?preview=1&date='+encodeURIComponent(iso)+'&shift='+encodeURIComponent(shift)+
            (onBehalf()?'&person='+encodeURIComponent(ME):'');
    const r=await api('/coverage'+q);
    const el=r.eligible||[];
    if(!el.length){
      box.innerHTML='<b>Nobody is eligible for this shift right now.</b> Everyone else is either '+
        'working, off, or not credentialed for it. Ask Dr. Nadon.';
      return;
    }
    const push=el.filter(x=>x.push).length;
    box.innerHTML='<b>'+el.length+' '+(el.length===1?'person':'people')+' can take this.</b> '+
      (push?push+' will get it on their phone; the rest see it next time they open the app.'
          :'None of them have phone notifications on, so they will see it next time they open the app.')+
      '<div class="cvlist">'+el.map(x=>
        `<label class="cvrow"><input type="checkbox" checked value="${esc(x.person)}">
           <span class="cvnm">${esc(fullOf(x.person)||x.person)}</span>
           <span class="cvpush">${x.push?'📱':'<span class="muted">in app</span>'}</span></label>`).join('')+
      '</div>';
    const upd=()=>{
      const n=$$('#cvWho input:checked').length;
      go.disabled=!n;
      go.textContent=n?('Offer to '+n+' provider'+(n===1?'':'s')):'Nobody selected';
    };
    $$('#cvWho input').forEach(c=>c.onchange=upd);
    upd();
    go.onclick=async()=>{
      const to=$$('#cvWho input:checked').map(c=>c.value);
      const m=$('#cvMsg'); m.textContent='Sending…'; m.className='msg on';
      go.disabled=true;
      try{
        const body={date:iso,shift,mode:'broadcast',to,note:($('#cvNote')||{}).value||''};
        if(onBehalf())body.person=ME;
        const j=await api('/coverage',{method:'POST',body:JSON.stringify(body)});
        closeSheet();
        toast('Asked '+(j.eligibleCount||to.length)+' — you will be told when someone takes it');
        await loadCoverage(); if(CUR==='swap')renderSwap();
      }catch(e){ m.textContent=e.message||'Could not send'; m.className='msg on bad'; go.disabled=false; }
    };
  }catch(e){
    box.innerHTML='<span class="bad">'+esc(e.message||'Could not work out who is available')+'</span>';
  }
}

/* ---------- live schedule changes (admin edits, applied on top of the build) ----------
   The page bakes the schedule in at build time. Manual changes therefore have to be layered
   on at read time, or a call-out fixed this morning would not reach anyone until the next
   full rebuild and redeploy. EDITS holds the override records; MYCHANGES is the subset that
   touches the signed-in physician. */
let EDITS=[], MYCHANGES=[];
function applyEdits(edits){
  EDITS=edits||[]; MYCHANGES=[];
  if(!ME)return;
  const mine=DATA.day[ME]||(DATA.day[ME]={});
  EDITS.forEach(o=>{
    const was=(o.from||[]).includes(ME), now=(o.to||[]).includes(ME);
    if(was===now)return;                          // this edit does not involve me
    const a=mine[o.date]||(mine[o.date]={s:[],r:[]});
    a.s=(a.s||[]).filter(x=>x!==o.unit);
    if(now)a.s.push(o.unit);
    MYCHANGES.push({date:o.date,unit:o.unit,added:now,at:o.at,by:o.by,note:o.note});
  });
  MYCHANGES.sort((x,y)=>x.date.localeCompare(y.date));
}
/* ACKNOWLEDGED, NOT DISMISSED FOREVER.
   This sat at the top of the schedule permanently. A notice that never goes away stops being
   read within a day, which is the opposite of what a schedule change needs — and there was no
   way to say "yes, I saw that", so it kept claiming the schedule had just changed weeks later.

   Dismissal is keyed to WHICH changes, not to the banner: acknowledging today's change cannot
   hide tomorrow's. The key is the changes themselves, so a new one — or the same shift changed
   again — brings it straight back. Per person too, since an admin steps through several. */
function changeKey(){
  return (ME||'')+'|'+MYCHANGES.map(c=>c.date+':'+c.unit+':'+(c.added?'+':'-')+(c.at||'')).join(',');
}
function changesSeen(){
  try{ return localStorage.getItem('ccpsa_chgseen')===changeKey(); }catch(e){ return false; }
}
function changeBanner(){
  if(!MYCHANGES.length||changesSeen())return '';
  const rows=MYCHANGES.map(c=>{
    const m=META(c.unit)||{label:c.unit};
    return '<li>'+(c.added?'<b>Added</b> ':'<b>Removed</b> ')+(m.label||c.unit)+
           ' on '+fmtD(c.date)+(c.note?' — '+esc(c.note):'')+'</li>';
  }).join('');
  return '<div class="swcard chg" id="chgCard"><div class="chgh">Your schedule changed</div>'+
         '<ul class="chgl">'+rows+'</ul>'+
         '<div class="muted sm">Changed by the scheduling lead. Questions go to '+
         esc((CFG&&CFG.lateContact)||'your scheduling lead')+'.</div>'+
         '<div class="btnrow"><button class="btn" id="chgOk">OK, got it</button></div></div>';
}
function wireChangeBanner(){
  const b=document.querySelector('#chgOk'); if(!b)return;
  b.onclick=()=>{
    try{localStorage.setItem('ccpsa_chgseen',changeKey());}catch(e){}
    const c=document.querySelector('#chgCard'); if(c)c.remove();
  };
}


function toast(msg){
  let t=$('#toast');
  if(!t){t=el('div','toastbox');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600);
}
/* ---------- admin: change the schedule ----------
   Phone-first on purpose: a call-out gets fixed from wherever the scheduling lead is, not from
   a desk. The rule verdict is ADVISORY — it is shown before saving, and a change that breaks
   something needs one extra deliberate tap rather than being blocked. */
let EDDAY=null, EDDATE=null;
function renderEdit(){
  const pane=$('#pane-edit');
  if(!pane.dataset.wired){
    pane.innerHTML=`<h2 class="sec">Change the schedule</h2>
      <div class="note" style="margin-top:0">Changes appear on every physician's phone straight
        away. The solved block is not altered — each change is recorded, attributed and undoable.</div>
      <div class="swcard" style="margin-top:12px">
        <label class="lbl" for="edDate">Day</label>
        <input type="date" id="edDate" class="inp" min="${DATA.dates[0]}" max="${DATA.dates[DATA.dates.length-1]}">
        <div class="btnrow"><button class="btn pri" id="edLoad">Show this day</button></div>
      </div>
      <div id="edBody"></div>
      <h3 class="sec" style="font-size:15px;margin-top:22px">Recent changes</h3>
      <div id="edLog"></div>`;
    $('#edDate').value=EDDATE||todayISO();
    $('#edLoad').onclick=()=>loadEditDay($('#edDate').value);
    pane.dataset.wired='1';
  }
  drawEditLog();
  if(EDDATE)drawEditDay();
}
async function loadEditDay(iso){
  if(!iso)return;
  EDDATE=iso; $('#edBody').innerHTML='<div class="muted">Loading…</div>';
  try{ EDDAY=await api('/schedule?date='+encodeURIComponent(iso)); }
  catch(e){ $('#edBody').innerHTML='<div class="errbox">'+esc(e.message)+'</div>'; return; }
  drawEditDay();
}
function drawEditDay(){
  if(!EDDAY)return;
  const units=EDDAY.units||{}, keys=Object.keys(units).sort((a,b)=>
    (META(a).label||a).localeCompare(META(b).label||b));
  const changedHere=new Set((EDDAY.overrides||[]).map(o=>o.unit));
  const rows=keys.map(u=>{
    const m=META(u), who=units[u]||[];
    return `<button class="edrow" data-u="${esc(u)}">
      <span class="dotU" style="background:${m.color}"></span>
      <span class="edu">${esc(m.label||u)}${changedHere.has(u)?' <span class="tagc">changed</span>':''}</span>
      <span class="edw">${who.length?esc(who.join(', ')):'<i>nobody</i>'}</span>
      <span class="chev">›</span></button>`;
  }).join('');
  $('#edBody').innerHTML=`<h3 class="sec" style="font-size:15px">${esc(fmtLong(EDDATE))}</h3>
    <div class="edlist">${rows||'<div class="empty">Nothing scheduled that day.</div>'}</div>`;
  $$('#edBody .edrow').forEach(b=>b.onclick=()=>openCell(b.dataset.u));
}
function openCell(unit){
  const who=(EDDAY.units||{})[unit]||[];
  const cands=((EDDAY.candidates||{})[unit]||[]).filter(p=>!who.includes(p));
  const m=META(unit);
  const chips=cands.map(p=>`<button class="pill cpick" data-p="${esc(p)}">${esc(p)}</button>`).join('');
  const cur=who.map(p=>`<button class="pill cpick on" data-r="${esc(p)}">${esc(p)} ✕</button>`).join('');
  sheet(`${m.label||unit} · ${fmtD(EDDATE)}`,
    `<div class="lbl">On now — tap to remove</div>
    <div class="chips">${cur||'<i class="muted">nobody</i>'}</div>
    <div class="lbl" style="margin-top:12px">Available and legal for this shift</div>
    <div class="chips">${chips||'<i class="muted">nobody is free and credentialed</i>'}</div>
    <label class="lbl" for="edNote" style="margin-top:12px">Why (shown to the physician)</label>
    <input id="edNote" class="inp" placeholder="e.g. called out sick">
    <div id="edVerdict"></div>
    <div class="btnrow"><button class="btn" id="edCancel">Cancel</button>
      <button class="btn pri" id="edSave" disabled>Save change</button></div>`);
  let next=who.slice();
  const paint=()=>{
    $('#edSave').disabled = (next.length===who.length && next.every((p,i)=>p===who[i]));
    $$('#sheet .cpick').forEach(c=>{
      const p=c.dataset.p||c.dataset.r;
      c.classList.toggle('on',next.includes(p));
      c.innerHTML=esc(p)+(next.includes(p)?' ✕':'');
    });
  };
  $$('#sheet .cpick').forEach(c=>c.onclick=()=>{
    const p=c.dataset.p||c.dataset.r;
    next = next.includes(p) ? next.filter(x=>x!==p) : next.concat([p]);
    paint();
  });
  $('#edCancel').onclick=closeSheet;
  $('#edSave').onclick=()=>saveCell(unit,next,false);
  paint();
}
async function saveCell(unit,to,force){
  const note=($('#edNote')&&$('#edNote').value)||'';
  const v=$('#edVerdict'); v.innerHTML='<div class="muted">Checking…</div>';
  try{
    const r=await api('/schedule',{method:'PATCH',
      body:JSON.stringify({date:EDDATE,unit,to,note,force:!!force})});
    closeSheet();
    await loadEditDay(EDDATE);
    try{const s=await api('/schedule');applyEdits(s.overrides||[]);}catch(e){}
    drawEditLog();
    toast(r.unchanged?'No change':'Saved — everyone sees it now');
  }catch(e){
    const p=(e.payload&&e.payload.problems)||[];
    if(e.status===409){
      v.innerHTML='<div class="errbox"><b>This breaks the rules</b><ul>'+
        p.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
        '<button class="btn warnbtn" id="edForce">Make the change anyway</button></div>';
      $('#edForce').onclick=()=>saveCell(unit,to,true);
    }else{ v.innerHTML='<div class="errbox">'+esc(e.message)+'</div>'; }
  }
}
function drawEditLog(){
  const box=$('#edLog'); if(!box)return;
  const list=EDITS.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,12);
  if(!list.length){box.innerHTML='<div class="empty">No manual changes yet.</div>';return;}
  box.innerHTML=list.map(o=>`<div class="swcard">
      <div class="lgh">${esc(fmtD(o.date))} · ${esc(META(o.unit).label||o.unit)}
        ${o.ruleCheck==='FAILS'?'<span class="tagw">forced</span>':''}</div>
      <div class="sub">${esc((o.from||[]).join(', ')||'nobody')} → <b>${esc((o.to||[]).join(', ')||'nobody')}</b></div>
      ${o.note?`<div class="sub">${esc(o.note)}</div>`:''}
      <div class="muted sm">${esc(o.by||'')} · ${esc(String(o.at||'').slice(0,10))}
        <button class="lnk" data-undo="${esc(o.id)}">Undo</button></div>
    </div>`).join('');
  $$('#edLog [data-undo]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Undo this change? The schedule goes back to what it was.'))return;
    try{
      await api('/schedule',{method:'DELETE',body:JSON.stringify({id:b.dataset.undo})});
      const s=await api('/schedule'); applyEdits(s.overrides||[]);
      drawEditLog(); if(EDDATE)loadEditDay(EDDATE); toast('Change undone');
    }catch(e){toast(e.message);}
  });
}

/* ---------- the test site's date control ----------
   Reloading after a change is deliberate: every view computes from today at render time, and
   re-rendering half of them would leave the other half showing a different day. */
function testDateBar(){
  if(!TEST_BUILD)return;
  let bar=document.querySelector('#testDateBar');
  if(!bar){ bar=el('div','testdate'); bar.id='testDateBar';
            document.querySelector('header').appendChild(bar); }

      'max="'+esc(DATA.dates[DATA.dates.length-1])+'">'+
    (on?'<button class="tdb" id="tdReset">Back to today</button>':'');

/* ---------- light or dark ----------
   No stored choice means follow the phone, which is already somebody's answer to this question.
   A tap makes it explicit and that choice sticks; the system stops being consulted from then on,
   because someone who has chosen does not want their preference re-litigated at sunset. */
function storedTheme(){ try{return localStorage.getItem('ccpsa_theme')||'';}catch(e){return '';} }
function systemTheme(){ return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
function currentTheme(){ return storedTheme()||systemTheme(); }
function setTheme(t){
  try{localStorage.setItem('ccpsa_theme',t);}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',t==='light'?'#F4F7FA':'#0E1621');
  paintThemeBtn();
}
function paintThemeBtn(){
  const b=document.querySelector('#themeBtn'); if(!b)return;
  // The icon is what you will GET, not what you are on — a sun while already light is a puzzle.
  b.textContent=currentTheme()==='light'?'☾':'☀';
}
// Applied before anything renders, or the app flashes the wrong theme on every open. This is
// also what makes ONE light palette enough: the system preference is turned into the same
// data-theme attribute an explicit choice sets, so the stylesheet needs no media-query copy of
// the values to drift out of step with.
(function(){
  const apply=()=>{
    const t=currentTheme();
    document.documentElement.setAttribute('data-theme',t);
    const m=document.querySelector('meta[name=theme-color]');
    if(m)m.setAttribute('content',t==='light'?'#F4F7FA':'#0E1621');
    paintThemeBtn();
  };
  apply();
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{
    if(!storedTheme())apply();          // still following the phone
  });
})();

// The portal is phone-first (.wrap is 600px), so the dashboard was being squeezed into a
// phone-width column on a laptop — which is what made its text overlap. In admin mode the pane
// breaks out of that column and the frame is sized to the real viewport.
function sizeAdminFrame(){
  const f=document.querySelector('#admFrame'); if(!f)return;
  const top=f.getBoundingClientRect().top;
  const h=Math.max(320,(window.innerHeight||600)-top);
  f.style.height=h+'px';
}

window.addEventListener('orientationchange',()=>setTimeout(sizeAdminFrame,250));

/* ---------- the approvals desk ----------
   Three queues used to live in three places, all of them inside SOME PHYSICIAN'S page: cover
   approvals in the offer sheet, swap sign-off at the bottom of the Swaps tab, and holiday
   decisions nowhere at all — /api/requests has taken a PATCH since 8/17 and nothing ever sent
   one. An admin who is not a physician has no page to find any of it on. This is that page.

   It is deliberately NOT behind the 6-digit step-up. Every decision here is one the Swaps tab
   already offers on a session alone; the code guards the admin DASHBOARD, where the schedule
   itself can be rewritten. Asking for one to see a list of the same two buttons would be
   theatre — and it would fire on every boot for the admins who land here. */
async function loadAdminQueue(){
  if(ROLE!=='admin'||!SESSION){ADMINQ={cover:[],swaps:[],hol:[]};return;}
  const [cov,sw,rq]=await Promise.all([
    api('/coverage').catch(()=>({offers:[]})),
    api('/swaps').catch(()=>({swaps:[]})),
    api('/requests?all=1').catch(()=>({all:{}})),
  ]);
  // Claimed, not open: an offer nobody has accepted is not waiting on an admin.
  ADMINQ.cover=(cov.offers||[]).filter(o=>o.status==='claimed');
  // 'blocked' is waiting on the two physicians, not on us — it never reached a partner.
  ADMINQ.swaps=(sw.swaps||[]).filter(s=>s.status==='awaiting_admin');
  ADMINQ.hol=Object.values(rq.all||{})
    .filter(r=>r&&r.holiday&&!['approved','declined'].includes(r.holidayStatus||''))
    .sort((a,b)=>String(a.person).localeCompare(String(b.person)));
}
function adminQCount(){ return ADMINQ.cover.length+ADMINQ.swaps.length+ADMINQ.hol.length; }

const HOLNAME={thanksgiving:'Thanksgiving',christmas:'Christmas',newyear:'New Year'};

      o.note?' — '+esc(o.note):''}</div>

    <div class="qact"><button class="btn pri" data-qc="${esc(o.id)}" data-act="approve">Approve</button>

      s.ruleCheck==='CLEAN'?''
        :`<button class="btn warnbtn" data-qs="${esc(s.id)}" data-act="override">Approve anyway</button>`}
    </div></div>`));

  ADMINQ.hol.forEach(r=>cards.push(`<div class="qcard">
    <div class="qk">Priority holiday · needs a decision</div>
    <div class="qt">${who(r.person)} — ${esc(HOLNAME[String(r.holiday).toLowerCase()]||r.holiday)}</div>
    <div class="qw">Their one guaranteed 4-day holiday block for the year.</div>
    <div class="qact"><button class="btn pri" data-qh="${esc(r.person)}" data-act="approved">Approve</button>
      <button class="btn" data-qh="${esc(r.person)}" data-act="declined">Decline</button></div></div>`));

  w.innerHTML=`<h1 class="hgreet">${esc((ACCT&&ACCT.label)||'Admin')}</h1>
    <div class="hsub">${n?`${n} thing${n===1?'':'s'} waiting on you.`
      :'Nothing is waiting on you right now.'}</div>
    ${cards.length?cards.join('')
      :`<div class="hzero"><div class="zt">You are all caught up</div>
         <div class="zs">Cover approvals, swap sign-offs and holiday decisions land here.</div></div>`}
    <div class="hlinks">
      <button class="btn" id="hDash">Open the dashboard</button>
      <button class="btn" id="hPick">Look at a physician</button>
      <button class="btn gho" id="hRef">Refresh</button>
    </div>`;

  // A decision is one round trip, then the whole queue is re-read: approving a cover can settle
  // a swap on the same shift, and a stale card is an invitation to decide something twice.
  const after=async(msg)=>{ toast(msg); await loadAdminQueue(); renderAdminHome();
                            adminBar(); await refreshLive(true).catch(()=>{}); };
  const wire=(sel,run)=>$$(sel,w).forEach(b=>b.onclick=async()=>{
    $$('button',w).forEach(x=>x.disabled=true);

  wire('[data-qc]',async b=>{

      action:act==='reject'?'reject':'approve', override:act==='override'})});

  wire('[data-qh]',async b=>{

  $('#hPick').onclick=()=>{ hideAdminHome(); if(ME){boot();markBar('pick');} else togglePicker(); };
  $('#hRef').onclick=async()=>{ await loadAdminQueue(); renderAdminHome(); adminBar(); };
}

  w.classList.add('on');

                              adminBar(); }).catch(()=>{});

  const t=document.querySelector('.tabs'); if(t){t.style.display='';t.hidden=false;}

function onAdminHome(){ return !!document.querySelector('#homeWrap.on'); }
// Everything that belongs to ONE person. Called at boot and again whenever the admin switches
// who they are looking at, so what is on screen is always that person's own data.
let LOADED_FOR=null;
async function loadPersonData(){
  if(!SESSION)return;
  const viewing=onBehalf()?('?person='+encodeURIComponent(ME)):'';
  try{const r=await api('/requests'+viewing);MYREQ=r.requests||{};
      CFG={...(CFG||{}),deadline:r.deadline,locked:r.locked,allowance:r.allowance};}catch(e){MYREQ={};}
  // The calendar link belongs to the person on screen, not to the account that signed in — and
  // it is stamped with WHOSE it is, because the fetch is slower than the switch. Drop the old
  // one first: for that moment the honest answer is "getting it", not the last person's link.
  const forWho=ME;
  CFG={...(CFG||{}),icsUrl:null,icsFor:null};
  if(CUR==='sched')renderSched();
  try{ const q=onBehalf()?('?person='+encodeURIComponent(ME)):'';
       const pr=await api('/portal'+q);
       if(ME!==forWho)return;            // switched again while this was in flight
       CFG={...(CFG||{}),icsUrl:pr.icsUrl||null,icsFor:forWho}; }catch(e){}
  await loadSwaps();
  await loadCoverage();
  if(onBehalf())MYSWAPS=(MYSWAPS||[]).filter(w=>w.fromPerson===ME||w.toPerson===ME);
  REQSAVED=null;                  // a confirmation from the previous person would be a lie
  LOADED_FOR=ME;
  if(CUR==='req')renderReq();
  if(CUR==='swap')renderSwap();
  if(CUR==='sched')renderSched();   // the calendar link lives here and has only just arrived
}

/* ---------- sign in, then load ----------
   Nothing renders until the API says who you are and hands back your schedule. */

/* A device that has already passed 2FA as this person does not need the code again — the token
   is signed and expires in 90 days, so it proves that and nothing more (client 8/17). */
function rememberedDevice(){ try{return localStorage.getItem('__dev')||'';}catch(e){return '';} }
function keepDevice(tok){ if(tok){try{localStorage.setItem('__dev',tok);}catch(e){}} }
// A code entered at sign-in covers the admin view for this session. Without this you typed a
// code, opened the admin view, were asked for another — and the one you had just used was
// REFUSED, because its time step is burned to stop replay. Right code, correct use, "not right".
function keepGrant(g){ if(g){ ADMIN_GRANT=g; try{sessionStorage.setItem('__grant',g);}catch(e){} } }
// Once per session, not once per reload: the grant lives in sessionStorage, so it survives a
// refresh but dies with the tab (client 8/17).
let ADMIN_GRANT=null;
try{ADMIN_GRANT=sessionStorage.getItem('__grant')||null;}catch(e){}
/* Entering the admin view asks for a fresh code: that is where the schedule can be changed. */
function askStepUp(then){
  sheet('Admin view',
    `<div class="sub">Enter the 6-digit code from your authenticator app to open the admin view.</div>
     <label class="lbl" for="suCode">Code</label>
     <input class="inp siCode" id="suCode" inputmode="numeric" autocomplete="one-time-code"
            maxlength="6" placeholder="000000">
     <div class="msg" id="suMsg"></div>
     <div class="btnrow"><button class="btn pri" id="suGo">Unlock</button>
       <button class="btn" id="suCancel">Cancel</button></div>`);
  const m=$('#suMsg');
  const go=async()=>{
    m.textContent='Checking…'; m.className='msg on';
    try{
      const j=await api('/stepup',{method:'POST',body:JSON.stringify({totp:$('#suCode').value.trim()})});
      ADMIN_GRANT=j.grant;
      try{sessionStorage.setItem('__grant',ADMIN_GRANT);}catch(e){}
      onSheetClose(null);      // the code was accepted; do NOT bounce back to physicians
      closeSheet(); then();
    }catch(e){
      if(e.payload&&e.payload.need==='enrol2fa'){
        m.textContent='Set up an authenticator first — open Account settings.'; m.className='msg on bad';
      }else{ m.textContent=e.message||'That code is not right.'; m.className='msg on bad'; }
    }
  };
  $('#suGo').onclick=go;
  // 'mine' matched no button — they are data-v="home"/"admin"/"pick" — so this used to clear
  // every one of them, leaving no side of the toggle lit. An admin with no schedule cancels
  // back to their own page, not to a physician they never chose.
  const backToPhysicians=()=>{
    hideAdminView();
    if(ME){ markBar('pick'); boot(); } else { markBar('home'); showAdminHome(); }
  };
  onSheetClose(backToPhysicians);
  $('#suCancel').onclick=()=>closeSheet();
  const c=$('#suCode');
  c.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go();}});
  c.addEventListener('input',()=>{if(c.value.replace(/\D/g,'').length===6)go();});
  setTimeout(()=>c.focus(),60);
}

function siShell(body){
