    <h2 class="sec">Number of shifts desired</h2>
    <div class="mgrid">${months.map(k=>`
      <label class="mrow"><span>${monthName(k)}</span>
        <input class="minp" type="number" min="0" max="31" inputmode="numeric"
               data-m="${k}" value="${want[k]!=null?want[k]:''}" placeholder="0">
        <span class="mnote">${per(k)} night${per(k)===1?'':'s'} offered</span></label>`).join('')}
    </div>
    <h2 class="sec">Nights available to work</h2>
    <div class="addrow"><input type="date" id="mnDate" aria-label="date" min="${reqStart()}"
      max="${reqYear()}-12-31" value="${reqStart()}"><button class="btn" id="mnAdd">Add</button></div>
    <div class="addhint" id="mnHint"></div>
    <div class="chips" id="mnChips">${chipList(avail,'mn',1)}</div>
    <h2 class="sec">How you'd like your nights</h2>
    <p class="muted" style="margin-top:0">If you are given more than one, would you rather they
      ran back to back or were spread out? A preference, not a guarantee — the schedule may not
      be able to honour it.</p>
    <div class="segx" id="nsSeg">
      ${[['','No preference'],['together','Back to back'],['apart','Spread out']]
        .map(([k,l])=>`<button data-ns="${k}" class="${(rq.nightShape||'')===k?'on':''}">${l}</button>`).join('')}
    </div>
    <div class="btnrow"><button class="btn pri" id="mSave">Save my availability</button></div>
    <div class="msg" id="mMsg"></div>`;
  const collect=()=>{
    const w={};
    pane.querySelectorAll('.minp').forEach(i=>{const v=parseInt(i.value,10); if(!isNaN(v)&&v>=0)w[i.dataset.m]=v;});
    return w;
  };
  $('#mnAdd').onclick=()=>{
    const el=$('#mnDate'), hint=$('#mnHint');
    if(!el.value){ if(hint)hint.textContent='Pick a date first, then press Add.';
                   el.focus(); if(el.showPicker)try{el.showPicker();}catch(e){} return; }
    const v=el.value;
    if(!avail.includes(v))avail.push(v);
    avail.sort(); MYREQ={...rq,nights_available:avail,shifts_wanted:collect()}; renderReq();
  };
  // chipList writes data-d on a .pillx. This looked for [data-x] and read dataset.x, so the
  // selector matched nothing at all and the × on a night you had offered did nothing — the one
  // way to take back an offer. The physicians' own chips, three functions down, were always
  // written against the real markup; only this copy drifted.
  $$('#mnChips .pillx',pane).forEach(c=>c.onclick=()=>{
    const i=avail.indexOf(c.dataset.d); if(i>=0)avail.splice(i,1);
    MYREQ={...rq,nights_available:avail,shifts_wanted:collect()}; renderReq();
  });
  $$('#nsSeg button',pane).forEach(b=>b.onclick=()=>{
    MYREQ={...rq,nights_available:avail,shifts_wanted:collect(),nightShape:b.dataset.ns||null};
    renderReq();});
  $('#mSave').onclick=async()=>{
    const m=$('#mMsg'); m.textContent='Saving…'; m.className='msg on';
    try{
      const who=onBehalf();
      const body={nights_available:avail,shifts_wanted:collect(),moonlighter:true,
                  nightShape:(MYREQ&&MYREQ.nightShape)||null};
      if(who)body.person=who;
      await api('/requests',{method:'POST',body:JSON.stringify(body)});
      m.textContent=who?('Saved for '+fullOf(who)):'Saved'; m.className='msg on ok';
    }catch(e){ m.textContent=e.message||'Could not save'; m.className='msg on bad'; }
  };
}

let REQSAVED=null, REQERR=null, REQCLEAROK=false;
/* WHAT THE SCHEDULING LEAD DECIDED, ON THE SCREEN THAT SHOWS THE REQUEST.
   A decline used to leave the days sitting in the list looking granted; now they come off, so
   the screen has to say why or the days simply vanish — which is worse. Named, not counted:
   "3 days were removed" sends somebody hunting for which three. */
function declinedHTML(){
  const r=MYREQ||{};
  if(r.longRunStatus!=='declined')return '';
  const gone=(r.longRunRemoved||[]).slice().sort();
  if(!gone.length)return '';
  const seen=(()=>{try{return localStorage.getItem('ccpsa_dec')===(r.longRunDecidedAt||'');}catch(e){return false;}})();
  if(seen)return '';
  const span=gone.length>1?fmtD(gone[0])+' – '+fmtD(gone[gone.length-1]):fmtD(gone[0]);
  return `<div class="errbox" id="decBox"><b>Declined — ${gone.length} day${gone.length===1?'':'s'} removed</b>
    <div style="margin-top:6px">${esc(span)} ${gone.length>1?'('+gone.length+' days in a row)':''}
      ${r.longRunNote?'— '+esc(r.longRunNote):''}</div>
    <div class="muted sm" style="margin-top:6px">Everything else you asked for is unchanged.
      Speak to ${esc((CFG&&CFG.lateContact)||'Dr. Nadon')} if you need this stretch.</div>
    <div class="btnrow"><button class="btn" id="decOk">OK, got it</button></div></div>`;
}
// Make requests / See requests (Sam, 2026-09-03). Two jobs on one page: picking days is fiddly,
// and reading back what you asked for should not mean scrolling past the picking to reach it.
let REQVIEW='make';

/* ---------- the request calendar (client items 8, 9, 10, 14) ----------
   "Some people complained about the requests not saving and people should be able to select
    multiple requests at once. like maybe on a calendar" … "there should be a calendar view to see
    all the requests you have put on the calendar at once. this should look just like the
    schedule."

   One control does both jobs, because they are the same job: the picture of what you have asked
   for IS the thing you edit. Three date inputs and three chip lists could not show you January at
   a glance, and a separate read-only calendar would be a second place to keep in step.

   Why this probably also fixes "not saving". A native date input on iOS does not commit its value
   until the wheel is dismissed, so picking 14 January and going straight for Add reads the FIELD,
   which is still yesterday's value or empty. The day never joins the list, Save stores the list
   without it, and from the far side of the screen that is "my request didn't save". A day you tap
   is on or off; there is no uncommitted state to lose. The date inputs stay for anyone who
   prefers typing, and for a keyboard. */
/* WANT TO WORK IS FOR MOONLIGHTERS ONLY (Sam, 2026-09-03). A partner or employed physician
   asking to work a particular day is not a thing this group does — availability is what a
   moonlighter offers, and they have their own form (renderMoonReq). It was on everybody's
   picker, which invited a request nobody processes.
   The FIELD is untouched: whatever `on` a record already holds is loaded, sent back on save and
   never quietly dropped. It simply cannot be edited from here. */
/* `one` and `many` spelled out, because the log says these numbers in a sentence. Deriving them
   gave "3 day offs", which is not English, and lowercasing gave "1 cme", which is not a word. */
const REQKINDS_ALL=[
  {k:'off',   arr:'off',    label:'Day off',      one:'day off',           many:'days off'},
  {k:'cme',   arr:'cme',    label:'CME',          one:'CME day',           many:'CME days'},
  {k:'nn',    arr:'no_noc', label:'No nights',    one:'no-night day',      many:'no-night days'},
  {k:'on',    arr:'on',     label:'Want to work', one:'want-to-work day',  many:'want-to-work days'},
];
const isMoonlighterMe=()=>!!(DATA.providers[ME]||{}).moon;
const REQKINDS=()=>REQKINDS_ALL.filter(k=>k.k!=='on'||isMoonlighterMe());
let REQMODE='off';
/* AN EXACT RANGE, WITHOUT A GESTURE (client, 2026-09-04: "its hard to get the exact schedules
   right"). Dragging fourteen days across a month grid on a phone is a fine idea and a poor
   instrument: it wraps at the end of a week, it needs a steady finger, and a slip costs you the
   run. Two taps cannot slip — the first day, then the last — and the days between are filled.
   Kept beside the drag rather than replacing it: a short run is quicker to drag. */
let RQRANGE=false, RQANCHOR=null;
/* ONE QUARTER AT A TIME (Sam, 2026-09-03). Twelve calendars was four thousand pixels of
   scrolling to reach March; twelve month buttons was a strip nobody could take in. Four quarters
   is how the group already thinks about the year — it is the unit the blocks are solved in — and
   three months on screen is enough to plan a holiday against.
   After the deadline only the FIRST quarter locks; the rest of the year stays open. */
let RQQTR=null;
// Which dates the deadline actually shuts. Everything else in the window stays editable.
const lockFrom=()=>((CFG&&CFG.lockFrom)||'');
const lockTo=()=>((CFG&&CFG.lockTo)||'');
const dateLocked=(iso)=>!!(CFG&&CFG.locked&&lockFrom()&&lockTo()&&iso>=lockFrom()&&iso<=lockTo());
/* WHAT IS PICKED AND WHAT IS SAVED ARE TWO THINGS, and they were one array.
   `off` came straight off MYREQ and reqCalHTML assigned it to RQ.off — so every tap pushed into
   the record the app calls "saved". Nothing was lost by it (the picks survived a re-render for
   exactly that reason) but nothing could tell the two apart either, which is why See requests
   could not mark anything unsaved: there was no saved copy left to compare against.
   RQ is now seeded with COPIES, and RQSAVED keeps what is actually on file. */
let RQBASE='';
let RQSAVED={off:[],cme:[],nn:[],on:[]};
let RQFOR=null;                       // whose record RQ was seeded from, and which version
function rqSeed(rec,force){
  const rq=rec||{};
  const id=(ME||'')+'|'+(rq.submittedAt||'');
  // Re-seeded only when the underlying record changes — a save, a reload, a different person.
  // NOT on a view switch, or moving to See requests and back would throw away your picks.
  if(!force&&RQFOR===id)return;
  RQFOR=id;
  RQSAVED={off:(rq.off||[]).slice(),cme:(rq.cme||[]).slice(),
           nn:(rq.no_noc||[]).slice(),on:(rq.on||[]).slice()};
  RQ={off:RQSAVED.off.slice(),cme:RQSAVED.cme.slice(),
      nn:RQSAVED.nn.slice(),on:RQSAVED.on.slice()};
  RQBASE=rqSig();
}
const rqSavedHas=(k,iso)=>RQSAVED[k].includes(iso);
// The live edit buffers, held between renders so a drag can paint across a repaint.
let RQ={off:[],cme:[],nn:[],on:[]};
let RQDRAG=null;

const rqHas=(k,iso)=>RQ[k].includes(iso);
function rqSet(k,iso,on){
  const a=RQ[k], i=a.indexOf(iso);
  if(on&&i<0)a.push(iso);
  if(!on&&i>=0)a.splice(i,1);
  /* A DAY CANNOT BE BOTH CME AND OFF — the server rejects the whole submission for it (C-004),
     which used to mean typing two dates and losing the lot on Save. Marking one clears the
     other here, at the moment of the tap, where it is obvious what happened. */
  if(on&&k==='off')rqSet('cme',iso,false);
  if(on&&k==='cme')rqSet('off',iso,false);
}

function reqQuarters(){
  const from=reqStart(), to=reqEnd(), out=[];
  const qof=(iso)=>iso.slice(0,4)+'-Q'+(Math.floor((+iso.slice(5,7)-1)/3)+1);
  for(let m=from.slice(0,7); m<=to.slice(0,7); ){
    const q=qof(m+'-01');
    if(!out.some(x=>x.id===q)){
      const y=+q.slice(0,4), n=+q.slice(6);
      const s0=`${y}-${String((n-1)*3+1).padStart(2,'0')}-01`;
      const eM=(n-1)*3+3, e0=`${y}-${String(eM).padStart(2,'0')}-${new Date(y,eM,0).getDate()}`;
      out.push({id:q, label:'Q'+n+' '+y, from:s0, to:e0,
                months:[0,1,2].map(i=>`${y}-${String((n-1)*3+1+i).padStart(2,'0')}`)});
    }
    const y=+m.slice(0,4), mo=+m.slice(5);
    m=(mo===12)?((y+1)+'-01'):(y+'-'+String(mo+1).padStart(2,'0'));
  }
  return out;
}
// How many days are picked inside a date range — the badge on a quarter button.
function rqCountIn(from,to){
  return REQKINDS_ALL.reduce((n,k)=>n+RQ[k.k].filter(d=>d>=from&&d<=to).length,0);
}
function reqCalHTML(){
  const from=reqStart(), to=reqEnd();
  const qs=reqQuarters();
  if(!RQQTR||!qs.some(q=>q.id===RQQTR))RQQTR=qs[0]&&qs[0].id;
  const q=qs.find(x=>x.id===RQQTR)||qs[0];
  let html=`<div class="rqmonths">${qs.map(x=>{
    const n=rqCountIn(x.from,x.to);
    const shut=!!(CFG&&CFG.locked&&lockFrom()&&x.from>=lockFrom()&&x.to<=lockTo());
    return `<button class="rqm${x.id===RQQTR?' on':''}${shut?' shut':''}" data-rq="${x.id}">
      <span class="rqml">${esc(x.label)}${shut?'<span>closed</span>':''}</span
      ><i class="rqmn" data-qn="${x.id}">${n||''}</i></button>`;}).join('')}</div>`;
  if(dateLocked(q.from)&&dateLocked(q.to))
    html+=`<div class="warnbox" style="margin:0 0 10px"><b>${esc(q.label)} is closed.</b>
      These days are on file and can no longer be changed here — speak to
      ${esc((CFG&&CFG.lateContact)||'Dr. Nadon')}. The rest of the year is still open.</div>`;
  q.months.forEach(mk=>{
    const y=+mk.slice(0,4), mo=+mk.slice(5)-1;
    const first=new Date(y,mo,1), dim=new Date(y,mo+1,0).getDate();
    html+=`<div class="month"><h4><b>${MONL[mo]} ${y}</b></h4><div class="grid7">`;
    dowLabels().forEach(d=>html+=`<div class="dow${d==='Sat'||d==='Sun'?' we':''}">${d}</div>`);
    for(let i=0;i<leadFor(first);i++)html+='<div class="cell blank"></div>';
    for(let d=1;d<=dim;d++){
      const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const out=(iso<from||iso>to), shut=dateLocked(iso);
      html+=rqCellHTML(iso,d,out,shut,iso===RQANCHOR);
    }
    html+='</div></div>';
  });
  return html;
}
/* ONE CELL. Shared by the first paint and the live repaint, so the date cannot appear in one and
   not the other — which is exactly what happened when the two were written separately. */
function rqCellHTML(iso,d,out,shut,anchor){
  const marks=REQKINDS_ALL.filter(k=>rqHas(k.k,iso));
  const spoken=[fmtLong(iso)].concat(marks.length?marks.map(k=>k.label):['not requested']);
  if(shut)spoken.push('closed');
  return `<div class="cell rqc${out?' out':''}${shut?' shut':''}${marks.length?' on':''}${
      anchor?' anchor':''}${iso===todayISO()?' today':''}" data-iso="${iso}" role="button"
      tabindex="${(out||shut)?-1:0}" aria-pressed="${marks.length?'true':'false'}"
      aria-label="${esc(spoken.join(', '))}">
      <span class="n" aria-hidden="true">${d}</span>
      <span class="rqmk">${marks.map(k=>
        `<span class="blk rq-${k.k}"><i class="bt">${esc(k.label)}</i></span>`).join('')}</span>
    </div>`;
}

/* EVERYTHING PICKED SO FAR, ACROSS EVERY MONTH, AND WHETHER IT IS SAVED (Sam, 2026-09-03:
   "keep a running log of requests until they hit submit and remind them they must hit submit").
   One calendar at a time means most of what you have asked for is off screen, so the log is not
   a nicety — without it you cannot see your own request. */
/* ONE UNSAVED NOTICE, BOTH VIEWS (Sam, 2026-09-03: "we should have the same notification on the
   make requests view"). It existed twice in different words — a quiet "Not saved yet" heading on
   the picking log, and the loud banner on the read view — so the same state looked like two
   different situations depending on which tab you were on. This is the loud one, and it is what
   both use. */
function unsavedHTML(){
  const addedN=REQKINDS_ALL.reduce((n,k)=>n+RQ[k.k].filter(d=>!rqSavedHas(k.k,d)).length,0);
  const goneN=REQKINDS_ALL.reduce((n,k)=>n+RQSAVED[k.k].filter(d=>!rqHas(k.k,d)).length,0);
  if(!addedN&&!goneN)return '';
  return `<div class="rqlog dirty">
    <div class="rqlh">Not saved yet</div>
    <div class="rqlrow"><span class="rqlt">${
      addedN?`<b>${addedN}</b> day${addedN===1?'':'s'} added`:''}${
      addedN&&goneN?', ':''}${goneN?`<b>${goneN}</b> removed`:''}</span></div>
    <div class="rqlwarn">Press <b>Save my requests</b> below, or these will not be on file.</div>
  </div>`;
}
function rqSig(){
  return REQKINDS_ALL.map(k=>k.k+':'+RQ[k.k].slice().sort().join(',')).join('|');
}
function rqDirty(){ return rqSig()!==RQBASE; }
function rqLogHTML(){
  /* A SUMMARY, AND NOT A SECOND ALARM. This used to go amber and say "Not saved yet" itself, so
     with the banner above it the same state was announced twice on one screen — which is what
     "doubled up" was (client, 2026-09-03). The banner is the alarm; this is the count. */
  const rows=REQKINDS_ALL.filter(k=>RQ[k.k].length).map(k=>{
    const byMonth={};
    RQ[k.k].slice().sort().forEach(d=>{(byMonth[d.slice(0,7)]=byMonth[d.slice(0,7)]||[]).push(d);});
    return `<div class="rqlrow"><span class="rqlk rq-${k.k}"></span>
      <span class="rqlt"><b>${RQ[k.k].length}</b> ${esc(RQ[k.k].length===1?k.one:k.many)}</span>
      <span class="rqlm">${Object.entries(byMonth).map(([m,ds])=>
        `${MON[+m.slice(5)-1]} ${ds.map(d=>+d.slice(8)).join(', ')}`).join(' · ')}</span></div>`;
  }).join('');
  return `<div class="rqlog">
    <div class="rqlh">Picked</div>
    ${rows||'<div class="muted sm">Nothing picked yet.</div>'}</div>`;
}

function rqPaint(){
  const cal=$('#rqCal'); if(!cal)return;
  cal.innerHTML=reqCalHTML();
  fitReqChips();
  wireReqCal();
  wireReqMonths();
  rqCounts();
  rqPaintUnsaved();
  const list=$('#rqAll');
  if(list){
    // Keep the quarters the reader had open; rebuilding shut them all on every removal.
    const open=[...list.querySelectorAll('details')].map(d=>d.open);
    list.innerHTML=rqListHTML();
    [...list.querySelectorAll('details')].forEach((d,i)=>{ if(open[i])d.open=true; });
    wireReqChips();
  }
}

/* THE COUNTER COUNTS DOWN AS YOU GO (client item 10, and 14 is the same number said once).
   It was rendered with the pane and then never touched again, so it described the list as it had
   been when the tab opened. Anyone adding days watched it sit still, which is exactly the kind of
   number that makes people doubt the whole screen. */
function rqCounts(){
  const ry=reqYear(), allow=(CFG&&CFG.allowance)||50;
  const used=RQ.off.filter(d=>d.slice(0,4)===String(ry)).length;
  const left=Math.max(0,allow-used);
  const set=(id,v)=>{const e=$('#'+id); if(e)e.textContent=v;};
  set('rqUsed',used); set('rqLeft',left); set('rqCme',RQ.cme.length);
  const over=$('#rqOver');
  if(over){
    const run=longestRun(RQ.off);
    // Only meaningful while the run on screen is the one the decision was about.
    const st=(MYREQ&&MYREQ.longestOff===run)?(MYREQ.longRunStatus||''):'';
    /* MORE THAN 14 IN A ROW NEEDS DR NADON (client item 11, and rule V-005). The server has
       always refused it; the app said nothing until you pressed Save and got a red box. It is
       said here, while the run is being built, which is when it can still be reconsidered. */
    over.innerHTML = used>allow
      ? `<div class="errbox">That is ${used} days off in ${ry} — ${used-allow} over your ${allow}-day allowance.</div>`
      : run>14
      /* NO NAMES ON A PENDING DECISION (Sam, 2026-09-03). It read "Dr. Nadon declined a run this
         long before", which is both a guess about why and a person to feel judged by. A request
         over 14 days is decided by the group, not by an individual, and the only thing the person
         asking needs is the state it is in. */
      ? `<div class="warnbox">${run} days off in a row. Anything over 14 needs approval — you can
         still save it, and it will go forward as a request to decide on.${
           st==='approved'?' <b>Approved.</b>'
           :st==='declined'?' <b>A run this long was declined before.</b>'
           :st==='pending'?' <b>Waiting on approval.</b>':''}</div>`
      : '';
  }
}
/* TAP, OR DRAG ACROSS A RUN. Pointer events rather than click, because a fortnight of leave is
   fourteen taps otherwise and that is the single most common thing anybody asks for.
   The first cell decides the direction for the whole gesture — start on a marked day and you are
   clearing, start on a clear one and you are marking. Without that, dragging over a mixed stretch
   toggles each cell independently and leaves a checkerboard. */
/* THE SAME LABELS, THE SAME SQUARES, AND ONLY ONE OF THEM WAS FITTED (Sam, 2026-09-04: "the
   'Day Off' tag on the calendar view gets cut off at the beginning and end").
   fitChips has existed since the bigger calendar font went in, and it was called on exactly one
   pane. The request calendar draws the same .blk chips into the same .cell squares — but "Day
   off" is 42px of mono in a ~38px chip, and .blk is overflow:hidden with the text CENTRED, so it
   loses a slice off each end rather than one off the right. That is why it read as cut off at
   the beginning as well as the end, and it is a better clue than it looks: centred overflow is
   the signature of a chip nobody measured.
   Called after every repaint of the calendar, because the available width changes with the
   quarter, the month count and the phone. */
function fitReqChips(){
  const cal=document.querySelector('#rqCal'); if(cal)fitChips(cal);
}
function wireReqCal(){
  const cal=$('#rqCal'); if(!cal)return;
  const cellFrom=(t)=>{ const c=t&&t.closest?t.closest('.cell.rqc'):null;
                        return (c&&!c.classList.contains('out')&&!c.classList.contains('shut'))?c:null; };
  const apply=(c)=>{
    const iso=c.dataset.iso; if(!iso)return;
    if(RQDRAG.seen.has(iso))return;              // one decision per day per gesture
    RQDRAG.seen.add(iso);
    rqSet(REQMODE,iso,RQDRAG.adding);
    rqPaintLive();
  };
  /* NOTHING IS CLAIMED ON POINTERDOWN. The old handler captured the pointer and called
     preventDefault the instant a finger touched a day, so the page could not scroll from inside
     the calendar at all. A gesture must earn the right to take over: this one waits until the
     finger has moved far enough, and mostly SIDEWAYS, before it decides the drag is a selection
     rather than the start of a scroll. Vertical is the browser's, always — see touch-action. */
  const SLOP=10;
  cal.onpointerdown=(e)=>{
    const c=cellFrom(e.target); if(!c)return;
    RQDRAG={start:c,x:e.clientX,y:e.clientY,live:false,
            adding:!rqHas(REQMODE,c.dataset.iso),seen:new Set()};
    // No capture and no preventDefault here. Both are what broke scrolling.
  };
  cal.onpointermove=(e)=>{
    if(!RQDRAG)return;
    if(!RQDRAG.live){
      const dx=Math.abs(e.clientX-RQDRAG.x), dy=Math.abs(e.clientY-RQDRAG.y);
      if(dx<SLOP&&dy<SLOP)return;              // not yet a gesture of any kind
      if(dy>dx){ RQDRAG=null; return; }        // they are scrolling; get out of the way
      RQDRAG.live=true;
      if(cal.setPointerCapture&&e.pointerId!=null){try{cal.setPointerCapture(e.pointerId);}catch(x){}}
      apply(RQDRAG.start);                     // the day it began on joins now, not before
    }
    const c=cellFrom(document.elementFromPoint(e.clientX,e.clientY));
    if(c)apply(c);
    e.preventDefault();                        // only once it is definitely ours
  };
  const end=()=>{
    if(!RQDRAG)return;
    const d=RQDRAG; RQDRAG=null;
    // A press that never became a drag is a tap on that day.
    if(!d.live)rqTap(d.start.dataset.iso);
    rqPaint();
  };
  cal.onpointerup=end; cal.onpointercancel=end;
  // NOT pointerleave: on a touchscreen the finger leaves the element constantly mid-drag, and
  // ending there cut every gesture short the moment it crossed a gap between cells.
  
  // Keyboard: the grid is a set of buttons and has to work as one.
  cal.onkeydown=(e)=>{
    if(e.key!==' '&&e.key!=='Enter')return;
    const c=cellFrom(e.target); if(!c)return;
    e.preventDefault();
    rqTap(c.dataset.iso);
    rqPaint();

// UTC, for the reason spelled out in requests.js runs(): local midnights are 23 or 25 hours apart
// on the two clock-change days, and 14 March 2027 is inside the window being collected. The app
// and the server must agree about what "14 in a row" means or one of them lies.
function longestRun(dates){
  const s=[...new Set(dates)].sort(); let best=0,cur=0,prev=null;
  for(const d of s){
    const t=Date.parse(d+'T00:00:00Z');
    cur=(prev!==null&&(t-prev)===86400000)?cur+1:1;
    if(cur>best)best=cur;
    prev=t;
  }
  return best;
}

// What a request record amounts to, in one line — for the two "this is what is already saved"
// messages above, where the whole point is that the person can see what they nearly lost.
function reqSummary(r){
  const n=(k)=>((r&&r[k])||[]).length;
  const parts=[];
  if(n('off'))parts.push(n('off')+' day'+(n('off')===1?'':'s')+' off');
  if(n('cme'))parts.push(n('cme')+' CME');
  if(n('no_noc'))parts.push(n('no_noc')+' no-night');
  if(n('on'))parts.push(n('on')+' want-to-work');
  return parts.length?parts.join(', '):'nothing';
}

    for(let d=1;d<=dim;d++){

      const gone=REQKINDS_ALL.filter(k=>rqSavedHas(k.k,iso)&&!rqHas(k.k,iso));
      const isNew=marks.some(k=>added(k.k,iso));
      const spoken=[fmtLong(iso)].concat(
        marks.length?marks.map(k=>k.label+(added(k.k,iso)?' (not saved yet)':'')):['nothing asked for'],
        gone.map(k=>k.label+' (being removed)'));

        <span class="rqmk">${marks.map(k=>
          `<span class="blk rq-${k.k}${added(k.k,iso)?' new':''}"><i class="bt">${esc(k.label)}${
            added(k.k,iso)?' •':''}</i></span>`).join('')}${gone.map(k=>
          `<span class="blk rq-${k.k} gone"><i class="bt">${esc(k.label)}</i></span>`).join('')}</span></div>`;
    }

  });
  html+=`<div class="rqlegend">${REQKINDS_ALL.filter(k=>RQ[k.k].length).map(k=>
      `<span><i class="rqdot rq-${k.k}"></i>${k.label}</span>`).join('')}${
      nAdded?'<span><i class="rqdot unsaved"></i>• not saved yet</span>':''}${
      dropped.length?'<span><i class="rqdot gone"></i>being removed</span>':''}</div>`;
  box.innerHTML=html;
  $$('[data-sq]',box).forEach(b=>b.onclick=()=>{RQSEEQ=b.dataset.sq;renderReqRead(box);});

/* ---------- coverage requests ----------
   Client 8/17 #2: asking everyone who *can* take the shift is the good path, so it leads.
   Picking one person stays available but is the secondary choice. First accept wins; only then
   is an admin asked. */
let COVER=[];
async function loadCoverage(){
  if(!SESSION)return;
  try{ COVER=(await api('/coverage')).offers||[]; }catch(e){ COVER=[]; }
  paintSwapDot();
}
/* THE ANSWER IS IN THE REPLY. Every coverage action posted, then fetched the WHOLE list back
   before the screen moved — two sequential calls to an API measured today between 0.9s and
   12.6s, which is what "the request shift and accept shift were slow" is (Sam, 2026-09-04, from
   a phone). Every branch of coverage.js already returns the offer it just wrote, so the second
   call was fetching something it had been handed.
   Splice it in by id. Falls back to a reload only if the reply carried no offer, so an older
   deployment answering a newer app still ends up correct rather than stale. */
async function absorbOffer(r){
  const o=r&&r.offer;
  if(!o||!o.id){ await loadCoverage(); return; }
  const i=(COVER||[]).findIndex(x=>x.id===o.id);
  if(i>=0)COVER[i]=o; else COVER=(COVER||[]).concat([o]);
  paintSwapDot();
}
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return {ok:false,why:'This browser cannot do notifications.'};
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return {ok:false,why:'Notifications are blocked for this site.'};
    const reg=await navigator.serviceWorker.ready;
    const {key}=await (await fetch(API+'/push')).json();
    if(!key)return {ok:false,why:'Notifications are not configured yet.'};
    const b64=(s)=>{const p='='.repeat((4-s.length%4)%4);const r=(s+p).replace(/-/g,'+').replace(/_/g,'/');
      const raw=atob(r);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));};
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
    await api('/push',{method:'POST',body:JSON.stringify({sub:sub.toJSON()})});
    return {ok:true};
  }catch(e){ return {ok:false,why:e.message||'Could not turn on notifications.'}; }
}
/* ---------- notifications, explained ----------
   Three things decide whether a phone can be reached, and a physician can only act on one of
   them. So say which state they are in and what to do about it, rather than offering a button
   that quietly fails. */
const PUSH_SUPPORTED = ('serviceWorker' in navigator) && ('PushManager' in window);
const pushGranted=()=>typeof Notification!=='undefined'&&Notification.permission==='granted';
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
async function pushState(){
  if(!PUSH_SUPPORTED) return IOS && !STANDALONE ? 'needs-install' : 'unsupported';
  if(IOS && !STANDALONE) return 'needs-install';        // iOS refuses push in a browser tab
  if(Notification.permission==='denied') return 'blocked';
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg && await reg.pushManager.getSubscription();
    if(sub && Notification.permission==='granted') return 'on';
  }catch(e){}
  return 'off';
}

  h+='<div class="note" style="margin-top:8px">A phone stays signed in for 90 days. If one is '+
     'lost, sign it out — your schedule is on it until you do.</div>';
  // The pane can be re-rendered while this is waiting on the server — a live refresh, a tab
  // switch, an admin changing who they are viewing. Writing into the card we started with then
  // fills a node that is no longer on the page, and the wiring below finds nothing to wire.
  if(!box.isConnected)return;
  box.innerHTML=h;

  const add=$('#faceAdd');
  if(add)add.onclick=async()=>{
    add.disabled=true; const was=add.textContent; add.textContent='…';

    }
    try{localStorage.removeItem('ccpsa_passkey');}catch(e){}

                       setTimeout(()=>location.reload(),700); return; }
      paintSignIn();
    }catch(e){ toast(e.message||'Could not sign them out'); b.disabled=false;
               b.textContent='Sign out all devices'; }

/* ---------- ask once, when asking makes sense ----------
   Being installed to the home screen is the moment notifications become possible on an iPhone
   and the moment someone has shown they intend to keep using this. Buried on the Swaps tab, the
   offer was never going to be found. Asked once, here, with a way to decline that sticks.

   The permission itself is still requested from a button press. A prompt fired on load is the
   fastest way to a permanent refusal — browsers hold that against the site, and there is no
   second chance. */
async function maybeOfferPush(){
  if(!STANDALONE||!PUSH_SUPPORTED)return;
  if(typeof Notification==='undefined'||Notification.permission!=='default')return;
  let asked=false; try{asked=localStorage.getItem('ccpsa_pushask')==='1';}catch(e){}
  if(asked)return;
  const done=()=>{ try{localStorage.setItem('ccpsa_pushask','1');}catch(e){} };
  sheet('Get told when something changes',
    `<div class="sub">Now that this is on your home screen, it can tell you when someone asks
       you to cover a shift, when your own request is taken, and when an admin approves it.</div>
     <div class="sub" style="margin-top:8px">Nothing else — no marketing, no daily digest.</div>
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="pshYes">Turn on notifications</button>
       <button class="btn" id="pshNo">Not now</button>
     </div>
     <div class="msg" id="pshMsg"></div>`);
  document.querySelector('#pshNo').onclick=()=>{ done(); closeSheet(); };
  document.querySelector('#pshYes').onclick=async()=>{
    const btn=document.querySelector('#pshYes'); btn.disabled=true; btn.textContent='…';
    const r=await enablePush();
    done();
    if(r.ok){ closeSheet(); toast('Notifications on'); }
    else { const m=document.querySelector('#pshMsg');
           m.textContent=r.why||'Could not turn them on'; m.className='msg on bad';
           btn.disabled=false; btn.textContent='Turn on notifications'; }
    paintNotify();
  };
}

function coverageCard(){
  const open=COVER.filter(o=>o.status==='open'&&(o.eligible||[]).includes(ME)&&o.fromPerson!==ME
    &&!(o.declinedBy||[]).includes(ME));
  // Only requests still in play. A withdrawn or expired one is finished business; leaving it
  // here is how a list becomes a pile nobody reads.
  const mine=COVER.filter(o=>o.fromPerson===ME&&['open','claimed'].includes(o.status));
  /* "Waiting on you" is the ADMIN's queue and belongs on the admin's own screen. Viewing Brian
     Ahn, it appeared on his page as though these were his to approve — they are not, and he
     cannot act on them. An admin looking at a physician is reading that physician's app. */
  const toApprove=(ROLE==='admin'&&!onBehalf())?COVER.filter(o=>o.status==='claimed'):[];
  const took=COVER.filter(o=>o.claimedBy===ME&&o.status==='claimed');
  /* DECIDED, AND NOT YET ACKNOWLEDGED. Once an admin approved it, the request vanished from
     both people's screens — the asker and the taker each left to work out from the schedule
     whether it had gone through. The outcome is the whole point of having asked, so it stays
     until somebody says they have seen it, with the name of whoever decided: "approved" with
     no author is a fact with nobody behind it. */
  /* ONLY APPROVALS WAIT TO BE ACKNOWLEDGED (Sam 8/23). An approval MOVED a shift — somebody is
     now working a day they were not, or is off one they were — and that has to be seen. A
     decline changed nothing, so holding it here with an OK button asks for a tap that confirms
     nothing happened. Declines go straight to the archive. */
  const decided=COVER.filter(o=>(o.fromPerson===ME||o.claimedBy===ME)&&
    o.status==='approved'&&!coverSeen(o.id));
  let h='';
  if(open.length)h+=`<h2 class="sec">Can you cover?</h2>`+open.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">${esc(fullOf(o.fromPerson))} needs this covered${o.note?' — '+esc(o.note):''}</div>
      <div class="btnrow two"><button class="btn pri" data-claim="${esc(o.id)}">Accept Shift</button>
        <button class="btn" data-pass="${esc(o.id)}">Decline Shift</button></div>
    </div>`).join('');
  /* NO NAME ON A DECISION, EITHER WAY (Sam 8/23). Approved or declined, an outcome is the
     group's answer and not one person's — putting an admin's name on it makes a scheduling
     decision look like an individual's verdict on you.
     The name that DOES stay is whoever is now working the shift, because that is the substance
     of the approval rather than a note about who signed it. */
  if(decided.length)h+=`<h2 class="sec">Decided</h2>`+decided.map(o=>{
    const mine=o.fromPerson===ME;
    return `<div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub"><b style="color:var(--signal)">Approved</b> —
        ${mine ? esc(fullOf(o.claimedBy)||o.claimedBy)+' is covering this for you; it is off your schedule.'
               : 'you are covering this for '+esc(fullOf(o.fromPerson)||o.fromPerson)+'. It is on your schedule now.'}</div>
      ${(()=>{
        /* BOTH SIDES GET A WAY ON (client, 2026-09-04: "the approved in the decided section still
           just has OK as an option"). The asker had OK and Make a trade; the person who TOOK the
           shift had OK and nothing else — and they are just as likely to want something back.
           Make a trade is tied to THIS cover, so it is the asker's; the overlay is a general
           "what have they got", which belongs to whoever is looking. */
        /* ONE DOOR TO THE TRADE (Sam, 2026-09-04: "after Decided i see three options ... We just
           need plan a trade").
           There were two, and they went to the same room: "Make a trade" was a flat list of the
           other person's shifts, "Plan a trade" was their month drawn over yours. Asking somebody
           to choose between a list and a calendar BEFORE they have opened either is asking the
           wrong question — so it is one button, and the view is a toggle inside it.
           OK stays. It is not a third way to trade, it is how the card is acknowledged and
           cleared; without it the decision sits on the swaps tab for good. */
        const other=mine?o.claimedBy:o.fromPerson;
        if(!other)return `<div class="btnrow"><button class="btn" data-covok="${esc(o.id)}">OK</button></div>`;
        return `<div class="btnrow"><button class="btn pri" data-plan="${esc(other)}">Plan a trade with ${esc(firstOf(other))}</button>
          <button class="btn" data-covok="${esc(o.id)}">OK</button></div>
        <div class="muted sm">${mine
          ?'Offer '+esc(firstOf(other))+' one of yours in return'
          :'See what '+esc(firstOf(other))+' has and offer them one of yours'} — the cover stands
          either way.</div>`;
      })()}
    </div>`;}).join('');
  /* THE TRADE IS OFFERED HERE TOO (Sam, 2026-09-04: "i accepted a shift on my phone and it took
     a long time and there was no 'plan a trade' option. There should have been").
     Accepting lands you on THIS card, not on Decided — the offer is claimed and waiting on an
     admin, which can be a day. Offering something back does not depend on that sign-off and is
     most on your mind the moment you have just agreed to work somebody's shift, so making them
     wait for it was the app deciding when they were allowed to ask. */
  /* Same fault as the swap heading, on the section immediately below it: "You accepted" is
     addressed to whoever is holding the phone, and on somebody else's page that is the wrong
     person. */
  if(took.length)h+=`<h2 class="sec">${(onBehalf()||visitingOn())
    ?esc(firstOf(ME))+' accepted':'You accepted'}</h2>`+took.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">Covering for <b>${esc(fullOf(o.fromPerson))}</b> —
        <b style="color:var(--amber)">waiting for final approval</b>. It is not on your schedule
        until an admin confirms it, and you will be told when they do.</div>
      <div class="btnrow"><button class="btn pri" data-plan="${esc(o.fromPerson)}">Plan a trade with ${esc(firstOf(o.fromPerson))}</button></div>
      <div class="muted sm">Ask ${esc(firstOf(o.fromPerson))} for one of theirs in return — it does
        not wait on the approval above.</div>
    </div>`).join('');
  if(toApprove.length)h+=`<h2 class="sec">${(onBehalf()||visitingOn())
    ?'Waiting on '+esc(firstOf(ME)):'Waiting on you'}</h2>`+toApprove.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub"><b>${esc(fullOf(o.claimedBy))}</b> will cover for ${esc(fullOf(o.fromPerson))}</div>
      <div class="btnrow"><button class="btn pri" data-ok="${esc(o.id)}">Approve</button>
        <button class="btn" data-no="${esc(o.id)}">Decline</button></div>
    </div>`).join('');
  // Older payloads carried the full list; fall back to it so an app that has not refreshed yet
  // still counts correctly.
  const covPassed=(o)=>(typeof o.declinedCount==='number')?o.declinedCount:(o.declinedBy||[]).length;
  if(mine.length)h+=`<h2 class="sec">Your coverage requests</h2>`+mine.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">${o.status==='open'
        ? 'Asked '+(o.eligible||[]).length+' colleague'+((o.eligible||[]).length===1?'':'s')
          /* declinedCount, not declinedBy.length: the server no longer sends other people's
             names, only your own pass and the total. A count is all this ever displayed. */
          +(covPassed(o)?' — '+covPassed(o)+' passed, '
              +Math.max(0,(o.eligible||[]).length-covPassed(o))+' still to answer'
            :' — nobody has accepted yet')
        : o.status==='claimed' ? esc(fullOf(o.claimedBy))+' accepted — waiting on an admin'
        : esc(o.status)}</div>
      <div class="btnrow"><button class="btn" data-covcancel="${esc(o.id)}">Withdraw</button></div>
      ${o.status==='claimed'&&o.claimedBy?`<div class="btnrow" style="margin-top:0">
        <button class="btn" data-plan="${esc(o.claimedBy)}">Plan a trade with ${esc(firstOf(o.claimedBy))}</button>
        </div>
        <div class="muted sm">Offer to take one of ${esc(firstOf(o.claimedBy))}'s shifts in
          return. They have to agree, then an admin signs it off.</div>`:''}
    </div>`).join('');
  return h;
}
/* WHAT IS WAITING ON THIS PERSON, and therefore what the tab should be shouting about.
   Only things that need a decision FROM THEM: a cover request they have been asked to take, and
   a swap where they are the one being asked. Not their own outstanding asks — those are waiting
   on somebody else — and not anything already decided, which belongs in the archive. */
function pendingForMe(){
  if(!ME)return 0;
  const covers=(COVER||[]).filter(o=>o.status==='open'&&o.fromPerson!==ME&&
    (o.eligible||[]).includes(ME)&&!(o.declinedBy||[]).includes(ME)).length;
  const swaps=(MYSWAPS||[]).filter(s=>s.status==='awaiting_partner'&&s.toPerson===ME).length;
  return covers+swaps;
}
function paintSwapDot(){
  const d=document.querySelector('#swapDot'); if(!d)return;
  const n=pendingForMe();
  d.textContent=n>9?'9+':String(n);
  d.hidden=!n;
}

/* ---------- archived requests ----------
   Anything already decided. It was in two different wrong places: a settled SWAP stayed in the
   main list forever, so the page became a pile with the one live item somewhere in it; and a
   settled COVER request vanished outright the moment it was acknowledged, so there was nowhere
   to go and check what had happened last month.
   Both land here now — closed by default, counted on the summary, newest first. */
const SWAP_DONE=['approved','rejected','declined'];
const COVER_DONE=['approved','declined','expired','cancelled'];
function archivedHTML(){
  const rows=[];
  (MYSWAPS||[]).filter(s=>(s.fromPerson===ME||s.toPerson===ME)&&SWAP_DONE.includes(s.status))
    .forEach(s=>rows.push({when:s.date,kind:'Swap',
      what:esc(META(s.shift).label||s.shift)+' · '+esc(fmtD(s.date)),
      who:esc(fullOf(s.fromPerson)||s.fromPerson)+' → '+esc(fullOf(s.toPerson)||s.toPerson),
      status:s.status, by:s.decidedBy}));
  // Not the one still sitting in "Decided" waiting to be acknowledged — it would be on the page
  // twice, once as news and once as history. It files itself the moment they tap OK.
  (COVER||[]).filter(o=>(o.fromPerson===ME||o.claimedBy===ME)&&COVER_DONE.includes(o.status)
    &&!(o.status==='approved'&&!coverSeen(o.id)))
    .forEach(o=>rows.push({when:o.date,kind:'Cover',
      what:esc(META(o.shift).label||o.shift)+' · '+esc(fmtD(o.date)),
      who:o.claimedBy?esc(fullOf(o.claimedBy)||o.claimedBy)+' for '+esc(fullOf(o.fromPerson)||o.fromPerson)
                     :esc(fullOf(o.fromPerson)||o.fromPerson),
      status:o.status, by:o.decidedBy}));
  if(!rows.length)return '';
  rows.sort((a,b)=>String(b.when).localeCompare(String(a.when)));
  // One word, the same word for both kinds. "Rejected" and "declined" are the same outcome
  // wearing two names, and neither says who — a decision that changed nothing does not need
  // somebody's name attached to it.
  const tone={approved:'ok',declined:'bad',rejected:'bad',expired:'',cancelled:''};
  const say={approved:'Approved',declined:'Declined',rejected:'Declined',
             expired:'Expired',cancelled:'Withdrawn'};
  // "Archived swaps" (Sam, 2026-09-03). It holds settled swaps, trades and coverage — every way
  // a shift has changed hands — and "requests" is this app's word for time off.
  return `<details class="arch"><summary>Archived swaps <span class="archn">${rows.length}</span></summary>
    <div class="archbody">${rows.map(r=>`
      <div class="archrow">
        <span class="archk">${r.kind}</span>
        <span class="archw"><b>${r.what}</b><span class="archwho">${r.who}</span></span>
        <span class="pill ${tone[r.status]||''}">${esc(say[r.status]||r.status)}</span>
      </div>`).join('')}</div>
    <div class="note" style="margin:10px 0 0">Nothing here needs anything from you — it is what
      was decided, kept so you can look back.</div></details>`;
}

/* Acknowledgement is per request and per person, so one being cleared cannot hide the next. */
function coverSeen(id){
  try{ return (localStorage.getItem('ccpsa_coverseen')||'').split(',').includes((ME||'')+':'+id); }
  catch(e){ return false; }
}
function markCoverSeen(id){
  try{
    const k=(ME||'')+':'+id;
    const cur=(localStorage.getItem('ccpsa_coverseen')||'').split(',').filter(Boolean);
    if(!cur.includes(k))cur.push(k);
    localStorage.setItem('ccpsa_coverseen',cur.slice(-60).join(','));   // a bounded list
  }catch(e){}
}

/* ---------- one notification, one decision ----------
   Tapping "Coverage needs approval" landed on the Swaps tab, which carries the approval queue,
   the coverage requests, the swap form, this person's own swaps, and the admin sign-off queue —
   five unrelated things, with the one you were told about somewhere among them. The notification
   is about a single shift and a single decision, so it opens that: the shift, who is covering
   for whom, and the two buttons. Everything else stays a tab away where it belongs. */
async function openOffer(id){
  if(!COVER.some(o=>o.id===id))await loadCoverage();
  const o=COVER.find(x=>x.id===id);
  if(!o){ toast('That request is no longer there'); return; }
  const label=esc(META(o.shift).label||o.shift)+' · '+esc(fmtD(o.date));
  const who=(p)=>esc(fullOf(p)||p);

  if(o.status==='claimed'&&ROLE==='admin'){
    sheet('Approve this cover?',
      `<div class="sub"><b>${label}</b></div>
       <div class="sub" style="margin-top:8px"><b>${who(o.claimedBy)}</b> will cover for
         <b>${who(o.fromPerson)}</b>.${o.note?' — '+esc(o.note):''}</div>
       <div class="sub" style="margin-top:8px">Approving moves the shift on the schedule and
         tells them both.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="ofOk">Approve</button>
         <button class="btn" id="ofNo">Decline</button></div>
       <div class="msg" id="ofMsg"></div>`);
    const decide=async(action)=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofOk').disabled=true; $('#ofNo').disabled=true;
      try{ await api('/coverage',{method:'PATCH',body:JSON.stringify({id:o.id,action})});
           closeSheet(); toast(action==='approve'?'Approved — the schedule is updated':'Declined');
           await loadCoverage(); await refreshLive(true); if(CUR==='swap')renderSwap();
           // Deciding from a notification leaves you standing on the desk; the card that was
           // just handled has to come off it, and the count with it.
           if(onAdminHome()){ await loadAdminQueue(); renderAdminHome(); adminBar(); } }
      catch(e){ m.textContent=e.message||'Could not save'; m.className='msg on bad';
                $('#ofOk').disabled=false; $('#ofNo').disabled=false; }
    };
    $('#ofOk').onclick=()=>decide('approve');
    $('#ofNo').onclick=()=>decide('decline');
    return;
  }

  /* SOMEBODY TOOK YOUR SHIFT — and the thing you want next is to offer them one of yours.
     Reaching this from the notification used to land on a sheet that stated the status and gave
     you an OK button; the trade button existed only on the card further down the page, which is
     not where somebody who just tapped a notification is looking (Sam, 2026-09-03). */
  /* AFTER APPROVAL TOO (Sam, 2026-09-03: "the Trade function should be an option even after
     approval for the first direction"). This was 'claimed' only, so the moment an admin signed
     the cover off the offer to trade disappeared — which is backwards: approval is when you KNOW
     it is going ahead, and therefore when offering something back is most likely to be on your
     mind. Identical flow either way; only the sentence above it changes. */
  if(['claimed','approved'].includes(o.status)&&o.fromPerson===ME&&o.claimedBy){
    const settled=o.status==='approved';
    sheet(who(o.claimedBy)+' is covering it',
      `<div class="sub"><b>${label}</b></div>
       <div class="sub" style="margin-top:8px"><b>${who(o.claimedBy)}</b> ${settled
         ?'is covering this. It is off your schedule.'
         :'has accepted this. It is off your schedule once an admin confirms it, and you will be told when they do.'}</div>
       <!-- Two buttons here were the same two doors as on the card: a list of theirs, and their
            month over yours. One button, and the view is a toggle inside it. -->
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="ofTrade">Plan a trade with ${esc(firstOf(o.claimedBy))}</button>
         <button class="btn gho" id="ofOk2">OK</button></div>
       <div class="note">A trade is optional — the cover stands either way.</div>`);
    $('#ofOk2').onclick=closeSheet;
    $('#ofTrade').onclick=()=>openTradeOverlay(o.claimedBy,()=>openOffer(o.id));
    return;
  }
  if(o.status==='open'&&(o.eligible||[]).includes(ME)){
    sheet('Can you cover this?',
      `<div class="sub"><b>${label}</b></div>
       <div class="sub" style="margin-top:8px">${who(o.fromPerson)} needs this covered.${
         o.note?' — '+esc(o.note):''}</div>
       <div class="sub" style="margin-top:8px">An admin still has to confirm it afterwards.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="ofTake">Accept Shift</button>
         <button class="btn" id="ofSkip">Decline Shift</button></div>
       <div class="msg" id="ofMsg"></div>`);
    // This used to just close the sheet, so "Not this time" changed nothing and the request was
    // back at the next glance. It records the answer now.
    $('#ofSkip').onclick=async()=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofTake').disabled=true; $('#ofSkip').disabled=true;
      try{ const body={id:o.id,action:'pass'}; if(onBehalf())body.person=ME;
           const r=await api('/coverage',{method:'POST',body:JSON.stringify(body)});
           track('cover_passed',{remaining:r.remaining,from:'notification'});
           closeSheet();
           toast(r.remaining? 'Passed — the others have still been asked'
                            : 'Passed — everyone has now passed, and they have been told');
           await loadCoverage(); if(CUR==='swap')renderSwap(); }
      catch(e){ m.textContent=e.message||'Could not save'; m.className='msg on bad';
                $('#ofTake').disabled=false; $('#ofSkip').disabled=false; }
    };
    $('#ofTake').onclick=async()=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofTake').disabled=true;
      try{ const body={id:o.id,action:'claim'}; if(onBehalf())body.person=ME;
           const r=await api('/coverage',{method:'POST',body:JSON.stringify(body)});
           closeSheet(); toast('Accepted — waiting for final approval');
           await absorbOffer(r); if(CUR==='swap')renderSwap(); }
      catch(e){ m.textContent=e.message||'Could not accept'; m.className='msg on bad';
                $('#ofTake').disabled=false; }
    };
    return;
  }

  // Anything already settled: say what happened rather than opening an empty decision.
  const done=o.status==='approved'?'approved':o.status==='declined'?'declined'
            :o.status==='expired'?'expired':o.status;
  sheet('Cover request',
    `<div class="sub"><b>${label}</b></div>
     <div class="sub" style="margin-top:8px">This one is <b>${esc(done)}</b>${
       o.claimedBy?' — '+who(o.claimedBy)+' covering for '+who(o.fromPerson):''}.</div>
     <div class="btnrow" style="margin-top:12px"><button class="btn" id="ofClose">OK</button></div>`);
  $('#ofClose').onclick=closeSheet;
}

/* ---------- one notification, one decision: the swap version ----------
   openOffer's twin. A swap notification names one swap and one decision, so it opens that —
   the shift, who it moves between, whether it passes the rules, and the buttons. Which buttons
   depends on who is looking: the physician being asked gets take/cannot, an admin gets sign-off,
   and anyone arriving at something already settled is told what happened instead of being shown
   an empty decision. */
/* A TRADE HAS TWO LEGS AND BOTH BELONG EVERYWHERE IT IS SHOWN (Sam, 2026-09-03: "i dont see
   where the trades ever come in").
   A trade was reaching the list — it just looked identical to a giveaway, because only the shift
   being GIVEN was ever drawn. The person being asked could see what they were taking on and not
   what they were getting; the admin signing it off could see one half of what they were
   approving. One renderer, used by the physician's card, the admin queue and the decision sheet,
   so a fourth place cannot quietly show half of it. */
function swapLegsHTML(s){
  if(!s.backDate)return '';
  const who=(p)=>esc(fullOf(p)||p);
  return `<div class="swtrade">
    <div><span class="tl">${who(s.toPerson)} takes</span>
      ${esc(META(s.shift).label||s.shift)} · ${esc(fmtD(s.date))}</div>
    <div><span class="tl">${who(s.fromPerson)} takes</span>
      ${esc(META(s.backShift).label||s.backShift)} · ${esc(fmtD(s.backDate))}</div></div>`;
}
async function openSwap(id){
  if(!MYSWAPS.some(s=>s.id===id))await loadSwaps();
  const s=MYSWAPS.find(x=>x.id===id);
  if(!s){ toast('That swap is no longer there'); return; }
  const who=(p)=>esc(fullOf(p)||p);
  const label=esc(fmtD(s.date))+' · '+esc(META(s.shift).label||s.shift);
  /* This said "trade, back on <date>" and never named the SHIFT coming back. */
  const line=`<div class="sub" style="margin-top:8px"><b>${who(s.fromPerson)}</b> → <b>${who(s.toPerson)}</b>${
    s.note?' — '+esc(s.note):''}</div>`+swapLegsHTML(s);
  const rule=`<div class="qrule ${s.ruleCheck==='CLEAN'?'ok':'bad'}" style="margin-top:8px">${
    s.ruleCheck==='CLEAN'?'✓ Passes every rule check'
      :'✗ '+(s.problems||[]).map(esc).join(' · ')}</div>`;
  const done=async(msg)=>{
    closeSheet(); toast(msg);
    await loadSwaps(); await refreshLive(true).catch(()=>{});
    if(CUR==='swap')renderSwap();
    if(onAdminHome()){ await loadAdminQueue(); renderAdminHome(); adminBar(); }
  };
  const run=async(body,msg,btns)=>{
    const m=$('#swMsg2'); m.textContent='…'; m.className='msg on';
    btns.forEach(b=>{const e=$(b); if(e)e.disabled=true;});
    try{ await api('/swaps',{method:'PATCH',body:JSON.stringify(body)}); await done(msg); }
    catch(e){ m.textContent=(e.payload&&e.payload.problems)?e.payload.problems.join(' · ')
                            :(e.message||'Could not save'); m.className='msg on bad';
              btns.forEach(b=>{const e2=$(b); if(e2)e2.disabled=false;}); }
  };

  if(s.status==='awaiting_admin'&&ROLE==='admin'){
    sheet('Approve this swap?',
      `<div class="sub"><b>${label}</b></div>${line}${rule}
       <div class="sub" style="margin-top:8px">Approving moves the shift on the schedule and
         tells them both.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="swOk">Approve</button>
         <button class="btn" id="swNo">Reject</button>
       </div><div class="msg" id="swMsg2"></div>`);
    /* TWO BUTTONS. There used to be a third — "Approve anyway" — because Approve itself was
       refused when the rule check failed. It is not any more (client, 2026-09-03), so a third
       button would be two names for one action. The problems are printed above; approving with
       them on screen is the decision. */
    const ids=['#swOk','#swNo'];
    $('#swOk').onclick=()=>run({id:s.id,action:'approve'},
      s.ruleCheck==='CLEAN'?'Approved — the schedule is updated'
                           :'Approved over the rule check — the schedule is updated',ids);
    $('#swNo').onclick=()=>run({id:s.id,action:'reject'},'Rejected',ids);
    return;
  }
  if(s.status==='awaiting_partner'&&s.toPerson===ME){
    sheet(s.backDate?'Swap these two?':'Can you take this?',
      `<div class="sub"><b>${label}</b></div>${line}${rule}
       <div class="sub" style="margin-top:8px">An admin still has to sign it off afterwards.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="swOk">I can take it</button>
         <button class="btn" id="swNo">Can’t</button></div>
       <div class="msg" id="swMsg2"></div>`);
    const ids=['#swOk','#swNo'];
    $('#swOk').onclick=()=>run({id:s.id,action:'accept'},'Accepted — waiting on an admin',ids);
    $('#swNo').onclick=()=>run({id:s.id,action:'decline'},'Declined',ids);
    return;
  }
  const state={awaiting_partner:'waiting on '+(fullOf(s.toPerson)||s.toPerson),
               awaiting_admin:'waiting on an admin', approved:'approved',
               rejected:'declined', declined:'declined', blocked:'blocked by the rule check'};
  /* OK, AND A WAY ON (Sam, 2026-09-04: "after a swap was approved (or before) you should have a
     button that says OK and a button that says Plan a trade too").
     This sheet stated the status and gave you one button out. But somebody reading it has just
     handed a shift over, or is about to — which is exactly the moment they want to look at what
     that person has. Offered whatever the state, approved or not: a trade is a separate
     conversation and does not wait on the first one settling.
     The other party is whoever is not you; an admin reading somebody else's swap gets neither. */
  const other=(s.fromPerson===ME)?s.toPerson:(s.toPerson===ME?s.fromPerson:null);
  sheet('Shift swap',
    `<div class="sub"><b>${label}</b></div>${line}
     <div class="sub" style="margin-top:8px">This one is <b>${esc(state[s.status]||s.status)}</b>.</div>
     <div class="btnrow" style="margin-top:12px"><button class="btn" id="swClose">OK</button>${
       other?`<button class="btn pri" id="swPlan">Plan a trade with ${esc(firstOf(other))}</button>`:''}
     </div>`);
  $('#swClose').onclick=closeSheet;
  const sp=$('#swPlan');
  if(sp)sp.onclick=()=>openTradeOverlay(other,()=>openSwap(s.id));
}

/* MAKE A TRADE (client item 19).
   "if someone accepts a swap, the person who requested coverage should be able to press a button
    titled 'Make a trade' where they see the provider who accepted the shift's schedule and can
    offer to cover a shift (must be approved first by the person taking the original shift then
    by admin)."

   The two-approval chain already exists: a swap record is created awaiting_partner, the partner
   accepts, then an admin signs off. So this is not new machinery — it is the existing trade path,
   entered from the coverage card with both people and one side of the trade already known. The
   only thing being chosen is which of THEIR shifts you take back.

   Their schedule comes from the data the app already holds for every provider, which is how
   colleague viewing works; no new endpoint and nothing extra is exposed. */
/* ---------- PLANNING A TRADE: their shifts, drawn on top of yours ----------
   Client item 19, the half left as a wishlist: "We should start planning this functionality for
   multi-way trades, like overlaying shifts of theirs that you could take onto your schedule in a
   specific view."

   The pairwise trade already works — you pick one of their shifts and offer one of yours. What it
   cannot answer is the question you have BEFORE that: which of their days could I actually take?
   Reading that off two separate calendars is the thing people do wrong.

   So: one month, your shifts and theirs on the same squares, and the days you could take marked
   as such. "Could take" is the same test coverage uses (item 16) — are you already working
   something at that time of day — because a trade that leaves you double-booked is not a trade.

   MORE THAN ONE COLLEAGUE AT A TIME, which is what makes it a step toward multi-way: overlay two
   or three people and the chain is visible, because you can see whose free day lines up with
   whose shift. What the app RECORDS is still pairwise — a three-way is three swaps — and the
   screen says so rather than implying an atomicity that does not exist. */
let OVWITH=new Set(), OVMONTH=null;
/* CALENDAR OR LIST (Sam, 2026-09-04: "should be able to swap between calendar view and list
   view"). They answer different questions and neither is the right default for everybody: the
   calendar shows you WHEN — which of their days line up with your free ones, which is the whole
   point of overlaying two months — and the list shows you WHAT, every day you could take in one
   scroll with no month to page through. Both offer the same trade by the same route. */
let OVVIEW='cal';

function ovDays(){
  const mk=OVMONTH||inBlockDay(todayISO()).slice(0,7);
  const y=+mk.slice(0,4), mo=+mk.slice(5)-1, dim=new Date(y,mo+1,0).getDate(), out=[];
  for(let d=1;d<=dim;d++){
    const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(knownDate(iso))out.push(iso);
  }
  return out;
}
// Mine that day, theirs that day, and whether taking theirs would clash with mine.
function ovCell(iso){
  const mine=(anyDayOf(ME,iso)||{s:[]}).s.filter(x=>isRealShift(ME,iso,x));
  const theirs=[];
  [...OVWITH].forEach(p=>{
    (anyDayOf(p,iso)||{s:[]}).s.filter(x=>isRealShift(p,iso,x))
      .forEach(sh=>theirs.push({p,sh}));
  });
  // Same test as the coverage picker: nights and swings are the evening, everything else is the
  // day, and two shifts only clash if they are on the same side of that line.
  const night=(x)=>['South Swing','SAH NOC','SAH NOC2','PTR NOC','LAH NOC'].includes(x);
  const takeable=theirs.filter(t=>!mine.some(m=>night(m)===night(t.sh)));
  return {mine,theirs,takeable};
}

function renderOverlay(){
  const box=$('#ovBody'); if(!box)return;
  if(!OVWITH.size){ box.innerHTML='<div class="empty">Choose somebody to overlay.</div>'; return; }
  if(OVVIEW==='list')return renderOverlayList(box);
  const days=ovDays();
  if(!days.length){ box.innerHTML='<div class="empty">Nothing that month.</div>'; return; }
  const mk=days[0].slice(0,7), y=+mk.slice(0,4), mo=+mk.slice(5)-1;
  const first=new Date(y,mo,1), dim=new Date(y,mo+1,0).getDate();
  let n=0;
  let html=`<div class="month"><h4><b>${MONL[mo]} ${y}</b></h4><div class="grid7">`;
  dowLabels().forEach(d=>html+=`<div class="dow${d==='Sat'||d==='Sun'?' we':''}">${d}</div>`);
  for(let i=0;i<leadFor(first);i++)html+='<div class="cell blank"></div>';
  for(let d=1;d<=dim;d++){
    const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(!days.includes(iso)){ html+='<div class="cell blank"></div>'; continue; }
    const c=ovCell(iso);
    if(c.takeable.length)n++;
    html+=`<div class="cell ovc${c.takeable.length?' can':''}${iso===todayISO()?' today':''}"
      data-ov="${iso}" ${c.takeable.length?'role="button" tabindex="0"':''}
      aria-label="${esc(fmtLong(iso)+', '+(c.mine.length?'you work '+c.mine.map(x=>shiftLabel(ME,iso,x,false)).join(' and '):'you are free')
        +(c.takeable.length?', could take '+c.takeable.map(t=>(fullOf(t.p)||t.p)+"'s "+shiftLabel(t.p,iso,t.sh,false)).join(' or '):''))}">
      <span class="n">${d}</span>
      ${c.mine.map(x=>`<span class="ovmine" style="background:${META(x).color}">${esc(shiftLabel(ME,iso,x,true))}</span>`).join('')}
      ${c.theirs.map(t=>`<span class="ovtheirs${c.takeable.includes(t)?' ok':''}"
         style="border-color:${personColour(t.p)};color:${personColour(t.p)}"
         >${esc(shiftLabel(t.p,iso,t.sh,true))}</span>`).join('')}
    </div>`;
  }
  html+='</div></div>';
  box.innerHTML=`<div class="note" style="margin-top:0">Your shifts are filled; theirs are
      outlined. <b>${n}</b> day${n===1?'':'s'} you could take — you are free at that time of day.
      Tap one to offer a trade.</div>`+html;
  $$('#ovBody .cell.ovc.can').forEach(c=>{
    const go=()=>ovOffer(c.dataset.ov);
    c.onclick=go;
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  });
}

/* THE SAME DAYS, AS A LIST, ACROSS EVERY MONTH — not one month at a time. Only the days you
   could actually take are listed: a list of their whole schedule would mostly be days you are
   already working, and reading past those is the work this is meant to remove. Tapping a row
   opens exactly what tapping a square opens. */
function renderOverlayList(box){
  const t=todayISO(), rows=[];
  spanMonths().forEach(mk=>{
    const y=+mk.slice(0,4), mo=+mk.slice(5)-1, dim=new Date(y,mo+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(!knownDate(iso)||iso<t)continue;
      const c=ovCell(iso);
      if(c.takeable.length)rows.push({iso,c});
    }
  });
  if(!rows.length){
    box.innerHTML=`<div class="empty">Nothing of theirs you could take — every shift they have
      left is a day you are already working.</div>`;
    return;
  }
  let last='';
  let h=`<div class="note" style="margin-top:0"><b>${rows.length}</b> day${rows.length===1?'':'s'}
    you could take, across the whole schedule. Tap one to offer a trade.</div><div class="ovlist">`;
  rows.forEach(({iso,c})=>{
    const mk=iso.slice(0,7);
    if(mk!==last){ last=mk; h+=`<div class="ovlm">${MONL[+mk.slice(5)-1]} ${mk.slice(0,4)}</div>`; }
    h+=`<button class="ovlrow" data-ovl="${iso}">
      <span class="ovld">${esc(fmtD(iso))}</span>
      <span class="ovlw">${c.takeable.map(x=>`<span class="ovtheirs ok"
        style="border-color:${personColour(x.p)};color:${personColour(x.p)}"
        >${esc(shiftLabel(x.p,iso,x.sh,true))}</span>`).join('')}
        <span class="muted sm">${esc(c.takeable.map(x=>fullOf(x.p)||x.p).join(', '))}</span></span>
      <span class="ovlme">${c.mine.length
        ?esc(c.mine.map(x=>shiftLabel(ME,iso,x,true)).join(' + '))
        :'<i>you are free</i>'}</span>
    </button>`;
  });
  box.innerHTML=h+'</div>';
  $$('#ovBody .ovlrow').forEach(b=>b.onclick=()=>ovOffer(b.dataset.ovl));
}
/* Tapping a day you could take: pick WHICH of your shifts to give back, and to whom. Reuses the
   pairwise swap the app already records — a three-way is three of these, and the note says so. */
function ovOffer(iso){
  const c=ovCell(iso);
  const t=todayISO();
  const mine=allShifts(ME).filter(x=>x.iso>=t&&isRealShift(ME,x.iso,x.shift));
  if(!mine.length){ toast('You have nothing left to offer in return'); return; }
  sheet('Offer a trade',`
    <div class="sub" style="margin-top:0">${esc(fmtLong(iso))}</div>
    <div class="ovpick"><b>You would take</b></div>
    <div id="ovTake">${c.takeable.map((x,i)=>`
      <label class="cvrow"><input type="radio" name="ovt" class="ovt" value="${i}"${i?'':' checked'}>
        <span class="cvnm">${esc(shiftLabel(x.p,iso,x.sh,false))}</span>
        <span class="cabusy">${esc(fullOf(x.p)||x.p)}</span></label>`).join('')}</div>
    <div class="ovpick"><b>You would give</b></div>
    <div id="ovGive">${mine.slice(0,60).map((x,i)=>`
      <label class="cvrow"><input type="radio" name="ovg" class="ovg" value="${esc(x.iso+'|'+x.shift)}"${i?'':' checked'}>
        <span class="cvnm">${esc(fmtD(x.iso))} · ${esc(shiftLabel(ME,x.iso,x.shift,false))}</span></label>`).join('')}</div>
    <div class="cvactions"><div class="msg" id="ovMsg"></div>
      <div class="btnrow"><button class="btn pri" id="ovGo">Offer it</button>
        <button class="btn" id="ovX">Cancel</button></div></div>
    <div class="note">They have to agree, then an admin signs it off. A three-way is three of
      these — the app records each pair, so each one is accepted and approved on its own.</div>`,
    // Back to the overlay, with the same people and month still chosen.
    ()=>openTradeOverlay());
  $('#ovX').onclick=dismissSheet;
  $('#ovGo').onclick=async()=>{
    const tk=document.querySelector('.ovt:checked'), gv=document.querySelector('.ovg:checked');
    const m=$('#ovMsg');
    if(!tk||!gv){ m.textContent='Pick one of each.'; m.className='msg on bad'; return; }
    const take=c.takeable[+tk.value];
    const [gd,gs]=gv.value.split('|');
    m.textContent='Sending…'; m.className='msg on';
    $('#ovGo').disabled=true;
    // If it is genuinely slow, say so rather than leaving one word on screen for ten seconds.
    const slow=setTimeout(()=>{ if(m)m.textContent='Still sending — the server is slow to wake.'; },4000);
    try{
      /* The record is written the way every other trade is: THEY take the shift I am giving, and
         I take theirs. fromPerson is me because I am the one asking. */
      const r=await api('/swaps',{method:'POST',body:JSON.stringify({
        toPerson:take.p, date:gd, shift:gs, backDate:iso, backShift:take.sh,
        note:'Trade planned from the overlay' })});
      clearTimeout(slow);
      /* The reply carries the record, so there is nothing for a second round trip to fetch —
         same fault as the coverage actions and the clinic desk had. */
      if(r&&r.swap)MYSWAPS=(MYSWAPS||[]).filter(x=>x.id!==r.swap.id).concat([r.swap]);
      else await loadSwaps();
      paintSwapDot();
      closeSheet();
      toast('Offered — '+firstOf(take.p)+' has to agree, then an admin');
      if(CUR==='swap')renderSwap();
    }catch(e){ clearTimeout(slow);
               // Never a blank message: an empty error box reads as nothing having happened,
               // which is exactly what was reported.
               m.textContent=(e&&e.message)||'Could not send that — nothing was offered.';
               m.className='msg on bad';
               $('#ovGo').disabled=false; }
  };
}

function openTradeOverlay(preset,back){
  OVWITH=new Set(preset?[].concat(preset):[...OVWITH]);
  OVMONTH=OVMONTH||inBlockDay(todayISO()).slice(0,7);
  const roster=whoRoster().filter(p=>p!==ME);

    <div class="sub" style="margin-top:0">Put somebody else's month on top of yours and see which
      of their days you could take.</div>
    ${pickerHTML('ovPick',roster,OVWITH)}
    <div class="btnrow" id="ovViews">

      <select class="inp" id="ovMonth" style="max-width:170px">${months.map(m=>

    </div>

  $$('#ovViews [data-ovv]').forEach(b=>b.onclick=()=>{
