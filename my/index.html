async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return {ok:false,why:'This browser cannot do notifications.'};
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return {ok:false,why:'Notifications are blocked for this site.'};
    const reg=await navigator.serviceWorker.ready;
    const {key}=await (await fetch(API+'/push')).json();
    if(!key)return {ok:false,why:'Notifications are not configured yet.'};
    const b64=(s)=>{const p='='.repeat((4-s.length%4)%4);const r=(s+p).replace(/-/g,'+').replace(/_/g,'/');
      const raw=atob(r);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));};
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
    await api('/push',{method:'POST',body:JSON.stringify({sub:sub.toJSON()})});
    return {ok:true};
  }catch(e){ return {ok:false,why:e.message||'Could not turn on notifications.'}; }
}
/* ---------- notifications, explained ----------
   Three things decide whether a phone can be reached, and a physician can only act on one of
   them. So say which state they are in and what to do about it, rather than offering a button
   that quietly fails. */
const PUSH_SUPPORTED = ('serviceWorker' in navigator) && ('PushManager' in window);
const pushGranted=()=>typeof Notification!=='undefined'&&Notification.permission==='granted';
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
async function pushState(){
  if(!PUSH_SUPPORTED) return IOS && !STANDALONE ? 'needs-install' : 'unsupported';
  if(IOS && !STANDALONE) return 'needs-install';        // iOS refuses push in a browser tab
  if(Notification.permission==='denied') return 'blocked';
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg && await reg.pushManager.getSubscription();
    if(sub && Notification.permission==='granted') return 'on';
  }catch(e){}
  return 'off';
}
/* A permanent home for Face ID, beside notifications. The one-time offer below is easy to
   decline by reflex, and an offer you can never find again is a feature that does not exist. */
function signInCard(){
  if(!ME)return '';
  const whose=onBehalf()?fullOf(ME):null;
  return `<div class="swcard" id="signinCard">
    <div class="lgh">${whose?esc(whose)+"'s sign-in":'How you sign in'}</div>
    <div id="signinBody" class="sub" style="margin-top:6px">Checking…</div>
  </div>`;
}

/* ONE CARD, ONE REQUEST. Face ID and signed-in devices were separate cards that each fetched on
   render — two round trips, two "Checking…" spinners, and a settings screen that sat blank for a
   second while three things loaded. They are one subject anyway: how you get in, and what is
   currently let in. /account {action:'devices'} already returns the passkeys, so both come back
   in a single answer. */
async function paintSignIn(){
  const box=$('#signinBody'); if(!box)return;
  const can=await pkAvailable();
  let d=null;
  try{ d=await api('/account',{method:'POST',
        body:JSON.stringify({action:'devices',...(onBehalf()?{person:ME}:{})})}); }
  catch(e){ box.textContent='Could not check.'; return; }
  const keys=d.passkeys||[];
  const face=/iPhone|iPad/.test(navigator.userAgent)?'Face ID':'Face ID or a fingerprint';

  let h='<div class="setrow"><span class="setk">'+esc(face)+'</span><span class="setv">'+
    (keys.length
      ? '<b style="color:var(--signal)">On</b> · '+keys.map(k=>esc(k.label||'a device')).join(', ')
      : (can?'Off':'This device cannot'))+'</span></div>';
  h+='<div class="setrow"><span class="setk">Last signed in</span><span class="setv">'+
    (d.lastLogin?esc(new Date(d.lastLogin).toLocaleString()):'never')+'</span></div>';
  if(d.signedOutAt)h+='<div class="setrow"><span class="setk">All devices signed out</span>'+
    '<span class="setv">'+esc(new Date(d.signedOutAt).toLocaleString())+'</span></div>';
  h+='<div class="btnrow" style="margin-top:10px">';
  if(can)h+='<button class="btn'+(keys.length?'':' pri')+'" id="faceAdd">'+
    (keys.length?'Add this device':'Turn on '+esc(face))+'</button>';
  if(keys.length)h+='<button class="btn" id="faceOff">Turn off</button>';
  h+='<button class="btn" id="devOut">Sign out all devices</button></div>';
  h+='<div class="note" style="margin-top:8px">A phone stays signed in for 90 days. If one is '+
     'lost, sign it out — your schedule is on it until you do.</div>';
  // The pane can be re-rendered while this is waiting on the server — a live refresh, a tab
  // switch, an admin changing who they are viewing. Writing into the card we started with then
  // fills a node that is no longer on the page, and the wiring below finds nothing to wire.
  if(!box.isConnected)return;
  box.innerHTML=h;

  const add=$('#faceAdd');
  if(add)add.onclick=async()=>{
    add.disabled=true; const was=add.textContent; add.textContent='…';
    try{ await enrollPasskey(); toast(face+' is on'); }
    catch(e){ const m=String((e&&e.message)||e);
              toast(/NotAllowed|Cancel|abort/i.test(m)?'Cancelled':m); }
    add.disabled=false; add.textContent=was; paintSignIn();
  };
  const off=$('#faceOff');
  if(off)off.onclick=async()=>{
    for(const k of keys){
      try{await api('/passkey',{method:'POST',body:JSON.stringify({action:'remove',id:k.id})});}catch(e){}
    }
    try{localStorage.removeItem('ccpsa_passkey');}catch(e){}
    toast(face+' turned off'); paintSignIn();
  };
  const out=$('#devOut');
  if(out)out.onclick=async()=>{
    const b=$('#devOut'); b.disabled=true; b.textContent='…';
    try{
      await api('/account',{method:'POST',
        body:JSON.stringify({action:'signOutEverywhere',...(onBehalf()?{person:ME}:{})})});
      toast('Signed out — they will have to sign in again');
      if(!onBehalf()){ try{localStorage.removeItem('__dev');sessionStorage.clear();}catch(e){}
                       setTimeout(()=>location.reload(),700); return; }
      paintSignIn();
    }catch(e){ toast(e.message||'Could not sign them out'); b.disabled=false;
               b.textContent='Sign out all devices'; }
  };
}

/* Did they already decide? Either answer — allowed, or declined the one-time offer — means the
   question has been asked and settled, and a card that keeps asking is not a card, it is nagging. */
const pushSettled=()=>{
  if(pushGranted())return true;
  try{ return localStorage.getItem('ccpsa_pushask')==='1'; }catch(e){ return false; }
};
function notifyCard(){
  /* ONCE IT IS SETTLED, NOTHING IS SHOWN. AT ALL.
     This started as a paragraph explaining notifications, parked at the top of the Swaps tab
     forever. Then it was hidden for physicians who had allowed them — but kept for admins,
     because the test tools were inside it, so an admin with notifications on still got sold
     notifications. Trimming the pitch was not enough: Sam, 8/26 — "I shouldn't see any
     notifications messaging once turned on or dismissed initially. The current box is not
     necessary. It should be removed."
     So it is, and the ADMIN TEST TOOLS MOVED to the Account sheet, which is where the comment
     here has claimed they lived since the day it was written. They had not.
     Settled means allowed OR declined: someone who said no once should not be asked on every
     visit to Swaps. The way back is the Account sheet, same place. */
  if(pushSettled())return '';
  return `<div class="swcard" id="notifyCard">
    <div class="lgh">Notifications</div>
    <div class="sub" id="notifyWhat">A message on your phone when someone asks you to cover a
      shift, when your own request is taken, and when an admin approves it.</div>
    <div id="notifyBody" class="sub" style="margin-top:8px">Checking…</div>
  </div>`;
}
/* ---------- ask once, when asking makes sense ----------
   Being installed to the home screen is the moment notifications become possible on an iPhone
   and the moment someone has shown they intend to keep using this. Buried on the Swaps tab, the
   offer was never going to be found. Asked once, here, with a way to decline that sticks.

   The permission itself is still requested from a button press. A prompt fired on load is the
   fastest way to a permanent refusal — browsers hold that against the site, and there is no
   second chance. */
async function maybeOfferPush(){
  if(!STANDALONE||!PUSH_SUPPORTED)return;
  if(typeof Notification==='undefined'||Notification.permission!=='default')return;
  let asked=false; try{asked=localStorage.getItem('ccpsa_pushask')==='1';}catch(e){}
  if(asked)return;
  const done=()=>{ try{localStorage.setItem('ccpsa_pushask','1');}catch(e){} };
  sheet('Get told when something changes',
    `<div class="sub">Now that this is on your home screen, it can tell you when someone asks
       you to cover a shift, when your own request is taken, and when an admin approves it.</div>
     <div class="sub" style="margin-top:8px">Nothing else — no marketing, no daily digest.</div>
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="pshYes">Turn on notifications</button>
       <button class="btn" id="pshNo">Not now</button>
     </div>
     <div class="msg" id="pshMsg"></div>`);
  document.querySelector('#pshNo').onclick=()=>{ done(); closeSheet(); };
  document.querySelector('#pshYes').onclick=async()=>{
    const btn=document.querySelector('#pshYes'); btn.disabled=true; btn.textContent='…';
    const r=await enablePush();
    done();
    if(r.ok){ closeSheet(); toast('Notifications on'); }
    else { const m=document.querySelector('#pshMsg');
           m.textContent=r.why||'Could not turn them on'; m.className='msg on bad';
           btn.disabled=false; btn.textContent='Turn on notifications'; }
    paintNotify();
  };
}

/* Admins get a way to fire each kind at themselves. Checking that a notification reads well
   otherwise means arranging the whole three-person situation that produces it. */
/* The Account sheet's version of the state line. Says where things stand in a few words, and
   offers the way ON to anybody who declined the one-time ask and changed their mind — which the
   Swaps card used to be, and no longer is. */
async function paintAccountPush(){
  const line=document.querySelector('#acPush'), body=document.querySelector('#acPushBody');
  if(!line)return;
  const st=await pushState();
  if(!line.isConnected)return;                 // the sheet may have closed while we awaited
  const say={on:'On for this device',off:'Off for this device',
             blocked:'Blocked in your settings','needs-install':'Add to your home screen first',
             unsupported:'Not available in this browser'}[st]||st;
  line.textContent=say;
  if(!body)return;
  if(st==='off'){
    body.innerHTML='<div class="btnrow" style="margin-top:8px">'+
      '<button class="btn" id="acPushOn">Turn on notifications</button></div>';
    const b=document.querySelector('#acPushOn');
    if(b)b.onclick=async()=>{ b.disabled=true; b.textContent='Asking…';
      try{ await enablePush(); }catch(e){ toast(e.message||'Could not turn them on'); }
      paintAccountPush(); };
  }else if(st==='needs-install'){
    body.innerHTML='<div class="btnrow" style="margin-top:8px">'+
      '<button class="btn" id="acPushHow">Show me how</button></div>';
    const h=document.querySelector('#acPushHow'); if(h)h.onclick=()=>{closeSheet();openInstall();};
  }else{ body.innerHTML=''; }
}
function notifyTestHTML(){
  if(ROLE!=='admin')return '';
  const kinds=[['ask','Asked to cover'],['taken','Someone else took it'],
               ['approve','Needs your approval'],['claimed','Someone took yours'],
               ['approved','Approved'],['declined','Declined'],
               ['changed','Schedule changed'],['expired','No longer needed']];
  return '<details class="icsmore" style="margin-top:10px"><summary>Send yourself a test</summary>'+
    '<div class="sub" style="margin-top:6px">Goes to your devices only — nobody else is '+
    'notified.</div><div class="testgrid">'+
    kinds.map(([k,l])=>`<button class="btn" data-ntest="${k}">${esc(l)}</button>`).join('')+
    '</div><div class="msg" id="ntMsg"></div></details>';
}
function wireNotifyTest(){
  document.querySelectorAll('[data-ntest]').forEach(b=>b.onclick=async()=>{
    const m=document.querySelector('#ntMsg');
    m.textContent='Sending…'; m.className='msg on';
    try{
      const r=await api('/push',{method:'POST',body:JSON.stringify({action:'test',kind:b.dataset.ntest})});
      m.textContent=r.sent?('Sent to '+r.sent+' device'+(r.sent===1?'':'s'))
        :'No device is subscribed — turn notifications on first.';
      m.className='msg on '+(r.sent?'ok':'bad');
    }catch(e){ m.textContent=e.message||'Could not send'; m.className='msg on bad'; }
  });
}

async function paintNotify(){
  const box=document.querySelector('#notifyBody'); if(!box)return;
  const st=await pushState();
  // Awaited above; the pane may have been re-rendered underneath us since. See paintSignIn.
  if(!box.isConnected)return;
  if(st==='on'){
    /* AND STOP SELLING THEM. The card is hidden entirely once push is on — except for admins,
       who keep it because the test tools inside are how we reproduce a report. What they kept
       with it was the pitch: "A message on your phone when someone asks you to cover a shift…",
       still sitting above a line saying it was already on. Sam read that as the app failing to
       notice his device had them. The explanation is for somebody deciding; once it is on there
       is nothing left to decide, so it goes and the heading carries the state instead. */
    const what=document.querySelector('#notifyWhat'); if(what)what.remove();
    const head=document.querySelector('#notifyCard .lgh');
    if(head)head.textContent='Notifications — on';
    box.innerHTML='<b style="color:var(--signal)">On for this device.</b> Turn them on separately '+
      'on any other phone or computer you use.';
    return;
  }
  if(st==='needs-install'){
    box.innerHTML='<b>On an iPhone or iPad, notifications only work once this is on your home '+
      'screen.</b> Tap the Share button, then <b>Add to Home Screen</b>, open it from there and '+
      'come back here.<div class="btnrow" style="margin-top:9px">'+
      '<button class="btn" id="notifyHow">Show me how</button></div>';
    const h=document.querySelector('#notifyHow'); if(h)h.onclick=()=>openInstall();
    return;
  }
  if(st==='blocked'){
    box.innerHTML='<b>Blocked in your browser settings.</b> Notifications were refused for this '+
      'site, so we cannot ask again — allow them for this site in your browser or phone '+
      'settings, then reload.';
    return;
  }
  if(st==='unsupported'){
    box.innerHTML='This browser cannot show notifications. Everything still works; you just will '+
      'not get a message on your phone.';
    return;
  }
  box.innerHTML='<div class="btnrow"><button class="btn pri" id="pushOn">Turn on notifications'+
    '</button></div><div style="margin-top:6px">Your phone will ask you to allow them.</div>';
  const pn=document.querySelector('#pushOn');
  if(!pn)return;                 // the card was replaced while this was waiting on the browser
  pn.onclick=async()=>{
    pn.disabled=true; pn.textContent='…';
    const r=await enablePush();
    if(r.ok){ toast('Notifications on'); }
    else { toast(r.why||'Could not turn them on'); pn.disabled=false; pn.textContent='Turn on notifications'; }
    paintNotify();
  };
}

function coverageCard(){
  const open=COVER.filter(o=>o.status==='open'&&(o.eligible||[]).includes(ME)&&o.fromPerson!==ME
    &&!(o.declinedBy||[]).includes(ME));
  // Only requests still in play. A withdrawn or expired one is finished business; leaving it
  // here is how a list becomes a pile nobody reads.
  const mine=COVER.filter(o=>o.fromPerson===ME&&['open','claimed'].includes(o.status));
  /* "Waiting on you" is the ADMIN's queue and belongs on the admin's own screen. Viewing Brian
     Ahn, it appeared on his page as though these were his to approve — they are not, and he
     cannot act on them. An admin looking at a physician is reading that physician's app. */
  const toApprove=(ROLE==='admin'&&!onBehalf())?COVER.filter(o=>o.status==='claimed'):[];
  const took=COVER.filter(o=>o.claimedBy===ME&&o.status==='claimed');
  /* DECIDED, AND NOT YET ACKNOWLEDGED. Once an admin approved it, the request vanished from
     both people's screens — the asker and the taker each left to work out from the schedule
     whether it had gone through. The outcome is the whole point of having asked, so it stays
     until somebody says they have seen it, with the name of whoever decided: "approved" with
     no author is a fact with nobody behind it. */
  /* ONLY APPROVALS WAIT TO BE ACKNOWLEDGED (Sam 8/23). An approval MOVED a shift — somebody is
     now working a day they were not, or is off one they were — and that has to be seen. A
     decline changed nothing, so holding it here with an OK button asks for a tap that confirms
     nothing happened. Declines go straight to the archive. */
  const decided=COVER.filter(o=>(o.fromPerson===ME||o.claimedBy===ME)&&
    o.status==='approved'&&!coverSeen(o.id));
  let h='';
  if(open.length)h+=`<h2 class="sec">Can you cover?</h2>`+open.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">${esc(fullOf(o.fromPerson))} needs this covered${o.note?' — '+esc(o.note):''}</div>
      <div class="btnrow two"><button class="btn pri" data-claim="${esc(o.id)}">Accept Shift</button>
        <button class="btn" data-pass="${esc(o.id)}">Decline Shift</button></div>
    </div>`).join('');
  /* NO NAME ON A DECISION, EITHER WAY (Sam 8/23). Approved or declined, an outcome is the
     group's answer and not one person's — putting an admin's name on it makes a scheduling
     decision look like an individual's verdict on you.
     The name that DOES stay is whoever is now working the shift, because that is the substance
     of the approval rather than a note about who signed it. */
  if(decided.length)h+=`<h2 class="sec">Decided</h2>`+decided.map(o=>{
    const mine=o.fromPerson===ME;
    return `<div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub"><b style="color:var(--signal)">Approved</b> —
        ${mine ? esc(fullOf(o.claimedBy)||o.claimedBy)+' is covering this for you; it is off your schedule.'
               : 'you are covering this for '+esc(fullOf(o.fromPerson)||o.fromPerson)+'. It is on your schedule now.'}</div>
      <div class="btnrow"><button class="btn" data-covok="${esc(o.id)}">OK</button></div>
    </div>`;}).join('');
  if(took.length)h+=`<h2 class="sec">You accepted</h2>`+took.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">Covering for <b>${esc(fullOf(o.fromPerson))}</b> —
        <b style="color:var(--amber)">waiting for final approval</b>. It is not on your schedule
        until an admin confirms it, and you will be told when they do.</div>
    </div>`).join('');
  if(toApprove.length)h+=`<h2 class="sec">Waiting on you</h2>`+toApprove.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub"><b>${esc(fullOf(o.claimedBy))}</b> will cover for ${esc(fullOf(o.fromPerson))}</div>
      <div class="btnrow"><button class="btn pri" data-ok="${esc(o.id)}">Approve</button>
        <button class="btn" data-no="${esc(o.id)}">Decline</button></div>
    </div>`).join('');
  // Older payloads carried the full list; fall back to it so an app that has not refreshed yet
  // still counts correctly.
  const covPassed=(o)=>(typeof o.declinedCount==='number')?o.declinedCount:(o.declinedBy||[]).length;
  if(mine.length)h+=`<h2 class="sec">Your coverage requests</h2>`+mine.map(o=>`
    <div class="swcard"><div class="lgh">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
      <div class="sub">${o.status==='open'
        ? 'Asked '+(o.eligible||[]).length+' colleague'+((o.eligible||[]).length===1?'':'s')
          /* declinedCount, not declinedBy.length: the server no longer sends other people's
             names, only your own pass and the total. A count is all this ever displayed. */
          +(covPassed(o)?' — '+covPassed(o)+' passed, '
              +Math.max(0,(o.eligible||[]).length-covPassed(o))+' still to answer'
            :' — nobody has accepted yet')
        : o.status==='claimed' ? esc(fullOf(o.claimedBy))+' accepted — waiting on an admin'
        : esc(o.status)}</div>
      <div class="btnrow"><button class="btn" data-covcancel="${esc(o.id)}">Withdraw</button></div>
    </div>`).join('');
  return h;
}
/* WHAT IS WAITING ON THIS PERSON, and therefore what the tab should be shouting about.
   Only things that need a decision FROM THEM: a cover request they have been asked to take, and
   a swap where they are the one being asked. Not their own outstanding asks — those are waiting
   on somebody else — and not anything already decided, which belongs in the archive. */
function pendingForMe(){
  if(!ME)return 0;
  const covers=(COVER||[]).filter(o=>o.status==='open'&&o.fromPerson!==ME&&
    (o.eligible||[]).includes(ME)&&!(o.declinedBy||[]).includes(ME)).length;
  const swaps=(MYSWAPS||[]).filter(s=>s.status==='awaiting_partner'&&s.toPerson===ME).length;
  return covers+swaps;
}
function paintSwapDot(){
  const d=document.querySelector('#swapDot'); if(!d)return;
  const n=pendingForMe();
  d.textContent=n>9?'9+':String(n);
  d.hidden=!n;
}

/* ---------- archived requests ----------
   Anything already decided. It was in two different wrong places: a settled SWAP stayed in the
   main list forever, so the page became a pile with the one live item somewhere in it; and a
   settled COVER request vanished outright the moment it was acknowledged, so there was nowhere
   to go and check what had happened last month.
   Both land here now — closed by default, counted on the summary, newest first. */
const SWAP_DONE=['approved','rejected','declined'];
const COVER_DONE=['approved','declined','expired','cancelled'];
function archivedHTML(){
  const rows=[];
  (MYSWAPS||[]).filter(s=>(s.fromPerson===ME||s.toPerson===ME)&&SWAP_DONE.includes(s.status))
    .forEach(s=>rows.push({when:s.date,kind:'Swap',
      what:esc(META(s.shift).label||s.shift)+' · '+esc(fmtD(s.date)),
      who:esc(fullOf(s.fromPerson)||s.fromPerson)+' → '+esc(fullOf(s.toPerson)||s.toPerson),
      status:s.status, by:s.decidedBy}));
  // Not the one still sitting in "Decided" waiting to be acknowledged — it would be on the page
  // twice, once as news and once as history. It files itself the moment they tap OK.
  (COVER||[]).filter(o=>(o.fromPerson===ME||o.claimedBy===ME)&&COVER_DONE.includes(o.status)
    &&!(o.status==='approved'&&!coverSeen(o.id)))
    .forEach(o=>rows.push({when:o.date,kind:'Cover',
      what:esc(META(o.shift).label||o.shift)+' · '+esc(fmtD(o.date)),
      who:o.claimedBy?esc(fullOf(o.claimedBy)||o.claimedBy)+' for '+esc(fullOf(o.fromPerson)||o.fromPerson)
                     :esc(fullOf(o.fromPerson)||o.fromPerson),
      status:o.status, by:o.decidedBy}));
  if(!rows.length)return '';
  rows.sort((a,b)=>String(b.when).localeCompare(String(a.when)));
  // One word, the same word for both kinds. "Rejected" and "declined" are the same outcome
  // wearing two names, and neither says who — a decision that changed nothing does not need
  // somebody's name attached to it.
  const tone={approved:'ok',declined:'bad',rejected:'bad',expired:'',cancelled:''};
  const say={approved:'Approved',declined:'Declined',rejected:'Declined',
             expired:'Expired',cancelled:'Withdrawn'};
  return `<details class="arch"><summary>Archived requests <span class="archn">${rows.length}</span></summary>
    <div class="archbody">${rows.map(r=>`
      <div class="archrow">
        <span class="archk">${r.kind}</span>
        <span class="archw"><b>${r.what}</b><span class="archwho">${r.who}</span></span>
        <span class="pill ${tone[r.status]||''}">${esc(say[r.status]||r.status)}</span>
      </div>`).join('')}</div>
    <div class="note" style="margin:10px 0 0">Nothing here needs anything from you — it is what
      was decided, kept so you can look back.</div></details>`;
}

/* Acknowledgement is per request and per person, so one being cleared cannot hide the next. */
function coverSeen(id){
  try{ return (localStorage.getItem('ccpsa_coverseen')||'').split(',').includes((ME||'')+':'+id); }
  catch(e){ return false; }
}
function markCoverSeen(id){
  try{
    const k=(ME||'')+':'+id;
    const cur=(localStorage.getItem('ccpsa_coverseen')||'').split(',').filter(Boolean);
    if(!cur.includes(k))cur.push(k);
    localStorage.setItem('ccpsa_coverseen',cur.slice(-60).join(','));   // a bounded list
  }catch(e){}
}

/* ---------- one notification, one decision ----------
   Tapping "Coverage needs approval" landed on the Swaps tab, which carries the approval queue,
   the coverage requests, the swap form, this person's own swaps, and the admin sign-off queue —
   five unrelated things, with the one you were told about somewhere among them. The notification
   is about a single shift and a single decision, so it opens that: the shift, who is covering
   for whom, and the two buttons. Everything else stays a tab away where it belongs. */
async function openOffer(id){
  if(!COVER.some(o=>o.id===id))await loadCoverage();
  const o=COVER.find(x=>x.id===id);
  if(!o){ toast('That request is no longer there'); return; }
  const label=esc(META(o.shift).label||o.shift)+' · '+esc(fmtD(o.date));
  const who=(p)=>esc(fullOf(p)||p);

  if(o.status==='claimed'&&ROLE==='admin'){
    sheet('Approve this cover?',
      `<div class="sub"><b>${label}</b></div>
       <div class="sub" style="margin-top:8px"><b>${who(o.claimedBy)}</b> will cover for
         <b>${who(o.fromPerson)}</b>.${o.note?' — '+esc(o.note):''}</div>
       <div class="sub" style="margin-top:8px">Approving moves the shift on the schedule and
         tells them both.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="ofOk">Approve</button>
         <button class="btn" id="ofNo">Decline</button></div>
       <div class="msg" id="ofMsg"></div>`);
    const decide=async(action)=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofOk').disabled=true; $('#ofNo').disabled=true;
      try{ await api('/coverage',{method:'PATCH',body:JSON.stringify({id:o.id,action})});
           closeSheet(); toast(action==='approve'?'Approved — the schedule is updated':'Declined');
           await loadCoverage(); await refreshLive(true); if(CUR==='swap')renderSwap();
           // Deciding from a notification leaves you standing on the desk; the card that was
           // just handled has to come off it, and the count with it.
           if(onAdminHome()){ await loadAdminQueue(); renderAdminHome(); adminBar(); } }
      catch(e){ m.textContent=e.message||'Could not save'; m.className='msg on bad';
                $('#ofOk').disabled=false; $('#ofNo').disabled=false; }
    };
    $('#ofOk').onclick=()=>decide('approve');
    $('#ofNo').onclick=()=>decide('decline');
    return;
  }

  if(o.status==='open'&&(o.eligible||[]).includes(ME)){
    sheet('Can you cover this?',
      `<div class="sub"><b>${label}</b></div>
       <div class="sub" style="margin-top:8px">${who(o.fromPerson)} needs this covered.${
         o.note?' — '+esc(o.note):''}</div>
       <div class="sub" style="margin-top:8px">An admin still has to confirm it afterwards.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="ofTake">Accept Shift</button>
         <button class="btn" id="ofSkip">Decline Shift</button></div>
       <div class="msg" id="ofMsg"></div>`);
    // This used to just close the sheet, so "Not this time" changed nothing and the request was
    // back at the next glance. It records the answer now.
    $('#ofSkip').onclick=async()=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofTake').disabled=true; $('#ofSkip').disabled=true;
      try{ const body={id:o.id,action:'pass'}; if(onBehalf())body.person=ME;
           const r=await api('/coverage',{method:'POST',body:JSON.stringify(body)});
           track('cover_passed',{remaining:r.remaining,from:'notification'});
           closeSheet();
           toast(r.remaining? 'Passed — the others have still been asked'
                            : 'Passed — everyone has now passed, and they have been told');
           await loadCoverage(); if(CUR==='swap')renderSwap(); }
      catch(e){ m.textContent=e.message||'Could not save'; m.className='msg on bad';
                $('#ofTake').disabled=false; $('#ofSkip').disabled=false; }
    };
    $('#ofTake').onclick=async()=>{
      const m=$('#ofMsg'); m.textContent='…'; m.className='msg on';
      $('#ofTake').disabled=true;
      try{ const body={id:o.id,action:'claim'}; if(onBehalf())body.person=ME;
           await api('/coverage',{method:'POST',body:JSON.stringify(body)});
           closeSheet(); toast('Accepted — waiting for final approval');
           await loadCoverage(); if(CUR==='swap')renderSwap(); }
      catch(e){ m.textContent=e.message||'Could not accept'; m.className='msg on bad';
                $('#ofTake').disabled=false; }
    };
    return;
  }

  // Anything already settled: say what happened rather than opening an empty decision.
  const done=o.status==='approved'?'approved':o.status==='declined'?'declined'
            :o.status==='expired'?'expired':o.status;
  sheet('Cover request',
    `<div class="sub"><b>${label}</b></div>
     <div class="sub" style="margin-top:8px">This one is <b>${esc(done)}</b>${
       o.claimedBy?' — '+who(o.claimedBy)+' covering for '+who(o.fromPerson):''}.</div>
     <div class="btnrow" style="margin-top:12px"><button class="btn" id="ofClose">OK</button></div>`);
  $('#ofClose').onclick=closeSheet;
}

/* ---------- one notification, one decision: the swap version ----------
   openOffer's twin. A swap notification names one swap and one decision, so it opens that —
   the shift, who it moves between, whether it passes the rules, and the buttons. Which buttons
   depends on who is looking: the physician being asked gets take/cannot, an admin gets sign-off,
   and anyone arriving at something already settled is told what happened instead of being shown
   an empty decision. */
async function openSwap(id){
  if(!MYSWAPS.some(s=>s.id===id))await loadSwaps();
  const s=MYSWAPS.find(x=>x.id===id);
  if(!s){ toast('That swap is no longer there'); return; }
  const who=(p)=>esc(fullOf(p)||p);
  const label=esc(fmtD(s.date))+' · '+esc(META(s.shift).label||s.shift);
  const line=`<div class="sub" style="margin-top:8px"><b>${who(s.fromPerson)}</b> → <b>${who(s.toPerson)}</b>${
    s.backDate?' · trade, back on '+esc(fmtD(s.backDate)):''}${s.note?' — '+esc(s.note):''}</div>`;
  const rule=`<div class="qrule ${s.ruleCheck==='CLEAN'?'ok':'bad'}" style="margin-top:8px">${
    s.ruleCheck==='CLEAN'?'✓ Passes every rule check'
      :'✗ '+(s.problems||[]).map(esc).join(' · ')}</div>`;
  const done=async(msg)=>{
    closeSheet(); toast(msg);
    await loadSwaps(); await refreshLive(true).catch(()=>{});
    if(CUR==='swap')renderSwap();
    if(onAdminHome()){ await loadAdminQueue(); renderAdminHome(); adminBar(); }
  };
  const run=async(body,msg,btns)=>{
    const m=$('#swMsg2'); m.textContent='…'; m.className='msg on';
    btns.forEach(b=>{const e=$(b); if(e)e.disabled=true;});
    try{ await api('/swaps',{method:'PATCH',body:JSON.stringify(body)}); await done(msg); }
    catch(e){ m.textContent=(e.payload&&e.payload.problems)?e.payload.problems.join(' · ')
                            :(e.message||'Could not save'); m.className='msg on bad';
              btns.forEach(b=>{const e2=$(b); if(e2)e2.disabled=false;}); }
  };

  if(s.status==='awaiting_admin'&&ROLE==='admin'){
    sheet('Approve this swap?',
      `<div class="sub"><b>${label}</b></div>${line}${rule}
       <div class="sub" style="margin-top:8px">Approving moves the shift on the schedule and
         tells them both.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="swOk">Approve</button>
         <button class="btn" id="swNo">Reject</button>
         ${s.ruleCheck==='CLEAN'?'':'<button class="btn warnbtn" id="swOv">Approve anyway</button>'}
       </div><div class="msg" id="swMsg2"></div>`);
    const ids=['#swOk','#swNo','#swOv'];
    $('#swOk').onclick=()=>run({id:s.id,action:'approve'},'Approved — the schedule is updated',ids);
    $('#swNo').onclick=()=>run({id:s.id,action:'reject'},'Rejected',ids);
    const ov=$('#swOv');
    if(ov)ov.onclick=()=>run({id:s.id,action:'approve',override:true},
                             'Approved over the rule check',ids);
    return;
  }
  if(s.status==='awaiting_partner'&&s.toPerson===ME){
    sheet('Can you take this?',
      `<div class="sub"><b>${label}</b></div>${line}${rule}
       <div class="sub" style="margin-top:8px">An admin still has to sign it off afterwards.</div>
       <div class="btnrow" style="margin-top:12px">
         <button class="btn pri" id="swOk">I can take it</button>
         <button class="btn" id="swNo">Can’t</button></div>
       <div class="msg" id="swMsg2"></div>`);
    const ids=['#swOk','#swNo'];
    $('#swOk').onclick=()=>run({id:s.id,action:'accept'},'Accepted — waiting on an admin',ids);
    $('#swNo').onclick=()=>run({id:s.id,action:'decline'},'Declined',ids);
    return;
  }
  const state={awaiting_partner:'waiting on '+(fullOf(s.toPerson)||s.toPerson),
               awaiting_admin:'waiting on an admin', approved:'approved',
               rejected:'declined', declined:'declined', blocked:'blocked by the rule check'};
  sheet('Shift swap',
    `<div class="sub"><b>${label}</b></div>${line}
     <div class="sub" style="margin-top:8px">This one is <b>${esc(state[s.status]||s.status)}</b>.</div>
     <div class="btnrow" style="margin-top:12px"><button class="btn" id="swClose">OK</button></div>`);
  $('#swClose').onclick=closeSheet;
}

function wireCoverage(){
  document.querySelectorAll('[data-covok]').forEach(b=>b.onclick=()=>{
    markCoverSeen(b.dataset.covok); renderSwap();
  });
  document.querySelectorAll('[data-covcancel]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent='…';
    try{ await api('/coverage',{method:'POST',body:JSON.stringify({id:b.dataset.covcancel,action:'cancel'})});
         toast('Withdrawn — nobody is being asked any more');
         await loadCoverage(); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Withdraw'; }
  });
  /* Saying no is an answer, and it is recorded like one. It clears the request from this
     person's list without touching anybody else's, and if everyone passes the asker is told
     rather than left waiting on something already dead. */
  document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent='…';
    try{ const body={id:b.dataset.pass,action:'pass'};
         if(onBehalf())body.person=ME;
         const r=await api('/coverage',{method:'POST',body:JSON.stringify(body)});
         track('cover_passed',{remaining:r.remaining});
         toast(r.remaining? 'Passed — the others have still been asked'
                          : 'Passed — everyone has now passed, and they have been told');
         await loadCoverage(); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Decline Shift'; }
  });
  document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='…';
    try{ const body={id:b.dataset.claim,action:'claim'};
         if(onBehalf())body.person=ME;      // accepting FOR the physician being viewed
         await api('/coverage',{method:'POST',body:JSON.stringify(body)});
         toast('Accepted — waiting for final approval'); await loadCoverage(); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Accept Shift'; }
  });
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.ok||b.dataset.no, act=b.dataset.ok?'approve':'decline';
    b.disabled=true;
    try{ await api('/coverage',{method:'PATCH',body:JSON.stringify({id,action:act})});
         toast(act==='approve'?'Approved — the schedule is updated':'Declined');
         await loadCoverage(); await refreshLive(true); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; }
  });
  const rc=document.querySelector('#reqCover'); if(rc)rc.onclick=openCoverAsk;
  paintNotify();
  wireNotifyTest();
}
/* Who could take a shift is worked out server-side across every colleague, and it depends
   entirely on WHICH shift — so it cannot be computed until one is chosen, and it is too slow to
   compute while somebody waits with a finger on the button. It is fetched the moment the sheet
   opens, and again whenever the shift changes, so by the time anyone presses Send request the
   answer is already sitting here. Keyed by shift, because people change their minds and going
   back to a shift they already looked at should cost nothing. */
const WHOCACHE=new Map();
function whoKey(date,shift){ return date+'|'+shift; }
function prefetchWho(date,shift){
  const k=whoKey(date,shift);
  if(WHOCACHE.has(k))return WHOCACHE.get(k);
  const on=onBehalf();
  const q='?preview=1&date='+encodeURIComponent(date)+'&shift='+encodeURIComponent(shift)
          +(on?'&person='+encodeURIComponent(on):'');
  const pr=api('/coverage'+q).catch(e=>{ WHOCACHE.delete(k); throw e; });
  WHOCACHE.set(k,pr);
  return pr;
}

function openCoverAsk(preIso,preShift){
  const shifts=allShifts(ME).filter(s=>s.iso>=todayISO());
  if(!shifts.length){ toast('No upcoming shifts'); return; }
  sheet('Request coverage',
    `<label class="lbl" for="cvShift">Which shift</label>
     <select class="inp" id="cvShift">${shifts.map(s=>
       `<option value="${s.iso}|${esc(s.shift)}">${esc(fmtD(s.iso))} — ${esc(META(s.shift).label)}</option>`).join('')}</select>
     <label class="lbl" for="cvNote">Why (optional)</label>
     <input class="inp" id="cvNote" placeholder="e.g. away at a conference">
     <div class="msg" id="cvMsg"></div>
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="cvNext">Send request</button></div>
     <div class="note">You choose who to ask on the next screen.</div>`);

  // Arriving from a particular day, that shift is the one being asked about. It may be in the
  // past, in which case there is nothing to preselect and the list opens on the next shift.
  if(preIso&&preShift){
    const want=preIso+'|'+preShift, sel=$('#cvShift');
    if([...sel.options].some(o=>o.value===want))sel.value=want;
  }
  const warm=()=>{ const [d,sh]=$('#cvShift').value.split('|'); prefetchWho(d,sh).catch(()=>{}); };
  warm();                       // start before they have decided anything else
  $('#cvShift').onchange=warm;  // and again if they change their mind

  $('#cvNext').onclick=async()=>{
    const [date,shift]=$('#cvShift').value.split('|');
    const note=$('#cvNote').value;
    const m=$('#cvMsg');
    $('#cvNext').disabled=true;
    // Almost always already resolved, so this shows nothing and the next screen appears at once.
    const slow=setTimeout(()=>{ m.textContent='One moment…'; m.className='msg on'; },250);
    try{
      const j=await prefetchWho(date,shift);
      clearTimeout(slow);
      pickWhoToAsk(date,shift,note,j);
    }catch(e){ clearTimeout(slow);
      m.textContent=e.message; m.className='msg on bad'; $('#cvNext').disabled=false; }
  };
}

/* WHO TO ASK — everybody, in three groups, and every one of them selectable.
   Available are ticked and come first, because that is the ask you almost always want. Nothing
   is disabled: the rules order the list rather than deciding it, and an approval re-checks and
   records what was actually true, so asking widely cannot quietly produce a schedule that
   claims to be clean when it is not.
   No reason is printed against a name. The grouping already says as much as anyone needs to
   choose, and a column of rule citations made the screen read like a rejection notice. */
function pickWhoToAsk(date,shift,note,j){
  const free=j.free||[], working=j.working||[], blocked=j.blocked||[];
  // A name and a checkbox. There was a "notified" / "sees it next time" tag against every row,
  // which answered a question nobody was asking at that moment — you are choosing colleagues,
  // not auditing their notification settings — and it put a second column of grey text beside
  // every name. Whether anyone was actually reached is reported once, in the toast, after
  // sending, which is when it matters.
  const row=(e,checked)=>`<label class="cvrow">
      <input type="checkbox" class="cvpick" value="${esc(e.person)}"${checked?' checked':''}>
      <span class="cvnm">${esc(fullOf(e.person)||e.person)}</span>
    </label>`;
  const group=(title,rows,checked,klass)=>rows.length
    ? `<div class="cvhead ${klass||''}">${title} <span class="cvn">${rows.length}</span></div>`
      +rows.map(e=>row(e,checked)).join('')
    : '';
  sheet('Who to ask',
    `<div class="sub" style="margin-top:0">${esc(META(shift).label||shift)} · ${esc(fmtD(date))}</div>
     <div id="cvWho">
       ${group('Available',free,true)}
       ${group('Able but unavailable',working,false,'warn')}
       ${group('Unable',blocked,false,'bad')}
       ${(!free.length&&!working.length&&!blocked.length)?'<div class="cvload">Nobody to ask.</div>':''}
     </div>
     <div class="cvactions">
       <div class="msg" id="cvMsg2"></div>
       <div class="btnrow">
         <button class="btn pri" id="cvGo">Send to <span id="cvCount">${free.length}</span></button>
         <button class="btn" id="cvBack">Back</button></div>
     </div>`);

  const count=()=>{ const n=document.querySelectorAll('.cvpick:checked').length;
    const c=$('#cvCount'); if(c)c.textContent=n; };
  document.querySelectorAll('.cvpick').forEach(b=>b.addEventListener('change',count));
  count();
  $('#cvBack').onclick=()=>openCoverAsk(date,shift);   // back to the shift they chose
  $('#cvGo').onclick=async()=>{
    const to=[...document.querySelectorAll('.cvpick:checked')].map(b=>b.value);
    const m=$('#cvMsg2');
    if(!to.length){ m.textContent='Tick at least one person to ask.'; m.className='msg on bad'; return; }
    m.textContent='Sending…'; m.className='msg on';
    $('#cvGo').disabled=true;
    try{
      const on=onBehalf();
      const r=await api('/coverage',{method:'POST',body:JSON.stringify(
        {date,shift,mode:'broadcast',to,note,...(on?{person:on}:{})})});
      // The ask has changed the picture for this shift, so the cached answer is now wrong.
      WHOCACHE.delete(whoKey(date,shift));
      closeSheet();
      /* SAY WHAT ACTUALLY HAPPENED. This said "Asked 11 colleagues" whether eleven phones had
         buzzed or none had — the API has always returned how many were reached, and the toast
         threw it away. The count of PEOPLE reached is the honest number; `notified` counts
         devices, and someone with a phone and a laptop is not two colleagues. */
      const n=r.eligibleCount||to.length;
      track('cover_requested',{asked:n,notified:r.subscribed||0,duplicate:!!r.duplicate,
        free_only:to.length===(j.free||[]).length});
      toast(r.duplicate ? 'Already sent — nobody was asked twice'
        : 'Asked '+n+' colleague'+(n===1?'':'s')+' · '+(r.subscribed
            ? r.subscribed+' notified now'
            : 'they will see it next time they open the app'));
      await loadCoverage(); renderSwap();
    }catch(e){ m.textContent=e.message; m.className='msg on bad'; $('#cvGo').disabled=false; }
  };
}

        </div>
      </div>`).join(''):'<div class="empty">Nothing waiting.</div>';
    const act=(sel,payload)=>$$(sel,box).forEach(b=>b.onclick=async()=>{
      try{await api('/swaps',{method:'PATCH',body:JSON.stringify({id:b.dataset.ap||b.dataset.rj||b.dataset.ov,...payload})});
          await loadSwaps(); renderSwap();}catch(e){alert(e.payload&&e.payload.problems?e.payload.problems.join('\n'):e.message);}});
    act('[data-ap]',{action:'approve'});
    act('[data-rj]',{action:'reject'});
    act('[data-ov]',{action:'approve',override:true});
  }
  /* WIRING BELONGS WITH RENDERING. wireCoverage() was called from one place — the moment you
     navigate to this tab — while renderSwap() is called from nine: after loading, after a live
     refresh, after sending a request, after claiming one. Every one of those replaced the
     buttons with fresh HTML carrying no handlers, so "I'll take it" did nothing at all unless
     the tab had just been opened and nothing had happened since. Re-rendering must not be able
     to leave dead buttons behind. */
  wireCoverage();
}

function openDay(iso){
  if(!knownDate(iso)){sheet(fmtLong(iso),'<div class="note" style="margin-top:0">Outside this block.</div>');return;}
  const a=anyDayOf(ME,iso),rq=DATA.requests[ME]||{};
  const onReq=(rq.on||[]).includes(iso),offReq=(rq.off||[]).includes(iso),cmeReq=(rq.cme||[]).includes(iso);
  let b='';
  const daySh=(a?a.s:[]).filter(s=>isRealShift(ME,iso,s));
  if(daySh.length){
    daySh.slice().sort((x,y)=>startHour(x)-startHour(y)).forEach(s=>{const m=META(s);
      const hrs=DATA.kindHours[m.kind];
      const time=hrsText(hrs);
      b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:${m.color}"></span>
        <span><span class="t">${esc(shiftLabel(ME,iso,s,false))}</span><span class="s">${esc(m.sub)}</span></span>
        <span class="rt">${time}</span></div>`;});
    if(a.s.filter(s=>META(s).kind!=='noc').length&&a.s.some(s=>META(s).kind==='noc'))
      b+=`<div class="note"><span class="pill warn">24-hour shift</span> Two full days off follow.</div>`;
  }else if(offReq||cmeReq){
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:var(--signal)"></span>
      <span><span class="t">Off — you asked for it</span><span class="s">${cmeReq?'CME':'Requested day off'} · granted</span></span></div>`;
  }else{
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:var(--line2)"></span>
      <span><span class="t">Not scheduled</span><span class="s">No shift this day</span></span></div>`;
  }
  (a&&a.r||[]).forEach(r=>{const rm=DATA.roles[r]||{label:r,color:'#F0ABFC'};
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:${rm.color}"></span>
      <span><span class="t">◆ ${esc(rm.label)}</span><span class="s">Layered role — on top of your shift</span></span></div>`;});
  if(onReq)b+=`<div class="note"><span class="pill ok">You asked to work</span> This was one of your request-on days.</div>`;
  /* NOT FOR A DAY THAT HAS ALREADY HAPPENED. This offered cover on any day carrying a shift, with
     no date test at all — so a July night, seven weeks gone, came with a button to find somebody
     to work it. Nobody had seen it because the archive was showing the SOLVED plan, in which the
     test persona had nothing on that date; putting the as-worked record in front of it exposed a
     gap that was there all along.
     The quarter is not the question — the date is. Q3 runs to 30 September, so most of it is
     still ahead of us and cover on those days is real. */
  const past = iso < todayISO();
  if(a&&a.s.length&&!past)
    b+=`<div class="btnrow"><button class="btn" id="dsSwap">Find cover for this shift</button></div>`;
  else if(a&&a.s.length&&past)
    b+=`<div class="note" style="margin-top:9px">This day has passed — it is here as a record.</div>`;
  sheet(fmtLong(iso),b);
  const sw=$('#dsSwap');
  // Used to close this sheet and jump to the Swaps tab — a different page, arrived at with no
  // explanation, which for an admin also lit up the admin view. Asking someone to cover a shift
  // is one decision; it belongs in one sheet, on the shift you were already looking at.
  // One cover flow, entered with this shift already chosen. There used to be a SECOND
  // implementation behind this button — its own sheet, its own candidate list, its own copy of
  // the rules text — and it silently broke the moment the preview endpoint changed shape,
  // because nothing else used it. Two ways to do one thing is how that happens.
  if(sw)sw.onclick=()=>openCoverAsk(iso,(a.s||[])[0]);
}

/* A sheet can be dismissed four ways — the ✕, Cancel, Escape, and the scrim — and anything that
   has to be undone on dismissal has to be undone by all four. Cancel alone put the admin/physician
   toggle back, so leaving the code prompt by any other route left "Admin view" highlighted while
   the physician's schedule was on screen. */
let _sheetOnClose=null;
function onSheetClose(fn){ _sheetOnClose=fn; }
function closeSheet(){
  const fn=_sheetOnClose; _sheetOnClose=null; if(fn)try{fn();}catch(e){}
  $('#sheet').classList.remove('on');$('#scrim').classList.remove('on');
  $$('.cell.sel').forEach(c=>c.classList.remove('sel'));
  /* Wait out the close animation before recording again. .on comes off immediately but the
     sheet slides away over .22s, and the secret is legible for every frame of it. 450ms costs a
     few seconds of recording; not waiting costs the tail of a TOTP secret. */
  if(typeof replayGate==='function')setTimeout(replayGate,450);
  if(_sheetReturnFocus&&_sheetReturnFocus.focus){_sheetReturnFocus.focus({preventScroll:true});_sheetReturnFocus=null;}}

/* THE SCRIM APPEARS UNDER THE FINGER THAT OPENED THE SHEET. Reported after withdrawing a request
   and pressing Request coverage straight afterwards: the sheet opened and then slid back down on
   its own. That is what a tap-through looks like -- the scrim is full-screen with a close
   handler, it is laid over the exact spot being touched, and on a touchscreen the tail of that
   same gesture can land on it. It could not be reproduced in a desktop browser, where a
   synthetic click does not linger; the guard is cheap and costs a real dismissal nothing, since
   nobody opens a sheet and deliberately dismisses it inside a third of a second. */
let _sheetOpenedAt=0;

/* ---------- live schedule changes (admin edits, applied on top of the build) ----------
   The page bakes the schedule in at build time. Manual changes therefore have to be layered
   on at read time, or a call-out fixed this morning would not reach anyone until the next
   full rebuild and redeploy. EDITS holds the override records; MYCHANGES is the subset that
   touches the signed-in physician. */
let EDITS=[], MYCHANGES=[];
function applyEdits(edits){
  EDITS=edits||[]; MYCHANGES=[];
  if(!ME)return;
  /* AN EDIT LANDS IN THE QUARTER ITS DATE BELONGS TO. Edits can now be made on Q3 dates, and
     writing them all into the Q4 map would have invented a Q4 day that does not exist while
     leaving the real Q3 day untouched — the change would appear on no screen at all. */
  const arch=(DATA.archive||{}).day;
  const inArchive=(iso)=>!!(arch&&(DATA.archive.dates||[]).includes(iso));
  EDITS.forEach(o=>{
    const was=(o.from||[]).includes(ME), now=(o.to||[]).includes(ME);
    if(was===now)return;                          // this edit does not involve me
    const map=inArchive(o.date)?(arch[ME]||(arch[ME]={})):(DATA.day[ME]||(DATA.day[ME]={}));
    const a=map[o.date]||(map[o.date]={s:[],r:[]});
    a.s=(a.s||[]).filter(x=>x!==o.unit);
    if(now)a.s.push(o.unit);
    MYCHANGES.push({date:o.date,unit:o.unit,added:now,at:o.at,by:o.by,note:o.note});
  });
  MYCHANGES.sort((x,y)=>x.date.localeCompare(y.date));
}
/* ACKNOWLEDGED, NOT DISMISSED FOREVER.
   This sat at the top of the schedule permanently. A notice that never goes away stops being
   read within a day, which is the opposite of what a schedule change needs — and there was no
   way to say "yes, I saw that", so it kept claiming the schedule had just changed weeks later.

   Dismissal is keyed to WHICH changes, not to the banner: acknowledging today's change cannot
   hide tomorrow's. The key is the changes themselves, so a new one — or the same shift changed
   again — brings it straight back. Per person too, since an admin steps through several. */
function changeKey(){
  return (ME||'')+'|'+MYCHANGES.map(c=>c.date+':'+c.unit+':'+(c.added?'+':'-')+(c.at||'')).join(',');
}
function changesSeen(){
  try{ return localStorage.getItem('ccpsa_chgseen')===changeKey(); }catch(e){ return false; }
}
function changeBanner(){
  if(!MYCHANGES.length||changesSeen())return '';
  const rows=MYCHANGES.map(c=>{
    const m=META(c.unit)||{label:c.unit};
    return '<li>'+(c.added?'<b>Added</b> ':'<b>Removed</b> ')+(m.label||c.unit)+
           ' on '+fmtD(c.date)+(c.note?' — '+esc(c.note):'')+'</li>';
  }).join('');
  return '<div class="swcard chg" id="chgCard"><div class="chgh">Your schedule changed</div>'+
         '<ul class="chgl">'+rows+'</ul>'+
         '<div class="muted sm">Changed by the scheduling lead. Questions go to '+
         esc((CFG&&CFG.lateContact)||'your scheduling lead')+'.</div>'+
         '<div class="btnrow"><button class="btn" id="chgOk">OK, got it</button></div></div>';
}
function wireChangeBanner(){
  const b=document.querySelector('#chgOk'); if(!b)return;
  b.onclick=()=>{
    try{localStorage.setItem('ccpsa_chgseen',changeKey());}catch(e){}
    const c=document.querySelector('#chgCard'); if(c)c.remove();
  };
}

async function loadEditDay(iso){

function drawEditDay(){
  if(!EDDAY)return;
  const units=EDDAY.units||{}, keys=Object.keys(units).sort((a,b)=>
    (META(a).label||a).localeCompare(META(b).label||b));

function openCell(unit){
  const who=(EDDAY.units||{})[unit]||[];
  const cands=((EDDAY.candidates||{})[unit]||[]).filter(p=>!who.includes(p));
  const m=META(unit);
  const chips=cands.map(p=>`<button class="pill cpick" data-p="${esc(p)}">${esc(p)}</button>`).join('');
  const cur=who.map(p=>`<button class="pill cpick on" data-r="${esc(p)}">${esc(p)} ✕</button>`).join('');
  sheet(`${m.label||unit} · ${fmtD(EDDATE)}`,
    `<div class="lbl">On now — tap to remove</div>
    <div class="chips">${cur||'<i class="muted">nobody</i>'}</div>
    <div class="lbl" style="margin-top:12px">Available and legal for this shift</div>
    <div class="chips">${chips||'<i class="muted">nobody is free and credentialed</i>'}</div>
    <label class="lbl" for="edNote" style="margin-top:12px">Why (shown to the provider)</label>
    <input id="edNote" class="inp" placeholder="e.g. called out sick">
    <div id="edVerdict"></div>
    <div class="btnrow"><button class="btn" id="edCancel">Cancel</button>
      <button class="btn pri" id="edSave" disabled>Save change</button></div>`);
  let next=who.slice();
  const paint=()=>{
    $('#edSave').disabled = (next.length===who.length && next.every((p,i)=>p===who[i]));
    $$('#sheet .cpick').forEach(c=>{
      const p=c.dataset.p||c.dataset.r;
      c.classList.toggle('on',next.includes(p));
      c.innerHTML=esc(p)+(next.includes(p)?' ✕':'');
    });
  };
  $$('#sheet .cpick').forEach(c=>c.onclick=()=>{
    const p=c.dataset.p||c.dataset.r;
    next = next.includes(p) ? next.filter(x=>x!==p) : next.concat([p]);
    paint();
  });
  $('#edCancel').onclick=closeSheet;
  $('#edSave').onclick=()=>saveCell(unit,next,false);
  paint();
}
async function saveCell(unit,to,force){
  const note=($('#edNote')&&$('#edNote').value)||'';
  const v=$('#edVerdict'); v.innerHTML='<div class="muted">Checking…</div>';
  try{
    const r=await api('/schedule',{method:'PATCH',
      body:JSON.stringify({date:EDDATE,unit,to,note,force:!!force})});
    closeSheet();
    await loadEditDay(EDDATE);
    try{const s=await api('/schedule');applyEdits(s.overrides||[]);}catch(e){}
    drawEditLog();
    toast(r.unchanged?'No change':'Saved — everyone sees it now');
  }catch(e){
    const p=(e.payload&&e.payload.problems)||[];
    if(e.status===409){
      v.innerHTML='<div class="errbox"><b>This breaks the rules</b><ul>'+
        p.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
        '<button class="btn warnbtn" id="edForce">Make the change anyway</button></div>';
      $('#edForce').onclick=()=>saveCell(unit,to,true);
    }else{ v.innerHTML='<div class="errbox">'+esc(e.message)+'</div>'; }
  }
}
function drawEditLog(){
  const box=$('#edLog'); if(!box)return;
  const list=EDITS.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,12);
  if(!list.length){box.innerHTML='<div class="empty">No manual changes yet.</div>';return;}
  box.innerHTML=list.map(o=>`<div class="swcard">
      <div class="lgh">${esc(fmtD(o.date))} · ${esc(META(o.unit).label||o.unit)}
        ${o.ruleCheck==='FAILS'?'<span class="tagw">forced</span>':''}</div>
      <div class="sub">${esc((o.from||[]).join(', ')||'nobody')} → <b>${esc((o.to||[]).join(', ')||'nobody')}</b></div>

    </div>`).join('');
  $$('#edLog [data-undo]').forEach(b=>b.onclick=async()=>{

/* ---------- tabs ---------- */
let CUR='now';
/* ---------- layout readout (off unless asked for) ----------
   The tab bar sitting high on Swaps could not be reproduced on any screen I have; it has only
   ever been seen on an installed iPhone app, which is exactly where there is no inspector. Rather
   than guess a fourth time, this reports the numbers that decide where the bar lands, live, from
   the device showing the fault. Tap the version in Account five times to turn it on or off.
   Nothing renders and no work is done unless it is on, so it is inert for everyone else. */
function diagOn(){ try{ return localStorage.getItem('swdiag')==='1'; }catch(e){ return false; } }
function diagToggle(){
  let on=false;
  try{ on=!diagOn(); localStorage.setItem('swdiag',on?'1':'0'); }catch(e){}
  const el=$('#swdiag'); if(el)el.remove();
  if(on)diagPaint(); toast(on?'Layout readout on':'Layout readout off');
}
function diagPaint(){
  if(!diagOn())return;
  let el=$('#swdiag');
  if(!el){
    el=document.createElement('div'); el.id='swdiag';
    el.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#111a26f2;'
      +'color:#7CFFB2;font:11px/1.35 ui-monospace,Menlo,monospace;padding:6px 8px;'
      +'white-space:pre;pointer-events:none;border-bottom:1px solid #2a3a4d';
    document.body.appendChild(el);
  }
  const nav=$('nav.tabs'), main=$('main.wrap');
  const r=nav?nav.getBoundingClientRect():{top:0,bottom:0,height:0};
  const cs=nav?getComputedStyle(nav):{};
  const vv=window.visualViewport||{};
  // env() is not readable from JS, so measure it with a probe.
  let inset='?';
  try{ const q=document.createElement('div');
       q.style.cssText='position:fixed;bottom:0;height:env(safe-area-inset-bottom);width:1px';
       document.body.appendChild(q); inset=Math.round(q.getBoundingClientRect().height); q.remove();
  }catch(e){}
  const g=Math.round((vv.height||window.innerHeight)-r.bottom);
  el.textContent=
     'tab '+CUR+'   GAP BELOW BAR '+g+'px'
   +'\ninner '+window.innerHeight+'  visual '+Math.round(vv.height||0)+'  vvTop '+Math.round(vv.offsetTop||0)
   +'  client '+document.documentElement.clientHeight
   +'\nbar top '+Math.round(r.top)+'  bottom '+Math.round(r.bottom)+'  h '+Math.round(r.height)
   +'  pos '+(cs.position||'?')
   +'\nmain scrollH '+(main?main.scrollHeight:0)+'  clientH '+(main?main.clientHeight:0)
   +'  scrollTop '+(main?Math.round(main.scrollTop):0)
   +'\ndoc scrollH '+document.documentElement.scrollHeight
   +'  pad '+(SPACER?SPACER.style.height:'-')
   +'\nfixed bottom:0 lands at '+Math.round(fixedBottom())+'   safeBottom '+inset
   +'\nstandalone '+(!!navigator.standalone||matchMedia('(display-mode: standalone)').matches)
   +'  dpr '+window.devicePixelRatio+'  build '+BUILD;
}

/* The two tabs that are about YOU, not about the schedule. Hidden while a physician is reading a
   colleague — see visitingOn(). Toggling visibility only: the redirect lives in go(), so there is
   no path where this calls go() and go() calls this. */
/* A READ-ONLY ACCOUNT NEVER HAS THEM, not even on its own name. Carie Barton, the practice
   accountant (client 8/26), signs in to look at schedules; she has no shifts, so Requests and
   Swaps would be two tabs that could only ever be empty and would invite a support question
   about why. The API refuses her writes regardless — this is the half that stops her finding a
   button that then fails. */
const readOnlyRole=()=>ROLE==='viewer';
function syncTabs(){
  const hide=!!visitingOn()||readOnlyRole();
  $$('.tab').forEach(b=>{ if(b.dataset.t==='req'||b.dataset.t==='swap') b.hidden=hide; });
}
function go(t){
  // Asked for a tab that does not belong to the person being read? Show them the schedule, which
  // is what they came for. Covers every route in — the tab bar, a switch, a resumed session.
  if((visitingOn()||readOnlyRole())&&(t==='req'||t==='swap')) t='sched';
  CUR=t;
  syncTabs();
  $$('.tab').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+t));
  document.body.classList.toggle('wide',t==='admin');
  window.scrollTo(0,0);
  if(t==='now')renderNow();
  if(t!=='sched')VIEWBLOCK=defaultBlock();   // only the calendar switches; back to today's quarter
  if(t==='sched')renderSched();
  if(t==='req')renderReq();
  if(t==='swap')renderSwap();      // renderSwap wires its own buttons
  if(t==='edit')renderEdit();
  if(t==='admin')renderAdmin();
  /* Three times, and the middle one is the point. Several of those renders finish after a fetch,
     so the first call measures a page that has not finished growing and the 400ms call catches
     up — but 400ms is long enough to WATCH the bar move, which is what it looked like. The rAF
     call lands before the browser paints, so the correction is not something you can see happen.
     A re-measure is nearly free; the cost of missing one is a bar that slides. */
  padShort();
  requestAnimationFrame(padShort);
  setTimeout(padShort, 400);
}
function wireTabs(){$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));}

/* ---------- never let a page be shorter than the screen ----------
   The bar is position:fixed;bottom:0 again, which is where it belongs: iOS puts that on the
   bottom of the glass, and it was right on Now, Schedule and Requests from the beginning. Swaps
   was the only tab that broke, and it is the only tab whose content does not fill a phone --
   when the document is shorter than the viewport, bottom:0 gets resolved against the DOCUMENT
   and the bar rides up with it.

   So the document is padded instead. Nothing else moves.

   Padding it to 100% was tried and failed, for a reason worth recording: on the phone showing
   this, every height JS can read -- innerHeight, clientHeight, visualViewport, 100dvh -- reports
   the viewport WITHOUT the home-indicator strip, about 34px short. A page padded to 100% is
   still shorter than the glass, so bottom:0 still had somewhere to ride up to.

   fixedBottom() is the honest number: a 1px element pinned at bottom:0, read back with
   getBoundingClientRect. Whatever the engine believes the bottom of the viewport is, that probe
   is sitting on it, in the same coordinate space the bar is laid out in. Pad past that and the
   short-document case cannot arise on any of the four tabs. */
let PROBE = null;
function fixedBottom(){
  if (!PROBE){
    PROBE = document.createElement('div');
    PROBE.setAttribute('aria-hidden','true');
    PROBE.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;'
                        + 'visibility:hidden;pointer-events:none';
    document.body.appendChild(PROBE);
  }
  return PROBE.getBoundingClientRect().bottom || 0;
}
let SPACER = null;
function padShort(){
  if (!SPACER){
    SPACER = document.createElement('div');
    SPACER.id = 'pad';
    SPACER.setAttribute('aria-hidden','true');
    SPACER.style.cssText = 'width:1px;pointer-events:none';
    document.body.appendChild(SPACER);
  }
  SPACER.style.height = '0px';                 // measure the page without our own padding first
  // One past the bottom, so the document is strictly taller than the viewport rather than equal
  // to it -- equal is the boundary case and not worth trusting.
  const want = Math.ceil(Math.max(fixedBottom(), window.innerHeight || 0,
                                  document.documentElement.clientHeight || 0)) + 1;
  /* HOW TALL IS THE PAGE, REALLY? Neither obvious answer survives contact:
       scrollHeight  is clamped to at least the viewport on both html and body, so a half-screen
                     page reports a full screen and the short case is invisible to it;
       body's box    reported 852 on a Swaps tab whose content ended at 585, so it is not
                     content-driven here either.
     The in-flow children are, so they are measured directly -- the lowest bottom edge of
     anything actually laid out in the document, in page coordinates, plus whatever padding the
     body adds under it. */
  let have = 0;
  for (const el of document.body.children){
    if (el === SPACER || el === PROBE) continue;
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.position === 'fixed' || cs.position === 'absolute') continue;
    have = Math.max(have, el.getBoundingClientRect().bottom + window.scrollY);
  }
  have = Math.round(have + parseFloat(getComputedStyle(document.body).paddingBottom || 0));
  if (have < want) SPACER.style.height = (want - have) + 'px';
  diagPaint();
}
function fitWire(){
  padShort();
  ['resize','orientationchange','pageshow'].forEach(e => window.addEventListener(e, padShort));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', padShort);
  // Orientation changes report the old size for a frame or two on iOS.
  window.addEventListener('orientationchange', () => setTimeout(padShort, 350));
}if(ADMIN_HTML){
  const bar=$('.tabsin');
  bar.style.gridTemplateColumns='repeat(6,1fr)';
  bar.appendChild(el('button','tab',
    '<svg viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16z"/></svg>Edit')).dataset.t='edit';
  bar.appendChild(el('button','tab',
    '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Admin')).dataset.t='admin';
  document.querySelector('main').appendChild(el('section','pane')).id='pane-edit';
  document.querySelector('main').appendChild(el('section','pane')).id='pane-admin';
}

fitWire();

/* ---------- light or dark ----------
   No stored choice means follow the phone, which is already somebody's answer to this question.
   A tap makes it explicit and that choice sticks; the system stops being consulted from then on,
   because someone who has chosen does not want their preference re-litigated at sunset. */
function storedTheme(){ try{return localStorage.getItem('ccpsa_theme')||'';}catch(e){return '';} }
function systemTheme(){ return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
function currentTheme(){ return storedTheme()||systemTheme(); }
function setTheme(t){
  try{localStorage.setItem('ccpsa_theme',t);}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',t==='light'?'#F4F7FA':'#0E1621');
  paintThemeBtn();
}
function paintThemeBtn(){
  const b=document.querySelector('#themeBtn'); if(!b)return;
  // The icon is what you will GET, not what you are on — a sun while already light is a puzzle.
  b.textContent=currentTheme()==='light'?'☾':'☀';
}
// Applied before anything renders, or the app flashes the wrong theme on every open. This is
// also what makes ONE light palette enough: the system preference is turned into the same
// data-theme attribute an explicit choice sets, so the stylesheet needs no media-query copy of
// the values to drift out of step with.
(function(){
  const apply=()=>{
    const t=currentTheme();
    document.documentElement.setAttribute('data-theme',t);
    const m=document.querySelector('meta[name=theme-color]');
    if(m)m.setAttribute('content',t==='light'?'#F4F7FA':'#0E1621');
    paintThemeBtn();
  };
  apply();
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{
    if(!storedTheme())apply();          // still following the phone
  });
})();

// The portal is phone-first (.wrap is 600px), so the dashboard was being squeezed into a
// phone-width column on a laptop — which is what made its text overlap. In admin mode the pane
// breaks out of that column and the frame is sized to the real viewport.
function sizeAdminFrame(){
  const f=document.querySelector('#admFrame'); if(!f)return;
  const top=f.getBoundingClientRect().top;
  const h=Math.max(320,(window.innerHeight||600)-top);
  f.style.height=h+'px';
}
window.addEventListener('resize',()=>{if(document.body.classList.contains('adminmode'))sizeAdminFrame();});
window.addEventListener('orientationchange',()=>setTimeout(sizeAdminFrame,250));

/* ---------- the approvals desk ----------
   Three queues used to live in three places, all of them inside SOME PHYSICIAN'S page: cover
   approvals in the offer sheet, swap sign-off at the bottom of the Swaps tab, and holiday
   decisions nowhere at all — /api/requests has taken a PATCH since 8/17 and nothing ever sent
   one. An admin who is not a physician has no page to find any of it on. This is that page.

   It is deliberately NOT behind the 6-digit step-up. Every decision here is one the Swaps tab
   already offers on a session alone; the code guards the admin DASHBOARD, where the schedule
   itself can be rewritten. Asking for one to see a list of the same two buttons would be
   theatre — and it would fire on every boot for the admins who land here. */
async function loadAdminQueue(){
  if(ROLE!=='admin'||!SESSION){ADMINQ={cover:[],swaps:[],hol:[]};return;}
  const [cov,sw,rq]=await Promise.all([
    api('/coverage').catch(()=>({offers:[]})),
    api('/swaps').catch(()=>({swaps:[]})),
    api('/requests?all=1').catch(()=>({all:{}})),
  ]);
  // Claimed, not open: an offer nobody has accepted is not waiting on an admin.
  ADMINQ.cover=(cov.offers||[]).filter(o=>o.status==='claimed');
  // 'blocked' is waiting on the two physicians, not on us — it never reached a partner.
  ADMINQ.swaps=(sw.swaps||[]).filter(s=>s.status==='awaiting_admin');
  ADMINQ.hol=Object.values(rq.all||{})
    .filter(r=>r&&r.holiday&&!['approved','declined'].includes(r.holidayStatus||''))
    .sort((a,b)=>String(a.person).localeCompare(String(b.person)));
}
function adminQCount(){ return ADMINQ.cover.length+ADMINQ.swaps.length+ADMINQ.hol.length; }

const HOLNAME={thanksgiving:'Thanksgiving',christmas:'Christmas',newyear:'New Year'};
function renderAdminHome(){
  const w=document.querySelector('#homeWrap'); if(!w)return;
  const who=(p)=>esc(fullOf(p)||p);
  const n=adminQCount();
  const cards=[];

  ADMINQ.cover.forEach(o=>cards.push(`<div class="qcard">
    <div class="qk">Cover · needs approval</div>
    <div class="qt">${esc(META(o.shift).label||o.shift)} · ${esc(fmtD(o.date))}</div>
    <div class="qw"><b>${who(o.claimedBy)}</b> will cover for <b>${who(o.fromPerson)}</b>.${
      o.note?' — '+esc(o.note):''}</div>
    <div class="qw">Approving moves the shift on the schedule and tells them both.</div>
    <div class="qact"><button class="btn pri" data-qc="${esc(o.id)}" data-act="approve">Approve</button>
      <button class="btn" data-qc="${esc(o.id)}" data-act="decline">Decline</button></div></div>`));

  ADMINQ.swaps.forEach(s=>cards.push(`<div class="qcard">
    <div class="qk">Swap · needs sign-off</div>
    <div class="qt">${esc(fmtD(s.date))} · ${esc(META(s.shift).label||s.shift)}</div>
    <div class="qw"><b>${who(s.fromPerson)}</b> → <b>${who(s.toPerson)}</b>${
      s.backDate?' (trade, back on '+esc(fmtD(s.backDate))+')':''}${s.note?' · '+esc(s.note):''}</div>
    <div class="qrule ${s.ruleCheck==='CLEAN'?'ok':'bad'}">${s.ruleCheck==='CLEAN'
      ?'✓ Passes every rule check':'✗ '+(s.problems||[]).map(esc).join(' · ')}</div>
    <div class="qact"><button class="btn pri" data-qs="${esc(s.id)}" data-act="approve">Approve</button>
      <button class="btn" data-qs="${esc(s.id)}" data-act="reject">Reject</button>${
      s.ruleCheck==='CLEAN'?''
        :`<button class="btn warnbtn" data-qs="${esc(s.id)}" data-act="override">Approve anyway</button>`}
    </div></div>`));

  ADMINQ.hol.forEach(r=>cards.push(`<div class="qcard">
    <div class="qk">Priority holiday · needs a decision</div>
    <div class="qt">${who(r.person)} — ${esc(HOLNAME[String(r.holiday).toLowerCase()]||r.holiday)}</div>
    <div class="qw">Their one guaranteed 4-day holiday block for the year.</div>
    <div class="qact"><button class="btn pri" data-qh="${esc(r.person)}" data-act="approved">Approve</button>
      <button class="btn" data-qh="${esc(r.person)}" data-act="declined">Decline</button></div></div>`));

  w.innerHTML=`<h1 class="hgreet">${esc((ACCT&&ACCT.label)||'Admin')}</h1>
    <div class="hsub">${n?`${n} thing${n===1?'':'s'} waiting on you.`
      :'Nothing is waiting on you right now.'}</div>
    ${cards.length?cards.join('')
      :`<div class="hzero"><div class="zt">You are all caught up</div>
         <div class="zs">Cover approvals, swap sign-offs and holiday decisions land here.</div></div>`}
    <div class="hlinks">
      <button class="btn" id="hDash">Open the dashboard</button>
      <button class="btn" id="hPick">Look at a provider</button>
      <button class="btn" id="hAcct">Manage access</button>
      <button class="btn gho" id="hRef">Refresh</button>
    </div>`;

  // A decision is one round trip, then the whole queue is re-read: approving a cover can settle
  // a swap on the same shift, and a stale card is an invitation to decide something twice.
  const after=async(msg)=>{ toast(msg); await loadAdminQueue(); renderAdminHome();
    /* eslint-disable-line */
                            adminBar(); await refreshLive(true).catch(()=>{}); };
  const wire=(sel,run)=>$$(sel,w).forEach(b=>b.onclick=async()=>{
    $$('button',w).forEach(x=>x.disabled=true);
    try{ await run(b); }
    catch(e){ toast((e.payload&&e.payload.problems)?e.payload.problems.join(' · ')
                    :(e.message||'Could not save'));
              /* A REFUSAL USUALLY MEANS THIS CARD IS OUT OF DATE. The commonest is a coverage
                 request the asker withdrew while the desk was open: the server refuses it, and
                 without this the card stayed, re-armed, inviting the same dead press again.
                 Re-reading turns a confusing refusal into the card simply going away. */
              await loadAdminQueue().catch(()=>{}); renderAdminHome(); adminBar(); }
  });
  wire('[data-qc]',async b=>{
    const act=b.dataset.act; track('decision',{kind:'cover',action:act,from:'desk'});
    await api('/coverage',{method:'PATCH',body:JSON.stringify({id:b.dataset.qc,action:act})});
    await after(act==='approve'?'Approved — the schedule is updated':'Declined');
  });
  wire('[data-qs]',async b=>{
    const act=b.dataset.act; track('decision',{kind:'swap',action:act,from:'desk'});
    await api('/swaps',{method:'PATCH',body:JSON.stringify({id:b.dataset.qs,
      action:act==='reject'?'reject':'approve', override:act==='override'})});
    await after(act==='reject'?'Rejected':'Approved — the schedule is updated');
  });
  wire('[data-qh]',async b=>{
    track('decision',{kind:'holiday',action:b.dataset.act,from:'desk'});
    await api('/requests',{method:'PATCH',
      body:JSON.stringify({person:b.dataset.qh,decision:b.dataset.act})});
    await after(b.dataset.act==='approved'?'Holiday approved':'Holiday declined');
  });
  $('#hDash').onclick=()=>{ showAdminView(); markBar('admin'); };
  $('#hPick').onclick=()=>{ hideAdminHome(); if(ME){boot();markBar('pick');} else togglePicker(); };
  $('#hAcct').onclick=()=>showAccounts();
  $('#hRef').onclick=async()=>{ await loadAdminQueue(); renderAdminHome(); adminBar(); };
}

/* ---------- managing access ----------
   Who can get in, and the three things that can be done about it. Written as one screen because
   the question is always comparative — "is she locked out or has she never set up" is answered by
   seeing the row next to everyone else's, not by looking up one person.

   Nothing here deletes. Retiring appends a disabled version of the record, so it is reversible and
   the history survives; the API refuses Aaron Nadon outright and will not act on anything but one
   exact name. The confirmation below is deliberately awkward — password plus the name typed back —
   because the failure that matters is not malice, it is a tired person tapping the wrong row. */
function acctChips(a){
  const c=[];
  if(a.disabled)      c.push('<span class="achip bad">Closed</span>');
  else if(!a.enrolled)c.push('<span class="achip warn">Not set up</span>');
  if(a.lockedFor)     c.push(`<span class="achip bad">Locked ${a.lockedFor>90
                                ?Math.ceil(a.lockedFor/60)+'m':a.lockedFor+'s'}</span>`);
  else if(a.failedAttempts>=3) c.push(`<span class="achip warn">${a.failedAttempts} failed</span>`);
  if(a.enrolled&&!a.disabled){
    if(a.twoFactor) c.push('<span class="achip">2FA</span>');
    if(a.passkeys)  c.push(`<span class="achip">Face ID${a.passkeys>1?' ×'+a.passkeys:''}</span>`);
  }
  if(a.protectedAccount) c.push('<span class="achip">Protected</span>');
  return c.join('');
}
async function showAccounts(){

  }catch(e){ $('#sheetBd').innerHTML=`<div class="empty">${esc(e.message||'Could not load accounts')}</div>`; return; }

  // Filter state lives out here so a redraw after an action does not throw you back to the top
  // of 65 names — which is where you were when somebody phoned.
  let q='', tab='all';
  const needsAttention=a=>!!a.lockedFor||a.failedAttempts>=3;
  const pending=a=>!a.enrolled&&!a.disabled;
  const draw=()=>{
    const locked=rows.filter(needsAttention).length;
    const notset=rows.filter(pending).length;
    const closed=rows.filter(a=>a.disabled).length;
    const match=a=>{
      if(tab==='locked'&&!needsAttention(a))return false;
      if(tab==='pending'&&!pending(a))return false;
      if(tab==='closed'&&!a.disabled)return false;
      if(!q)return true;
      const t=(fullOf(a.person)||a.person)+' '+a.person+' '+(a.email||'');

    const shown=rows.filter(match).sort((x,y)=>

      (x.disabled-y.disabled)||

    const tabBtn=(k,label,n)=>`<button class="acctab${tab===k?' on':''}" data-tab="${k}"
      role="tab" aria-selected="${tab===k}"${n===0&&k!=='all'?' disabled':''}>${label}${
      n!=null?`<span class="n">${n}</span>`:''}</button>`;

      <div class="accsearch">

             stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
