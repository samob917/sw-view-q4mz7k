/* Show/hide on every password box. Typing a 12+ character passphrase blind on a phone keyboard
   is where most sign-in attempts actually fail. */
function wireReveal(root){
  (root||document).querySelectorAll('input[type=password]').forEach(inp=>{
    if(inp.dataset.reveal)return;
    inp.dataset.reveal='1';
    const wrap=document.createElement('div');
    wrap.className='pwwrap';
    inp.parentNode.insertBefore(wrap,inp);
    wrap.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pweye'; b.textContent='Show';
    b.setAttribute('aria-label','Show password');
    b.onclick=()=>{
      const on=inp.type==='password';
      inp.type=on?'text':'password';
      b.textContent=on?'Hide':'Show';
      b.setAttribute('aria-label',(on?'Hide':'Show')+' password');
      inp.focus();
    };
    wrap.appendChild(b);
  });
}

function siPaint(body){
  const old=document.querySelector('.signin'); if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',siShell(body));
  wireReveal(document.querySelector('.signin'));
}
function siSay(t,bad){const m=document.querySelector('#siMsg'); if(!m)return;
  m.textContent=t||''; m.className='siMsg'+(t?' on':'')+(bad?' bad':'');}

/* ---------- live refresh ----------
   The portal used to fetch its data once at sign-in and never again, so a shift the scheduling
   lead changed this morning never reached a session opened last night — the API was right, the
   page was just holding a stale copy. Poll when the tab regains focus and on a slow interval,
   and re-render only when something has actually changed. */
let LAST_EDIT_SIG=null, REFRESH_TIMER=null;
function editSig(list){
  return (list||[]).map(o=>o.id+':'+(o.at||'')).sort().join('|');
}
async function refreshLive(force){
  if(!SESSION||!SESSION.token)return;
  try{
    const r=await fetch(API+'/portal',{headers:{Authorization:'Bearer '+SESSION.token},cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    const sig=editSig(j.edits);
    if(!force&&sig===LAST_EDIT_SIG)return;      // nothing changed — leave the view alone
    const first=LAST_EDIT_SIG===null;
    LAST_EDIT_SIG=sig;
    DATA=j.data;
    CFG={...(CFG||{}),deadline:j.deadline,locked:j.locked,lateContact:j.lateContact};
    applyEdits(j.edits||[]);
    if(!first){
      // Re-render in place. boot() lands on the schedule tab, which for an admin with no
      // schedule of their own means "Choose a physician" — so a background refresh was
      // yanking people out of the admin view every 90 seconds while they were reading it.
      const inAdmin=!!document.querySelector('#admWrap.on');
      const inGroup=!!document.querySelector('#pane-group.on');
      const inClinic=!!document.querySelector('#pane-clinic.on');
      // Home belongs on this list for the same reason as the rest: boot() lands on the schedule
      // tab, so without it, approving anything from the desk threw you off the desk — after()
      // calls refreshLive, and the admin ended up on "Choose a physician" mid-queue.
      const inHome=onAdminHome();
      if(inAdmin||inGroup||inClinic||inHome){
        if(inGroup)renderGroup();
        if(inClinic)renderClinicView();
        if(inHome)renderAdminHome();
        // the admin view is an iframe with its own data; leave it alone
      }else{
        boot();
        if(CUR)go(CUR);
      }
      if(MYCHANGES.length)toastLive('Your schedule was updated');
    }
  }catch(e){ /* offline: keep showing what we have */ }
}
function toastLive(msg){
  let t=document.querySelector('#liveToast');
  if(!t){t=el('div','toastbox');t.id='liveToast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3500);
}
/* IS THIS APP THE VERSION THAT IS DEPLOYED? Ask the server, not the browser.
   Everything else about updating goes through the service worker, and that is one mechanism
   with several ways to sit still: a worker that installs but waits, a page that is resumed
   rather than loaded, an update check that never runs because the app was suspended. Worse, a
   fix to any of that can only reach a phone THROUGH the thing being fixed — the install that
   most needs the update is running the code that fails to fetch it.

   So this compares the build stamp baked into this page against the one the API reports for the
   deployment, and reloads if they differ. It needs no worker, no lifecycle event and no
   cooperation from the cache. It is the backstop for every way the rest of it can fail. */
let VERCHECK=null;
async function checkVersion(){
  if(!API||typeof BUILD!=='string'||BUILD.indexOf('__')===0)return;
  try{
    const c=await (await fetch(API+'/config',{cache:'no-store'})).json();
    const live=((c||{}).release||{}).build;
    if(!live||live===BUILD)return;
    // Reload once per build, or a mismatch that is not really a mismatch becomes a boot loop.
    let done=null; try{done=sessionStorage.getItem('ccpsa_reloadedfor');}catch(e){}
    if(done===live)return;
    try{sessionStorage.setItem('ccpsa_reloadedfor',live);}catch(e){}
    // Not while someone is mid-sentence; the next foreground will do.
    const a=document.activeElement||{};
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||'')||document.querySelector('.sheet.on'))return;
    location.reload();
  }catch(e){}
}

function startLiveRefresh(){
  if(REFRESH_TIMER)clearInterval(REFRESH_TIMER);
  REFRESH_TIMER=setInterval(()=>{if(!document.hidden)refreshLive(false);},90000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshLive(false);checkVersion();}});
  window.addEventListener('focus',()=>refreshLive(false));
  if(VERCHECK)clearInterval(VERCHECK);
  VERCHECK=setInterval(()=>{if(!document.hidden)checkVersion();},600000);
  checkVersion();
}

async function loadPortal(token){
  const r=await fetch(API+'/portal',{headers:{Authorization:'Bearer '+token}});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||'Could not load your schedule');
  DATA=j.data;
  SESSION={token,person:j.person,role:j.role};
  // The dashboard runs in a same-origin frame and reads its identity from sessionStorage, so
  // handing it the session here means signing in once covers both. Without this it showed its
  // own "Sign in" button to someone who had just signed in.
  try{
    sessionStorage.setItem('__tok',token);
    sessionStorage.setItem('__editTok',token);
    sessionStorage.setItem('__acctInfo',JSON.stringify({person:j.person,role:j.role,twoFactor:true}));
  }catch(e){}
  CFG={deadline:j.deadline,locked:j.locked,lateContact:j.lateContact,
       icsUrl:j.icsUrl,icsFor:j.person};   // whose link this is — see subscribeCard
  // A physician who wanders onto the test copy would file real requests into a schedule that
  // gets thrown away, so they are warned plainly. But this used to REFUSE them outright, which
  // also made it impossible to test anything a physician does — requests, swaps, coverage —
  // since those act as the signed-in person and an admin cannot stand in. Warn, and let them
  // through if they meant it.
  let warned=false; try{warned=sessionStorage.getItem('__testok')==='1';}catch(e){}
  if(TEST_BUILD && j.role!=='admin' && !warned){
    document.body.classList.add('locked');
    siPaint(`
      <div class="siLead"><b>This is the test copy of the schedule.</b> Anything you do here is
        discarded and never reaches the real schedule — including requests and swaps.</div>
      <div class="siLead">Your real schedule is at <b>ccpsa.schedulingwiz.com/my/</b>.</div>
      <a class="siB" href="https://ccpsa.schedulingwiz.com/my/" style="display:block;
        text-align:center;text-decoration:none">Take me to my real schedule</a>
      <button class="siGhost" id="testGo">I am testing — continue here</button>`);
    document.querySelector('#testGo').onclick=()=>{
      try{sessionStorage.setItem('__testok','1');}catch(e){}
      loadPortal(token).catch(e=>siSay(e.message,true));
    };
    return;
  }
  setIdentity(j.person,j.role,j.label);
  document.body.classList.remove('locked');
  const g=document.querySelector('.signin'); if(g)g.remove();
  LAST_EDIT_SIG=editSig(j.edits);
  applyEdits(j.edits||[]);
  boot(); bootApi();
  startLiveRefresh();
}

/* Step 1 — email and password only. The 6-digit code gets its own screen: putting it on the
   login form asks for something most people do not have open yet, and makes a fresh account
   look like it is missing a field. */
function stepPassword(email){
  siPaint(`
    <form id="siForm" method="post" action="#" novalidate>
    <label class="siL" for="siEmail">Email</label>
    <input class="siI" id="siEmail" name="username" type="email" autocomplete="username"
           autocapitalize="none" spellcheck="false"
           value="${email?String(email).replace(/"/g,'&quot;'):''}">
    <label class="siL" for="siPw">Password</label>
    <input class="siI" id="siPw" name="password" type="password" autocomplete="current-password">
    <button class="siB" id="siGo" type="submit">Sign in</button>
    </form>
    <div id="siPk"></div>
    <div class="siNote" id="siNote">No account yet? <a href="/account/">Set one up</a></div>`);
  // Face ID goes UNDER the form, not above it. Offered first it would be the obvious thing to
  // press, and on a device that has never enrolled it opens a system sheet saying there are no
  // passkeys — a dead end presented as the main route. Shown to anyone whose device can do it,
  // because a passkey may have been enrolled on this account from a different browser here.
  pkAvailable().then(ok=>{
    const box=document.querySelector('#siPk'); if(!ok||!box)return;
    box.innerHTML='<div class="siOr">or</div>'+
      '<button class="siGhost" id="siFace" type="button">Sign in with Face ID</button>';
    document.querySelector('#siFace').onclick=async()=>{
      siSay('Waiting for Face ID…');
      try{ await signInWithPasskey(); }
      catch(e){
        const m=String((e&&e.message)||e);
        // A cancelled prompt is not an error worth shouting about; the person changed their mind.
        siSay(/NotAllowed|Cancel|abort/i.test(m)
          ? 'Face ID was cancelled. You can still use your password.'
          : m, true);
      }
    };
  });
  // Submitting the form is what a manager expects to happen; the click handler below still runs.
  document.querySelector('#siForm').addEventListener('submit',ev=>{ev.preventDefault();go();});
  // Only offer the emailed reset if this deployment can actually send one. Asked and answered
  // by /api/config, which is public and says nothing about who has an account.
  fetch(API+'/config').then(r=>r.json()).then(c=>{
    const note=document.querySelector('#siNote'); if(!note)return;
    note.innerHTML=(c&&c.mail
      ? '<a href="#" id="siForgot">Forgot your password?</a> · '
      : 'Forgotten your password? Your access code still signs you in — ask Dr. Nadon. · ')+
      'No account yet? <a href="/account/">Set one up</a>';
    const f=document.querySelector('#siForgot');
    if(f)f.onclick=e=>{e.preventDefault();stepForgot(document.querySelector('#siEmail').value.trim());};
  }).catch(()=>{});
  const go=async()=>{
    const em=document.querySelector('#siEmail').value.trim();
    const pw=document.querySelector('#siPw').value;
    if(!em||!pw){siSay('Enter your email and password.',true);return;}
    siSay('Signing in…');
    try{
      const r=await fetch(API+'/session',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:em,password:pw,device:rememberedDevice()})});
      const j=await r.json();
      if(r.ok){
        PW_TYPED=true;
        try{sessionStorage.setItem('__tok',j.token);localStorage.setItem('ccpsa_login_email',em);}catch(e){}
        keepDevice(j.device); keepGrant(j.grant);
        // Only offer to set up 2FA to someone who has none. A returning user on a trusted
        // device already has it and was being asked to set it up again.
        if(j.twoFactor){ await loadPortal(j.token); return; }
        stepOffer2fa(em,pw,j.token);
        return;
      }
      if(j.need==='2fa'){ step2fa(em,pw); return; }
      siSay(j.error||'Could not sign in',true);
    }catch(e){ siSay('Could not reach the server.',true); }
  };
  document.querySelector('#siGo').onclick=go;
  ['siEmail','siPw'].forEach(id=>{const e=document.querySelector('#'+id);
    e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go();}});});
  setTimeout(()=>{const e=document.querySelector('#siEmail'); if(e&&!e.value)e.focus();
                  else document.querySelector('#siPw').focus();},60);
}

/* Step 2a — this account already has an authenticator. */
function step2fa(email,pw){
  siPaint(`
    <div class="siStep">Step 2 of 2</div>

    siSay('Checking…');

        body:JSON.stringify({email,password:pw,totp:code,device:rememberedDevice()})});

      if(!r.ok){siSay(j.error||'That code is not right.',true);return;}
      try{sessionStorage.setItem('__tok',j.token);}catch(e){}

/* Step 2b — no authenticator yet. Offered, not imposed: locking someone out of their own
   schedule because they have not set up 2FA yet is worse than letting them in and asking again. */
function stepOffer2fa(email,pw,token){
  siPaint(`
    <div class="siStep">One more thing</div>
    <div class="siLead">Protect your account with an authenticator app. It takes about a minute,
      and means a stolen password alone is not enough to open your schedule.</div>
    <button class="siB" id="siSetup">Set up two-factor</button>
    <button class="siGhost" id="siLater">Not now — take me to my schedule</button>`);
  document.querySelector('#siLater').onclick=()=>loadPortal(token).catch(e=>siSay(e.message,true));
  document.querySelector('#siSetup').onclick=async()=>{
    siSay('Preparing…');
    try{
      const r=await fetch(API+'/account',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({action:'reset2fa',password:pw})});
      const j=await r.json();
      if(!r.ok){siSay(j.error||'Could not start setup',true);return;}
      stepScan(email,pw,token,j);
    }catch(e){ siSay('Could not reach the server.',true); }
  };
}
function stepScan(email,pw,token,setup){
  /* A QR CODE ON THE PHONE YOU ARE SETTING UP CANNOT BE SCANNED BY THAT PHONE. This screen was
     written for somebody sitting at a computer with a phone in hand, and then shipped to people
     whose only device is the phone in front of them. The otpauth:// link has always been in the
     response; nothing used it. On a phone it opens the authenticator app directly and the whole
     scanning problem disappears, so that is the button, and the QR moves to where it belongs —
     behind "setting this up from a computer?".

     The key stays visible and copyable either way: it is the route that works when the app is
     one the link does not reach. */
  const touch=matchMedia('(pointer:coarse)').matches||/iPhone|iPad|Android/i.test(navigator.userAgent);
  const qrBlock=`<div class="siQr"><img src="${setup.totpQr||''}" alt="QR code"></div>`;
  siPaint(`
    <div class="siStep">${touch?'Add it to your authenticator':'Scan this'}</div>
    <div class="siLead">Google Authenticator, Authy, 1Password, or the password app on iPhone.</div>
    ${touch
      ? `<a class="siB" id="siOpenAuth" href="${esc(setup.totpUri||'')}">Open my authenticator app</a>
         <div class="siHint">If nothing opens, copy the key below and paste it into the app by hand.</div>
         <details class="icsmore" style="margin-top:10px"><summary>Setting this up from a computer?</summary>
           ${qrBlock}</details>`
      : qrBlock}
    <button class="siKey" id="siCopyKey" type="button" title="Tap to copy">${setup.totpSecret||''}</button>
    <label class="siL" for="siNew">Then enter the 6-digit code</label>
    <input class="siI siCode" id="siNew" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="000000">
    <button class="siB" id="siDone">Turn on and sign in</button>
    <button class="siGhost" id="siSkip">Skip for now</button>`);
  document.querySelector('#siSkip').onclick=()=>loadPortal(token).catch(e=>siSay(e.message,true));
  const ck=document.querySelector('#siCopyKey');
  if(ck)ck.onclick=async()=>{
    try{ await navigator.clipboard.writeText(setup.totpSecret||''); siSay('Key copied'); }
    catch(e){ siSay('Select the key and copy it',true); }
  };
  // Two security set-ups back to back is one too many. If somebody has just done the
  // authenticator, Face ID waits until their next visit rather than stacking on top of it —
  // which is also how a QR screen ended up looking like it was part of setting up Face ID.
  DID_2FA_SETUP=true;
  const go=async()=>{
    siSay('Checking…');
    try{
      const r=await fetch(API+'/account',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({action:'confirm2fa',
                             totp:document.querySelector('#siNew').value.trim()})});
      const j=await r.json();
      if(!r.ok){siSay(j.error||'That code is not right.',true);return;}
      keepDevice(j.device); keepGrant(j.grant);       // else the next sign-in asks for a code it does not need
      await loadPortal(j.token||token);
    }catch(e){ siSay('Could not reach the server.',true); }
  };
  document.querySelector('#siDone').onclick=go;
  const n=document.querySelector('#siNew');
  n.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go();}});
  setTimeout(()=>n.focus(),60);
}

  siPaint(`

/* WHICH SIGN-IN THE PASSWORD MANAGER OFFERS.
   A manager matches on the registrable domain — schedulingwiz.com — not the host, so every
   credential saved on any of these pages is offered on all of them: the real schedule, the test
   copy, and the account page. Nothing a site can put in its HTML changes that; it is how the
   browser is built.

   What DOES narrow it is a username already in the field, because the manager then offers the
   password saved for that address rather than the whole list. This remembered the email nowhere
   and opened the form blank every time, so there was nothing to narrow on. localStorage is
   per-origin, so test remembers the test address and the real site remembers the real one —
   which is exactly the separation the manager cannot make on its own. */
function lastLoginEmail(){
  try{return localStorage.getItem('ccpsa_login_email')||'';}catch(e){return '';}
}
function showGate(){ stepPassword(lastLoginEmail()); }

(async function start(){
  document.body.classList.add('locked');
  // A reset link beats an existing session: whoever holds the link is the one at the keyboard,
  // and they are here precisely because they could not get in.
  const rtok=new URLSearchParams(location.search).get('reset');
  if(rtok){ document.body.classList.add('locked'); await stepReset(rtok); return; }
  let tok=null; try{tok=sessionStorage.getItem('__tok');}catch(e){}
  if(tok){ try{ await loadPortal(tok); return; }catch(e){ try{sessionStorage.removeItem('__tok');}catch(_){} } }

  // Once an account is set up, this browser holds a device token for 90 days. Use it: closing
  // the app and coming back should not mean typing an email and password again. The admin view
  // still asks for a code, which is the part that needs somebody actually present.
  const dev=rememberedDevice();
  if(dev){
    try{
      const r=await fetch(API+'/session',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({device:dev})});
      if(r.ok){
        const j=await r.json();
        // Resuming is exactly the moment to ask, if there is something to ask with.
        if(await maybeLock())return;
        try{sessionStorage.setItem('__tok',j.token);}catch(e){}
        await loadPortal(j.token);
        return;
      }
      // The token is dead or the account is gone — stop offering it.
      try{localStorage.removeItem('__dev');}catch(e){}
    }catch(e){}
  }
  showGate();
})();

/* The version check has to run whether or not anyone is signed in.
   It was wired into startLiveRefresh(), which only runs once a schedule has loaded — so an app
   sitting on the sign-in screen, which is exactly what a stale install shows when its session
   has expired, never checked at all. That is the case that most needs it: nobody can get past
   that screen to trigger anything. /api/config is public, so this asks for nothing it is not
   entitled to. */
/* ---------- landing where the notification was about ----------
   A push carries ?go=<tab>. Opened cold the app reads it here; already open, the service worker
   sends the same instruction, because focusing a window leaves whoever tapped on whatever screen
   they happened to be reading — which is not the thing they just tapped about. The parameter is
   then cleared from the address, so a later reload does not keep dragging them back to it. */
function goFromUrl(u){
  let tab=null,as=null,offer=null;
  try{ const q=new URL(u||location.href,location.origin).searchParams;
       tab=q.get('go'); as=q.get('as'); offer=q.get('offer'); }catch(e){}
  if(!tab||!['now','sched','req','swap'].includes(tab))return false;
  const land=()=>{
    // NO IDENTITY SWITCHING. Putting the admin "back on their own page" set ME to their account
    // name — and an admin like sam is not a physician, so ME blanked and the app fell back to
    // "choose somebody", which is the provider list Sam saw open over the top of everything.
    // The decision sheet below is identity-independent: it approves the same offer whoever is
    // being viewed, which is what the notification was actually asking for.
    //
    // Leave the admin panes properly first. go() clears whichever pane is on, but it cannot
    // restore the tab bar or drop body.adminmode — both of those are switched off by hand when
    // you leave. Without this you landed on the right tab with no tab bar to leave it by.
    hideAdminHome(); hideAdminView();
    // as=me means "your own queue". For an admin that is now a real page — the approvals desk —
    // and it carries the same approve/reject buttons. Dropping a person-less admin on the Swaps
    // TAB put them on a physician's page with an empty swap form behind the sheet, and nothing
    // useful under it if the offer had already been handled.
    if(as==='me'&&ROLE==='admin')showAdminHome();
    else if(typeof go==='function')go(tab);
    // The notification was about one thing; open that thing rather than the tab it lives on.
    if(offer)openOffer(offer);
  };
  /* WAITING FOR A FIXED 900ms WAS A GUESS, AND IT LOST.
     goFromUrl runs at parse time, long before sign-in has finished: /api/session, then
     /api/portal with 160KB of schedule behind it. On a cold app open over cellular that is
     routinely more than 900ms, and when land() fired early there was no session yet — so
     openOffer found an empty COVER, gave up with "that request is no longer there", and boot()
     then moved the person somewhere else entirely. Intermittent by construction: fast network,
     works; slow network, silently lands you nowhere near the decision.
     Wait for the app to actually BE ready instead, and keep the parameters until it is, so
     nothing is thrown away while we are still waiting. */
  const clearUrl=()=>{
    try{ const clean=new URL(location.href);
         clean.searchParams.delete('go');
         clean.searchParams.delete('as'); clean.searchParams.delete('offer');
         history.replaceState(null,'',clean.pathname+clean.search+clean.hash); }catch(e){}
  };
  const t0=Date.now();
  (function ready(){
    // BOOTED alone is not enough — boot() can run before the API has answered. openOffer needs
    // a session to load the offer, and go() needs DATA to render anything at all.
    if(BOOTED&&DATA&&SESSION){ land(); clearUrl(); return; }
    // Give up after 20s and land anyway: offline, the app should still go somewhere sensible
    // rather than sit on the last screen forever with the notification unanswered.
    if(Date.now()-t0>20000){ land(); clearUrl(); return; }
    setTimeout(ready,120);
  })();
  return true;
}
goFromUrl();
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',ev=>{
    if(!ev.data||ev.data.type!=='navigate')return;
    /* ARRIVING BY TAP INTO AN APP THAT IS ALREADY OPEN IS NOT THE SAME as opening the app from
       a cold start. Somebody reading one physician's schedule did not ask to be moved somewhere
       else; being moved anyway loses their place with no way back to it. Cold start goes
       straight there — there is nothing to lose — and an app already open is asked. */
    if(document.querySelector('.signin')||!BOOTED){ goFromUrl(ev.data.url); return; }
    askToGo(ev.data.url);
  });
}

function askToGo(url){
  let bar=document.querySelector('#goBar');
  if(bar)bar.remove();
  bar=el('div','gobar'); bar.id='goBar';
  bar.innerHTML='<span>A request needs your approval.</span>'+
    '<span class="gobtns"><button class="btn pri" id="goYes">View request</button>'+
    '<button class="btn" id="goNo">Later</button></span>';
  document.body.appendChild(bar);
  document.querySelector('#goNo').onclick=()=>bar.remove();
  document.querySelector('#goYes').onclick=()=>{ bar.remove(); goFromUrl(url); };
  // It is a prompt, not an alarm: if it is ignored it goes quietly rather than sitting there.
  setTimeout(()=>{ if(bar&&bar.isConnected)bar.remove(); },30000);
}

checkVersion();
touchSeen();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){touchSeen();return;}     // stamp on the way out, judge on the way back
  checkVersion();
  maybeLock();
});
window.addEventListener('pagehide',touchSeen);
setInterval(()=>{if(!document.hidden)touchSeen();},60000);
window.addEventListener('pageshow',e=>{if(e.persisted)checkVersion();});
</script>
