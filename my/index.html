/* openTradeBack — a flat list of the other person's shifts — is GONE. It was the second door to
   the same room, and every caller now opens the overlay, which offers that same list as one of
   its two views. Deleted rather than left unwired: an entry point nothing calls is something the
   next person has to work out is dead. */
function wireCoverage(){
  document.querySelectorAll('[data-covok]').forEach(b=>b.onclick=()=>{
    markCoverSeen(b.dataset.covok); renderSwap();
  });
  /* "Plan a trade with X" — the overlay, from either side of a settled cover. data-trade is
     bound to one specific cover and belongs to the person who asked; this one only needs to know
     who the other person is, which is why the taker can have it too. */
  document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>
    openTradeOverlay(b.dataset.plan));
  document.querySelectorAll('[data-covcancel]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent='…';
    try{ await api('/coverage',{method:'POST',body:JSON.stringify({id:b.dataset.covcancel,action:'cancel'})});
         toast('Withdrawn — nobody is being asked any more');
         await loadCoverage(); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Withdraw'; }
  });
  /* Saying no is an answer, and it is recorded like one. It clears the request from this
     person's list without touching anybody else's, and if everyone passes the asker is told
     rather than left waiting on something already dead. */
  document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent='…';
    try{ const body={id:b.dataset.pass,action:'pass'};
         if(onBehalf())body.person=ME;
         const r=await api('/coverage',{method:'POST',body:JSON.stringify(body)});
         track('cover_passed',{remaining:r.remaining});
         toast(r.remaining? 'Passed — the others have still been asked'
                          : 'Passed — everyone has now passed, and they have been told');
         await loadCoverage(); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Decline Shift'; }
  });
  document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='…';
    try{ const body={id:b.dataset.claim,action:'claim'};
         if(onBehalf())body.person=ME;      // accepting FOR the physician being viewed
         const r=await api('/coverage',{method:'POST',body:JSON.stringify(body)});
         toast('Accepted — waiting for final approval'); await absorbOffer(r); renderSwap(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Accept Shift'; }
  });
  document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.ok||b.dataset.no, act=b.dataset.ok?'approve':'decline';
    b.disabled=true;
    try{ const r=await api('/coverage',{method:'PATCH',body:JSON.stringify({id,action:act})});
         toast(act==='approve'?'Approved — the schedule is updated':'Declined');
         await absorbOffer(r);
         renderSwap();                       // say so NOW; the schedule catches up behind it
         if(act==='approve')refreshLive(true).then(()=>{ if(CUR==='swap')renderSwap(); }); }
    catch(e){ toast(e.message); b.disabled=false; }
  });
  const rc=document.querySelector('#reqCover'); if(rc)rc.onclick=openCoverAsk;
  paintNotify();
  wireNotifyTest();
}
/* Who could take a shift is worked out server-side across every colleague, and it depends
   entirely on WHICH shift — so it cannot be computed until one is chosen, and it is too slow to
   compute while somebody waits with a finger on the button. It is fetched the moment the sheet
   opens, and again whenever the shift changes, so by the time anyone presses Send request the
   answer is already sitting here. Keyed by shift, because people change their minds and going
   back to a shift they already looked at should cost nothing. */
const WHOCACHE=new Map();
function whoKey(date,shift){ return date+'|'+shift; }
function prefetchWho(date,shift){
  const k=whoKey(date,shift);
  if(WHOCACHE.has(k))return WHOCACHE.get(k);
  const on=onBehalf();
  const q='?preview=1&date='+encodeURIComponent(date)+'&shift='+encodeURIComponent(shift)
          +(on?'&person='+encodeURIComponent(on):'');
  const pr=api('/coverage'+q).catch(e=>{ WHOCACHE.delete(k); throw e; });
  WHOCACHE.set(k,pr);
  return pr;
}

/* IS THERE ALREADY ONE OUT ON THIS SHIFT? (Sam, 2026-09-04: "i requested coverage for a shift
   then went back the shift and i was able to request coverage again.")
   Nothing asked. The server does notice a duplicate — it answers `duplicate:true` and asks
   nobody twice — but that is a safety net behind a screen that had already told you to go ahead,
   and the second toast reads exactly like the first. So you cannot tell whether you have asked
   once or three times, which is the actual problem: the app should not have to be forgiving
   about something it can plainly see.
   Open OR claimed. Claimed is the state people are most likely to ask again from — somebody has
   accepted and it is sitting on an admin, which looks from the shift like nothing happened. */
function pendingCover(iso,shift){
  return (COVER||[]).find(o=>o.fromPerson===ME&&o.date===iso&&(!shift||o.shift===shift)
    &&(o.status==='open'||o.status==='claimed'))||null;
}
// What to call it on a button, in the state it is actually in.
function pendingCoverLabel(o){
  return o&&o.status==='claimed'
    ? 'Pending coverage — '+(fullOf(o.claimedBy)||o.claimedBy)+' accepted'
    : 'Pending coverage';
}
function openCoverAsk(preIso,preShift){
  const shifts=allShifts(ME).filter(s=>s.iso>=todayISO());
  if(!shifts.length){ toast('No upcoming shifts'); return; }
  sheet('Request coverage',
    `<label class="lbl" for="cvShift">Which shift</label>
     <select class="inp" id="cvShift">${shifts.map(s=>{
       // Said in the list, not only when they press send: a shift already out for cover reads as
       // one here, so the choice is informed rather than corrected.
       const pend=pendingCover(s.iso,s.shift);
       return `<option value="${s.iso}|${esc(s.shift)}">${esc(fmtD(s.iso))} — ${esc(META(s.shift).label)}${
         pend?' · already out for cover':''}</option>`;}).join('')}</select>
     <label class="lbl" for="cvNote">Why (optional)</label>
     <input class="inp" id="cvNote" placeholder="e.g. away at a conference">
     <div class="msg" id="cvMsg"></div>
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="cvNext">Send request</button></div>
     <div class="note">You choose who to ask on the next screen.</div>`);

  // Arriving from a particular day, that shift is the one being asked about. It may be in the
  // past, in which case there is nothing to preselect and the list opens on the next shift.
  if(preIso&&preShift){
    const want=preIso+'|'+preShift, sel=$('#cvShift');
    if([...sel.options].some(o=>o.value===want))sel.value=want;
  }
  const warm=()=>{ const [d,sh]=$('#cvShift').value.split('|'); prefetchWho(d,sh).catch(()=>{}); };
  warm();                       // start before they have decided anything else
  $('#cvShift').onchange=warm;  // and again if they change their mind

  $('#cvNext').onclick=async()=>{
    const [date,shift]=$('#cvShift').value.split('|');
    const note=$('#cvNote').value;
    const m=$('#cvMsg');
    /* REFUSED HERE, not absorbed silently by the server. Asking a second time would notify
       nobody new and leave one request looking like two. */
    const already=pendingCover(date,shift);
    if(already){
      m.innerHTML='This shift is already out for cover — '+
        (already.status==='claimed'
          ? esc(fullOf(already.claimedBy)||already.claimedBy)+' has accepted it and it is waiting on an admin.'
          : 'nobody has accepted yet.')+
        ' <button class="lnk" id="cvSee">See the request</button>';
      m.className='msg on';
      const see=$('#cvSee'); if(see)see.onclick=()=>openOffer(already.id);
      return;
    }
    $('#cvNext').disabled=true;
    // Almost always already resolved, so this shows nothing and the next screen appears at once.
    const slow=setTimeout(()=>{ m.textContent='One moment…'; m.className='msg on'; },250);
    try{
      const j=await prefetchWho(date,shift);
      clearTimeout(slow);
      pickWhoToAsk(date,shift,note,j);
    }catch(e){ clearTimeout(slow);
      m.textContent=e.message; m.className='msg on bad'; $('#cvNext').disabled=false; }
  };
}

/* WHO TO ASK — everybody, in three groups, and every one of them selectable.
   Available are ticked and come first, because that is the ask you almost always want. Nothing
   is disabled: the rules order the list rather than deciding it, and an approval re-checks and
   records what was actually true, so asking widely cannot quietly produce a schedule that
   claims to be clean when it is not.
   No reason is printed against a name. The grouping already says as much as anyone needs to
   choose, and a column of rule citations made the screen read like a rejection notice. */
function pickWhoToAsk(date,shift,note,j){
  const free=j.free||[], working=j.working||[], blocked=j.blocked||[];
  // A name and a checkbox. There was a "notified" / "sees it next time" tag against every row,
  // which answered a question nobody was asking at that moment — you are choosing colleagues,
  // not auditing their notification settings — and it put a second column of grey text beside
  // every name. Whether anyone was actually reached is reported once, in the toast, after
  // sending, which is when it matters.
  const row=(e,checked)=>`<label class="cvrow">
      <input type="checkbox" class="cvpick" value="${esc(e.person)}"${checked?' checked':''}>
      <span class="cvnm">${esc(fullOf(e.person)||e.person)}</span>
    </label>`;
  const group=(title,rows,checked,klass)=>rows.length
    ? `<div class="cvhead ${klass||''}">${title} <span class="cvn">${rows.length}</span></div>`
      +rows.map(e=>row(e,checked)).join('')
    : '';
  sheet('Who to ask',
    `<div class="sub" style="margin-top:0">${esc(META(shift).label||shift)} · ${esc(fmtD(date))}</div>
     <div id="cvWho">
       ${group('Available',free,true)}
       ${group('Working that day',working,false,'warn')}
       ${group('Unable',blocked,false,'bad')}
       ${(!free.length&&!working.length&&!blocked.length)?'<div class="cvload">Nobody to ask.</div>':''}
     </div>
     <div class="cvactions">
       <div class="msg" id="cvMsg2"></div>
       <div class="btnrow">
         <button class="btn pri" id="cvGo">Send to <span id="cvCount">${free.length}</span></button>
         <button class="btn" id="cvBack">Back</button></div>
     </div>`);

  const count=()=>{ const n=document.querySelectorAll('.cvpick:checked').length;
    const c=$('#cvCount'); if(c)c.textContent=n; };
  document.querySelectorAll('.cvpick').forEach(b=>b.addEventListener('change',count));
  count();
  $('#cvBack').onclick=()=>openCoverAsk(date,shift);   // back to the shift they chose
  $('#cvGo').onclick=async()=>{
    const to=[...document.querySelectorAll('.cvpick:checked')].map(b=>b.value);
    const m=$('#cvMsg2');
    if(!to.length){ m.textContent='Tick at least one person to ask.'; m.className='msg on bad'; return; }
    m.textContent='Sending…'; m.className='msg on';
    $('#cvGo').disabled=true;
    try{
      const on=onBehalf();
      const r=await api('/coverage',{method:'POST',body:JSON.stringify(
        {date,shift,mode:'broadcast',to,note,...(on?{person:on}:{})})});
      // The ask has changed the picture for this shift, so the cached answer is now wrong.
      WHOCACHE.delete(whoKey(date,shift));
      closeSheet();
      /* SAY WHAT ACTUALLY HAPPENED. This said "Asked 11 colleagues" whether eleven phones had
         buzzed or none had — the API has always returned how many were reached, and the toast
         threw it away. The count of PEOPLE reached is the honest number; `notified` counts
         devices, and someone with a phone and a laptop is not two colleagues. */
      const n=r.eligibleCount||to.length;
      track('cover_requested',{asked:n,notified:r.subscribed||0,duplicate:!!r.duplicate,
        free_only:to.length===(j.free||[]).length});
      toast(r.duplicate ? 'Already sent — nobody was asked twice'
        : 'Asked '+n+' colleague'+(n===1?'':'s')+' · '+(r.subscribed
            ? r.subscribed+' notified now'
            : 'they will see it next time they open the app'));
      await absorbOffer(r); renderSwap();
    }catch(e){ m.textContent=e.message; m.className='msg on bad'; $('#cvGo').disabled=false; }
  };
}

function renderSwap(){
  const pane=$('#pane-swap');
  // coverage requests lead: asking everyone who can take it is the good path
  if(!ME){pane.innerHTML='<div class="empty" style="margin-top:22px">Choose a provider first.</div>';return;}
  if(!SESSION){pane.innerHTML='<div class="empty" style="margin-top:22px">Sign in again to use swaps.</div>';return;}

  const mine=allShifts(ME).filter(x=>x.iso>=todayISO());
  const others=DATA.people.filter(p=>p!==ME).sort();
  // Live only. Settled ones move to the archive at the bottom rather than sitting here.
  const mySw=MYSWAPS.filter(s=>(s.fromPerson===ME||s.toPerson===ME)&&!SWAP_DONE.includes(s.status));

  const badge=(s)=>{
    const m={blocked:['bad','Breaks a rule'],awaiting_partner:['warn','Waiting on them'],
             awaiting_admin:['warn','Waiting on Dr. Nadon'],approved:['ok','Approved'],
             rejected:['bad','Rejected'],declined:['bad','Declined']}[s.status]||['','—'];
    return `<span class="pill ${m[0]}">${m[1]}</span>`;
  };

  pane.innerHTML=`<div class="btnrow two"><button class="btn pri" id="reqCover">Request coverage</button>
      <button class="btn" id="planTrade">Plan a trade</button></div>
    ${notifyCard()}${coverageCard()}
    <!-- THE PERSON-TO-PERSON SWAP FORM IS GONE (Sam 2026-08-23).
         It never did anything "Request coverage" cannot, and it did it worse:

           · coverage already has a DIRECT mode — ask one named person — so the only thing this
             form offered was already there
           · the two-way trade this was built for was never reachable from the UI: backDate and
             backShift appear only in code that DISPLAYS a trade, never in a form that makes one
           · coverage picks its candidates by the rule check, so you are only offered colleagues
             who can legally take the shift. This form let you pick anyone, created the request,
             marked it blocked — and then neither person could do anything with it. Berger sent
             one to Sullivan for a night Sullivan already works; it sat on both their pages with
             no button on it, and no way to withdraw it, because swaps have no withdraw.

         What is left is everything needed to SETTLE what already exists: the list below, the
         accept/decline buttons, and the admin sign-off queue. Nothing in flight breaks. Deleting
         the machinery is a separate decision — this only stops new dead ends being created. -->
    <!-- WHOSE SWAPS THESE ARE (Sam, 2026-09-04: "the trades say me, it should say the provider
         that is trading, not me!!"). "My swap requests" is true for exactly one reader. An admin
         on somebody's page, and a provider reading a colleague's, both have ME set to that other
         person — so the heading claimed their swaps as the reader's own, over cards that then
         named two different people. The heading now says whose page it is, the way the schedule
         heading already does; and it is "swaps and trades" because half this list is proposals

  if(isAdmin()){

          await loadSwaps(); renderSwap();}catch(e){alert(e.payload&&e.payload.problems?e.payload.problems.join('\n'):e.message);}});
    act('[data-ap]',{action:'approve'});
    act('[data-rj]',{action:'reject'});
  }
  /* WIRING BELONGS WITH RENDERING. wireCoverage() was called from one place — the moment you
     navigate to this tab — while renderSwap() is called from nine: after loading, after a live
     refresh, after sending a request, after claiming one. Every one of those replaced the
     buttons with fresh HTML carrying no handlers, so "I'll take it" did nothing at all unless
     the tab had just been opened and nothing had happened since. Re-rendering must not be able
     to leave dead buttons behind. */
  wireCoverage();

/* ---------- day sheet ---------- */
function openDay(iso){
  if(!knownDate(iso)){sheet(fmtLong(iso),'<div class="note" style="margin-top:0">Outside this block.</div>');return;}
  const a=anyDayOf(ME,iso),rq=DATA.requests[ME]||{};
  const onReq=(rq.on||[]).includes(iso),offReq=(rq.off||[]).includes(iso),cmeReq=(rq.cme||[]).includes(iso);
  let b='';
  const daySh=(a?a.s:[]).filter(s=>isRealShift(ME,iso,s));
  if(daySh.length){
    daySh.slice().sort((x,y)=>startHour(x)-startHour(y)).forEach(s=>{const m=META(s);
      const hrs=DATA.kindHours[m.kind];
      const time=hrsText(hrs);
      b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:${m.color}"></span>
        <span><span class="t">${esc(shiftLabel(ME,iso,s,false))}</span><span class="s">${esc(m.sub)}</span></span>
        <span class="rt">${time}</span></div>`;});
    /* NO "24-HOUR SHIFT · TWO FULL DAYS OFF FOLLOW" (Sam, 2026-09-03: "incorrect and unneeded").
       It was inferred from the shape of the day — a day assignment plus a night — and then stated
       the consequence as fact. Whether two days off actually follow depends on the schedule, not
       on the pair, so on any day it was wrong it was wrong about time off, which is the last
       thing to be casually wrong about. The two shifts are listed above with their real hours;
       that is the information, and it needs no gloss. */
  }else if(offReq||cmeReq){
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:var(--signal)"></span>
      <span><span class="t">Off — you asked for it</span><span class="s">${cmeReq?'CME':'Requested day off'} · granted</span></span></div>`;
  }else{
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:var(--line2)"></span>
      <span><span class="t">Not scheduled</span><span class="s">No shift this day</span></span></div>`;
  }
  (a&&a.r||[]).forEach(r=>{const rm=DATA.roles[r]||{label:r,color:'#F0ABFC'};
    b+=`<div class="row" style="margin-top:8px"><span class="sp" style="background:${rm.color}"></span>
      <span><span class="t">◆ ${esc(rm.label)}</span><span class="s">Layered role — on top of your shift</span></span></div>`;});
  if(onReq)b+=`<div class="note"><span class="pill ok">You asked to work</span> This was one of your request-on days.</div>`;
  /* NOT FOR A DAY THAT HAS ALREADY HAPPENED. This offered cover on any day carrying a shift, with
     no date test at all — so a July night, seven weeks gone, came with a button to find somebody
     to work it. Nobody had seen it because the archive was showing the SOLVED plan, in which the
     test persona had nothing on that date; putting the as-worked record in front of it exposed a
     gap that was there all along.
     The quarter is not the question — the date is. Q3 runs to 30 September, so most of it is
     still ahead of us and cover on those days is real. */
  const past = iso < todayISO();
  /* THE SHIFT ITSELF SAYS SO. This is where the second request came from: you ask for cover,
     come back to the day, and the button reads exactly as it did before you asked. */
  const pend = (a&&a.s.length&&!past) ? pendingCover(iso,(a.s||[])[0]) : null;
  if(pend)
    b+=`<div class="btnrow"><button class="btn" id="dsPend">${esc(pendingCoverLabel(pend))}</button></div>
        <div class="muted sm">${pend.status==='claimed'
          ? 'Waiting on an admin to confirm it.'
          : 'Nobody has accepted yet. Tap to see who was asked, or to withdraw it.'}</div>`;
  else if(a&&a.s.length&&!past)
    b+=`<div class="btnrow"><button class="btn" id="dsSwap">Find cover for this shift</button></div>`;
  else if(a&&a.s.length&&past)
    b+=`<div class="note" style="margin-top:9px">This day has passed — it is here as a record.</div>`;
  sheet(fmtLong(iso),b);
  const sw=$('#dsSwap');
  // Used to close this sheet and jump to the Swaps tab — a different page, arrived at with no
  // explanation, which for an admin also lit up the admin view. Asking someone to cover a shift
  // is one decision; it belongs in one sheet, on the shift you were already looking at.
  // One cover flow, entered with this shift already chosen. There used to be a SECOND
  // implementation behind this button — its own sheet, its own candidate list, its own copy of
  // the rules text — and it silently broke the moment the preview endpoint changed shape,
  // because nothing else used it. Two ways to do one thing is how that happens.
  if(sw)sw.onclick=()=>openCoverAsk(iso,(a.s||[])[0]);
  const pb=$('#dsPend');
  if(pb)pb.onclick=()=>openOffer(pend.id);   // the request itself, where withdrawing lives
}

let _sheetReturnFocus=null;
/* A SHEET CAN HAVE A BACK, NOT ONLY A CLOSE.
   Some of these are two steps deep — the trade overlay opens a day, the day opens an offer — and
   the ✕ dropped you all the way out to the Swaps page, losing the calendar you were reading
   (client, 2026-09-04). onSheetClose cannot do this: closeSheet runs the hook and THEN removes
   .on, so a hook that reopens the sheet has it torn down again in the next statement.
   `back` is a step, not a cleanup. Every route out honours it — ✕, Cancel, Escape and the
   scrim — because a dismissal that behaves differently depending on how you dismissed it is the
   kind of thing people learn to distrust. */
let _sheetBack=null;
function dismissSheet(){
  if(_sheetBack){ const f=_sheetBack; _sheetBack=null; f(); return; }
  closeSheet();
}
function sheet(title,body,back){
  _sheetBack=(typeof back==='function')?back:null;
  _sheetReturnFocus=document.activeElement;
  $('#sheetHd').innerHTML=`<div><div class="eyebrow">${esc(DATA.blockLabel)}</div>
    <div style="font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:3px">${esc(title)}</div></div>
    <button class="x" id="shX" aria-label="Close">✕</button>`;
  $('#sheetBd').innerHTML=body;
  $('#sheet').classList.add('on');$('#scrim').classList.add('on');
  _sheetOpenedAt=Date.now();
  if(typeof replayGate==='function')replayGate();     // a sheet may be showing a secret
  $('#shX').innerHTML=_sheetBack?'‹':'✕';
  $('#shX').setAttribute('aria-label',_sheetBack?'Back':'Close');
  $('#shX').onclick=dismissSheet;
  $('#shX').focus({preventScroll:true});
}
/* A sheet can be dismissed four ways — the ✕, Cancel, Escape, and the scrim — and anything that
   has to be undone on dismissal has to be undone by all four. Cancel alone put the admin/physician
   toggle back, so leaving the code prompt by any other route left "Admin view" highlighted while
   the physician's schedule was on screen. */
let _sheetOnClose=null;
function onSheetClose(fn){ _sheetOnClose=fn; }
function closeSheet(){
  _sheetBack=null;
  const fn=_sheetOnClose; _sheetOnClose=null; if(fn)try{fn();}catch(e){}
  $('#sheet').classList.remove('on');$('#scrim').classList.remove('on');
  $$('.cell.sel').forEach(c=>c.classList.remove('sel'));
  /* Wait out the close animation before recording again. .on comes off immediately but the
     sheet slides away over .22s, and the secret is legible for every frame of it. 450ms costs a
     few seconds of recording; not waiting costs the tail of a TOTP secret. */
  if(typeof replayGate==='function')setTimeout(replayGate,450);
  if(_sheetReturnFocus&&_sheetReturnFocus.focus){_sheetReturnFocus.focus({preventScroll:true});_sheetReturnFocus=null;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))dismissSheet();});
/* THE SCRIM APPEARS UNDER THE FINGER THAT OPENED THE SHEET. Reported after withdrawing a request
   and pressing Request coverage straight afterwards: the sheet opened and then slid back down on
   its own. That is what a tap-through looks like -- the scrim is full-screen with a close
   handler, it is laid over the exact spot being touched, and on a touchscreen the tail of that
   same gesture can land on it. It could not be reproduced in a desktop browser, where a
   synthetic click does not linger; the guard is cheap and costs a real dismissal nothing, since
   nobody opens a sheet and deliberately dismisses it inside a third of a second. */
let _sheetOpenedAt=0;
$('#scrim').onclick=()=>{ if(Date.now()-_sheetOpenedAt<350)return; dismissSheet(); };


/* ---------- live schedule changes (admin edits, applied on top of the build) ----------
   The page bakes the schedule in at build time. Manual changes therefore have to be layered
   on at read time, or a call-out fixed this morning would not reach anyone until the next
   full rebuild and redeploy. EDITS holds the override records; MYCHANGES is the subset that
   touches the signed-in physician. */
let EDITS=[], MYCHANGES=[];
function applyEdits(edits){
  EDITS=edits||[]; MYCHANGES=[];
  if(!ME)return;
  /* AN EDIT LANDS IN THE QUARTER ITS DATE BELONGS TO. Edits can now be made on Q3 dates, and
     writing them all into the Q4 map would have invented a Q4 day that does not exist while
     leaving the real Q3 day untouched — the change would appear on no screen at all. */
  const arch=(DATA.archive||{}).day;
  const inArchive=(iso)=>!!(arch&&(DATA.archive.dates||[]).includes(iso));
  EDITS.forEach(o=>{
    const was=(o.from||[]).includes(ME), now=(o.to||[]).includes(ME);
    if(was===now)return;                          // this edit does not involve me
    const map=inArchive(o.date)?(arch[ME]||(arch[ME]={})):(DATA.day[ME]||(DATA.day[ME]={}));
    const a=map[o.date]||(map[o.date]={s:[],r:[]});
    /* A ROLE IS NOT A SHIFT, and this never asked. Partner On Call, ECMO Noc Backup and the two
       team captaincies are worn ON TOP of a clinical assignment; they are stored under `layered`
       and belong in `r`. Pushed into `s` they became grey unnamed assignments, and a day already
       carrying a day shift and a night gained a third — which is exactly the "more than one
       assignment per day" Aaron reported on 2 September. The server's _rules.js has always read
       this flag; the browser applies the same records and did not. */
    const slot=o.layered?'r':'s';
    a[slot]=(a[slot]||[]).filter(x=>x!==o.unit);
    if(now)a[slot].push(o.unit);
    MYCHANGES.push({date:o.date,unit:o.unit,added:now,at:o.at,by:o.by,note:o.note});
  });
  MYCHANGES.sort((x,y)=>x.date.localeCompare(y.date));
}
/* ACKNOWLEDGED, NOT DISMISSED FOREVER.
   This sat at the top of the schedule permanently. A notice that never goes away stops being
   read within a day, which is the opposite of what a schedule change needs — and there was no
   way to say "yes, I saw that", so it kept claiming the schedule had just changed weeks later.

   Dismissal is keyed to WHICH changes, not to the banner: acknowledging today's change cannot
   hide tomorrow's. The key is the changes themselves, so a new one — or the same shift changed
   again — brings it straight back. Per person too, since an admin steps through several. */
function changeKey(){
  return (ME||'')+'|'+MYCHANGES.map(c=>c.date+':'+c.unit+':'+(c.added?'+':'-')+(c.at||'')).join(',');
}
function changesSeen(){
  try{ return localStorage.getItem('ccpsa_chgseen')===changeKey(); }catch(e){ return false; }
}
function changeBanner(){
  if(!MYCHANGES.length||changesSeen())return '';
  const rows=MYCHANGES.map(c=>{
    const m=META(c.unit)||{label:c.unit};
    return '<li>'+(c.added?'<b>Added</b> ':'<b>Removed</b> ')+(m.label||c.unit)+
           ' on '+fmtD(c.date)+(c.note?' — '+esc(c.note):'')+'</li>';
  }).join('');
  return '<div class="swcard chg" id="chgCard"><div class="chgh">Your schedule changed</div>'+
         '<ul class="chgl">'+rows+'</ul>'+
         '<div class="muted sm">Changed by the scheduling lead. Questions go to '+
         esc((CFG&&CFG.lateContact)||'your scheduling lead')+'.</div>'+
         '<div class="btnrow"><button class="btn" id="chgOk">OK, got it</button></div></div>';
}
function wireChangeBanner(){
  const b=document.querySelector('#chgOk'); if(!b)return;
  b.onclick=()=>{
    try{localStorage.setItem('ccpsa_chgseen',changeKey());}catch(e){}
    const c=document.querySelector('#chgCard'); if(c)c.remove();
  };
}


function toast(msg){
  let t=$('#toast');
  if(!t){t=el('div','toastbox');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600);
}
/* ---------- admin: change the schedule ----------
   Phone-first on purpose: a call-out gets fixed from wherever the scheduling lead is, not from
   a desk. The rule verdict is ADVISORY — it is shown before saving, and a change that breaks
   something needs one extra deliberate tap rather than being blocked. */
let EDDAY=null, EDDATE=null;
function renderEdit(){

async function loadEditDay(iso){
  if(!iso)return;
  EDDATE=iso; $('#edBody').innerHTML='<div class="muted">Loading…</div>';
  try{ EDDAY=await api('/schedule?date='+encodeURIComponent(iso)); }
  catch(e){ $('#edBody').innerHTML='<div class="errbox">'+esc(e.message)+'</div>'; return; }
  drawEditDay();
}
function drawEditDay(){
  if(!EDDAY)return;
  const units=EDDAY.units||{}, keys=Object.keys(units).sort((a,b)=>
    (META(a).label||a).localeCompare(META(b).label||b));
  const changedHere=new Set((EDDAY.overrides||[]).map(o=>o.unit));
  const rows=keys.map(u=>{
    const m=META(u), who=units[u]||[];
    return `<button class="edrow" data-u="${esc(u)}">
      <span class="dotU" style="background:${m.color}"></span>
      <span class="edu">${esc(m.label||u)}${changedHere.has(u)?' <span class="tagc">changed</span>':''}</span>
      <span class="edw">${who.length?esc(who.join(', ')):'<i>nobody</i>'}</span>
      <span class="chev">›</span></button>`;
  }).join('');
  $('#edBody').innerHTML=`<h3 class="sec" style="font-size:15px">${esc(fmtLong(EDDATE))}</h3>
    <div class="edlist">${rows||'<div class="empty">Nothing scheduled that day.</div>'}</div>`;
  $$('#edBody .edrow').forEach(b=>b.onclick=()=>openCell(b.dataset.u));
}
function openCell(unit){
  const who=(EDDAY.units||{})[unit]||[];
  const cands=((EDDAY.candidates||{})[unit]||[]).filter(p=>!who.includes(p));
  const m=META(unit);
  const chips=cands.map(p=>`<button class="pill cpick" data-p="${esc(p)}">${esc(p)}</button>`).join('');
  const cur=who.map(p=>`<button class="pill cpick on" data-r="${esc(p)}">${esc(p)} ✕</button>`).join('');
  sheet(`${m.label||unit} · ${fmtD(EDDATE)}`,
    `<div class="lbl">On now — tap to remove</div>
    <div class="chips">${cur||'<i class="muted">nobody</i>'}</div>
    <div class="lbl" style="margin-top:12px">Available and legal for this shift</div>
    <div class="chips">${chips||'<i class="muted">nobody is free and credentialed</i>'}</div>
    <label class="lbl" for="edNote" style="margin-top:12px">Why (shown to the provider)</label>
    <input id="edNote" class="inp" placeholder="e.g. called out sick">
    <div id="edVerdict"></div>
    <div class="btnrow"><button class="btn" id="edCancel">Cancel</button>
      <button class="btn pri" id="edSave" disabled>Save change</button></div>`);
  let next=who.slice();
  const paint=()=>{
    $('#edSave').disabled = (next.length===who.length && next.every((p,i)=>p===who[i]));
    $$('#sheet .cpick').forEach(c=>{

async function saveCell(unit,to,force){

/* ---------- never let a page be shorter than the screen ----------
   The bar is position:fixed;bottom:0 again, which is where it belongs: iOS puts that on the
   bottom of the glass, and it was right on Now, Schedule and Requests from the beginning. Swaps
   was the only tab that broke, and it is the only tab whose content does not fill a phone --
   when the document is shorter than the viewport, bottom:0 gets resolved against the DOCUMENT
   and the bar rides up with it.

   So the document is padded instead. Nothing else moves.

   Padding it to 100% was tried and failed, for a reason worth recording: on the phone showing
   this, every height JS can read -- innerHeight, clientHeight, visualViewport, 100dvh -- reports
   the viewport WITHOUT the home-indicator strip, about 34px short. A page padded to 100% is
   still shorter than the glass, so bottom:0 still had somewhere to ride up to.

   fixedBottom() is the honest number: a 1px element pinned at bottom:0, read back with
   getBoundingClientRect. Whatever the engine believes the bottom of the viewport is, that probe
   is sitting on it, in the same coordinate space the bar is laid out in. Pad past that and the
   short-document case cannot arise on any of the four tabs. */
let PROBE = null;
function fixedBottom(){
  if (!PROBE){
    PROBE = document.createElement('div');
    PROBE.setAttribute('aria-hidden','true');
    PROBE.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;'
                        + 'visibility:hidden;pointer-events:none';
    document.body.appendChild(PROBE);
  }
  return PROBE.getBoundingClientRect().bottom || 0;
}
let SPACER = null;
function padShort(){
  if (!SPACER){
    SPACER = document.createElement('div');
    SPACER.id = 'pad';
    SPACER.setAttribute('aria-hidden','true');
    SPACER.style.cssText = 'width:1px;pointer-events:none';
    document.body.appendChild(SPACER);
  }
  SPACER.style.height = '0px';                 // measure the page without our own padding first
  // One past the bottom, so the document is strictly taller than the viewport rather than equal
  // to it -- equal is the boundary case and not worth trusting.
  const want = Math.ceil(Math.max(fixedBottom(), window.innerHeight || 0,
                                  document.documentElement.clientHeight || 0)) + 1;
  /* HOW TALL IS THE PAGE, REALLY? Neither obvious answer survives contact:
       scrollHeight  is clamped to at least the viewport on both html and body, so a half-screen
                     page reports a full screen and the short case is invisible to it;
       body's box    reported 852 on a Swaps tab whose content ended at 585, so it is not
                     content-driven here either.
     The in-flow children are, so they are measured directly -- the lowest bottom edge of
     anything actually laid out in the document, in page coordinates, plus whatever padding the
     body adds under it. */
  let have = 0;
  for (const el of document.body.children){
    if (el === SPACER || el === PROBE) continue;
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.position === 'fixed' || cs.position === 'absolute') continue;
    have = Math.max(have, el.getBoundingClientRect().bottom + window.scrollY);
  }
  have = Math.round(have + parseFloat(getComputedStyle(document.body).paddingBottom || 0));
  if (have < want) SPACER.style.height = (want - have) + 'px';
  diagPaint();
}
function fitWire(){

function storedTheme(){ try{return localStorage.getItem('ccpsa_theme')||'';}catch(e){return '';} }
function systemTheme(){ return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }

function setTheme(t){
  try{localStorage.setItem('ccpsa_theme',t);}catch(e){}
  document.documentElement.setAttribute('data-theme',t);

  if(m)m.setAttribute('content',t==='light'?'#F4F7FA':'#0E1621');

}
function paintThemeBtn(){
  const b=document.querySelector('#themeBtn'); if(!b)return;

// Applied before anything renders, or the app flashes the wrong theme on every open. This is
// also what makes ONE light palette enough: the system preference is turned into the same
// data-theme attribute an explicit choice sets, so the stylesheet needs no media-query copy of
// the values to drift out of step with.
(function(){
  const apply=()=>{
    const t=currentTheme();
    document.documentElement.setAttribute('data-theme',t);
    const m=document.querySelector('meta[name=theme-color]');
    if(m)m.setAttribute('content',t==='light'?'#F4F7FA':'#0E1621');
    paintThemeBtn();
  };
  apply();

    if(!storedTheme())apply();          // still following the phone

})();

        const l=document.querySelector('#admLoad');
        if(l)l.textContent='Could not load the dashboard ('+e.message+'). Try again.';
      });
  }
}
// The portal is phone-first (.wrap is 600px), so the dashboard was being squeezed into a
// phone-width column on a laptop — which is what made its text overlap. In admin mode the pane
// breaks out of that column and the frame is sized to the real viewport.
function sizeAdminFrame(){
  const f=document.querySelector('#admFrame'); if(!f)return;
  const top=f.getBoundingClientRect().top;
  const h=Math.max(320,(window.innerHeight||600)-top);
  f.style.height=h+'px';
}

/* ---------- the approvals desk ----------
   Three queues used to live in three places, all of them inside SOME PHYSICIAN'S page: cover
   approvals in the offer sheet, swap sign-off at the bottom of the Swaps tab, and holiday
   decisions nowhere at all — /api/requests has taken a PATCH since 8/17 and nothing ever sent
   one. An admin who is not a physician has no page to find any of it on. This is that page.

   It is deliberately NOT behind the 6-digit step-up. Every decision here is one the Swaps tab
   already offers on a session alone; the code guards the admin DASHBOARD, where the schedule
   itself can be rewritten. Asking for one to see a list of the same two buttons would be
   theatre — and it would fire on every boot for the admins who land here. */
async function loadAdminQueue(){
  if(ROLE!=='admin'||!SESSION){ADMINQ={cover:[],swaps:[],hol:[],longrun:[]};return;}
  const [cov,sw,rq]=await Promise.all([
    api('/coverage').catch(()=>({offers:[]})),
    api('/swaps').catch(()=>({swaps:[]})),
    api('/requests?all=1').catch(()=>({all:{}})),
  ]);
  // Claimed, not open: an offer nobody has accepted is not waiting on an admin.
  ADMINQ.cover=(cov.offers||[]).filter(o=>o.status==='claimed');
  // 'blocked' is waiting on the two physicians, not on us — it never reached a partner.
  ADMINQ.swaps=(sw.swaps||[]).filter(s=>s.status==='awaiting_admin');
  ADMINQ.hol=Object.values(rq.all||{})
    .filter(r=>r&&r.holiday&&!['approved','declined'].includes(r.holidayStatus||''))
    .sort((a,b)=>String(a.person).localeCompare(String(b.person)));
  /* MORE THAN 14 DAYS OFF IN A ROW (Sam, item 11). The server used to refuse the submission
     outright, so nobody who needed three weeks could say so through the app at all. It is
     accepted now and waits here instead — the same shape as a priority holiday. */
  /* longestOff IS COMPUTED ON SAVE, so a record submitted before that field existed does not
     carry it — and this filter would skip it forever. A fifteen-day request from August would
     never reach the desk, and "nothing happened" is exactly what it would look like. Fall back to
     measuring the run here. */
  ADMINQ.longrun=Object.values(rq.all||{})
    .map(r=>(r&&r.longestOff==null&&(r.off||[]).length)
      ?{...r,longestOff:longestRun(r.off)}:r)
    .filter(r=>r&&r.longestOff>14&&!['approved','declined'].includes(r.longRunStatus||''))
    .sort((a,b)=>String(a.person).localeCompare(String(b.person)));
}
function adminQCount(){ return ADMINQ.cover.length+ADMINQ.swaps.length+ADMINQ.hol.length
                             +(ADMINQ.longrun||[]).length; }

         <div class="zs">Cover approvals, swap sign-offs, holiday and time-off decisions land here.</div></div>`}
    <div class="hlinks">
      <button class="btn" id="hDash">Open the dashboard</button>

  // A decision is one round trip, then the whole queue is re-read: approving a cover can settle
  // a swap on the same shift, and a stale card is an invitation to decide something twice.
  const after=async(msg)=>{ toast(msg); await loadAdminQueue(); renderAdminHome();
    /* eslint-disable-line */
                            adminBar(); await refreshLive(true).catch(()=>{}); };
  const wire=(sel,run)=>$$(sel,w).forEach(b=>b.onclick=async()=>{

                    :(e.message||'Could not save'));
              /* A REFUSAL USUALLY MEANS THIS CARD IS OUT OF DATE. The commonest is a coverage
                 request the asker withdrew while the desk was open: the server refuses it, and
                 without this the card stayed, re-armed, inviting the same dead press again.
                 Re-reading turns a confusing refusal into the card simply going away. */
              await loadAdminQueue().catch(()=>{}); renderAdminHome(); adminBar(); }
  });
  wire('[data-qc]',async b=>{
    const act=b.dataset.act; track('decision',{kind:'cover',action:act,from:'desk'});
    await api('/coverage',{method:'PATCH',body:JSON.stringify({id:b.dataset.qc,action:act})});

  wire('[data-qs]',async b=>{
    const act=b.dataset.act; track('decision',{kind:'swap',action:act,from:'desk'});
    await api('/swaps',{method:'PATCH',body:JSON.stringify({id:b.dataset.qs,
      action:act==='reject'?'reject':'approve', override:act==='override'})});
    await after(act==='reject'?'Rejected':'Approved — the schedule is updated');
  });
  wire('[data-qh]',async b=>{
    track('decision',{kind:'holiday',action:b.dataset.act,from:'desk'});
    await api('/requests',{method:'PATCH',
      body:JSON.stringify({person:b.dataset.qh,decision:b.dataset.act,what:'holiday'})});
    await after(b.dataset.act==='approved'?'Holiday approved':'Holiday declined');
  });
  wire('[data-qlr]',async b=>{
    track('decision',{kind:'longrun',action:b.dataset.act,from:'desk'});
    await api('/requests',{method:'PATCH',
      body:JSON.stringify({person:b.dataset.qlr,decision:b.dataset.act,what:'longRun'})});
    // Either answer leaves the days on file. Declining records that it was refused; it does not
    // quietly delete somebody's leave.
    await after(b.dataset.act==='approved'?'Time off approved':'Recorded as declined');

  $('#hDash').onclick=()=>{ showAdminView(); markBar('admin'); };

  $('#hRef').onclick=async()=>{ await loadAdminQueue(); renderAdminHome(); adminBar(); };
}

/* ---------- reports (client item 22) ----------
   "report creation is important, most are just selecting people, selecting time period (usually
    the quarter) and selecting the shifts and seeing a table of the counts of each shift and
    total."

   Exactly that and nothing more: people × period × assignments -> a count per assignment and a
   total, with a CSV out. It reads both quarters through anyDayOf, so a report spanning the block
   boundary is one report rather than two that have to be added up by hand.

   Requested-off days are excluded from the count by construction: the schedule is the source, and
   a day somebody has off carries no assignment for them. That is also item 22c — "when a sleep
   doctor or APP requests off, the shift should be removed from that view" — for this view. */
/* THE PERIOD IS EITHER SOME QUARTERS OR A RANGE (Sam, 2026-09-03: "the period selector should be
   able to select a date range or press Q3 or Q4 or be able to select both").
   Q3/Q4/Both as three buttons could not express "Q4 and next January", and made "both" a third
   thing to learn rather than the obvious consequence of pressing two. They are toggles now: press
   what you want, press it again to drop it, and the dates follow. Typing dates clears the
   quarters, because a range that no longer matches the highlighted quarter is a lie. */
let RPT={people:new Set(), from:null, to:null, units:null, qs:new Set()};
function rptQuarters(){
  const out=[];
  const a=(DATA.archive||{});
  if(a.dates&&a.dates.length)out.push({id:'archive',label:a.label||'Q3',from:a.dates[0],to:a.dates[a.dates.length-1]});
  if((DATA.dates||[]).length)out.push({id:'live',label:DATA.blockLabel||'Q4',from:DATA.dates[0],to:DATA.dates[DATA.dates.length-1]});
  return out;
}
// The window the chosen quarters span. Contiguous or not, a report is one from/to — so two
// quarters with a gap between them reports the gap too, and says so on the table.
function rptApplyQuarters(){
  const picked=rptQuarters().filter(q=>RPT.qs.has(q.id));
  if(!picked.length)return;
  RPT.from=picked.map(q=>q.from).sort()[0];
  RPT.to=picked.map(q=>q.to).sort().pop();
}
function showReport(){
  // Admin only (Sam, 2026-09-03). Guarded here as well as at the button, so a stale page or a
  // console cannot open it.
  if(ROLE!=='admin'){ toast('Reports are for admins'); return; }
  const sp=spanDates();
  RPT.from=RPT.from||sp[0]; RPT.to=RPT.to||sp[1];
  const roster=whoRoster();
  const draw=()=>{
    const chosen=roster.filter(p=>RPT.people.has(p));
    sheet('Build a report',`
      ${pickerHTML('rpPick',roster,RPT.people)}
      <h2 class="sec">Period</h2>
      <div class="onfilter">
        ${rptQuarters().map(q=>`<button class="onfb${RPT.qs.has(q.id)?' on':''}"
          data-rq="${q.id}">${esc(q.label)}</button>`).join('')}
        <button class="onfb${RPT.qs.size?'':' on'}" data-rq="range">Date range</button>
      </div>
      <div class="addrow rprange">
        <label class="addlbl" for="rpFrom">From</label>
        <input type="date" id="rpFrom" value="${RPT.from}" min="${sp[0]}" max="${sp[1]}">
        <label class="addlbl" for="rpTo">To</label>
        <input type="date" id="rpTo" value="${RPT.to}" min="${sp[0]}" max="${sp[1]}">
      </div>
      <h2 class="sec">Assignments</h2>
      <div class="onfilter">
        <button class="onfb${RPT.units?'':' on'}" data-ru="all">All</button>
        ${teamFilters().map(([id,label])=>`<button class="onfb" data-ru="${id}">${esc(label)}</button>`).join('')}
      </div>
      <div id="rpOut">${chosen.length?reportTable(chosen):'<div class="empty">Choose one or more providers.</div>'}</div>
      ${chosen.length?'<div class="btnrow"><button class="btn" id="rpCsv">Download CSV</button></div>':''}`);
    wirePicker('rpPick',roster,RPT.people,draw);
    $$('[data-rq]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.rq;
      if(id==='range'){ RPT.qs.clear(); }
      else { RPT.qs.has(id)?RPT.qs.delete(id):RPT.qs.add(id); rptApplyQuarters(); }
      draw();});
    // Typing a date is choosing a range, so the quarter chips let go rather than sitting lit
    // beside a window they no longer describe.
    $('#rpFrom').onchange=e=>{RPT.from=e.target.value;RPT.qs.clear();draw();};
    $('#rpTo').onchange=e=>{RPT.to=e.target.value;RPT.qs.clear();draw();};
    $$('[data-ru]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.ru;
      if(id==='all')RPT.units=null;
      else{const f=teamFilterSet(id);RPT.units=f?f.set:null;}
      draw();});
    const csv=$('#rpCsv');
    if(csv)csv.onclick=()=>downloadReportCSV(chosen);
  };
  draw();
}
// person -> unit -> count, over the chosen window, both quarters.
function reportCounts(people){
  const out={}, units=new Set();
  people.forEach(p=>{
    const row={};
    for(let iso=RPT.from; iso<=RPT.to; iso=isoAdd(iso,1)){
      if(!knownDate(iso))continue;
      const a=anyDayOf(p,iso); if(!a)continue;
      (a.s||[]).forEach(s=>{
        if(!isRealShift(p,iso,s))return;
        if(RPT.units&&!RPT.units.has(s))return;
        row[s]=(row[s]||0)+1; units.add(s);
      });
    }
    out[p]=row;
  });
  return {out, units:[...units].sort((a,b)=>(META(a).label||a).localeCompare(META(b).label||b))};
}
function reportTable(people){
  const {out,units}=reportCounts(people);
  if(!units.length)return '<div class="empty">Nothing scheduled in that window for those people.</div>';
  const head=units.map(u=>`<th class="gh">${esc(META(u).short||u)}</th>`).join('');
  const rows=people.map(p=>{
    const r=out[p]||{}, tot=units.reduce((n,u)=>n+(r[u]||0),0);
    return `<tr><th class="gn">${esc(fullOf(p)||p)}</th>${
      units.map(u=>`<td class="gc">${r[u]||''}</td>`).join('')}<td class="gc"><b>${tot}</b></td></tr>`;
  }).join('');
  const foot=units.map(u=>`<td class="gc"><b>${people.reduce((n,p)=>n+((out[p]||{})[u]||0),0)}</b></td>`).join('');
  const grand=people.reduce((n,p)=>n+units.reduce((m,u)=>m+((out[p]||{})[u]||0),0),0);
  const qn=rptQuarters().filter(q=>RPT.qs.has(q.id)).map(q=>q.label);
  return `<div class="note" style="margin-top:0">${qn.length?esc(qn.join(' + '))+' · ':''}${
      esc(fmtD(RPT.from))} – ${esc(fmtD(RPT.to))}${
      qn.length===2?' <b>(includes the gap between them)</b>':''}</div>
    <div class="gwrap"><table class="gtab"><thead><tr><th class="gn"></th>${head}<th class="gh">Total</th></tr></thead>
    <tbody>${rows}<tr><th class="gn">All</th>${foot}<td class="gc"><b>${grand}</b></td></tr></tbody></table></div>`;
}
function downloadReportCSV(people){
  const {out,units}=reportCounts(people);
  const q=(v)=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  const lines=[['Provider',...units.map(u=>META(u).label||u),'Total'].map(q).join(',')];
  people.forEach(p=>{
    const r=out[p]||{}, tot=units.reduce((n,u)=>n+(r[u]||0),0);
    lines.push([fullOf(p)||p,...units.map(u=>r[u]||0),tot].map(q).join(','));
  });
  const blob=new Blob([lines.join('\n')+'\n'],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`ccpsa-report-${RPT.from}-to-${RPT.to}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- the swap log (client item 20) ----------
   "We should have a swap log tab that shows all swaps that were accepted (this can be on admin
    view)."

   Every way a shift changes hands, in one list, because from the desk they are the same event
   even though the app models them separately:
     swaps    two physicians agreeing between themselves, then signed off
     coverage somebody asks, somebody claims it, an admin approves
   Both are read from the endpoints the admin queue already loads, so this costs no new API.
   Newest first, and it says who decided each one — an audit answers "who let that happen", which
   is the question this exists for. */
async function showSwapLog(){
  sheet('Swap log','<div class="cvload">Reading…</div>');
  let rows=[];
  try{
    const [sw,cov]=await Promise.all([
      api('/swaps').catch(()=>({swaps:[]})),
      api('/coverage').catch(()=>({offers:[]})),
    ]);
    (sw.swaps||[]).filter(s=>s.status==='approved').forEach(s=>rows.push({
      at:(s.history||[]).slice(-1)[0]?.at||'', kind:s.kind==='trade'?'Trade':'Swap',
      date:s.date, shift:s.shift,
      what:`${fullOf(s.toPerson)||s.toPerson} took it from ${fullOf(s.fromPerson)||s.fromPerson}`
           +(s.backShift?` · back: ${META(s.backShift).label||s.backShift} on ${fmtD(s.backDate)}`:''),
      by:s.decidedBy, flag:s.overridden?'approved over a rule break':'' }));
    (cov.offers||[]).filter(o=>o.status==='approved').forEach(o=>rows.push({
      at:o.approvedAt||o.claimedAt||'', kind:'Cover',
      date:o.date, shift:o.shift,
      what:`${fullOf(o.claimedBy)||o.claimedBy} covered for ${fullOf(o.fromPerson)||o.fromPerson}`,
      by:o.approvedBy, flag:(o.claimProblems&&o.claimProblems.length)?'approved over a rule break':'' }));
  }catch(e){
    $('#sheetBd').innerHTML='<div class="errbox">Could not read the log. '+esc(e.message||'')+'</div>';
    return;
  }
  rows.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  if(!rows.length){
    $('#sheetBd').innerHTML='<div class="empty">Nothing has changed hands yet.</div>';

/* ---------- managing access ----------
   Who can get in, and the three things that can be done about it. Written as one screen because
   the question is always comparative — "is she locked out or has she never set up" is answered by
   seeing the row next to everyone else's, not by looking up one person.

   Nothing here deletes. Retiring appends a disabled version of the record, so it is reversible and
   the history survives; the API refuses Aaron Nadon outright and will not act on anything but one
   exact name. The confirmation below is deliberately awkward — password plus the name typed back —
   because the failure that matters is not malice, it is a tired person tapping the wrong row. */
function acctChips(a){
  const c=[];
  if(a.disabled)      c.push('<span class="achip bad">Closed</span>');
  else if(!a.enrolled)c.push('<span class="achip warn">Not set up</span>');
  if(a.lockedFor)     c.push(`<span class="achip bad">Locked ${a.lockedFor>90
                                ?Math.ceil(a.lockedFor/60)+'m':a.lockedFor+'s'}</span>`);
  else if(a.failedAttempts>=3) c.push(`<span class="achip warn">${a.failedAttempts} failed</span>`);
  if(a.enrolled&&!a.disabled){
    if(a.twoFactor) c.push('<span class="achip">2FA</span>');
    if(a.passkeys)  c.push(`<span class="achip">Face ID${a.passkeys>1?' ×'+a.passkeys:''}</span>`);
  }
  if(a.protectedAccount) c.push('<span class="achip">Protected</span>');
  return c.join('');
}

function confirmAcct(action,person){

    reenrol:{t:'Reset sign-in',

                account up again from their access code, which keeps working. Use this when

    }catch(e){ say(e.message||'Could not save'); $('#caGo').disabled=false; }

}

// who they are looking at, so what is on screen is always that person's own data.
let LOADED_FOR=null;
/* ONE LOAD PER PERSON, NOT ONE PER CALLER.
   bootApi awaits loadPersonData; boot() then fires it again because LOADED_FOR is not set until
   the first one FINISHES, so every sign-in fetched /requests twice — confirmed on the deployed
   copy, eight loads out of eight, two calls each.
   Wasteful is the least of it. The two run concurrently and each ends by assigning MYREQ, so
   whichever resolves LAST wins regardless of which is newer or which succeeded. A slow duplicate
   that fails sets MYREQ=null over a record the first call had already fetched, and the Requests
   tab says "Couldn't load your requests" about data that is sitting in the page. That is the
   family of fault Sam reported on 2 September as "people complained about the requests not
   saving": the form refuses to draw over null, deliberately, so the data looks lost.
   In-flight calls for the same person are shared, and a result that is no longer the newest is
   dropped rather than written. */
let _loadInflight=null, _loadFor=null, _loadSeq=0;
async function loadPersonData(){
  if(!SESSION)return;
  if(_loadInflight&&_loadFor===ME)return _loadInflight;
  const seq=++_loadSeq;
  _loadFor=ME;
  _loadInflight=_loadPersonDataOnce(seq);
  try{ return await _loadInflight; }
  finally{ if(_loadSeq===seq){ _loadInflight=null; _loadFor=null; } }
}
async function _loadPersonDataOnce(seq){
  // Superseded while waiting? Say nothing and write nothing. `stale` is checked before every
  // assignment below, not only at the end: the point is that a loser must never write.
  const stale=()=>_loadSeq!==seq;
  /* THE COUNT ON THE TAB WAS LAST IN A QUEUE OF FOUR. This ran /requests, then /portal, then
     swaps, then coverage — each awaiting the one before, though none of them needs anything from
     the others — and only then painted the badge. Somebody with a request waiting sat looking at
     a bare tab for the length of all four round trips.
     Swaps and coverage start first and run alongside the rest now, and each paints the badge as
     it lands, so the count appears after ONE round trip rather than four. */
  /* AND /requests AND /portal JOIN THEM (Sam, 2026-09-04: "requests are taking a long time to
     load ... and to send").
     The badge was fixed; the LOADS were still a queue. /requests was awaited, and only when it
     came back did /portal go out — though /portal is the calendar link and knows nothing about
     requests. Four calls, two of them strictly one after the other, against an API measured
     today between 0.9s and 12.6s a call. All four leave together now and are collected in the
     order the page needs them, so the wait is the SLOWEST call rather than the SUM. */
  const swapsP=loadSwaps(), coverP=loadCoverage();
  const viewing=onBehalf()?('?person='+encodeURIComponent(ME)):'';
  const reqP=api('/requests'+viewing);
  const portalP=api('/portal'+viewing);
  // Nothing awaits a rejection later than it happens, or the browser logs an unhandled one
  // before the code that handles it is reached.
  reqP.catch(()=>{}); portalP.catch(()=>{});
  /* A FAILED FETCH IS NOT AN EMPTY SET. This was `catch(e){MYREQ={}}`, so a dropped request made
     the Requests tab say you had asked for nothing — and Save writes the whole record, so the
     next press would have made that true. No production record has been seen losing days this
     way (56 backups checked), which makes it an open hazard rather than damage done; the shape is
     wrong either way. null means UNKNOWN: renderReq refuses to draw a form over it, and the
     server refuses a write that has not seen the current version. */
  try{const r=await reqP;
      if(stale())return;
      MYREQ=r.requests||{};REQERR=null;
      CFG={...(CFG||{}),deadline:r.deadline,locked:r.locked,allowance:r.allowance};}
  catch(e){ if(stale())return;
            MYREQ=null;REQERR=(e&&e.message)||'could not be loaded';}
  // The calendar link belongs to the person on screen, not to the account that signed in — and
  // it is stamped with WHOSE it is, because the fetch is slower than the switch. Drop the old
  // one first: for that moment the honest answer is "getting it", not the last person's link.
  const forWho=ME;
  if(stale())return;
  CFG={...(CFG||{}),icsUrl:null,icsFor:null};
  if(CUR==='sched')renderSched();
  try{ const pr=await portalP;
       if(ME!==forWho||stale())return;   // switched again, or superseded, while in flight
       CFG={...(CFG||{}),icsUrl:pr.icsUrl||null,icsFor:forWho}; }catch(e){}
  await Promise.all([swapsP,coverP]);
  if(ME!==forWho||stale())return;   // switched physician, or superseded, while in flight
  if(onBehalf())MYSWAPS=(MYSWAPS||[]).filter(w=>w.fromPerson===ME||w.toPerson===ME);
  paintSwapDot();   // the list just changed under it — an admin switching physician sees theirs
  REQSAVED=null;                  // a confirmation from the previous person would be a lie
  LOADED_FOR=ME;
  if(CUR==='req')renderReq();
  if(CUR==='swap')renderSwap();
  if(CUR==='sched')renderSched();   // the calendar link lives here and has only just arrived
