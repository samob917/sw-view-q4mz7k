/* ADDING AND REMOVING SOMEBODY FROM A CLINIC.
   Writes the same overlay record an admin edit writes — PATCH /api/schedule with the FULL new
   holder list for that cell, not a delta, because that is the shape the store keeps and the
   shape every reader already applies. The server checks the unit again: the app draws the
   controls, the server decides, and only one of the two is authoritative. */
/* ONE RECORD, APPLIED TO EVERYBODY IT NAMES.
   applyEdits opens with `if(!ME)return` and then skips any record that does not involve the
   signed-in person — it exists to build "your schedule changed", which is a question about one
   person. The clinic desk HAS no person: ME is null for that login, so every edit they made was
   written to the store and then dropped on the floor by the very next line, and the grid went on
   showing the day as it was before they touched it (Sam, 2026-09-04: "the clinic did not say who
   was added"). Picking a provider does not help either — it would then apply only the records
   involving THAT provider.
   This is the same walk portal.js does server-side when it lays the overlay over data.day, and
   it is deliberately a separate function: MYCHANGES must stay about you, and this must not. */
function applyOneEdit(o){
  if(!o||!o.date||!o.unit)return;
  const a=DATA.archive||{};
  const map=(a.day&&(a.dates||[]).includes(o.date))?a.day:DATA.day;
  if(!map)return;
  const slot=o.layered?'r':'s';
  new Set([...(o.from||[]),...(o.to||[])]).forEach(p=>{
    const per=map[p]||(map[p]={});
    const cell=per[o.date]||(per[o.date]={s:[],r:[]});
    cell[slot]=(cell[slot]||[]).filter(x=>x!==o.unit);
    if((o.to||[]).includes(p))cell[slot].push(o.unit);
  });
}
async function clinicSet(iso,unit,people,what){
  /* THE SCREEN MOVES FIRST, AND THE NETWORK CATCHES UP.
     This waited on a PATCH and then on a full GET of every override before anything changed —
     two sequential calls to an API measured today at between 0.9s and 12.6s, so up to half a
     minute of a screen that looks like it ignored you. The second call was also a read taken
     immediately after a write, which is the one moment a store is entitled to answer with the
     old list.
     The PATCH already hands back the record it wrote, so there is nothing the re-read was for. */
  const before=clinicHolders(iso,unit);
  const guess={date:iso,unit,from:before,to:people,layered:false};
  applyOneEdit(guess);
  renderClinicView();
  toast(what);                     // names the person, and says it now rather than in ten seconds
  try{
    const r=await api('/schedule',{method:'PATCH',body:JSON.stringify({
      date:iso, unit, to:people, force:true,
      note:'clinic desk: '+what })});
    /* Re-apply the SERVER's record over the guess. Same shape in the ordinary case, so nothing
       moves; if it normalised anything — a layered unit, a name we did not send — its version
       wins and the view is corrected. Only then is a second render worth its cost, which on the
       quarter grid is 736 cells. */
    const rec=r&&r.edit;
    if(rec){
      const drifted=!!rec.layered!==!!guess.layered||
        JSON.stringify((rec.to||[]).slice().sort())!==JSON.stringify(people.slice().sort());
      applyOneEdit(rec);
      if(drifted)renderClinicView();
    }
  }catch(e){
    // Put it back. An optimistic change that fails and stays on screen is worse than a slow one.
    applyOneEdit({date:iso,unit,from:people,to:before,layered:false});
    renderClinicView();
    toast((e&&e.message)||'Could not save that — put back');
  }
}
function clinicHolders(iso,unit){
  return whoRoster().filter(p=>((anyDayOf(p,iso)||{s:[]}).s||[]).includes(unit));
}
/* One wiring for all three views. Every control carries its own date, so the scroll view — which
   is many days at once — needs no special case, and a control cannot act on the wrong day. */
/* One clinic, one day, in a sheet: who is on it, each removable, and a way to add. The same two
   operations the day view has, reached without leaving the quarter. */
function openClinicCell(iso,unit){
  const who=clinicHolders(iso,unit);
  const can=mayStaffClinics()&&knownDate(iso);
  sheet(`${META(unit).label||unit}`,
    `<div class="sub" style="margin-top:0">${esc(fmtLong(iso))}</div>
     <div class="ccpeople">${who.length?who.map(p=>`
       <div class="pkrrow"><span class="cvnm">${esc(fullOf(p)||p)}</span>${
         can?`<button class="rqx" data-ccdrop="${esc(p)}">Remove</button>`:''}</div>`).join('')
       :'<div class="muted sm" style="padding:8px 2px">Nobody on it that day.</div>'}</div>
     ${can?`<div class="btnrow"><button class="btn pri" id="ccAdd">Add somebody</button>
       <button class="btn" id="ccDone">Done</button></div>`
          :`<div class="btnrow"><button class="btn" id="ccDone">Done</button></div>`}`);
  $('#ccDone').onclick=closeSheet;
  const a=$('#ccAdd');
  if(a)a.onclick=()=>openClinicAdd(iso,unit,()=>openClinicCell(iso,unit));
  $$('[data-ccdrop]').forEach(b=>b.onclick=()=>{
    closeSheet();
    clinicSet(iso,unit,who.filter(x=>x!==b.dataset.ccdrop),
              (fullOf(b.dataset.ccdrop)||b.dataset.ccdrop)+' off '+(META(unit).label||unit));
  });
}
function wireClinicEdit(){
  $$('#cBody [data-cdrop]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.cd, u=b.dataset.cu, p=b.dataset.cdrop;
    clinicSet(d,u,clinicHolders(d,u).filter(x=>x!==p),
              (fullOf(p)||p)+' off '+(META(u).label||u));
  });
  $$('#cBody [data-cadd]').forEach(b=>b.onclick=()=>openClinicAdd(b.dataset.cd,b.dataset.cadd));
  /* A CELL IN THE QUARTER GRID OPENS THAT CLINIC ON THAT DAY (client, 2026-09-04: "on the
     quarter, they should be able to press on a day and add people to it in a popup").
     Jumping to the day view worked but lost your place in a ninety-column grid, which is the one
     thing the quarter view exists to keep. */
  $$('#cBody [data-cell]').forEach(c=>{
    const go=()=>{ const [iso,unit]=c.dataset.cell.split('|'); openClinicCell(iso,unit); };
    c.onclick=go;
    c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
  $$('#cBody [data-cday]').forEach(b=>b.onclick=()=>{
    CLINICDAY=b.dataset.cday; CLINICVIEW='day'; renderClinicView();
  });
}

/* THREE WAYS TO READ THE SAME BOARD (Sam, 2026-09-03: "a week view and a scroll view so they can
   see continuity and every day").
     day    one date, everything about it, and the rest of the ward list underneath
     week   seven days across — who is on which clinic, and where the gaps are
     scroll every day of the month in a stream, so continuity is something you scan rather than
            something you reconstruct by pressing an arrow thirty times
   Editing lives in day and scroll, where a row has room for names and controls. A week cell is a
   few characters wide; tapping one opens that day rather than pretending to be a form. */
let CLINICVIEW='day', CLINICQ=null;

/* THE WHOLE QUARTER, AND EVERY SHIFT — not one week of clinics (Sam, 2026-09-04: "we should
   have the same view for all shifts under the clinic one. and we should make it cover the whole
   quarter not just a week and call it quarter view with the option to select other quarters
   including future ones with the set template").

   A week was the wrong unit for the question this view answers. Somebody covering the desk is
   asking "who is on West through the block" and "is anybody on that Thursday" — both of which
   are a quarter-shaped question, and a week made you press an arrow thirteen times to see it.

   TWO GRIDS: the clinics, then every other unit underneath, in the bands Who's on uses. The
   second one is read-only — staffing a ward is not the clinic desk's job — but seeing it is,
   because you cannot tell whether somebody is free for a clinic without it.

   FUTURE QUARTERS COME FROM THE PATTERN. Past the solved block there is no schedule, but the
   sleep and APP cycles run forever, so a quarter in 2027 is drawn from the projection and says
   so. The other units are simply empty there — nothing is invented. */
function clinicQuarters(){
  const out=[];
  const a=(DATA.archive||{});
  if(a.dates&&a.dates.length)out.push({id:'archive',label:a.label||'Q3 2026',dates:a.dates,pattern:false});
  if((DATA.dates||[]).length)out.push({id:'live',label:DATA.blockLabel||'Q4 2026',dates:DATA.dates,pattern:false});
  // Everything the pattern reaches, grouped into quarters of its own.
  const pd=Object.keys(DATA.patterns||{}).sort();
  const byQ={};
  pd.forEach(d=>{
    const y=+d.slice(0,4), q=Math.floor((+d.slice(5,7)-1)/3)+1;
    (byQ[y+'-Q'+q]=byQ[y+'-Q'+q]||[]).push(d);
  });
  Object.keys(byQ).sort().forEach(k=>out.push(
    {id:'pat:'+k, label:'Q'+k.slice(6)+' '+k.slice(0,4)+' · pattern', dates:byQ[k], pattern:true}));
  return out;
}
function clinicQtr(){
  const qs=clinicQuarters();
  return qs.find(q=>q.id===CLINICQ)||qs.find(q=>q.id===(defaultBlock&&defaultBlock()))||qs[0];
}
/* One grid: units down the side, every day of the quarter across. Wide on purpose — it scrolls
   sideways inside its own box, the way the admin grid does. */
function clinicGrid(units,dates,pattern,tappable){
  if(!units.length)return '';
  /* A MONTH BAND OVER THE DATES (Sam, 2026-09-04: "does not have an obvious designation of month
     or date, the numbers should be bigger and it should be very clear what month and day we are
     looking at").
     Ninety-two columns of "M 14" in 9pt is a wall: you can find a column but not say what it is
     without counting. Two header rows now — the month spanning its own days, then the date, with
     the number the biggest thing in the cell and the weekday under it. A rule down the first
     column of each month gives the eye somewhere to land. */
  const months=[];
  dates.forEach(d=>{
    const mk=d.slice(0,7);
    if(!months.length||months[months.length-1].mk!==mk)months.push({mk,n:0,first:d});
    months[months.length-1].n++;
  });
  /* The label is STICKY INSIDE ITS OWN SPAN. The month heading was pinned vertically, which is
     not the axis this grid scrolls — so scrolling sideways carried "July 2026" off the left and
     left ninety columns with no month on them at all (Sam, 2026-09-04: "July 2026 is locked
     until i scroll to August").
     A sticky span inside the colspan'd cell stays put while any part of its month is on screen
     and is pushed out by the next one, which is exactly the behaviour asked for. Offset past the
     unit column, which is itself sticky at left:0. */
  const mrow=months.map(m=>`<th class="gm" colspan="${m.n}"><span class="gmlab">${
    MONL[+m.mk.slice(5)-1]} ${m.mk.slice(0,4)}</span></th>`).join('');
  const isFirst=(d)=>months.some(m=>m.first===d);
  const head=dates.map(d=>{
    const inner=`<b class="gdate">${d2(d).getDate()}</b><i class="gdow">${DOW[dowOf(d)][0]}</i>`;
    return `<th class="gh${dowOf(d)>=5?' we':''}${isFirst(d)?' mstart':''}${
      d===todayISO()?' istoday':''}">${
      tappable?`<button class="clink" data-cday="${d}" aria-label="${esc(fmtLong(d))}">${inner}</button>`
              :inner}</th>`;}).join('');
  const rows=units.map(u=>`<tr><th class="gn">${esc(META(u).short||u)}</th>${
    dates.map(d=>{
      const who=pattern?((patternDay(d)||{})[u]||[])
                       :whoRoster().filter(p=>((anyDayOf(p,d)||{s:[]}).s||[]).includes(u));
      const tap=tappable&&!pattern&&clinicUnit(u)&&mayStaffClinics();
      return `<td class="gc${dowOf(d)>=5?' we':''}${isFirst(d)?' mstart':''}${who.length?' on':''}${
          tap?' cctap':''}"${tap?` data-cell="${d}|${esc(u)}" role="button" tabindex="0"`:''}
        title="${esc((META(u).label||u)+' · '+fmtD(d)+(who.length?': '+who.map(x=>fullOf(x)||x).join(', '):' — not running')+(tap?' · tap to change':''))}">${
        who.map(x=>`<span class="wname">${esc(x)}</span>`).join('')}</td>`;
    }).join('')}</tr>`).join('');
  return `<div class="gwrap"><table class="gtab ctab">
    <thead><tr class="gmrow"><th class="gn"></th>${mrow}</tr>
           <tr><th class="gn"></th>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
/* THE FOUR GRIDS SCROLL TOGETHER. Clinics, ICU, Noc/Swing and Backup all cover the same ninety
   days, and each was its own scroll box — so lining up "who is on the 14th" across them meant
   dragging four things to the same place by eye. One is the master while it is being dragged;
   the others follow. Guarded against the echo of setting scrollLeft on the followers, which
   would otherwise fight the drag. */
function syncClinicScroll(){
  const wraps=$$('#cBody .gwrap');
  if(wraps.length<2)return;
  let lock=false;
  wraps.forEach(w=>w.onscroll=()=>{
    if(lock)return;
    lock=true;
    wraps.forEach(o=>{ if(o!==w&&o.scrollLeft!==w.scrollLeft)o.scrollLeft=w.scrollLeft; });
    requestAnimationFrame(()=>{lock=false;});
  });
}
/* EVERY MONTH THE CLINIC VIEW CAN REACH — the two solved quarters and everything the sleep/APP
   pattern projects. The scroll view is a month at a time, so it should be chosen as a month
   rather than by picking some day inside it (Sam, 2026-09-04). */
function clinicMonths(){
  const all=new Set();
  ((DATA.archive||{}).dates||[]).forEach(d=>all.add(d.slice(0,7)));
  (DATA.dates||[]).forEach(d=>all.add(d.slice(0,7)));
  Object.keys(DATA.patterns||{}).forEach(d=>all.add(d.slice(0,7)));
  return [...all].sort();
}
function clinicQuarterHTML(){
  const q=clinicQtr();
  if(!q)return '<div class="empty">Nothing to show.</div>';
  const dates=q.dates;
  // The other units, in the bands Who's on uses, minus the clinics and minus protected time.
  const BANDS=[
    ['ICU — Day', ['Red - Neuro/Trauma (201-224)','Yellow - CICU-M (225-236)',
                   'Green - CICU-C (237-248)','Blue - SMICU (329-340)','SAN ICU',
                   'Avista/North 2','LAH CVICU','LAH ICU 1','LAH ICU 2/PTR','Porter ICU',
                   'CR/PKR','Parker ICU']],
    ['Noc / Swing',['South Swing','SAH NOC','SAH NOC2','PTR NOC','LAH NOC']],
    ['Backup',    ['Day Jeopardy','IP Backup']],
  ];
  let html=`<h2 class="sec" style="margin-top:2px">Clinics</h2>`
    +clinicGrid(CLINIC_UNITS,dates,q.pattern,!q.pattern);
  if(q.pattern){
    html+=`<div class="note">${esc(q.label.replace(' · pattern',''))} is drawn from the recurring
      sleep and APP cycle — not a solved schedule, and not approved by anyone. Days somebody has
      asked off are already taken out. The wards are not scheduled this far ahead.</div>`;
  }else{
    BANDS.forEach(([title,units])=>{
      const live=units.filter(u=>dates.some(d=>whoRoster().some(p=>
        ((anyDayOf(p,d)||{s:[]}).s||[]).includes(u))));
      if(!live.length)return;
      html+=`<h2 class="sec">${esc(title)}</h2>`+clinicGrid(live,dates,false,true);
    });
    html+=`<div class="note">Clinics are yours to change — open a day. Everything below is here
      so you can see who is already busy; it is read only.</div>`;
  }
  return html;
}

function clinicScrollHTML(iso){
  const mk=iso.slice(0,7), y=+mk.slice(0,4), mo=+mk.slice(5)-1;
  const dim=new Date(y,mo+1,0).getDate();
  let out='';
  for(let d=1;d<=dim;d++){
    const day=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(!knownDate(day)&&!patternDate(day))continue;
    out+=`<div class="cday${day===todayISO()?' today':''}">
      <div class="cdh"><b>${DOW[dowOf(day)]}</b> ${MON[d2(day).getMonth()]} ${d2(day).getDate()}</div>
      ${clinicDayHTML(day)}</div>`;
  }
  return out||'<div class="empty">Nothing on file that month.</div>';
}
/* WHO CAN BE PUT IN THIS CLINIC. Everybody on the roster, with what they are ALREADY doing that
   day printed beside them — a clinic desk booking somebody who is on a night needs to see that
   before they do it, not after. Nobody is hidden: the rules are advisory here for the same reason
   they are advisory on an admin edit, and the person doing it can see what they are choosing. */
/* `back` so the picker returns to whatever opened it. Reached from the day view there is nothing
   behind it and ✕ means close; reached from a cell in the quarter it must land back on that day,
   for the same reason the trade calendar does (Sam, 2026-09-04). */
function openClinicAdd(iso,unit,back){
  const on=clinicHolders(iso,unit);
  const rows=whoRoster().filter(p=>!on.includes(p)).map(p=>{
    const a=anyDayOf(p,iso)||{s:[],r:[]};
    const busy=(a.s||[]).filter(x=>isRealShift(p,iso,x));
    return {p,busy};
  });
  sheet('Add to '+(META(unit).label||unit),
    `<div class="sub" style="margin-top:0">${esc(fmtLong(iso))}</div>
     <div id="caList">${rows.map(r=>`
       <label class="cvrow">
         <input type="radio" name="capick" class="capick" value="${esc(r.p)}">
         <span class="cvnm">${esc(fullOf(r.p)||r.p)}</span>
         <span class="cabusy">${r.busy.length
            ?esc(r.busy.map(x=>shiftLabel(r.p,iso,x,true)).join(' + '))
            :'<i>free</i>'}</span>
       </label>`).join('')}</div>
     <div class="cvactions"><div class="msg" id="caMsg"></div>
       <div class="btnrow"><button class="btn pri" id="caGo">Add</button>
         <button class="btn" id="caX">Cancel</button></div></div>`,back);
  $('#caX').onclick=dismissSheet;   // Cancel honours the back step like the other three exits do
  $('#caGo').onclick=()=>{
    const sel=document.querySelector('.capick:checked');
    if(!sel){ const m=$('#caMsg'); m.textContent='Pick somebody first.'; m.className='msg on bad'; return; }
    closeSheet();
    clinicSet(iso,unit,on.concat([sel.value]),
              (fullOf(sel.value)||sel.value)+' added to '+(META(unit).label||unit));
  };
}

function renderClinicView(){
  const main=document.querySelector('main');
  let pane=document.querySelector('#pane-clinic');
  if(!pane){pane=el('section','pane on');pane.id='pane-clinic';main.appendChild(pane);}
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-clinic'));
  /* The tab bar used to be TORN OUT here, because this pane was the entire clinic login: one
     screen, no way anywhere else. Sam, 2026-09-04: "the clinic staff should be able to see all
     provider schedules." So Clinics becomes a tab beside Now and Schedule rather than the only
     thing there is, and the bar stays where it is. */
  const iso=CLINICDAY||inBlockDay(todayISO());
  const V=CLINICVIEW;
  const label=V==='week'?((clinicQtr()||{}).label||'Quarter')
             :V==='scroll'?MONL[d2(iso).getMonth()]+' '+iso.slice(0,4)
             :fmtLong(iso);
  pane.innerHTML=`<h2 class="sec">Clinics <span class="daynav">
      <button class="navb" id="cPrev" aria-label="Back">‹</button>
      <button class="daypick" id="cLabel" aria-label="Pick a date">${esc(label)}</button>
      <button class="navb" id="cNext" aria-label="Forward">›</button></span></h2>
    <div class="btnrow three" id="cViews">
      <button class="btn ${V==='day'?'pri':''}" data-cv="day">Day</button>
      <button class="btn ${V==='week'?'pri':''}" data-cv="week">Quarter</button>
      <button class="btn ${V==='scroll'?'pri':''}" data-cv="scroll">Scroll</button></div>
    ${V==='week'?`<div class="btnrow"><select class="inp" id="cQtr" style="max-width:230px">${
      clinicQuarters().map(q=>`<option value="${esc(q.id)}"${
        (clinicQtr()||{}).id===q.id?' selected':''}>${esc(q.label)}</option>`).join('')}</select></div>`:''}
    ${V==='scroll'?`<div class="btnrow"><select class="inp" id="cMon" style="max-width:230px">${
      clinicMonths().map(m=>`<option value="${m}"${m===iso.slice(0,7)?' selected':''}>${
        MONL[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')}</select></div>`:''}
    <div id="cBody">${V==='week'?clinicQuarterHTML()
                     :V==='scroll'?clinicScrollHTML(iso)
                     :clinicDayHTML(iso)}</div>
    ${V==='day'?`<div class="note">${mayStaffClinics()
      ?'Add or remove people on any clinic. Changes are live the moment they are saved and are recorded against your login.'
      :'Every clinic for the day. Use the arrows to look ahead or back.'}</div>
    <h2 class="sec">Everyone else that day</h2>
    <div id="cRest">${clinicRestHTML(iso)}</div>`:''}`;
  const set=d=>{CLINICDAY=d;renderClinicView();};
  // The arrows step by whatever unit is on screen — a day, a week, a month.
  const step=(n)=>{
    const cur=CLINICDAY||iso;
    if(CLINICVIEW==='week'){
      // The arrows step a QUARTER now, through the same list the dropdown offers.
      const qs=clinicQuarters(), i=qs.findIndex(q=>q.id===(clinicQtr()||{}).id);
      const j=Math.max(0,Math.min(qs.length-1,i+n));
      CLINICQ=qs[j].id;
      return qs[j].dates[0];
    }
    if(CLINICVIEW==='scroll'){
      const d=d2(cur); d.setMonth(d.getMonth()+n); d.setDate(1);
      return d.toISOString().slice(0,10);
    }
    return isoAdd(cur,n);
  };
  $('#cPrev').onclick=()=>set(step(-1));
  $('#cNext').onclick=()=>set(step(1));
  $$('#cViews [data-cv]').forEach(b=>b.onclick=()=>{CLINICVIEW=b.dataset.cv;renderClinicView();});
  const qs=$('#cQtr');
  if(qs)qs.onchange=e=>{CLINICQ=e.target.value;renderClinicView();};
  const ms=$('#cMon');
  if(ms)ms.onchange=e=>{CLINICDAY=e.target.value+'-01';renderClinicView();};
  syncClinicScroll();
  // The date opens a calendar here too, because walking to next August one arrow at a time is
  // not a way to answer a question about next August.
  const lab=$('#cLabel');
  if(lab)lab.onclick=()=>{
    // In scroll view the unit is a month, so the label opens the month list rather than a grid
    // of days — picking the 14th to see September is a step nobody needs.
    if(CLINICVIEW==='scroll'){ const m=$('#cMon'); if(m){m.focus(); if(m.showPicker)try{m.showPicker();}catch(e){}} return; }
    if(CLINICVIEW==='week'){ const q=$('#cQtr'); if(q){q.focus(); if(q.showPicker)try{q.showPicker();}catch(e){}} return; }
    openDatePicker(CLINICDAY||iso,set,true);
  };
  wireClinicEdit();
}

/* ---------- TEAM: compare providers (client items 1, 2 and 3) ----------
   2. "Everyone should have the ability to make groups in a very similar way to the way we have on
      the admin view where you select a few people and get their stacked schedule."
   3. "We should allow people to filter by assignment or groups of assignments (like nights and
      specific sets of hospitals, etc, maybe they have checkboxes to see the group)."
   1. "The clinic staff only view should be able to see the full schedule. Basically the admin
      view but without the edit functionality."

   All three are one screen. The admin's compare view already existed and was reachable only from
   the admin bar; it is a tab now, for every account. Three things were wrong with it and are
   fixed here rather than carried over:

     - it drew `a.s[0]` and nothing else, so a day with a day shift AND a night showed one of
       them. That is the same truncation as Aaron's September bug, in a different screen.
     - it read DATA.day, which is Q4 alone, so the whole of Jul-Sep was blank.
     - it had no filter at all.

   The clinic account lands here with everybody selected, which is "the admin view without the
   edit functionality" — the grid, the colours and the scrolling, and nothing that writes. */
/* BY QUARTER, NOT BY MONTH (Sam, 2026-09-03). A month was the admin view's unit because that
   grid was built to be printed; on screen the question is "who is on across the block", and
   making somebody step through three months to answer it is the same mistake as making them
   step through days with the arrows. TQTR is 'archive' or 'live', the same vocabulary the
   quarter dropdown on the schedule already uses. */
let TSEL=new Set(), TMODE='grid', TQTR=null, TFILTER=null, TFILTERNAME='';
let TGROUPS=[], TGROUPSLOADED=false;
// Which half of the schedule tab is showing. Mine by default: it is your schedule tab.
let SCHEDWHO='mine';
function wireSchedWho(){
  $$('#schedWho [data-sw]').forEach(b=>b.onclick=()=>{SCHEDWHO=b.dataset.sw;renderSched();});
}

/* A DROPDOWN CHECKLIST, NOT SIXTY-ONE PILLS (Sam, 2026-09-03: "it should just be a drop down
   checklist. The everyone option should be a 'select all' in the checklist").
   Sixty-one pills is four screens of scrolling before you reach the thing you came to look at,
   and on a phone it pushed the grid entirely below the fold. Collapsed to a summary line that
   says how many are picked, with Select all as the first row of the list rather than a separate
   button beside it — one place to choose people, not two. */
function pickerLabel(roster,sel){
  const n=sel.size;
  return n===0?'Nobody selected':n===roster.length?`Everyone (${n})`
        :n<=3?[...sel].map(p=>fullOf(p)||p).join(', '):`${n} selected`;
}
function pickerHTML(id,roster,sel){
  const n=sel.size;
  const label=pickerLabel(roster,sel);
  return `<details class="pkr" id="${id}">
    <summary><span>${esc(label)}</span><i>▾</i></summary>
    <div class="pkrbody">
      <label class="pkrrow all"><input type="checkbox" class="pkall"${
        n===roster.length?' checked':''}${n&&n<roster.length?' data-part="1"':''}>
        <span><b>Select all</b></span></label>
      ${roster.map(p=>`<label class="pkrrow"><input type="checkbox" class="pk" value="${esc(p)}"${
        sel.has(p)?' checked':''}><span>${esc(fullOf(p)||p)}</span></label>`).join('')}
    </div></details>`;
}
/* `after` repaints whatever depends on the selection. `relabel` updates the summary line in
   place — optional, and the reason it exists: the Team view used to call renderTeam() on every
   tick, which rebuilt the <details> and slammed the list shut, so choosing five people meant
   opening the list five times. Nothing that redraws the picker may run from inside the picker. */
function wirePicker(id,roster,sel,after,relabel){
  const root=document.querySelector('#'+id); if(!root)return;
  const done=()=>{ if(relabel)relabel(); if(after)after(); syncAll(); };
  const syncAll=()=>{
    const all=root.querySelector('.pkall');
    if(!all)return;
    all.checked=sel.size===roster.length;
    // Some-but-not-all reads as neither on nor off, which is the truth.
    all.indeterminate=sel.size>0&&sel.size<roster.length;
  };
  root.querySelectorAll('.pk').forEach(c=>c.onchange=()=>{
    c.checked?sel.add(c.value):sel.delete(c.value); done();});
  const all=root.querySelector('.pkall');
  if(all)all.onchange=()=>{
    const want=all.checked;
    sel.clear();
    if(want)roster.forEach(p=>sel.add(p));
    root.querySelectorAll('.pk').forEach(c=>{c.checked=want;});
    done();};
  syncAll();
}

function teamMonths(){
  const o=[]; spanMonths().forEach(m=>o.push(m)); return o;
}
function spanMonths(){
  const sp=spanDates(), out=[];
  for(let m=sp[0].slice(0,7); m<=sp[1].slice(0,7); ){
    out.push(m);
    const y=+m.slice(0,4), mo=+m.slice(5);
    m=(mo===12)?((y+1)+'-01'):(y+'-'+String(mo+1).padStart(2,'0'));
  }
  return out;
}
/* The filter offers the SAME bands Who's on and the dashboard use, plus the two hospitals, so
   there is one vocabulary for "a set of shifts" across the app rather than three. */
function teamFilters(){
  const bands=[['icu','ICU — Day'],['clinic','Clinic'],['noc','Noc / Swing'],['backup','Backup']];
  return bands.concat(HOSPITALS.map(([id,name])=>[id,name]));
}
function teamFilterSet(id){
  const h=HOSPITALS.find(x=>x[0]===id);
  if(h)return {name:h[1],set:new Set(h[2])};
  const BANDS={
    icu:['Red - Neuro/Trauma (201-224)','Yellow - CICU-M (225-236)','Green - CICU-C (237-248)',
         'Blue - SMICU (329-340)','SAN ICU','Avista/North 2','LAH CVICU','LAH ICU 1',
         'LAH ICU 2/PTR','Porter ICU','CR/PKR','Parker ICU'],
    clinic:['West Clinic','North Clinic','South Clinic','Central Clinic','SAH EBUS','Porter EBUS',
            'Goodland Clinic','RHC-SAN'],
    noc:['South Swing','SAH NOC','SAH NOC2','PTR NOC','LAH NOC'],
    backup:['Day Jeopardy','IP Backup'],
  };
  const b=BANDS[id];
  return b?{name:(teamFilters().find(x=>x[0]===id)||[,id])[1],set:new Set(b)}:null;
}

/* WHAT IS ON SCREEN, AND HOW TO GET BACK OUT (Sam, 2026-09-03: "it is not obvious how to
   finalize a group selection then how to clear the view. There should be a clear grouping button
   then I should be able to press the named group at anytime after").

   There is nothing to finalize — the grid follows the checklist as you tick — but a control with
   no visible consequence reads as one that has not taken effect yet. So the state is stated: how
   many people are showing, the grouping's name if it is one, and a Clear beside it. The saved
   chips sit under a heading of their own so it is obvious they are there to be pressed. */
function showingHTML(){
  const n=TSEL.size;
  const g=TGROUPS.find(x=>x.members.length===n&&x.members.every(m=>TSEL.has(m)));
  if(!n)return `<div class="showing muted">Nobody chosen — tick some people above.</div>`;
  return `<div class="showing"><span>Showing <b>${g?esc(g.name):n+' provider'+(n===1?'':'s')}</b>${
      g?` · ${n}`:''}</span>
    <button class="btn gho" id="tClear">Clear grouping</button></div>`;
}
function renderTeam(into){
  const pane=into||$('#pane-sched');
  const qs=teamQuarters();
  if(!TQTR||!qs.some(q=>q[0]===TQTR))TQTR=(defaultBlock&&defaultBlock())||((qs[0]||[])[0]||'live');
  const roster=whoRoster();
  // The clinic account is here to read the whole board, so it starts with the whole board.
  if(!TSEL.size&&ROLE==='clinic')roster.forEach(p=>TSEL.add(p));
  if(!TGROUPSLOADED)loadTeamGroups(into);
  const chip=(id,label,on)=>`<button class="onfb${on?' on':''}" data-tf="${id}">${esc(label)}</button>`;
  pane.innerHTML=`
    <div class="note" style="margin-top:2px">Pick people, then choose how to look at them.</div>
    ${pickerHTML('tPick',roster,TSEL)}
    ${showingHTML()}
    <h2 class="sec" style="margin-top:14px">Saved groupings</h2>
    <div id="tGrpRow" class="onfilter">${teamGroupChips()||
      '<span class="muted sm">None yet — pick some people and save the grouping.</span>'}</div>
    <div class="btnrow" style="margin:6px 0">
      <button class="btn" id="tSave">Save this grouping…</button>
      ${ROLE==='admin'?'<button class="btn" id="tRpt">Report…</button>':''}
    </div>
    <h2 class="sec">Show which assignments</h2>
    <div class="onfilter">
      ${chip('all','All assignments',!TFILTER)}
      ${teamFilters().map(([id,label])=>chip(id,label,!!TFILTER&&TFILTERNAME===label)).join('')}
    </div>
    <div class="btnrow">
      <button class="btn${TMODE==='grid'?' pri':''}" data-tm="grid">Grid</button>
      <button class="btn${TMODE==='stack'?' pri':''}" data-tm="stack">Calendar overlay</button>
      <select class="inp" id="tQtr" style="max-width:170px">${qs.map(([id,label])=>
        `<option value="${id}"${id===TQTR?' selected':''}>${esc(label)}</option>`).join('')}</select>
    </div>
    <div id="tBody"></div>`;
  paintTeamBody();
  wirePicker('tPick',roster,TSEL,()=>paintTeamBody(),()=>{
    // Repaint ONLY the summary line and the grid. renderTeam() rebuilt the <details>, which
    // slammed the list shut on every tick — so picking five people meant opening it five times.
    const sum=document.querySelector('#tPick > summary > span');
    if(sum)sum.textContent=pickerLabel(roster,TSEL);
  });
  $$('[data-tm]',pane).forEach(b=>b.onclick=()=>{TMODE=b.dataset.tm;renderTeam(into);});
  $$('[data-tf]',pane).forEach(b=>b.onclick=()=>{
    const id=b.dataset.tf;
    if(id==='all'){TFILTER=null;TFILTERNAME='';}
    else{
      const f=teamFilterSet(id);
      if(TFILTER&&TFILTERNAME===f.name){TFILTER=null;TFILTERNAME='';}
      else{TFILTER=f.set;TFILTERNAME=f.name;}
    }
    renderTeam(into);});
  $('#tQtr').onchange=e=>{TQTR=e.target.value;paintTeamBody();};
  const rb=$('#tRpt');
  if(rb)rb.onclick=()=>{ if(TSEL.size){RPT.people=new Set(TSEL);} showReport(); };
  $('#tSave').onclick=()=>saveTeamGroup(into);
  const cb=$('#tClear');
  if(cb)cb.onclick=()=>{TSEL.clear();renderTeam(into);};
  wireTeamGroups(into);
}

// Only the body. Called on every pick, so it must not touch the picker.
function paintTeamBody(){
  const box=$('#tBody'); if(!box)return;
  const sh=document.querySelector('#pane-sched .showing');
  if(sh){
    const t=document.createElement('div'); t.innerHTML=showingHTML();

    if(cb)cb.onclick=()=>{TSEL.clear();renderTeam(document.querySelector('#teamWrap'));};
  }
  const chosen=whoRoster().filter(p=>TSEL.has(p));
  box.innerHTML=chosen.length
    ?(TMODE==='grid'?teamGrid(chosen):teamBusy(chosen))
    :'<div class="empty">Choose one or more providers above.</div>';
}

/* ---------- saved groupings ----------
   "I want to be able to save a grouping and give it a name and see it as an option next time I
   look at team schedule." Server-side, not localStorage: a grouping like "SAH nights" is a fact
   about the practice and Aaron building it once should mean Sam sees it too. /api/groups already

async function loadTeamGroups(into){

function wireTeamGroups(into){

async function saveTeamGroup(into){
  if(!TSEL.size){ toast('Pick some people first'); return; }
  const mine=[...TSEL];
  sheet('Save this grouping',`
    <div class="sub" style="margin-top:0">${mine.length} people:
      ${esc(mine.slice(0,6).map(p=>fullOf(p)||p).join(', '))}${mine.length>6?' and '+(mine.length-6)+' more':''}</div>
    <div class="addrow"><input class="inp" id="grpName" placeholder="e.g. SAH nights" maxlength="60"></div>

      <button class="btn" id="grpX">Cancel</button></div>

  $('#grpX').onclick=closeSheet;

// Every shift the person has that day, in the order worked, after the filter. Not a.s[0].
function teamCell(p,iso){
  const a=anyDayOf(p,iso);
  if(!a)return [];
  return (a.s||[])
    .filter(s=>isRealShift(p,iso,s))
    .filter(s=>!TFILTER||TFILTER.has(s))
    .sort((x,y)=>startHour(x)-startHour(y));
}
function teamQuarters(){
  const out=[];
  const a=(DATA.archive||{});
  if(a.dates&&a.dates.length)out.push(['archive',a.label||'Q3',a.dates]);
  if((DATA.dates||[]).length)out.push(['live',DATA.blockLabel||'Q4',DATA.dates]);
  return out;
}
function teamDays(){
  const q=teamQuarters().find(x=>x[0]===TQTR)||teamQuarters()[0];
  return q?q[2]:[];
}
function teamGrid(people){
  const days=teamDays();
  if(!days.length)return '<div class="empty">Nothing scheduled in that quarter.</div>';
  const head=days.map(d=>`<th class="gh${dowOf(d)>=5?' we':''}">${d2(d).getDate()}<span>${DOW[dowOf(d)][0]}</span></th>`).join('');
  const rows=people.map(p=>`<tr><th class="gn">${esc(fullOf(p))}</th>${
    days.map(d=>{
      const sh=teamCell(p,d);
      const m=sh.length?META(sh[0]):null;
      // Every shift is named, so a doubled day reads as a doubled day.
      const txt=sh.map(x=>esc(shiftLabel(p,d,x,true))).join(' + ');
      return `<td class="gc${dowOf(d)>=5?' we':''}"${sh.length?` style="background:${m.color}22;border-left:2px solid ${m.color}"`:''}
        title="${sh.length?esc(sh.map(x=>shiftLabel(p,d,x,false)).join(' + ')):''}">${txt}</td>`;
    }).join('')}</tr>`).join('');
  return `<div class="gwrap"><table class="gtab"><thead><tr><th class="gn"></th>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
/* CALENDAR OVERLAY — one calendar, a bar per person (Sam, 2026-09-02 and 03).
   "show a line on a SINGLE calendar where everyone is stacked so fewer lines means less people
    busy that day" … "should say calendar overlay and should instead have colored bars for each
    person with a legend. Also dotted lines if it isnt an icu or swing or night shift, so we do
    not double count and note that meetings are meetings not shifts!"

   THE BARS WERE INVISIBLE. .cell sets align-items:center, and a bar with no text content
   collapses to zero width against it — 3px tall and 0px wide, present in the DOM and absent from
   the screen. The test counted elements, which is not the same as looking, and it passed. Every
   bar is stretched explicitly now and the check measures pixels.

   COLOURED BY PERSON, not by unit. Reading down a column you are asking "is that the same person
   again"; the unit colour answered a question the grid already answers. The legend maps colour to
   name, so a stripe is identifiable without a hover.

   SOLID IS ON SERVICE, DOTTED IS NOT. ICU, swing and night are the shifts that make somebody
   unavailable; clinic, bronchoscopy, jeopardy and backup are real work that does not. Only the
   solid ones are counted, so the number under the date is "how many are on service" and a clinic
   day cannot inflate it.

   A MEETING IS NOT A SHIFT. An Admin block on a managing-team or triad day is an appointment, and
   it is drawn as one — dotted, named, and counted as nothing. Protected time is not drawn at all,
   the same rule every other screen follows. */
const ONSERVICE=new Set(['icu','noc','swing']);
// A stable colour per person, from their place in the roster: the same name is the same stripe
// on every quarter and in the legend.
function personColour(p){
  const r=whoRoster(), i=Math.max(0,r.indexOf(p));
  return `hsl(${(i*137.508)%360} 62% 58%)`;
}
function teamBusy(people){
  const days=teamDays();
  if(!days.length)return '<div class="empty">Nothing scheduled in that quarter.</div>';
  const months=[...new Set(days.map(d=>d.slice(0,7)))];
  const rows=(p,iso)=>{
    const out=[];
    (teamCell(p,iso)||[]).forEach(sh=>{
      if(sh==='Admin'){
        const t=mtgTag(p,iso);
        if(t)out.push({p,kind:'mtg',label:(DATA.mtgLong||{})[t]||t,service:false});
        return;                       // protected time is not an appointment; it is not drawn
      }
      out.push({p,kind:META(sh).kind,label:shiftLabel(p,iso,sh,false),
                service:ONSERVICE.has(META(sh).kind)});
    });
    return out;
  };
  let peak=0;
  days.forEach(iso=>{
    const n=people.filter(p=>rows(p,iso).some(x=>x.service)).length;
    if(n>peak)peak=n;
  });
  let html='';
  months.forEach(mk=>{
    const y=+mk.slice(0,4), mo=+mk.slice(5)-1;
    const first=new Date(y,mo,1), dim=new Date(y,mo+1,0).getDate();
    html+=`<div class="month"><h4><b>${MONL[mo]} ${y}</b></h4><div class="grid7 busy">`;
    dowLabels().forEach(d=>html+=`<div class="dow${d==='Sat'||d==='Sun'?' we':''}">${d}</div>`);
    for(let i=0;i<leadFor(first);i++)html+='<div class="cell blank"></div>';
    for(let d=1;d<=dim;d++){
      const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(!days.includes(iso)){ html+='<div class="cell blank"></div>'; continue; }
      const all=[]; people.forEach(p=>all.push(...rows(p,iso)));
      const onService=people.filter(p=>rows(p,iso).some(x=>x.service)).length;
      const bars=all.map(x=>`<i class="bl${x.service?'':' soft'}${x.kind==='mtg'?' mtg':''}"
        style="--pc:${personColour(x.p)}"
        title="${esc((fullOf(x.p)||x.p)+' — '+x.label+(x.service?'':x.kind==='mtg'?' (meeting)':' (not on service)'))}"></i>`).join('');
      html+=`<div class="cell bz${iso===todayISO()?' today':''}" data-iso="${iso}"
        aria-label="${esc(fmtLong(iso)+', '+onService+' of '+people.length+' on service')}">
        <span class="bd">${d}</span><span class="bstack">${bars}</span>
        <span class="bn">${onService||''}</span></div>`;
    }
    html+='</div></div>';
  });
  const legend=people.map(p=>`<span><i class="bkey" style="background:${personColour(p)}"></i>${
    esc(fullOf(p)||p)}</span>`).join('');
  return `<div class="note" style="margin-top:0">A bar per person. <b>Solid</b> is on service
      (ICU, swing, night) and is what the number counts; <b>dotted</b> is clinic, bronchoscopy,
      jeopardy or backup — real work that does not take them off the board, so it is not counted
      twice. A meeting is drawn dotted and named, and counts as nothing.
      Busiest day this quarter: <b>${peak}</b> of ${people.length}.</div>
    <div class="bleg">${legend}</div>`+html;
}

/* Everyone who appears in EITHER quarter. Somebody can be in one and not the other, and "who
   is on" must not depend on which. */
function whoRoster(){
  const r=new Set(DATA.people||[]);
  if(DATA.archive&&DATA.archive.day)Object.keys(DATA.archive.day).forEach(x=>r.add(x));
  return [...r].sort();
}
/* WHICH HOSPITAL A UNIT BELONGS TO — the client's own list, 2026-09-03.

   Not derived any more. Aaron sent the two systems out shift by shift, and it corrected my guess
   in three places:

     RHC-SAN and SAH EBUS were under CommonSpirit and are not on his list. Nor is Porter EBUS
     under AdventHealth. His list is the INPATIENT and NIGHT units — the board somebody is asking
     about when they say "who is on at Advent tonight" — and the clinics, bronchoscopy, jeopardy
     and backup are not part of that question. They are reachable under All, which is where they
     belong rather than being filed under a hospital nobody asked about.

     Avista/SAN he marks "(both systems)", which is what I had inferred and is now confirmed. It
     appears under each, deliberately: it is one shift covering two hospitals, and hiding it from
     either board would be a lie about who is on.

   His names, mapped to the keys the schedule uses:
     Parker                  -> Parker ICU          SAH- Red/blue/green/yellow -> the four SAH ICUs
     Castle Rock /Parker     -> CR/PKR              SAN                        -> SAN ICU
     Littleton ICU 1         -> LAH ICU 1           SAH noc 1                  -> SAH NOC
     Littleton ICU 2/Porter  -> LAH ICU 2/PTR       SAH noc 2                  -> SAH NOC2
     Littleton CVICU         -> LAH CVICU
     Porter                  -> Porter ICU          Parker Swing -> South Swing
     Avista/SAN              -> Avista/North 2      Porter Noc   -> PTR NOC
                                                    Littleton Noc-> LAH NOC                     */
const HOSPITALS=[
  ['common', 'CommonSpirit', ['Red - Neuro/Trauma (201-224)','Yellow - CICU-M (225-236)',
     'Green - CICU-C (237-248)','Blue - SMICU (329-340)','SAN ICU','Avista/North 2',
     'SAH NOC','SAH NOC2']],
  ['advent', 'AdventHealth', ['Parker ICU','CR/PKR','LAH ICU 1','LAH ICU 2/PTR','LAH CVICU',
     'Porter ICU','Avista/North 2','South Swing','PTR NOC','LAH NOC']],
];
let ONFILTER=null;        // null = everything. Otherwise a Set of unit keys.
let ONFILTERNAME='';

function whosOnHTML(iso){
  if(!knownDate(iso))
    return '<div class="empty">Outside this block.</div>';
  /* ADMIN IS NOT "ON" (Aaron 8/21). Protected time is the opposite of being on the board: it
     answers "who is unavailable", and this screen is read to find out who is covering what.
     Dropped here rather than un-grouped, because an un-grouped shift falls into the Other
     catch-all and would come back as a heading of its own. Inpatient Backup shares kind 'admin'
     and STAYS — it is real cover and the dashboard lists it under Backup. */
  const OFF_BOARD=new Set(['Admin']);
  const rows=[];
  /* EITHER QUARTER, AND EVERYONE IN IT. This read DATA.day and DATA.people, both of which are
     Q4 alone — so on any date in Q3 it found nobody and the section came up blank. Today IS a
     Q3 date until 1 October, which is to say it was blank for the whole group, on the screen
     they open first.
     The roster is a union too: somebody can appear in one quarter and not the other, and
     "who is on today" must not depend on which. */
  const keep=sh=>!ONFILTER||ONFILTER.has(sh);
  [...whoRoster()].forEach(p=>{
    const a=anyDayOf(p,iso);
    if(!a)return;
    (a.s||[]).forEach(sh=>{ if(!OFF_BOARD.has(sh)&&keep(sh)&&isRealShift(p,iso,sh)) rows.push({sh,p,role:false}); });
    (a.r||[]).forEach(r=>{ if(!OFF_BOARD.has(r)&&keep(r)) rows.push({sh:r,p,role:true}); });
  });
  if(!rows.length)
    return ONFILTER
      ? `<div class="empty">Nobody on ${esc(ONFILTERNAME||'this selection')} that day.</div>`
      : '<div class="empty">Nobody scheduled.</div>';
  /* THE SAME GROUPS THE ADMIN VIEW DRAWS (Aaron 8/21).
     Reordering alone was not what he asked for. The dashboard's grid is banded — it prints a
     labelled section row (.secrow) above each set of units — and this was a flat list, so the
     groups he reads over there simply were not here. It is banded now, from the SAME membership
     the dashboard uses, spelled out by unit rather than inferred from `kind`.

     Inferring was its own bug: IP Backup carries kind 'admin', so a kind-based band filed it
     under Admin while the dashboard has always shown it under Backup.

     Order is Aaron's, which is NOT quite the dashboard's own — over there Backup and Admin sit
     above Swing/Night. He asked for nights before backup, so nights before backup it is; the
     grouping and the membership are what had to match. Admin then came off the screen entirely
     (8/21, second pass) — see OFF_BOARD. */
  const GROUPS=[
    ['ICU — Day', ['Red - Neuro/Trauma (201-224)','Yellow - CICU-M (225-236)',
                   'Green - CICU-C (237-248)','Blue - SMICU (329-340)','SAN ICU',
                   'Avista/North 2','LAH CVICU','LAH ICU 1','LAH ICU 2/PTR','Porter ICU',
                   'CR/PKR','Parker ICU']],
    ['Clinic',    ['West Clinic','North Clinic','South Clinic','Central Clinic','SAH EBUS',
                   'Porter EBUS','Goodland Clinic','RHC-SAN']],
    ['Noc / Swing',['South Swing','SAH NOC','SAH NOC2','PTR NOC','LAH NOC']],
    ['Backup',    ['Day Jeopardy','IP Backup']],
    ['Layered roles', null],          // whatever arrived as a layered role, in DATA.roles order
  ];                                  // no Admin band — see OFF_BOARD above
  const byShift={};
  rows.forEach(r=>{(byShift[r.sh]=byShift[r.sh]||{role:r.role,who:[]}).who.push(r.p);});
  /* DATA.roles IS the layered-role registry, and membership of it is the real test — not how a
     given day happened to store the assignment. Orientation is registered as a layered role and
     is ALSO written as a top-level unit (the dashboard hit the same thing on 8/17), so keying
     off the per-day flag alone dropped it out of the group and into "Other". */
  const roleSeq=Object.keys(DATA.roles||{});
  const isRole=sh=>!!(byShift[sh]&&byShift[sh].role)||!!(DATA.roles&&DATA.roles[sh]);
  const placed=new Set();
  const line=sh=>{
    const g=byShift[sh], r=isRole(sh), m=META(sh);
    return `<div class="onrow${r?' isrole':''}">
      <span class="ondot" style="background:${r?'var(--line2)':m.color}"></span>
      <span class="onshift">${esc(r?((DATA.roles[sh]||{}).label||sh):m.label)}</span>
      <span class="onwho">${g.who.map(x=>esc(fullOf(x))).join(', ')}</span></div>`;
  };
  let out='';
  GROUPS.forEach(([title,keys])=>{
    const mine=keys
      ? keys.filter(k=>byShift[k]&&!isRole(k))
      : Object.keys(byShift).filter(isRole)
          .sort((a,b)=>{const i=roleSeq.indexOf(a),j=roleSeq.indexOf(b);
                        return (i<0?999:i)-(j<0?999:j)||String(a).localeCompare(String(b));});
    if(!mine.length)return;                       // an empty band is noise, not information
    mine.forEach(k=>placed.add(k));
    out+=`<div class="ongrp">${esc(title)}</div>`+mine.map(line).join('');
  });
  // A unit added to the schedule but not yet to GROUPS must still appear. Silently dropping a
  // shift from "who is on today" is the one failure this screen cannot have.
  const rest=Object.keys(byShift).filter(k=>!placed.has(k));
  if(rest.length)out+='<div class="ongrp">Other</div>'+rest.sort().map(line).join('');
  return out;
}
/* WHO IS ON — the header, the filter and the date picker (client items 4, 5, 6).
   Rendered as its own block so it can sit at the top of the Now page without dragging the rest
   of renderNow's layout around with it. */
function whosOnBlock(iso){
  const chip=(id,label,on)=>`<button class="onfb${on?' on':''}" data-f="${id}">${esc(label)}</button>`;
  return `<h2 class="sec" style="margin-top:4px">Who's on <span class="daynav">
      <button class="navb" id="dayPrev" aria-label="Previous day">‹</button>
      <button class="daypick" id="dayLabel" aria-label="Pick a date">${esc(fmtD(iso))}</button>
      <button class="navb" id="dayNext" aria-label="Next day">›</button></span></h2>
    <div class="onfilter" role="group" aria-label="Filter by hospital">
      ${chip('all','All shifts',!ONFILTER)}
      ${HOSPITALS.map(([id,name])=>chip(id,name,ONFILTER&&ONFILTERNAME===name)).join('')}
    </div>
    <div id="onToday">${whosOnHTML(iso)}</div>`;
}
function wireDayNav(){
  const lab=$('#dayLabel'), box=$('#onToday');
  if(!lab||!box)return;
  const cur=()=>DAYVIEW||inBlockDay(todayISO());
  const repaint=()=>{
    const wrap=$('#whosOnWrap');
    if(wrap){wrap.innerHTML=whosOnBlock(cur());wireDayNav();}
  };
  const set=iso=>{DAYVIEW=iso;repaint();};
  const p=$('#dayPrev'), n=$('#dayNext');
  if(p)p.onclick=()=>set(isoAdd(cur(),-1));
  if(n)n.onclick=()=>set(isoAdd(cur(),1));
  /* THE DATE ITSELF OPENS A CALENDAR (item 5). Two arrows are fine for tomorrow and useless for
     "the 24th" — that is eleven taps. Our own month grid rather than <input type="date">: the
     native one does not commit its value on iOS until the wheel is dismissed, which is the same
     trap that made the request form feel broken. */
  lab.onclick=()=>openDatePicker(cur(),set);
  $$('.onfb').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='all'){ONFILTER=null;ONFILTERNAME='';}
    else{
      const h=HOSPITALS.find(x=>x[0]===f);
      // Pressing the hospital you are already on goes back to everything, so the button is a
      // toggle rather than a state you have to hunt for the exit from.
      if(ONFILTER&&ONFILTERNAME===h[1]){ONFILTER=null;ONFILTERNAME='';}
      else{ONFILTER=new Set(h[2]);ONFILTERNAME=h[1];}
    }
    repaint();
  });
}

/* A month grid in a sheet, for picking a day anywhere in either quarter. Reuses the schedule's
   own furniture so it is the same object people already read. */
function openDatePicker(cur,onPick,withPattern){
  const sp=spanDates().slice();
  // The clinic view reaches a year past the block, so its picker has to as well.
  if(withPattern){
    const pd=Object.keys(DATA.patterns||{}).sort();
    if(pd.length){ if(pd[0]<sp[0])sp[0]=pd[0]; if(pd[pd.length-1]>sp[1])sp[1]=pd[pd.length-1]; }
  }
  let m=cur.slice(0,7);
  const draw=()=>{
    const y=+m.slice(0,4), mo=+m.slice(5)-1;
    const first=new Date(y,mo,1), dim=new Date(y,mo+1,0).getDate();
    const prevM=mo===0?((y-1)+'-12'):(y+'-'+String(mo).padStart(2,'0'));
    const nextM=mo===11?((y+1)+'-01'):(y+'-'+String(mo+2).padStart(2,'0'));
    let g='';
    dowLabels().forEach(d=>g+=`<div class="dow${d==='Sat'||d==='Sun'?' we':''}">${d}</div>`);
    for(let i=0;i<leadFor(first);i++)g+='<div class="cell blank"></div>';
    for(let d=1;d<=dim;d++){
      const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const out=iso<sp[0]||iso>sp[1];
      g+=`<div class="cell dpc${out?' out':''}${iso===cur?' sel':''}${iso===todayISO()?' today':''}"
        data-iso="${iso}" role="button" tabindex="${out?-1:0}"
        aria-label="${esc(fmtLong(iso))}"><i class="dpn">${d}</i></div>`;
    }
    sheet('Pick a date',`
      <div class="dphead">
        <button class="navb" id="dpPrev" aria-label="Previous month">‹</button>
        <b>${MONL[mo]} ${y}</b>
        <button class="navb" id="dpNext" aria-label="Next month">›</button></div>
      <div class="month" style="margin-top:8px"><div class="grid7">${g}</div></div>
      <div class="btnrow"><button class="btn" id="dpToday">Today</button></div>`);
    const step=(mm)=>{ if(mm>=sp[0].slice(0,7)&&mm<=sp[1].slice(0,7)){m=mm;draw();} };
    $('#dpPrev').onclick=()=>step(prevM);
    $('#dpNext').onclick=()=>step(nextM);
    $('#dpToday').onclick=()=>{closeSheet();onPick(inBlockDay(todayISO()));};
    $$('#sheetBd .cell.dpc').forEach(c=>{
      if(c.classList.contains('out'))return;
      const go=()=>{closeSheet();onPick(c.dataset.iso);};
      c.onclick=go;
      c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
    });
  };
  draw();
}

/* THE NOW PAGE IS WHERE PEOPLE ACTUALLY LOOK. The subscription lives at the bottom of the
   schedule tab, which is a tab away and below a quarter of shifts. Offered here as well, once,
   with a way to say no that sticks — a prompt that cannot be dismissed is worse than no prompt. */
function subscribeNudge(){
  if(!ME||!CFG||CFG.icsFor!==ME||!CFG.icsUrl)return '';
  let off=false; try{off=localStorage.getItem('ccpsa_subnudge')==='off';}catch(e){}
  if(off)return '';
  const whose=onBehalf()?fullOf(ME):null;
  return `<div class="swcard nudge" id="subNudge">
    <div class="lgh">${whose?'Put '+esc(whose)+"'s shifts in a calendar":'Put your shifts in your calendar'}</div>
    <div class="sub">They stay up to date on their own — a swap or a change reaches your calendar
      without you doing anything.</div>
    <div class="btnrow">
      <a class="btn pri" id="nudgeGo" href="${icsAbsolute().replace(/^https?:/,'webcal:')}">Subscribe</a>
      <button class="btn" id="nudgeNo">No thanks</button>
    </div>
  </div>`;
}
function wireNudge(){
  const no=$('#nudgeNo'), go=$('#nudgeGo');
  const done=()=>{ try{localStorage.setItem('ccpsa_subnudge','off');}catch(e){}
                   const n=$('#subNudge'); if(n)n.remove(); };
  if(no)no.onclick=done;
  if(go)go.onclick=()=>setTimeout(done,400);   // taken up: no reason to keep asking
}

function renderNow(){
  const pane=$('#pane-now');
  if(!ME){pane.innerHTML=`<div class="empty" style="margin-top:22px">Choose a provider to see a personal schedule.
    <div class="btnrow"><button class="btn pri" id="pickWho">Choose provider</button></div></div>`;
    $('#pickWho').onclick=openGate;return;}
  const t=todayISO();
  const all=allShifts(ME);
  const next=all.find(s=>s.iso>=t)||all[0];
  const c=counts(ME),tg=targets(ME),de=deBalance(ME);
  /* WHO'S ON GOES FIRST (client item 4: "This is the most important").
     One exception, and it is the reason the banner exists: an unacknowledged change to YOUR OWN
     schedule still comes above it. Who's on is twenty rows, so pushing "your schedule changed"
     under it means somebody scrolls past a shift that moved. The banner is only present when
     there IS a change and disappears the moment it is acknowledged (item 7 — "very good to
     keep"), so on almost every day Who's on is genuinely the first thing on the page. */
  let html=changeBanner();
  html+=`<div id="whosOnWrap">${whosOnBlock(DAYVIEW||inBlockDay(t))}</div>`;
  html+=installCard();              // the home-screen nudge, until they act on it
  if(next){
    const m=next.m,days=Math.round((d2(next.iso)-d2(t))/864e5);
    const when=days<0?'First shift of the block':days===0?'Today':days===1?'Tomorrow':`In ${days} days`;
    /* THE HOURS COME FROM kindHours, not from a second copy written out by hand. These strings
       still said 7pm–7am and 1pm–11pm after the times changed on 25 August, so the card under
       "your next shift" contradicted the calendar, the day sheet and the subscribed feed. */
    const kindName={noc:'Overnight',icu:'Day shift',swing:'Swing',clinic:'Clinic',
                    admin:'Protected time',jeop:'Backup',proc:'Bronchoscopy'}[m.kind]||'';
    const kh=DATA.kindHours[m.kind];
    const kindTxt=!kindName?'':(kh?kindName+' · '+hrsText(kh):kindName);
    // anyDayOf, not dayOf: `next` can be in either quarter. Defensive fallback too — a shift
    // with no day record must render as a shift with nothing beside it, never as a crash.
    const a=anyDayOf(ME,next.iso)||{s:[],r:[]},
          also=(a.s||[]).filter(s=>s!==next.shift&&isRealShift(ME,next.iso,s)), roles=a.r||[];
    html+=`<div class="hero"><div class="spine" style="background:${m.color}"></div><div class="in">
      <div class="when">${esc(when)}</div>
      <div class="unit"><span class="dotU" style="background:${m.color};width:15px;height:15px"></span>${
        esc(shiftLabel(ME,next.iso,next.shift,false))}</div>
      <div class="sub">${esc(m.sub)}</div>
      ${also.length?`<div class="sub" style="margin-top:7px">Also that day: ${
        also.map(s=>esc(shiftLabel(ME,next.iso,s,false))).join(' · ')}</div>`:''}
      ${roles.length?`<div class="sub" style="margin-top:5px;color:#F0ABFC">◆ ${roles.map(r=>esc((DATA.roles[r]||{label:r}).label)).join(' · ')}</div>`:''}
      <div class="date mono"><span>${esc(fmtLong(next.iso))}</span><span class="t">${esc(kindTxt)}</span></div>
    </div></div>`;
  }else{
    html+=`<div class="empty">No shifts scheduled this block.</div>`;
  }
  // week strip
  /* "Next 7 days" means the next seven, not the first seven of Q4. This clamped to
     DATA.dates[0], so from July to September it showed the week of 1 October — the wrong week
     for the entire group, every day, for three months. Clamped to the full span now. */
  const _sp=spanDates();
  const start=(all.length&&t>_sp[1])?_sp[0]:(t<_sp[0]?_sp[0]:t);
  html+=`<h2 class="sec">Next 7 days</h2><div class="wk7">`;
  for(let i=0;i<7;i++){
    const iso=isoAdd(start,i);
    const a=anyDayOf(ME,iso);
    const inBlock=knownDate(iso);
    // A coloured pill told you *that* you worked, never *what* — which is the one thing you
    // want at a glance (client 8/17 #4).
    const wshown=(a?a.s:[]).filter(sh=>isRealShift(ME,iso,sh))
      .sort((x,y)=>startHour(x)-startHour(y));
    const names=wshown.length
      ? wshown.map(sh=>`<span class="w7s" style="border-left-color:${META(sh).color}">${esc(shiftLabel(ME,iso,sh,false))}</span>`).join('')
      : `<span class="w7off">${inBlock?'Off':'—'}</span>`;
    const roles=(a&&a.r&&a.r.length)
      ? a.r.map(r=>`<span class="w7r">${esc((DATA.roles[r]||{label:r}).label||r)}</span>`).join('') : '';
    html+=`<div class="w7d${iso===t?' today':''}" data-iso="${iso}">
      <div class="w7h"><b>${DOW[dowOf(iso)]}</b><span>${MON[d2(iso).getMonth()]} ${d2(iso).getDate()}</span></div>
      <div class="w7b">${names}${roles}</div></div>`;
  }
  html+='</div>';
  // Who's on used to sit here, under the hero and the week strip. It is at the top of the page
  // now — see the note by changeBanner() above.
  html+=subscribeNudge();     // after the schedule itself, before the footnote
  html+=`<div class="note">Every off and CME day you asked for was granted this block.</div>`;
  pane.innerHTML=html;
  wireInstallCard();
  wireChangeBanner();
  wireNudge();
  wireDayNav();
  $$('.sday',pane).forEach(d=>{d.onclick=()=>openDay(d.dataset.iso);
    d.setAttribute('role','button');d.setAttribute('tabindex','0');
    d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDay(d.dataset.iso);}};});
}

/* ---------- SCHEDULE ---------- */
let schedView='cal';

/* A subscription beats a download: a downloaded .ics is a snapshot that goes stale the moment
   anything changes, which is exactly the complaint. Calendar apps re-poll this URL. */
function subscribeCard(){
  if(!ME)return '';
  /* THE LINK AND THE NAME ON IT MUST BE THE SAME PERSON.
     The feed address is minted per person by the server, so for the moment between switching
     physician and that answer arriving there is no correct link to show. This card used to
     render the previous one under the new person's name: the button read "Add Emily Horn's
     shifts" and subscribed you to Bailey's 76 shifts. A calendar subscription is not a page you
     can back out of — it lands on the phone and stays — so a link that might be the wrong
     person's must not be tappable at all. */
  if(CFG&&CFG.icsFor!==ME)
    return `<div class="swcard"><div class="lgh">Add to your calendar</div>
      <div class="sub">Getting ${esc(fullOf(ME)||ME)}'s calendar link…</div></div>`;

    return `<div class="swcard"><div class="lgh">Add to your calendar</div>
      <div class="sub">No calendar for this account — it has no schedule of its own. Open a
        physician from the ▾ menu to subscribe to theirs.</div></div>`;
  const url=icsAbsolute();
  const webcal=url.replace(/^https?:/,'webcal:');
  const whose=onBehalf()?fullOf(ME):null;
  const n=myShifts(ME).length;
  return `<h2 class="sec">Take it with you</h2>
  <div class="swcard subcard">
    <div class="lgh">${whose?'Subscribe to '+esc(whose)+"'s shifts":'Subscribe in your calendar'}</div>
    <div class="sub">${whose
      ? 'You are looking at <b>'+esc(whose)+'</b>, so this adds <b>their</b> shifts to your '+
        'calendar — not yours. It appears as <b>CCPSA — '+esc(ME)+'</b>.'
      : 'Your shifts appear in the calendar you already use and <b>keep themselves up to '+
        'date</b> — a swap or a change reaches it on its own.'} Your phone decides how often to
      re-check, usually within the hour, so <b>for a change that just happened, this app is the
      one to trust</b>.</div>
    <div class="btnrow">
      <a class="btn pri" href="${webcal}">${whose?'Subscribe to '+esc(whose)+"'s shifts":'Subscribe in my calendar'}</a>
    </div>
    <div class="minorrow">
      <a href="#" id="dlIcs">One-off calendar file</a>
      <a href="#" id="dlCsv">CSV</a>
      <a href="#" id="doPrint">Print</a>
    </div>
    <details class="icsmore"><summary>Adding it on a computer?</summary>
      <div class="sub" style="margin-top:6px">Paste this into Google Calendar or Outlook —
        "add by URL", not import.</div>
      <div class="muted sm" style="margin-top:5px;word-break:break-all">${esc(url)}</div>

/* ---------- what a printed schedule is ----------
   One person's shifts, by month, on white paper: the date, what they are on, and the hours. Not
   the app — the app is a phone layout of cards and a tab bar, and hiding parts of it does not
   produce something anyone would pin to a fridge.

   Built at the moment of printing so it is always the schedule currently being looked at,
   including any change the scheduling lead has just made. */
const SHIFT_HOURS={noc:'5pm – 11:59pm', icu:'7am – 5pm', swing:'5pm – 11:59pm', clinic:'7am – 5pm'};
function hoursOf(m){ return SHIFT_HOURS[m.kind]||''; }

function buildPrintable(){
  let host=document.querySelector('#printOnly');
  if(!host){ host=el('div',''); host.id='printOnly'; document.body.appendChild(host); }
  const who=ME?(fullOf(ME)||ME):null;
  if(!who){ host.innerHTML=''; return; }
  /* BOTH QUARTERS on the printable too. myShifts() defaults to the LIVE block, so the sheet you
     printed or saved as PDF ended at 1 October while the app beside it showed July onwards.
     allShifts() is the pair-aware version that already existed for exactly this. Client 8/26. */
  const shifts=allShifts(ME);
  const when=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  // The heading names the range actually printed. It said "Q4 · Oct-Dec" over a sheet that now
  // starts in July, which is a caption contradicting the thing under it.
  const _sp=spanDates();
  const _rng=_sp.length?(fmtD(_sp[0])+' – '+fmtD(_sp[_sp.length-1])):(DATA.blockLabel||'');
  let h='<h1>'+esc(who)+'</h1><div class="pmeta">'+esc(_rng)+
        (_rng?' · ':'')+shifts.length+' shift'+(shifts.length===1?'':'s')+
        ' · printed '+esc(when)+'</div>';
  if(!shifts.length){
    h+='<p>No shifts in this block.</p>';
  }else{
    let month='';
    shifts.forEach(s=>{
      const d=d2(s.iso), mk=d.getFullYear()+'-'+d.getMonth();
      if(mk!==month){
        if(month)h+='</tbody></table>';
        month=mk;
        h+='<h2>'+esc(MONL[d.getMonth()]+' '+d.getFullYear())+'</h2>'+
           '<table><thead><tr><th>Date</th><th>Shift</th><th>Hours</th></tr></thead><tbody>';
      }
      const wknd=[0,6].includes(d.getDay());
      h+='<tr'+(wknd?' class="we"':'')+'><td class="pd">'+esc(fmtD(s.iso))+'</td><td>'+
         esc(shiftLabel(ME,s.iso,s.shift,false))+'</td><td class="pt">'+esc(hoursOf(s.m))+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="pnote">Hours are the standard ones for each shift type. A printed copy does '+
       'not update — check the app for anything that changed after '+esc(when)+'.</div>';
  }
  host.innerHTML=h;
}

window.addEventListener('afterprint',()=>{

function renderSched(){
  const pane=$('#pane-sched');

     gets acted on — a physician checking a colleague's nights and reading them as their own. When
     visiting, the heading says the name and a line underneath says what is and is not on screen,
     because a tab quietly missing is worse than a tab explained. */
  const vis=visitingOn();

     2026-09-03: "that should be embedded in the schedule tab … but i still want just 4 tabs at

          const ds=shown.filter(s=>META(s).kind!=='noc'),ns=shown.filter(s=>META(s).kind==='noc');

            const _ink=_worst('#0B1220')>=_worst('#FFFFFF')?'#0B1220':'#FFFFFF';

      }
      html+='</div></div>';

    html+=`<div class="note"><b style="color:var(--ink)">Reading the calendar.</b> Colour = the unit. A moon marks an overnight;
      a split cell is a 24-hour shift. <b style="color:var(--info-ink)">CME</b> marks a CME day.
      ● is a day you asked to work, ○ a day off you requested. <b style="color:var(--signal)">Today</b>

  }else{
    const all=myShifts(ME,blockDates(),vDayOf).sort(byTime);
    if(!all.length)html+='<div class="empty">Nothing scheduled this block.</div>';
    let lastMo='';
    all.forEach(s=>{

/* ---------- downloads ---------- */
function icsStamp(iso,h,mi){return iso.replace(/-/g,'')+'T'+String(h).padStart(2,'0')+String(mi).padStart(2,'0')+'00';}
function downloadICS(){
  /* BOTH QUARTERS. This walked DATA.dates, which is Q4 alone, so the file you downloaded stopped
     at 1 October while the app either side of it showed July onwards. Sam, 8/26: the one-off
     files should carry Q3 too. spanDates() is the full range the app knows and anyDayOf() reads
     from whichever quarter the date belongs to — the same pair every other cross-quarter view
     uses. The calendar NAME loses "Q4" with it, because it is no longer true. */
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scheduling Wizard//CCPSA//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
           'X-WR-CALNAME:CCPSA - '+fullOf(ME)];
  let n=0;
  const _sp=spanDates(), _from=_sp[0], _to=_sp[_sp.length-1];
  const _all=[];
  for(let d=_from; d<=_to; d=isoAdd(d,1)) if(knownDate(d)) _all.push(d);
  _all.forEach(iso=>{
    const a=anyDayOf(ME,iso);if(!a)return;
    // Same rule as every other view: protected time is not an appointment and does not belong in
    // anyone's calendar app. The SERVER feed has always filtered it; this one-off download did
    // not, so the file you tapped "download" on disagreed with the feed you subscribed to.
    a.s.filter(s=>isRealShift(ME,iso,s)).forEach(s=>{
      const m=META(s),hrs=DATA.kindHours[m.kind];
      const uid=`${iso}-${s.replace(/[^A-Za-z0-9]/g,'')}-${ME}@schedulingwiz`;
      L.push('BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+icsStamp(DATA.generated,0,0)+'Z');
      if(!hrs){
        L.push('DTSTART;VALUE=DATE:'+iso.replace(/-/g,''),'DTEND;VALUE=DATE:'+isoAdd(iso,1).replace(/-/g,''));
      }else{
        // (startH, startM, endH, endM). An end before the start still means the next day, which
        // no current shift does — nights stop at 23:59 — but the rule is about the times.
        const[h,mi,eh,em]=hrs;
        const endIso=(eh<h||(eh===h&&em<mi))?isoAdd(iso,1):iso;
        L.push('DTSTART:'+icsStamp(iso,h,mi),'DTEND:'+icsStamp(endIso,eh,em));
      }
      L.push('SUMMARY:'+shiftLabel(ME,iso,s,false),'LOCATION:'+m.sub.replace(/,/g,''),
             'DESCRIPTION:'+(m.sub+((a.r&&a.r.length)?' — also '+a.r.join(', '):'')).replace(/,/g,'\\,'),
             'END:VEVENT');
      n++;
    });
    (a.r||[]).forEach(r=>{
      const lab=(DATA.roles[r]||{label:r}).label;
      L.push('BEGIN:VEVENT','UID:'+iso+'-'+r.replace(/[^A-Za-z0-9]/g,'')+'-'+ME+'@schedulingwiz',
        'DTSTAMP:'+icsStamp(DATA.generated,0,0)+'Z',
        'DTSTART;VALUE=DATE:'+iso.replace(/-/g,''),'DTEND;VALUE=DATE:'+isoAdd(iso,1).replace(/-/g,''),
        'SUMMARY:'+lab,'DESCRIPTION:Layered role','END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  save(L.join('\r\n'),`CCPSA-${ME}-Q4-2026.ics`,'text/calendar');
}
function downloadCSV(){
  const head=['Date','Day','Shift','Where','Type','Roles'];
  const rows=[];
  // Both quarters, same reason as the .ics beside it: a download that stops at 1 October is not
  // the schedule the app is showing.
  const _sp=spanDates(), _to=_sp[_sp.length-1];
  const _all=[];
  for(let d=_sp[0]; d<=_to; d=isoAdd(d,1)) if(knownDate(d)) _all.push(d);
  _all.forEach(iso=>{
    const a=anyDayOf(ME,iso);if(!a)return;
    const shown=a.s.filter(s=>isRealShift(ME,iso,s));
    shown.forEach(s=>{const m=META(s);
      rows.push([iso,DOW[dowOf(iso)],shiftLabel(ME,iso,s,false),m.sub,m.kind,(a.r||[]).join(' / ')]);});
    if(!shown.length&&a.r&&a.r.length)rows.push([iso,DOW[dowOf(iso)],'—','','role',a.r.join(' / ')]);
  });
  // A column nobody has anything in is a column to leave out. Most physicians hold no layered
  // role, so Roles arrived as a header over 39 empty cells — and an empty column in a
  // spreadsheet reads as missing data rather than as "does not apply here".
  const keep=head.map((_,i)=>rows.some(r=>String(r[i]||'').trim()!==''));
  const cut=r=>r.filter((_,i)=>keep[i]);
  save([cut(head)].concat(rows.map(cut))
         .map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),
       `CCPSA-${ME}-Q4-2026.csv`,'text/csv');
}
function save(txt,name,mime){
  const b=new Blob([txt],{type:mime+';charset=utf-8'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);
}

/* ---------- when may we record? ----------
   Anything that puts a credential on the glass closes the recorder. Checked from the DOM rather
   than tracked with a flag, because a flag left set by an early return is a recording that never
   restarts, and a flag left CLEAR by one is a recording of a secret. The DOM cannot disagree with
   what is on screen.

     .signin    the sign-in card — access code and password
     #gate      identity chooser, shown before anything is authenticated
     body.locked  pre-auth, nothing has been unlocked yet
     .ph-no-capture visible  a TOTP secret, its QR, or a recovery code is on screen right now

   Called on every sheet open and close, on sign-in, and after boot. */
function replaySensitive(){
  try{
    if(document.body.classList.contains('locked'))return true;
    if(document.querySelector('.signin'))return true;
    const g=document.querySelector('#gate');
    if(g&&getComputedStyle(g).display!=='none')return true;
    /* ASK THE MARKUP, NOT THE PIXELS. Two wrong versions of this are worth recording.

       First tried width/height: a closed sheet keeps its markup and is parked off-screen with a
       transform, so its box stays full size and it read as visible forever -- the recorder, once
       stopped by an auth sheet, never restarted.

       Then tried intersecting the viewport, which was worse in the way that matters. The sheet
       ANIMATES: .on is added and the transform runs from translateY(102%) over .22s. Checking at
       the moment it opens finds it still off-screen, so recording carried on THROUGH the secret
       appearing; checking as it closes finds it still at translateY(0), so recording stopped
       once the secret had gone. Exactly inverted, and only against a real browser -- the stub
       had no transitions, which is why it passed.

       Position is the wrong question. A sheet is showing when it carries .on, whatever its
       transform is doing this frame, and that is knowable the instant the class changes. */
    for(const el of document.querySelectorAll('.ph-no-capture')){
      const sh=el.closest('#sheet');
      if(sh) { if(sh.classList.contains('on')) return true; continue; }
      const r=el.getBoundingClientRect();
      if(r.width<=0||r.height<=0)continue;
      const cs=getComputedStyle(el);
      if(cs.visibility==='hidden'||cs.display==='none'||parseFloat(cs.opacity||'1')===0)continue;
      return true;

const api=async(path,opts={})=>{
  const h={'Content-Type':'application/json',...(opts.headers||{})};
  if(SESSION&&SESSION.token)h.Authorization='Bearer '+SESSION.token;
  // Tell the API which day we are pretending it is. It only honours this on the test
  // deployment, so the same header sent at production is ignored.
  const td=testToday(); if(td)h['x-test-today']=td;
  // The endpoint WITHOUT its query string: '/requests?person=Stramel' is the same call as
  // '/requests?person=Horn' and should group as one. A query string here would also be the
  // easiest accidental route for a physician's name into analytics.
  const ep=String(path).split('?')[0];
  const t0=Date.now();
  let r;
  /* NOTHING WAITS FOREVER (Sam, 2026-09-04: "when I pressed offer it on a trade, it said sending
     for a very long time and didnt do anything").
     There was no timeout anywhere in this app. A fetch that never settles leaves whatever called
     it awaiting a promise that will not resolve — the button stays disabled, the message stays
     "Sending…", and there is no error to show because nothing failed. It just stops. On a phone
     moving between wifi and cell that is not a rare case, and every screen in here is one await
     away from it.
     45s is long enough that a cold start is never mistaken for a hang — the slowest real response
     measured today was 12.6s — and short enough to be an answer rather than a wait. AbortError is
     translated, because "The user aborted a request" describes the code and not the situation. */
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const cap=opts.timeout||45000;
  const bell=ctl?setTimeout(()=>ctl.abort(),cap):null;
  try{ r=await fetch(API+path,{...opts,headers:h,signal:ctl?ctl.signal:undefined}); }
  catch(err){
    if(err&&(err.name==='AbortError'||err.code===20)){
      track('api_timeout',{endpoint:ep,ms:Date.now()-t0,method:(opts.method||'GET')});
      throw Object.assign(new Error('The connection timed out. Nothing was sent — try again.'),
                          {timeout:true});
    }
    // Offline, DNS, CORS, a dead deployment — none of which produce a status code, and all of
    // which look identical to the person holding the phone.
    track('api_error',{endpoint:ep,status:0,ms:Date.now()-t0,
      method:(opts.method||'GET'),reason:String(err&&err.message||err).slice(0,120)});
    throw err;
  }finally{ if(bell)clearTimeout(bell); }
  const ms=Date.now()-t0;
  let j={}; try{j=await r.json();}catch(e){}
  if(!r.ok){
    track('api_error',{endpoint:ep,status:r.status,ms,method:(opts.method||'GET'),
      reason:String(j.error||'').slice(0,120)});
    throw Object.assign(new Error(j.error||('HTTP '+r.status)),{payload:j,status:r.status});
  }
  // Cold starts are the thing that makes this app feel broken, so slow SUCCESSES matter as much
  // as failures. Only the slow ones, or every tap becomes an event.
  if(ms>2000)track('api_slow',{endpoint:ep,ms,method:(opts.method||'GET')});
  return j;
};
/* ---------- Face ID / Touch ID ----------
   A passkey is a private key the phone keeps in its own secure hardware. It never leaves the
   device and this code cannot read it; the server holds only the matching public key, so there
   is nothing in the store worth stealing. The phone will not sign unless the face or fingerprint
   matched, which is what lets this replace the password rather than sit alongside it.

const PK_SUPPORTED = !!(window.PublicKeyCredential && navigator.credentials &&
                        navigator.credentials.create);
async function pkAvailable(){
  if(!PK_SUPPORTED)return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }

function pkB64(buf){
  const a=new Uint8Array(buf); let s='';
  for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);

}
function pkBuf(s){
  const t=String(s||'').replace(/-/g,'+').replace(/_/g,'/');

  const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a.buffer;
}

async function enrollPasskey(){
  const o=await api('/passkey',{method:'POST',body:JSON.stringify({action:'register-options'})});
  const pk=o.publicKey;
  pk.challenge=pkBuf(pk.challenge);
  pk.user.id=pkBuf(pk.user.id);
  pk.excludeCredentials=(pk.excludeCredentials||[]).map(c=>({...c,id:pkBuf(c.id)}));
  const cred=await navigator.credentials.create({publicKey:pk});
  if(!cred)throw new Error('No passkey was created.');
  const r=cred.response;
  // getPublicKey() hands over the key in SPKI form, which is what the server can verify with
  // directly — the alternative is decoding CBOR to reach the same bytes.
  if(!r.getPublicKey)throw new Error('This browser is too old for Face ID sign-in.');
  await api('/passkey',{method:'POST',body:JSON.stringify({
    action:'register', challengeToken:o.challengeToken, id:cred.id,
    clientDataJSON:pkB64(r.clientDataJSON),
    publicKey:pkB64(r.getPublicKey()), alg:String(r.getPublicKeyAlgorithm()),
    label:(/iPhone|iPad/.test(navigator.userAgent)?'iPhone':
           /Mac/.test(navigator.userAgent)?'Mac':'This device')})});
  try{localStorage.setItem('ccpsa_passkey','1');}catch(e){}
}

async function signInWithPasskey(){
  const post=(body)=>fetch(API+'/passkey',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(async r=>{const j=await r.json().catch(()=>({}));
                    if(!r.ok)throw new Error(j.error||'Could not sign in');return j;});
  const o=await post({action:'login-options'});
  const pk=o.publicKey; pk.challenge=pkBuf(pk.challenge);
  const cred=await navigator.credentials.get({publicKey:pk});
  if(!cred)throw new Error('Cancelled');
  const r=cred.response;
  const j=await post({action:'login', challengeToken:o.challengeToken, id:cred.id,
    clientDataJSON:pkB64(r.clientDataJSON), authenticatorData:pkB64(r.authenticatorData),
    signature:pkB64(r.signature), userHandle:pkB64(r.userHandle||new ArrayBuffer(0))});
  try{sessionStorage.setItem('__tok',j.token);
      localStorage.setItem('ccpsa_passkey','1');}catch(e){}
  keepDevice(j.device); keepGrant(j.grant);
  await loadPortal(j.token);
}
