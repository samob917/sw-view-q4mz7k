<script>
// The schedule is NOT in this file. It is fetched from the API for the signed-in person, so a
// downloaded copy of this page is worth nothing and access can be revoked server-side.
let DATA=null;
window.__portalBooted=true;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const d2=iso=>new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10));
const dowOf=iso=>(d2(iso).getDay()+6)%7;
/* ---------- which day starts the week ----------
   The month grid runs Mon..Sun, so Saturday and Sunday sit together on the right and a run of
   nights reads as one block. Plenty of people expect the American calendar instead, Sun..Sat,
   and neither is wrong -- so it is a preference rather than a decision.

   dowOf() IS NOT TOUCHED BY THIS, deliberately. It is Monday-indexed and is used for two quite
   different things: naming a day (DOW[dowOf(iso)]) and asking whether it is a weekend
   (dowOf(iso)>=5, in the weekend counts and the group shading). Re-basing it for a Sunday-first
   grid would silently make Friday a weekend and Sunday a weekday everywhere those live. Column
   position is a third question and gets its own function. */
/* SUNDAY BY DEFAULT (Aaron, 2026-08-25): "so the view matches most peoples calendar apps".
   It is also what Intl.Locale.getWeekInfo() reports for en-US, so the request and the device
   convention agree. Anyone who set the preference keeps their choice — only the default moves. */
/* CALENDAR TEXT SIZE. Someone asked for bigger type and seeing a whole month at once is the
   feature people liked, so the two pull against each other: every point of size costs column
   width. One dial drives the date, the chip and the day letters together, and fitChips still
   guarantees no label is cut off — a larger setting condenses more rather than clipping.
   Per device, because it is about the screen in your hand, not about you. */
/* FIVE SIZES, AND THE TOP ONE IS WHERE IT MEASURABLY STOPS. Pushed until labels actually broke:
   1.75 is clean at every supported width, 2.0 cuts three labels at 320px and 2.5 cuts
   twenty-four. So the ceiling is 1.75, found rather than guessed.
   An earlier note here claimed 1.5 was past the point where a month fits one screen. It is not
   — a month at 1.75 is 557px against an 852px phone. What the largest sizes actually cost is
   condensing: the longest labels squeeze to about three-quarters width to stay whole. */
const CALSIZES={1:'Normal',1.15:'Large',1.3:'Larger',1.5:'Largest',1.75:'Huge'};
let CALSCALE=1;
try{ const v=parseFloat(localStorage.getItem('ccpsa_calscale')); if(CALSIZES[v])CALSCALE=v; }catch(e){}
/* HOW TALL IS THE TEST BANNER RIGHT NOW. It is a ::before with wrapping text, so its height
   depends on the width — measured rather than assumed, and re-measured on rotate. */
function measureBanner(){
  try{
    const cs=getComputedStyle(document.body,'::before');
    const on=cs && cs.content && cs.content!=='none' && cs.content!=='normal';
    /* THE FULL BOX, NOT THE CONTENT BOX. getComputedStyle(::before).height reports the CONTENT
       height and the banner carries the status-bar inset as padding — 33px of text inside a
       104px bar. Sticking the header to 33px would have put it back underneath, which is the
       bug this whole change exists to fix. Padding and border are added back. */
    const px=v=>parseFloat(v)||0;
    const h=on ? Math.round(px(cs.height)+px(cs.paddingTop)+px(cs.paddingBottom)
                            +px(cs.borderTopWidth)+px(cs.borderBottomWidth)) : 0;
    document.documentElement.style.setProperty('--bannerh', h+'px');
    // When a banner is present it has already taken the status-bar inset, so the header must
    // not take it a second time. In production there is no banner and this stays unset, which
    // leaves header.top on env(safe-area-inset-top) exactly as before.
    document.documentElement.style.setProperty('--hdrsafe', on ? '0px' : '');
  }catch(e){}
}
addEventListener('resize',measureBanner);
addEventListener('orientationchange',()=>setTimeout(measureBanner,250));
function applyCalScale(){
  try{ document.documentElement.style.setProperty('--calscale', String(CALSCALE)); }catch(e){}
}
function setCalScale(v){
  v=parseFloat(v); if(!CALSIZES[v])v=1;
  CALSCALE=v;
  try{ localStorage.setItem('ccpsa_calscale', String(v)); }catch(e){}
  applyCalScale();
}
let WEEKSTART='sun';
try{ const w=localStorage.getItem('ccpsa_weekstart'); if(w==='mon'||w==='sun')WEEKSTART=w; }catch(e){}
function setWeekStart(v){
  WEEKSTART = (v==='sun') ? 'sun' : 'mon';
  try{ localStorage.setItem('ccpsa_weekstart', WEEKSTART); }catch(e){}
}
// Header labels in display order. DOW is Mon..Sun, so Sunday-first is Sunday lifted to the front.
const dowLabels=()=>WEEKSTART==='sun' ? [DOW[6]].concat(DOW.slice(0,6)) : DOW;
// Which column a date falls in. Sunday-first shifts everything one to the right and wraps Sunday
// round to the front: Sun 6->0, Mon 0->1, ... Sat 5->6.
const colOf=iso=>WEEKSTART==='sun' ? (dowOf(iso)+1)%7 : dowOf(iso);
// Blank cells before the 1st. getDay() is 0=Sun natively, which is already the Sunday-first answer.
const leadFor=d=>WEEKSTART==='sun' ? d.getDay() : (d.getDay()+6)%7;
const fmtD=iso=>{const d=d2(iso);return DOW[dowOf(iso)]+', '+MON[d.getMonth()]+' '+d.getDate();};
const fmtLong=iso=>{const d=d2(iso);return DOW[dowOf(iso)]+', '+MONL[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();};
/* LOCAL DATE, NEVER UTC. toISOString() converts to UTC first, and every screen here turns on
   what day it is. In Denver that made the app say tomorrow from 6pm every evening — the next
   shift, the highlighted day, the days-left countdown, which quarter it opens on, all one day
   out for the last six hours of every day. Reported from a laptop on Eastern time at 22:34 on
   the 25th, where the app said the 26th; UTC had already rolled over.
   d2() builds a LOCAL midnight, so reading it back through toISOString() was wrong in the other
   direction too, east of UTC. One formatter, used by all of them. */
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'
              +String(d.getDate()).padStart(2,'0');
const isoAdd=(iso,n)=>{const d=d2(iso);d.setDate(d.getDate()+n);return isoOf(d);};
// WHAT DAY IS IT. Almost every screen turns on this — the next shift, what is highlighted,
// whether requests are still open. On the test site it can be moved, so a date months away can
// be looked at without waiting for it. Production has no such control and always reads the clock.
const realTodayISO=()=>isoOf(new Date());
function testToday(){
  if(typeof TEST_BUILD==='undefined'||!TEST_BUILD)return null;
  try{ return localStorage.getItem('__today')||null; }catch(e){ return null; }
}
const todayISO=()=>testToday()||realTodayISO();
const META=s=>DATA.meta[s]||{label:s,sub:'',kind:'other',color:'#7C8FA6'};
/* THE INK ON A COLOURED CHIP FOLLOWS THE CHIP, NOT THE THEME. These were drawn with the page's
   own background colour as the text — near-black on dark, which works on a bright unit colour
   and fails on a dim one, and near-white in light mode, which fails on nearly all of them. The
   unit colours are fixed by the client and cannot be re-picked, so the text has to be chosen
   per chip: black on a light colour, white on a dark one. */
function chipLum(hex){
  const h=String(hex||'').replace('#','');
  if(h.length!==6)return 1;
  const v=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255)
    .map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));
  return .2126*v[0]+.7152*v[1]+.0722*v[2];
}
// Both ratios are worked out and the better one wins, rather than guessing where the crossover
// sits. A guessed threshold of .42 put white on the mid-tone reds and blues, where black is
// nearly three times the contrast — the real crossover is about .18.
function chipInk(hex){
  const L=chipLum(hex);
  return ((L+.05)/.05) >= (1.05/(L+.05)) ? '#0B1220' : '#FFFFFF';
}
// An Admin block on a meeting day is the meeting. Everywhere the portal names a shift it asks
// this first, so the answer cannot differ between the calendar, the day sheet and the list.
const mtgTag=(person,iso)=>((DATA.adminMtg||{})[iso]||{})[person]||null;
// Is this Admin block a scheduled event, or contract time the solver placed? Only the first
// belongs on a schedule. The admin dashboard has always hidden the second; the physician's own
// app was showing it as "Protected time", which is a tag for something nobody attends.
const isRealShift=(person,iso,shift)=>
  shift!=='Admin' || ((DATA.adminShown||{})[iso]||[]).includes(person);
function shiftLabel(person,iso,shift,short){
  if(shift==='Admin'){
    // "Admin" is a category in the solver, not a thing anyone is asked to attend. On the day of
    // a managing-team or triad meeting it IS that meeting and should say so; the rest is
    // protected time the solver placed to fill a contract. Either way the physician should not
    // be reading the word Admin off their own calendar and wondering what it means.
    const t=mtgTag(person,iso);
    if(t)return (short?(DATA.mtgShort||{}):(DATA.mtgLong||{}))[t]||t;
    return short?'Protected':'Protected time';
  }
  const m=META(shift);
  return short?(m.short||m.label):m.label;
}
const isICU=s=>DATA.icu.includes(s), isNOC=s=>DATA.noc.includes(s);
const f1=x=>Number.isInteger(x)?x:Math.round(x*100)/100;
/* Day equivalents to a tenth, for display only.
   A contract of 0.33 admin days a month times three blocks is 0.99, so a physician who is
   exactly level reads as 57.99 worked against 54 — hundredths of a shift that mean nothing to
   anybody and make a headline number look broken. The difference shown is worked-minus-contract
   AFTER both are rounded, so the three numbers on screen always agree with each other. */
const deN=x=>{const r=Math.round(x*10)/10; return Number.isInteger(r)?r:r.toFixed(1);};

/* ---------- identity ----------
   Identity is whoever the SERVER says you are. It used to come from decrypting a slot in the
   page, which meant the page had to contain everyone's schedule for anyone to read their own. */
let ACCT=null, ADMIN_HTML=null, ROLE='doctor', CAN_SWITCH=false, ME=null;
function setIdentity(person,role,label){
  ROLE=role||'doctor';
  // The account key is the last resort, not the name: it reads as "sam" or "Greco". The API
  // sends the label from the accounts table; a physician falls back to their own full name.
  ACCT={person,role:ROLE,label:label||fullOf(person)||person};
  /* EVERY PHYSICIAN CAN LOOK AT EVERY OTHER PHYSICIAN'S SCHEDULE (Nadon, 2026-08-25). This was
     admin-only, which is what Mary Elmasri ran into: she could see who was on a given day but
     could not open one person and read their quarter.

     SWITCHING IS NOT ADMIN ACCESS, and the two must not be confused. What a switch changes is
     WHOSE SCHEDULE IS DRAWN — the schedule is already in the page for everyone, because "who's
     on" and the coverage pickers have always needed it. What it does NOT change for a physician
     is whose requests, time off, CME and swaps are shown: those stay their own. See visitingOn()
     and the tab rule in go().

     The server never had to be trusted differently for this. requests.js and coverage.js resolve
     "who" as (role === 'admin' && asked-for) || me.person, and swaps.js filters to the swaps you
     are a party to — so a physician who asks for somebody else's records is handed their own,
     whatever the client does. This change only stops the app from hiding a view of data it was
     already entitled to draw. */
  CAN_SWITCH=true;
  // A physician is fixed to themselves. An admin who is also a physician (Nadon) opens on their
  // OWN schedule with a toggle to the admin view; an admin who is not (Sam) has no schedule of
  // their own, so they go straight to the admin view.
  /* EITHER QUARTER. This asked DATA.people, which is the Q4 roster, so anybody who works only
     the earlier block was treated as an account with no schedule and shown "Choose a physician
     first" on every tab. CJ Mowry is exactly that: one shift, 16 August, and no Oct-Dec work —
     an account issued to him this week that showed him nothing. */
  ME=(person&&whoRoster().includes(person))?person:null;
  // Signing in should land on a SCHEDULE, not a dashboard — for an admin too. Nadon has a
  // schedule of their own; Sam, Zac and AB do not, so they resume whoever they were last
  // looking at. The admin view is then something you choose, not where you are dropped.
  if(!ME && ROLE==='admin'){
    try{ const last=localStorage.getItem('ccpsa_me');
         if(last && DATA.people.includes(last)) ME=last; }catch(e){}
  }
  // (IS_ADMIN_ONLY used to live here. It was computed once at sign-in and never again, so it
  // still said "admin only" after a physician had been chosen — boot() then bounced back to the
  // admin view. boot() asks !ME directly now.)
}
let BOOTED=false;

function initials(n){const p=DATA.providers[n]||{};return ((p.first||n)[0]+n[0]).toUpperCase();}
const firstOf=n=>((DATA.providers[n]||{}).first||n);
const fullOf=n=>{const p=DATA.providers[n]||{};return p.first?p.first+' '+n:n;};
function renderGate(filter){
  const list=$('#gateList');list.innerHTML='';
  const q=(filter||'').trim().toLowerCase();
  const ppl=DATA.people.filter(n=>!q||n.toLowerCase().includes(q)||((DATA.providers[n].first||'').toLowerCase().includes(q)));
  if(!ppl.length){list.innerHTML='<div style="padding:16px;color:var(--dim);font-size:13.5px">No one by that name. Check the spelling, or ask Sam to add you.</div>';return;}
  ppl.forEach(n=>{
    const p=DATA.providers[n];
    // Names only. Employed / APP / moonlighter / partner is a contracting distinction and has
    // no business on a screen whose only job is "open this person's schedule".
    const b=el('button','pitem',`<span class="av">${esc(initials(n))}</span>
      <span><span class="nm">${esc(p.first?p.first+' '+n:n)}</span></span>`);
    b.onclick=()=>{
      ME=n;try{localStorage.setItem('ccpsa_me',n);}catch(e){}   // survives a reload too
      MYREQ=null;
      const tab=(CUR&&CUR!=='admin')?CUR:'now';
      closeGate();
      hideAdminView();                 // viewing a physician is not the admin view
      boot();
      markBar('pick');
      go(tab);
    };
    list.appendChild(b);
  });
}
// The picker is a full-screen overlay (z-index above the header), so the admin toggle is
// painted over while it is open — you could get in but not back out. It carries its own way
// back, mirroring whatever the toggle offers.
let GATE_FROM=null;
function openGate(){
  GATE_FROM=document.querySelector('#admWrap.on')?'admin':'mine';
  const top=$('#gateTop');
  if(top){
    // The same three controls, not a lone back arrow: the overlay covers the header, so the
    // toggle has to exist here or it looks like it vanished.
    top.innerHTML=(ROLE==='admin'
        ?'<button class="gback" data-g="home">Home</button>'+
         '<button class="gback" data-g="admin">Admin view</button>':'')+
      '<button class="gback on" data-g="pick">Providers</button>';
    top.querySelectorAll('.gback').forEach(bt=>bt.onclick=()=>{
      const v=bt.dataset.g;
      if(v==='pick')return;
      closeGate();
      if(v==='home'){showAdminHome();markBar('home');}
      else if(v==='admin'){showAdminView();markBar('admin');}
      else{hideAdminView();if(ME){boot();}markBar('pick');}
    });
  }
  $('#gate').style.display='block';$('#gateSearch').value='';renderGate('');
}
function closeGate(){$('#gate').style.display='none';}

/* ---------- switch physician, from the chip ---------- */
function closePicker(){
  const d=document.querySelector('.pdrop');
  if(d){ if(d._place)window.removeEventListener('resize',d._place); d.remove(); }
}
function togglePicker(){
  if(document.querySelector('.pdrop')){ closePicker(); return; }
  const chip=document.querySelector('#whoami');
  const d=el('div','pdrop');
  d.innerHTML='<div class="pds"><input id="pdq" type="search" placeholder="Search providers" '+
              'autocapitalize="none" spellcheck="false"></div><div class="pdlist" id="pdl"></div>';
  document.body.appendChild(d);
  // Anchored to the chip itself. It used to hang off the header element, which put it below the
  // whole header — under the toggle bar, nowhere near the thing that was clicked.
  const place=()=>{
    const r=chip.getBoundingClientRect();
    d.style.top=Math.round(r.bottom+6)+'px';
    d.style.right=Math.max(8,Math.round(window.innerWidth-r.right))+'px';
  };
  place();
  window.addEventListener('resize',place);
  d._place=place;
  const paint=q=>{
    const t=(q||'').trim().toLowerCase();
    /* whoRoster(), not DATA.people. DATA.people is the CURRENT block's roster, so anybody who
       works only the archived quarter was missing from the list entirely — the same Q4-only
       assumption that showed CJ Mowry an empty app. If the point is to look up any physician,
       the list has to be every physician. */
    const ppl=whoRoster().filter(nm=>!t||nm.toLowerCase().includes(t)||
      ((DATA.providers[nm]||{}).first||'').toLowerCase().includes(t));
    const box=document.querySelector('#pdl');
    if(!ppl.length){ box.innerHTML='<div class="pdnone">Nobody by that name.</div>'; return; }
    box.innerHTML=ppl.map(nm=>`<button class="pdrow${nm===ME?' on':''}" data-p="${esc(nm)}">
        <span class="av">${esc(initials(nm))}</span><span>${esc(fullOf(nm))}</span></button>`).join('');
    box.querySelectorAll('.pdrow').forEach(b=>b.onclick=()=>{
      const nm=b.dataset.p;
      closePicker();
      if(nm===ME)return;                       // already on them; nothing to reload
      ME=nm; try{localStorage.setItem('ccpsa_me',nm);}catch(e){}
      MYREQ=null;
      // Staying on the tab you were on is right for an admin, who is switching who they work on.
      // A physician switching to READ somebody lands on the schedule: it is the only thing that
      // changed, and go() would bounce them off Requests or Swaps anyway.
      const vis=(ROLE!=='admin'&&nm!==ACCT.person);
      const tab=vis?'sched':((CUR&&CUR!=='admin')?CUR:'now');
      hideAdminView(); boot(); markBar('pick'); go(tab);
    });
  };
  paint('');
  const q=document.querySelector('#pdq');
  q.addEventListener('input',ev=>paint(ev.target.value));
  q.addEventListener('keydown',ev=>{
    if(ev.key==='Escape'){ closePicker(); return; }
    if(ev.key==='Enter'){ const first=document.querySelector('.pdrow'); if(first)first.click(); }
  });
  setTimeout(()=>q.focus(),40);
  // Clicking anywhere else closes it, which is what a menu does.
  setTimeout(()=>document.addEventListener('click',function once(ev){
    if(!ev.target.closest('.pdrop')&&!ev.target.closest('#whoami')){ closePicker(); }
    if(!document.querySelector('.pdrop'))document.removeEventListener('click',once);
  }),0);
}

/* ---------- my data ---------- */
/* WHICH BLOCK THE SCHEDULE TAB IS SHOWING. 'live' is the published quarter and the only one
   anything can be done to; 'archive' is the previous quarter, readable and nothing else.
   Deliberately NOT persisted: the live block is what matters day to day, and an app that opens
   on last quarter because you once looked at it is an app that lies about today. */
/* WHICH QUARTER THE CALENDAR OPENS ON: the one that contains today, according to the device.
   On 25 August that is Q3, which is the quarter they are actually working — opening on Q4
   showed everybody an empty October instead of this week. Computed per load rather than stored,
   so it follows the calendar forward on its own and needs no migration when Q4 becomes current.
   Falls back to the live block if today is in neither, which is what happens in the gap between
   quarters. */
function defaultBlock(){
  try{
    const t=todayISO(), a=(DATA.archive||{}).dates;
    if(a&&a.length&&t>=a[0]&&t<=a[a.length-1])return 'archive';
  }catch(e){}
  return 'live';
}
let VIEWBLOCK='live';
const archiveOn=()=>VIEWBLOCK==='archive'&&!!(DATA.archive&&DATA.archive.dates);
const blockDates=()=>archiveOn()?DATA.archive.dates:DATA.dates;
const blockDayMap=()=>archiveOn()?(DATA.archive.day||{}):DATA.day;
const blockLabelNow=()=>archiveOn()?DATA.archive.label:DATA.blockLabel;
/* dayOf IS ALWAYS THE LIVE BLOCK. It feeds the coverage picker, the swaps tab, the .ics
   download, the stats and "your next shift" — none of which may follow a quarter somebody is
   only READING. Letting it track the selection meant choosing Q3 quietly re-pointed the
   coverage picker at shifts the server would refuse. Only the calendar switches, through
   vDayOf, and it is the only caller. */
const dayOf=(n,iso)=>(DATA.day[n]||{})[iso]||null;
const vDayOf=(n,iso)=>(blockDayMap()[n]||{})[iso]||null;
// When a shift starts, so a day's shifts read in the order they are worked. The schedule stores
// them in whatever order the solver produced, which put a 7pm night ahead of the 7am day shift
// beside it.
function startHour(sh){
  const h=DATA.kindHours[(META(sh)||{}).kind];
  return h ? h[0] : 7;                       // no clock time (Admin) sits with the day
}
/* ONE PLACE THAT TURNS kindHours INTO WORDS. The day sheet was computing its own end time as
   start + duration, which the (startH, startM, endH, endM) shape makes wrong — 7 + 17 is 24.
   Minutes are shown only when there are any, so "7am – 5pm" stays clean and a night reads
   "5pm – 11:59pm". */
/* A BIGGER FONT MUST NOT BREAK A CHIP. "Jeopardy" needs 42px in a 38px chip on a 390px phone,
   so at the larger size it clipped mid-word and read as text escaping its box. Rather than
   shrink every chip back, or abbreviate a label people recognise, only the ones that do not fit
   step down -- half a point at a time, to a floor of 7px, and only until they fit. Everything
   else keeps the size Aaron asked for.
   Measured after layout, so it accounts for the actual column width at whatever the screen is. */
function fitChips(root){
  const list=(root||document).querySelectorAll('.blk');
  list.forEach(c=>{
    const t=c.querySelector('.bt'); if(!t)return;
    c.style.fontSize=''; t.style.transform='';    // start from the stylesheet, not last pass
    const avail=c.clientWidth;
    if(t.scrollWidth<=avail+0.5)return;
    /* STEP THE SIZE DOWN FIRST, but only to 8px — below that it stops being readable and the
       point was to make the calendar BIGGER. */
    let size=parseFloat(getComputedStyle(c).fontSize)||9.5;
    /* TWO FLOORS, IN ORDER OF WHAT MATTERS.
       The soft floor tracks the chosen size (85% of it), so picking "Largest" is not undone by
       every tight chip stepping straight back to a fixed minimum — that made the setting do
       nothing exactly where it was wanted.
       But a label that does not fit beats a setting that does. If the soft floor is not enough,
       it keeps going to a hard 7px. At 320px on "Largest" the soft floor alone left nine labels
       cut off, which is the whole fault this function exists to prevent. */
    const soft=Math.max(7, size*0.85);
    for(let i=0;i<6&&size>soft&&t.scrollWidth>avail+0.5;i++){
      size-=0.5; c.style.fontSize=size+'px';
    }
    for(let i=0;i<12&&size>7&&t.scrollWidth>avail+0.5;i++){
      size-=0.5; c.style.fontSize=size+'px';
    }
    /* THEN CONDENSE, so the WHOLE WORD still shows. "Jeopardy" is 38.5px at 8px in a 34px
       column, in either font — mono and sans measure within a pixel of each other, so changing
       typeface buys nothing. Squeezing the last 12% horizontally shows every letter, where
       clipping or an ellipsis hides some of them. Floored at 0.72: past that it reads as
       damaged rather than condensed. */
    if(t.scrollWidth>avail+0.5){
      const k=Math.max(0.72, avail/t.scrollWidth);
      t.style.transform='scaleX('+k.toFixed(3)+')';
    }
    /* Below about 340px even 7px will not fit "Jeopardy" in a 30px column, and shrinking
       further stops being readable. text-overflow then does the honest thing and shows it
       truncated -- "Jeopa…" reads as a word that did not fit, where a hard clip reads as the
       text escaping its box, which is what was reported. The full name is in the day sheet and
       in the aria-label either way. */
  });
}
function hrsText(hrs){
  if(!hrs) return 'All day';
  const t=(h,m)=>`${h%12||12}${m?':'+String(m).padStart(2,'0'):''}${h<12?'am':'pm'}`;
  return t(hrs[0],hrs[1])+' – '+t(hrs[2],hrs[3]);
}
function byTime(a,b){
  if(a.iso!==b.iso) return a.iso<b.iso?-1:1;
  return startHour(a.shift)-startHour(b.shift) ||
         String(a.shift).localeCompare(String(b.shift));
}
/* MOONLIGHTERS ONLY (Sam, 2026-08-25). Two wrong answers were tried before this one. First it
   was offered to anyone credentialed for nights, which is most of the group. Then it was gated
   on Category === 'Moonlighter' but left in the employed/partner form — and moonlighters never
   see that form, they get their own with availability and shifts wanted, so it rendered for
   NOBODY and the gate looked correct in the source.
   It now lives in the moonlighter form itself, which is the gate. This helper is kept because
   it is the roster's own word for the distinction and reads better than a category literal. */
function isMoonlighter(n){
  return ((DATA.providers||{})[n]||{}).cat==='Moonlighter';
}
/* EVERY SHIFT THIS PERSON HAS, ACROSS BOTH QUARTERS. The group works Q3 and can no longer see
   it anywhere else, so coverage and swaps have to reach it — Q3 is not an archive any more, it
   is simply the earlier half of the schedule. The rule-check snapshot spans both quarters now,
   so the server can actually judge a September request rather than waving it through.
   The CALENDAR still shows one quarter at a time; that is a reading choice, not a limit. */
/* THE DAY RECORD FOR A DATE IN EITHER QUARTER.
   allShifts() spans both, and dayOf() is live-only by design — so anything that takes a shift
   from allShifts and then looks the date up needs this, or it reads null and throws. That is
   exactly what broke the Now tab: on 25 August the next shift is a September one, dayOf
   returned null, and `a.s` killed the whole render. Live first, because a date that exists in
   both should resolve to the block that is being scheduled. */
/* IS THIS DATE PART OF THE SCHEDULE AT ALL — either quarter. Every "Outside this block" check
   asked DATA.dates, which is Q4 alone, so every Q3 day sheet said the date did not exist. Q3 is
   not an archive any more; it is the earlier half of the same schedule. */
/* THE WHOLE SCHEDULE'S SPAN, both quarters, earliest to latest. Several things clamped against
   DATA.dates, which starts 1 October — so on 25 August they jumped forward to October instead
   of showing this week. */
function spanDates(){
  const a=(DATA.archive||{}).dates||[];
  const l=DATA.dates||[];
  if(!a.length)return l;
  if(!l.length)return a;
  return a[0]<l[0]?[a[0],l[l.length-1]]:[l[0],a[a.length-1]];
}
function knownDate(iso){
  if((DATA.dates||[]).includes(iso))return true;
  const a=DATA.archive;
  return !!(a&&(a.dates||[]).includes(iso));
}
function anyDayOf(n,iso){
  const live=dayOf(n,iso); if(live)return live;
  const a=DATA.archive;
  return (a&&a.day&&(a.day[n]||{})[iso])||null;
}
function allShifts(n){
  const out=myShifts(n,DATA.dates,dayOf);
  const a=DATA.archive;
  if(a&&a.dates&&a.dates.length)
    out.push(...myShifts(n,a.dates,(who,iso)=>((a.day||{})[who]||{})[iso]||null));
  return out.sort(byTime);
}
function myShifts(n,dates,dayFn){           // [{iso, shift, meta}], in the order they are worked
  const out=[];
  // Defaults to the LIVE block. The calendar passes the viewed one; nothing else may.
  (dates||DATA.dates).forEach(iso=>{const a=(dayFn||dayOf)(n,iso);
    if(a)a.s.forEach(s=>{ if(isRealShift(n,iso,s)) out.push({iso,shift:s,m:META(s)}); });});
  return out.sort(byTime);
}
/* Worked, but not owed. See OFF_CONTRACT in build_portal.py: these count as a day on service and
   show up everywhere a shift shows up, but they are not measured against a contracted total that
   never included them. Counted separately so the profile sheet can say so out loud — a number
   that quietly differs from what you can see on the calendar is the thing that started this. */
const offContract=s=>(DATA.offContract||[]).includes(s);
function counts(n){
  const c={icu:0,swing:0,noc:0,clinic:0,proc:0,jeop:0,admin:0,combo:0,wknd:0,worked:0,extra:0};
  DATA.dates.forEach(iso=>{
    const a=dayOf(n,iso);if(!a)return;
    let hasD=false,hasN=false,real=false;
    a.s.forEach(s=>{const k=META(s).kind;
      if(offContract(s)){c.extra++;real=true;return;}
      if(k==='icu'){c.icu++;hasD=true;real=true;}
      else if(k==='noc'){c.noc++;hasN=true;real=true;}
      else if(k==='swing'){c.swing++;real=true;}
      else if(k==='clinic'){c.clinic++;real=true;}
      else if(k==='proc'){c.proc++;real=true;}
      else if(k==='jeop'){c.jeop++;}
      else if(k==='admin'&&s!=='IP Backup'){c.admin++;}
    });
    if(hasD&&hasN)c.combo++;
    if(real){c.worked++;if(dowOf(iso)>=5)c.wknd++;}
  });
  return c;
}
function targets(n){
  const p=DATA.providers[n]||{}, bm=p.bm||3;
  const t=v=>typeof v==='number'?Math.round(v*bm):null;
  return {day:t(p.icu),noc:t(p.noc),clinic:t(p.clinic),admin:typeof p.admin==='number'?p.admin*bm:null};
}
function deBalance(n){
  const c=counts(n),p=DATA.providers[n]||{},bm=p.bm||3;
  const adm=typeof p.admin==='number'?p.admin*bm:0;
  const worked=c.icu+c.swing+2*c.noc+c.clinic+c.proc+adm;
  const nn=k=>typeof p[k]==='number'?p[k]:0;
  /* MOONLIGHTERS HAVE NO CONTRACTED TOTAL. Their fields are all null — they pick up nights
     rather than owing a quarter's worth of them. Treating a missing contract as a contract of
     zero made every night they worked look like an overage: three nights, six day equivalents,
     reported as "+6 above contract". There is nothing to be above. */
  const hasContract=['icu','noc','clinic','admin'].some(k=>typeof p[k]==='number');
  const contract=(nn('icu')+2*nn('noc')+nn('clinic')+nn('admin'))*bm;
  return {worked:f1(worked), contract:f1(contract), bal:f1(worked-contract),
          hasContract, nights:c.noc, extra:c.extra};
}

function unitChip(shift,w){

/* ---------- WEEK VIEW ----------
   A month grid can only be so large before a column is narrower than the word in it — that is
   what the condensing in fitChips is working around, and past about 1.75x it stops being enough.
   Seven rows down the screen have no such limit: a day gets the full width, so the shift can be
   set at a size somebody who cannot read the grid can actually read.

   Deliberately NOT a third quarter-worth of state. It navigates by week across the whole
   schedule, both quarters, because a week that straddles 30 September is still one week and
   splitting it would be an artefact of how the blocks are filed rather than anything real. */
let WEEKISO=null;
function weekStartOf(iso){ return isoAdd(iso, -colOf(iso)); }
function weekBounds(){
  const sp=spanDates();
  return [weekStartOf(sp[0]), weekStartOf(sp[1])];
}
function initWeek(){
  const t=todayISO(), sp=spanDates();
  const at=(t>=sp[0]&&t<=sp[1])?t:(t<sp[0]?sp[0]:sp[1]);
  WEEKISO=weekStartOf(at);
}
function weekHTML(){
  if(!WEEKISO)initWeek();
  const [lo,hi]=weekBounds();
  if(WEEKISO<lo)WEEKISO=lo; if(WEEKISO>hi)WEEKISO=hi;
  const days=[]; for(let i=0;i<7;i++)days.push(isoAdd(WEEKISO,i));
  const endIso=days[6];
  const span=(d2(WEEKISO).getMonth()===d2(endIso).getMonth())
    ? `${MONL[d2(WEEKISO).getMonth()]} ${d2(WEEKISO).getDate()}–${d2(endIso).getDate()}`
    : `${MON[d2(WEEKISO).getMonth()]} ${d2(WEEKISO).getDate()} – ${MON[d2(endIso).getMonth()]} ${d2(endIso).getDate()}`;
  const t=todayISO();
  let h=`<div class="wknav">
    <button class="wkarrow" id="wkPrev" ${WEEKISO<=lo?'disabled':''} aria-label="Previous week">‹</button>
    <div class="wkspan"><b>${esc(span)}</b><span>${d2(WEEKISO).getFullYear()}</span></div>
    <button class="wkarrow" id="wkNext" ${WEEKISO>=hi?'disabled':''} aria-label="Next week">›</button>
  </div>
  <div class="wkbtns"><button class="btn" id="wkToday">This week</button></div>
  <div class="wklist">`;
  days.forEach(iso=>{
    const known=knownDate(iso);
    const a=known?anyDayOf(ME,iso):null;
    const shown=(a?a.s:[]).filter(x=>isRealShift(ME,iso,x));
    const roles=(a&&a.r)||[];
    const rq=DATA.requests[ME]||{};
    const off=(rq.off||[]).includes(iso), cme=(rq.cme||[]).includes(iso), on=(rq.on||[]).includes(iso);
    const isNow=iso===t;
    let body;
    if(!known) body=`<div class="wkoff">Not in the schedule</div>`;
    else if(shown.length) body=shown.map(x=>{const m=META(x),hrs=DATA.kindHours[m.kind];
        return `<div class="wkshift" style="border-left-color:${m.color}">
          <div class="wkname">${esc(shiftLabel(ME,iso,x,false))}</div>
          <div class="wkmeta">${esc(m.sub)}${hrs?' · '+esc(hrsText(hrs)):''}</div></div>`;}).join('');
    else if(cme) body=`<div class="wkoff cme">CME day</div>`;
    else if(off) body=`<div class="wkoff">Requested off</div>`;
    else body=`<div class="wkoff">Off</div>`;
    h+=`<div class="wkrow${isNow?' today':''}" data-iso="${iso}" role="button" tabindex="0"
        aria-label="${esc(fmtLong(iso))}, ${shown.length?shown.map(x=>shiftLabel(ME,iso,x,false)).join(' and '):'no shift'}">
      <div class="wkday"><b>${DOW[dowOf(iso)]}</b><span>${d2(iso).getDate()}</span></div>
      <div class="wkbody">${body}${roles.length?`<div class="wkrole">◆ ${esc((DATA.roles[roles[0]]||{label:roles[0]}).label)}</div>`:''}
        ${on?'<div class="wkrole">● asked to work</div>':''}</div>
    </div>`;
  });
  return h+`</div>`;
}
function shiftRow(iso,shift,extra){
  const m=META(shift);
  return `<div class="row" data-iso="${iso}">
    <span class="sp" style="background:${m.color}"></span>
    <span class="d">${fmtD(iso).replace(', ','<br>')}</span>
    <span><span class="t">${esc(shiftLabel(ME,iso,shift,false))}</span><span class="s">${esc(m.sub)}</span></span>
    ${extra?`<span class="rt">${extra}</span>`:''}</div>`;
}

  const OFF_BOARD=new Set(['Admin']);
  const rows=[];
  /* EITHER QUARTER, AND EVERYONE IN IT. This read DATA.day and DATA.people, both of which are
     Q4 alone — so on any date in Q3 it found nobody and the section came up blank. Today IS a
     Q3 date until 1 October, which is to say it was blank for the whole group, on the screen
     they open first.
     The roster is a union too: somebody can appear in one quarter and not the other, and
     "who is on today" must not depend on which. */
  [...whoRoster()].forEach(p=>{
    const a=anyDayOf(p,iso);
    if(!a)return;
    (a.s||[]).forEach(sh=>{ if(!OFF_BOARD.has(sh)&&isRealShift(p,iso,sh)) rows.push({sh,p,role:false}); });
    (a.r||[]).forEach(r=>{ if(!OFF_BOARD.has(r)) rows.push({sh:r,p,role:true}); });
  });
  if(!rows.length)return '<div class="empty">Nobody scheduled.</div>';
  /* THE SAME GROUPS THE ADMIN VIEW DRAWS (Aaron 8/21).
     Reordering alone was not what he asked for. The dashboard's grid is banded — it prints a
     labelled section row (.secrow) above each set of units — and this was a flat list, so the
     groups he reads over there simply were not here. It is banded now, from the SAME membership
     the dashboard uses, spelled out by unit rather than inferred from `kind`.

     Inferring was its own bug: IP Backup carries kind 'admin', so a kind-based band filed it
     under Admin while the dashboard has always shown it under Backup.

     Order is Aaron's, which is NOT quite the dashboard's own — over there Backup and Admin sit
     above Swing/Night. He asked for nights before backup, so nights before backup it is; the
     grouping and the membership are what had to match. Admin then came off the screen entirely
     (8/21, second pass) — see OFF_BOARD. */
  const GROUPS=[
    ['ICU — Day', ['Red - Neuro/Trauma (201-224)','Yellow - CICU-M (225-236)',
                   'Green - CICU-C (237-248)','Blue - SMICU (329-340)','SAN ICU',
                   'Avista/North 2','LAH CVICU','LAH ICU 1','LAH ICU 2/PTR','Porter ICU',
                   'CR/PKR','Parker ICU']],
    ['Clinic',    ['West Clinic','North Clinic','South Clinic','Central Clinic','SAH EBUS',
                   'Porter EBUS','Goodland Clinic','RHC-SAN']],
    ['Noc / Swing',['South Swing','SAH NOC','SAH NOC2','PTR NOC','LAH NOC']],
    ['Backup',    ['Day Jeopardy','IP Backup']],
    ['Layered roles', null],          // whatever arrived as a layered role, in DATA.roles order
  ];                                  // no Admin band — see OFF_BOARD above
  const byShift={};
  rows.forEach(r=>{(byShift[r.sh]=byShift[r.sh]||{role:r.role,who:[]}).who.push(r.p);});
  /* DATA.roles IS the layered-role registry, and membership of it is the real test — not how a
     given day happened to store the assignment. Orientation is registered as a layered role and
     is ALSO written as a top-level unit (the dashboard hit the same thing on 8/17), so keying
     off the per-day flag alone dropped it out of the group and into "Other". */
  const roleSeq=Object.keys(DATA.roles||{});
  const isRole=sh=>!!(byShift[sh]&&byShift[sh].role)||!!(DATA.roles&&DATA.roles[sh]);
  const placed=new Set();
  const line=sh=>{
    const g=byShift[sh], r=isRole(sh), m=META(sh);
    return `<div class="onrow${r?' isrole':''}">
      <span class="ondot" style="background:${r?'var(--line2)':m.color}"></span>
      <span class="onshift">${esc(r?((DATA.roles[sh]||{}).label||sh):m.label)}</span>
      <span class="onwho">${g.who.map(x=>esc(fullOf(x))).join(', ')}</span></div>`;
  };
  let out='';
  GROUPS.forEach(([title,keys])=>{
    const mine=keys
      ? keys.filter(k=>byShift[k]&&!isRole(k))
      : Object.keys(byShift).filter(isRole)
          .sort((a,b)=>{const i=roleSeq.indexOf(a),j=roleSeq.indexOf(b);
                        return (i<0?999:i)-(j<0?999:j)||String(a).localeCompare(String(b));});
    if(!mine.length)return;                       // an empty band is noise, not information
    mine.forEach(k=>placed.add(k));
    out+=`<div class="ongrp">${esc(title)}</div>`+mine.map(line).join('');
  });
  // A unit added to the schedule but not yet to GROUPS must still appear. Silently dropping a
  // shift from "who is on today" is the one failure this screen cannot have.
  const rest=Object.keys(byShift).filter(k=>!placed.has(k));
  if(rest.length)out+='<div class="ongrp">Other</div>'+rest.sort().map(line).join('');
  return out;
}

  const t=todayISO();

  html+=installCard();              // ...then the home-screen nudge, until they act on it

    const when=days<0?'First shift of the block':days===0?'Today':days===1?'Tomorrow':`In ${days} days`;

       still said 7pm–7am and 1pm–11pm after the times changed on 25 August, so the card under

    const kindName={noc:'Overnight',icu:'Day shift',swing:'Swing',clinic:'Clinic',
                    admin:'Protected time',jeop:'Backup',proc:'Bronchoscopy'}[m.kind]||'';
    const kh=DATA.kindHours[m.kind];
    const kindTxt=!kindName?'':(kh?kindName+' · '+hrsText(kh):kindName);
    // anyDayOf, not dayOf: `next` can be in either quarter. Defensive fallback too — a shift
    // with no day record must render as a shift with nothing beside it, never as a crash.
    const a=anyDayOf(ME,next.iso)||{s:[],r:[]},

    html+=`<div class="hero"><div class="spine" style="background:${m.color}"></div><div class="in">

  }
  // week strip
  /* "Next 7 days" means the next seven, not the first seven of Q4. This clamped to
     DATA.dates[0], so from July to September it showed the week of 1 October — the wrong week
     for the entire group, every day, for three months. Clamped to the full span now. */
  const _sp=spanDates();
  const start=(all.length&&t>_sp[1])?_sp[0]:(t<_sp[0]?_sp[0]:t);
  html+=`<h2 class="sec">Next 7 days</h2><div class="wk7">`;
  for(let i=0;i<7;i++){

    // want at a glance (client 8/17 #4).
    const wshown=(a?a.s:[]).filter(sh=>isRealShift(ME,iso,sh))
      .sort((x,y)=>startHour(x)-startHour(y));
    const names=wshown.length
      ? wshown.map(sh=>`<span class="w7s" style="border-left-color:${META(sh).color}">${esc(shiftLabel(ME,iso,sh,false))}</span>`).join('')
      : `<span class="w7off">${inBlock?'Off':'—'}</span>`;
    const roles=(a&&a.r&&a.r.length)
      ? a.r.map(r=>`<span class="w7r">${esc((DATA.roles[r]||{label:r}).label||r)}</span>`).join('') : '';
    html+=`<div class="w7d${iso===t?' today':''}" data-iso="${iso}">
      <div class="w7h"><b>${DOW[dowOf(iso)]}</b><span>${MON[d2(iso).getMonth()]} ${d2(iso).getDate()}</span></div>
      <div class="w7b">${names}${roles}</div></div>`;
  }
  html+='</div>';
  // Who is on, for the day you are looking at — with arrows to walk the block. The contract
  // tiles moved to Block Statistics (under your profile), because this is what people open the
  // app to find (client 8/17 #4).
  html+=`<h2 class="sec">Who's on <span class="daynav">
      <button class="navb" id="dayPrev" aria-label="Previous day">‹</button>
      <span id="dayLabel">${esc(fmtD(DAYVIEW||inBlockDay(t)))}</span>
      <button class="navb" id="dayNext" aria-label="Next day">›</button></span></h2>
    <div id="onToday">${whosOnHTML(DAYVIEW||inBlockDay(t))}</div>`;
  html+=subscribeNudge();     // after the schedule itself, before the footnote
  html+=`<div class="note">Every off and CME day you asked for was granted this block.</div>`;
  pane.innerHTML=html;
  wireInstallCard();
  wireChangeBanner();
  wireNudge();
  wireDayNav();
  $$('.sday',pane).forEach(d=>{d.onclick=()=>openDay(d.dataset.iso);
    d.setAttribute('role','button');d.setAttribute('tabindex','0');

}

let schedView='cal';

/* A subscription beats a download: a downloaded .ics is a snapshot that goes stale the moment
   anything changes, which is exactly the complaint. Calendar apps re-poll this URL. */
function subscribeCard(){
  if(!ME)return '';
  /* THE LINK AND THE NAME ON IT MUST BE THE SAME PERSON.
     The feed address is minted per person by the server, so for the moment between switching
     physician and that answer arriving there is no correct link to show. This card used to
     render the previous one under the new person's name: the button read "Add Emily Horn's
     shifts" and subscribed you to Bailey's 76 shifts. A calendar subscription is not a page you
     can back out of — it lands on the phone and stays — so a link that might be the wrong
     person's must not be tappable at all. */
  if(CFG&&CFG.icsFor!==ME)
    return `<div class="swcard"><div class="lgh">Add to your calendar</div>
      <div class="sub">Getting ${esc(fullOf(ME)||ME)}'s calendar link…</div></div>`;

    return `<div class="swcard"><div class="lgh">Add to your calendar</div>
      <div class="sub">No calendar for this account — it has no schedule of its own. Open a
        physician from the ▾ menu to subscribe to theirs.</div></div>`;
  const url=icsAbsolute();
  const webcal=url.replace(/^https?:/,'webcal:');
  const whose=onBehalf()?fullOf(ME):null;
  const n=myShifts(ME).length;
  return `<h2 class="sec">Take it with you</h2>
  <div class="swcard subcard">
    <div class="lgh">${whose?'Subscribe to '+esc(whose)+"'s shifts":'Subscribe in your calendar'}</div>
    <div class="sub">${whose
      ? 'You are looking at <b>'+esc(whose)+'</b>, so this adds <b>their</b> shifts to your '+
        'calendar — not yours. It appears as <b>CCPSA — '+esc(ME)+'</b>.'
      : 'Your shifts appear in the calendar you already use and <b>keep themselves up to '+
        'date</b> — a swap or a change reaches it on its own.'} Your phone decides how often to
      re-check, usually within the hour, so <b>for a change that just happened, this app is the
      one to trust</b>.</div>
    <div class="btnrow">
      <a class="btn pri" href="${webcal}">${whose?'Subscribe to '+esc(whose)+"'s shifts":'Subscribe in my calendar'}</a>
    </div>
    <div class="minorrow">
      <a href="#" id="dlIcs">One-off calendar file</a>
      <a href="#" id="dlCsv">CSV</a>
      <a href="#" id="doPrint">Print</a>
    </div>
    <details class="icsmore"><summary>Adding it on a computer?</summary>
      <div class="sub" style="margin-top:6px">Paste this into Google Calendar or Outlook —

/* ---------- what a printed schedule is ----------
   One person's shifts, by month, on white paper: the date, what they are on, and the hours. Not
   the app — the app is a phone layout of cards and a tab bar, and hiding parts of it does not
   produce something anyone would pin to a fridge.

   Built at the moment of printing so it is always the schedule currently being looked at,
   including any change the scheduling lead has just made. */
const SHIFT_HOURS={noc:'5pm – 11:59pm', icu:'7am – 5pm', swing:'5pm – 11:59pm', clinic:'7am – 5pm'};
function hoursOf(m){ return SHIFT_HOURS[m.kind]||''; }

function buildPrintable(){
  let host=document.querySelector('#printOnly');
  if(!host){ host=el('div',''); host.id='printOnly'; document.body.appendChild(host); }
  const who=ME?(fullOf(ME)||ME):null;
  if(!who){ host.innerHTML=''; return; }
  /* BOTH QUARTERS on the printable too. myShifts() defaults to the LIVE block, so the sheet you
     printed or saved as PDF ended at 1 October while the app beside it showed July onwards.
     allShifts() is the pair-aware version that already existed for exactly this. Client 8/26. */
  const shifts=allShifts(ME);
  const when=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  // The heading names the range actually printed. It said "Q4 · Oct-Dec" over a sheet that now
  // starts in July, which is a caption contradicting the thing under it.
  const _sp=spanDates();
  const _rng=_sp.length?(fmtD(_sp[0])+' – '+fmtD(_sp[_sp.length-1])):(DATA.blockLabel||'');
  let h='<h1>'+esc(who)+'</h1><div class="pmeta">'+esc(_rng)+
        (_rng?' · ':'')+shifts.length+' shift'+(shifts.length===1?'':'s')+
        ' · printed '+esc(when)+'</div>';
  if(!shifts.length){
    h+='<p>No shifts in this block.</p>';
  }else{
    let month='';
    shifts.forEach(s=>{
      const d=d2(s.iso), mk=d.getFullYear()+'-'+d.getMonth();
      if(mk!==month){
        if(month)h+='</tbody></table>';
        month=mk;
        h+='<h2>'+esc(MONL[d.getMonth()]+' '+d.getFullYear())+'</h2>'+
           '<table><thead><tr><th>Date</th><th>Shift</th><th>Hours</th></tr></thead><tbody>';
      }
      const wknd=[0,6].includes(d.getDay());
      h+='<tr'+(wknd?' class="we"':'')+'><td class="pd">'+esc(fmtD(s.iso))+'</td><td>'+
         esc(shiftLabel(ME,s.iso,s.shift,false))+'</td><td class="pt">'+esc(hoursOf(s.m))+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<div class="pnote">Hours are the standard ones for each shift type. A printed copy does '+
       'not update — check the app for anything that changed after '+esc(when)+'.</div>';
  }
  host.innerHTML=h;
}
window.addEventListener('beforeprint',buildPrintable);
window.addEventListener('afterprint',()=>{
  const h=document.querySelector('#printOnly'); if(h)h.innerHTML='';
  // Safari can come back from the print sheet at a different scale. Re-stating the viewport
  // makes it recompute rather than keeping whatever the print pass left behind.
  const v=document.querySelector('meta[name=viewport]');
  if(v){const was=v.getAttribute('content'); v.setAttribute('content',was+',minimum-scale=1');
        setTimeout(()=>v.setAttribute('content',was),50);}
});

function renderSched(){

  if(!ME){pane.innerHTML='<div class="empty" style="margin-top:22px">Choose a provider first.</div>';return;}
  const arch=!!(DATA.archive&&DATA.archive.dates&&DATA.archive.dates.length);
  /* WHOSE SCHEDULE IS THIS. "My schedule" over somebody else's shifts is the kind of wrong that
     gets acted on — a physician checking a colleague's nights and reading them as their own. When
     visiting, the heading says the name and a line underneath says what is and is not on screen,
     because a tab quietly missing is worse than a tab explained. */
  const vis=visitingOn();
  let html=`<h2 class="sec">${vis?esc(fullOf(vis))+"'s schedule":'My schedule'}
    <span class="pill" style="margin-left:6px">${esc(blockLabelNow())}</span></h2>`;
  if(vis)
    html+=`<div class="behalf">Reading <b>${esc(fullOf(vis))}</b>'s schedule. Their time off,
      requests and swaps are private — yours are still under your own name.
      <button class="lnk" id="backToMe">Back to my schedule</button></div>`;
  /* THE PREVIOUS QUARTER, TO READ (Aaron, 2026-08-25 — the group loses Lightning Bolt on
     1 September). Only offered when there is an archive to offer, and it says "view only" on the
     control itself rather than letting somebody find that out by tapping something that does
     nothing. */
  /* A SELECT, NOT TWO BUTTONS. Quarters are a list that will keep growing -- Q1 2027 is the
     same kind of thing as Q3 2026 -- and a row of buttons stops working the moment there are
     three. Earliest first, so it reads as a timeline rather than as "the real one and the other
     one". */
  /* THE QUARTER CONTROL STAYS IN THE WEEK VIEW. It used to be hidden there, on the reasoning that
     a week walks across both quarters so naming one answers a question the view does not ask.
     True, and still beside the point: a control that vanishes when you press Week reads as
     something breaking, and it stranded anyone who switched to Week while in Q3 with no way back
     to Q4 but to leave the view. Client 8/25 (Nadon). In the week view it does not filter — it
     JUMPS, to today's week if today falls inside the quarter picked, otherwise to its first week.
     Which is what somebody reaching for it in that view actually wants. */
  if(arch)
    html+=`<div class="qrow">
      <label class="qlbl" for="qSel">Quarter</label>
      <select class="acsel" id="qSel">
        <option value="archive"${archiveOn()?' selected':''}>${esc(DATA.archive.label)}</option>
        <option value="live"${!archiveOn()?' selected':''}>${esc(DATA.blockLabel)}</option>
      </select>
    </div>`;
  html+=`<div class="btnrow three">
    <button class="btn ${schedView==='cal'?'pri':''}" id="vCal">Month</button>
    <button class="btn ${schedView==='week'?'pri':''}" id="vWeek">Week</button>
    <button class="btn ${schedView==='list'?'pri':''}" id="vList">List</button></div>`;
  // Not in the week view: it walks across both quarters, so a note about which one you are
  // looking at is answering a question that view does not ask.
  if(archiveOn() && schedView!=='week')
    html+=`<div class="note" style="margin-top:9px">Requests and time off are set per block, and
      belong to <b>${esc(DATA.blockLabel)}</b>. Coverage and swaps work on any shift you hold,
      in either quarter.</div>`;

  if(schedView==='week'){
    html+=weekHTML();
  }else if(schedView==='cal'){
    const months=[...new Set(blockDates().map(i=>i.slice(0,7)))];
    months.forEach(mk=>{
      const y=+mk.slice(0,4),mo=+mk.slice(5)-1;
      const first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate();
      /* NO SHIFT COUNT IN THE MONTH HEADER. Client 8/25: physicians were reading "14 shifts"
         as a contract figure and checking it against their FTE, which it never was. It counted
         calendar days carrying any shift in the block being viewed — so a doubled day counted
         once, a partial month at a block boundary undercounted, and the archived quarter showed
         a different number for the same month. A number that invites a comparison it cannot
         survive is worse than no number; day equivalents live in the profile sheet, which is
         where the contract question is actually answered. */
      html+=`<div class="month"><h4><b>${MONL[mo]} ${y}</b></h4><div class="grid7">`;
      dowLabels().forEach(d=>html+=`<div class="dow${d==='Sat'||d==='Sun'?' we':''}">${d}</div>`);
      const lead=leadFor(first);
      for(let i=0;i<lead;i++)html+='<div class="cell blank"></div>';
      for(let d=1;d<=dim;d++){
        const iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const a=vDayOf(ME,iso),rq=DATA.requests[ME]||{};
        const onReq=(rq.on||[]).includes(iso);
        const cmeReq=(rq.cme||[]).includes(iso);
        const offReq=(rq.off||[]).includes(iso)||cmeReq;
        let inner='';
        const shown=(a?a.s:[]).filter(s=>isRealShift(ME,iso,s));
        if(shown.length){
          const ds=shown.filter(s=>META(s).kind!=='noc'),ns=shown.filter(s=>META(s).kind==='noc');
          if(ds.length&&ns.length){       // 24h combo — diagonal split
            // Two colours under one label: take the ink that suits the darker half, so the
            // word cannot disappear into whichever end it happens to sit over.
            const _a=META(ds[0]).color,_b=META(ns[0]).color;
            // Whichever ink is least bad across both halves of the gradient.
            const _worst=f=>Math.min(...[_a,_b].map(c=>{const L=chipLum(c);

function icsStamp(iso,h,mi){return iso.replace(/-/g,'')+'T'+String(h).padStart(2,'0')+String(mi).padStart(2,'0')+'00';}
function downloadICS(){
  /* BOTH QUARTERS. This walked DATA.dates, which is Q4 alone, so the file you downloaded stopped
     at 1 October while the app either side of it showed July onwards. Sam, 8/26: the one-off
     files should carry Q3 too. spanDates() is the full range the app knows and anyDayOf() reads
     from whichever quarter the date belongs to — the same pair every other cross-quarter view
     uses. The calendar NAME loses "Q4" with it, because it is no longer true. */
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scheduling Wizard//CCPSA//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
           'X-WR-CALNAME:CCPSA - '+fullOf(ME)];
  let n=0;
  const _sp=spanDates(), _from=_sp[0], _to=_sp[_sp.length-1];
  const _all=[];
  for(let d=_from; d<=_to; d=isoAdd(d,1)) if(knownDate(d)) _all.push(d);
  _all.forEach(iso=>{
    const a=anyDayOf(ME,iso);if(!a)return;
    // Same rule as every other view: protected time is not an appointment and does not belong in
    // anyone's calendar app. The SERVER feed has always filtered it; this one-off download did
    // not, so the file you tapped "download" on disagreed with the feed you subscribed to.
    a.s.filter(s=>isRealShift(ME,iso,s)).forEach(s=>{
      const m=META(s),hrs=DATA.kindHours[m.kind];
      const uid=`${iso}-${s.replace(/[^A-Za-z0-9]/g,'')}-${ME}@schedulingwiz`;
      L.push('BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+icsStamp(DATA.generated,0,0)+'Z');
      if(!hrs){
        L.push('DTSTART;VALUE=DATE:'+iso.replace(/-/g,''),'DTEND;VALUE=DATE:'+isoAdd(iso,1).replace(/-/g,''));
      }else{
        // (startH, startM, endH, endM). An end before the start still means the next day, which
        // no current shift does — nights stop at 23:59 — but the rule is about the times.
        const[h,mi,eh,em]=hrs;
        const endIso=(eh<h||(eh===h&&em<mi))?isoAdd(iso,1):iso;
        L.push('DTSTART:'+icsStamp(iso,h,mi),'DTEND:'+icsStamp(endIso,eh,em));
      }
      L.push('SUMMARY:'+shiftLabel(ME,iso,s,false),'LOCATION:'+m.sub.replace(/,/g,''),
             'DESCRIPTION:'+(m.sub+((a.r&&a.r.length)?' — also '+a.r.join(', '):'')).replace(/,/g,'\\,'),
             'END:VEVENT');
      n++;
    });
    (a.r||[]).forEach(r=>{
      const lab=(DATA.roles[r]||{label:r}).label;
      L.push('BEGIN:VEVENT','UID:'+iso+'-'+r.replace(/[^A-Za-z0-9]/g,'')+'-'+ME+'@schedulingwiz',
        'DTSTAMP:'+icsStamp(DATA.generated,0,0)+'Z',
        'DTSTART;VALUE=DATE:'+iso.replace(/-/g,''),'DTEND;VALUE=DATE:'+isoAdd(iso,1).replace(/-/g,''),
        'SUMMARY:'+lab,'DESCRIPTION:Layered role','END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  save(L.join('\r\n'),`CCPSA-${ME}-Q4-2026.ics`,'text/calendar');
}
function downloadCSV(){
  const head=['Date','Day','Shift','Where','Type','Roles'];
  const rows=[];
  // Both quarters, same reason as the .ics beside it: a download that stops at 1 October is not
  // the schedule the app is showing.
  const _sp=spanDates(), _to=_sp[_sp.length-1];
  const _all=[];
  for(let d=_sp[0]; d<=_to; d=isoAdd(d,1)) if(knownDate(d)) _all.push(d);
  _all.forEach(iso=>{

    const shown=a.s.filter(s=>isRealShift(ME,iso,s));
    shown.forEach(s=>{const m=META(s);
      rows.push([iso,DOW[dowOf(iso)],shiftLabel(ME,iso,s,false),m.sub,m.kind,(a.r||[]).join(' / ')]);});
    if(!shown.length&&a.r&&a.r.length)rows.push([iso,DOW[dowOf(iso)],'—','','role',a.r.join(' / ')]);
  });

  // role, so Roles arrived as a header over 39 empty cells — and an empty column in a
  // spreadsheet reads as missing data rather than as "does not apply here".
  const keep=head.map((_,i)=>rows.some(r=>String(r[i]||'').trim()!==''));

         .map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),

function save(txt,name,mime){

  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);
}

/* ---------- when may we record? ----------

   than tracked with a flag, because a flag left set by an early return is a recording that never
   restarts, and a flag left CLEAR by one is a recording of a secret. The DOM cannot disagree with
   what is on screen.

     .signin    the sign-in card — access code and password
     #gate      identity chooser, shown before anything is authenticated
     body.locked  pre-auth, nothing has been unlocked yet
     .ph-no-capture visible  a TOTP secret, its QR, or a recovery code is on screen right now

   Called on every sheet open and close, on sign-in, and after boot. */
function replaySensitive(){
  try{
    if(document.body.classList.contains('locked'))return true;
    if(document.querySelector('.signin'))return true;
    const g=document.querySelector('#gate');
    if(g&&getComputedStyle(g).display!=='none')return true;
    /* ASK THE MARKUP, NOT THE PIXELS. Two wrong versions of this are worth recording.

       First tried width/height: a closed sheet keeps its markup and is parked off-screen with a
       transform, so its box stays full size and it read as visible forever -- the recorder, once
       stopped by an auth sheet, never restarted.

       Then tried intersecting the viewport, which was worse in the way that matters. The sheet
       ANIMATES: .on is added and the transform runs from translateY(102%) over .22s. Checking at
       the moment it opens finds it still off-screen, so recording carried on THROUGH the secret
       appearing; checking as it closes finds it still at translateY(0), so recording stopped
       once the secret had gone. Exactly inverted, and only against a real browser -- the stub
       had no transitions, which is why it passed.

       Position is the wrong question. A sheet is showing when it carries .on, whatever its
       transform is doing this frame, and that is knowable the instant the class changes. */
    for(const el of document.querySelectorAll('.ph-no-capture')){
      const sh=el.closest('#sheet');
      if(sh) { if(sh.classList.contains('on')) return true; continue; }

      if(cs.visibility==='hidden'||cs.display==='none'||parseFloat(cs.opacity||'1')===0)continue;

   device and this code cannot read it; the server holds only the matching public key, so there
   is nothing in the store worth stealing. The phone will not sign unless the face or fingerprint
   matched, which is what lets this replace the password rather than sit alongside it.

                        navigator.credentials.create);

function pkB64(buf){

async function enrollPasskey(){
  const o=await api('/passkey',{method:'POST',body:JSON.stringify({action:'register-options'})});
  const pk=o.publicKey;
  pk.challenge=pkBuf(pk.challenge);
  pk.user.id=pkBuf(pk.user.id);
  pk.excludeCredentials=(pk.excludeCredentials||[]).map(c=>({...c,id:pkBuf(c.id)}));
  const cred=await navigator.credentials.create({publicKey:pk});
  if(!cred)throw new Error('No passkey was created.');
  const r=cred.response;
  // getPublicKey() hands over the key in SPKI form, which is what the server can verify with
  // directly — the alternative is decoding CBOR to reach the same bytes.
  if(!r.getPublicKey)throw new Error('This browser is too old for Face ID sign-in.');
  await api('/passkey',{method:'POST',body:JSON.stringify({
    action:'register', challengeToken:o.challengeToken, id:cred.id,
    clientDataJSON:pkB64(r.clientDataJSON),
    publicKey:pkB64(r.getPublicKey()), alg:String(r.getPublicKeyAlgorithm()),
    label:(/iPhone|iPad/.test(navigator.userAgent)?'iPhone':
           /Mac/.test(navigator.userAgent)?'Mac':'This device')})});
  try{localStorage.setItem('ccpsa_passkey','1');}catch(e){}

  // Strictly after login: not over the sign-in screens, and not before the schedule is on
  // screen. Offered while a gate is still up, it reads as another hoop in signing in.
  if(document.body.classList.contains('locked'))return;
  if(document.querySelector('.signin'))return;
  let asked=false; try{asked=localStorage.getItem('ccpsa_faceask')==='1';}catch(e){}
  if(asked)return;
  if(!(await pkAvailable()))return;
  const done=()=>{ try{localStorage.setItem('ccpsa_faceask','1');}catch(e){} };
  const face=/iPhone|iPad/.test(navigator.userAgent)?'Face ID':'your fingerprint or face';
  sheet('Skip the password next time',
    `<div class="sub">You can open this with ${face} instead of typing your password. The key
       stays in this phone's secure hardware — it never leaves the device and we never see it.</div>
     <div class="sub" style="margin-top:8px">Your password still works, and still gets you in on
       any other device.</div>
     <div class="btnrow" style="margin-top:12px">
       <button class="btn pri" id="fidYes">Turn on ${face}</button>
       <button class="btn" id="fidNo">Not now</button>
     </div>
     <div class="msg" id="fidMsg"></div>`);
  document.querySelector('#fidNo').onclick=()=>{ done(); closeSheet(); };
  document.querySelector('#fidYes').onclick=async()=>{
    const btn=document.querySelector('#fidYes'); btn.disabled=true; btn.textContent='…';
    try{ await enrollPasskey(); done(); closeSheet(); toast(face+' is on'); }
    catch(e){
      const m=String((e&&e.message)||e);
      const msg=document.querySelector('#fidMsg');
      msg.textContent=/NotAllowed|Cancel|abort/i.test(m)?'Cancelled — you can turn it on later '+
        'from the Swaps tab.':m;
      msg.className='msg on bad'; btn.disabled=false; btn.textContent='Turn on '+face;
    }
    paintSignIn();
  };
}

/* ---------- Face ID when you come back ----------
   Staying signed in for ninety days is right for a schedule checked between patients, and wrong
   for a phone left in a taxi. Face ID resolves that: the app stays signed in, and coming back to
   it after a few hours costs a glance instead of a password.

   ONLY WHERE IT IS FREE. If no passkey is enrolled this does nothing at all — locking someone
   out behind a factor they have not set up would be the app breaking, not the app being careful.
   The password route stays on the screen for the day the face does not work, because a schedule
   nobody can open is worse than one that opens too easily. */
const RELOCK_AFTER=4*60*60*1000;                 // a shift's worth of idle, not a coffee break
function touchSeen(){ try{localStorage.setItem('ccpsa_lastseen',String(Date.now()));}catch(e){} }
function idleTooLong(){
  let t=0; try{t=+localStorage.getItem('ccpsa_lastseen')||0;}catch(e){}
  return !t||(Date.now()-t)>RELOCK_AFTER;
}
let LOCKED=false;
async function maybeLock(){
  if(LOCKED||!pkEnrolled()||!idleTooLong())return false;
  if(!(await pkAvailable()))return false;
  LOCKED=true;
  document.body.classList.add('locked');
  siPaint(`<div class="siLead"><b>Welcome back.</b> Use Face ID to open your schedule.</div>
     <button class="siB" id="lkGo">Use Face ID</button>
     <button class="siGhost" id="lkPw">Use my password instead</button>
     <div class="msg" id="lkMsg"></div>`);
  const go=async()=>{
    const m=$('#lkMsg'); m.textContent='Waiting for Face ID…'; m.className='msg on';
    try{ await signInWithPasskey(); LOCKED=false; touchSeen(); }
    catch(e){
      const t=String((e&&e.message)||e);
      m.textContent=/NotAllowed|Cancel|abort/i.test(t)?'Cancelled.':t;
      m.className='msg on bad';
    }
  };
  $('#lkGo').onclick=go;
  $('#lkPw').onclick=()=>{ LOCKED=false; stepPassword(lastLoginEmail()); };
  go();                       // offer it immediately; the prompt is the whole point
  return true;
}

async function signInApi(){
  let code=null; try{code=sessionStorage.getItem('__code');}catch(e){}
  if(!code)return null;
  try{
    SESSION=await api('/session',{method:'POST',body:JSON.stringify({code})});
    CFG={deadline:SESSION.deadline,locked:SESSION.locked,lateContact:SESSION.lateContact};
    return SESSION;
  }catch(e){SESSION=null;return null;}
}
const isAdmin=()=>!!(SESSION&&SESSION.role==='admin');
// Who this page is acting FOR. An admin looking at Dr Smith is editing Smith's requests, not
// their own. The read path already knew this; the write path did not, so a request an admin
// entered for someone else was silently filed under the ADMIN — the page looked unchanged and
// the physician never got it.
const onBehalf=()=>(ROLE==='admin'&&ME&&ACCT&&ME!==ACCT.person)?ME:null;
/* LOOKING AT A COLLEAGUE, which is not the same as acting for them.
   An admin who switches is working ON that person: onBehalf() is set and their requests and swaps
   are the ones on screen, because entering time off for somebody is a thing an admin does. A
   physician who switches is only READING a schedule. Nadon 8/25: "They should not see their
   requests or swaps though, just the schedule."
   So for a visitor the Requests and Swaps tabs are removed rather than filled. Not because the
   server would hand anything over — it would return the visitor's OWN records, since a doctor
   asking for another person's is given theirs — but because that is worse than refusing: the
   page would show YOUR time off under SOMEBODY ELSE'S name, which is a lie that looks like data. */
const visitingOn=()=>(ROLE!=='admin'&&ME&&ACCT&&ME!==ACCT.person)?ME:null;
/* One way home, called from the header bar and from the Schedule banner. An admin with no
   schedule of their own (Sam, Zac, AB) has nowhere personal to return TO, so for them this goes
   to the approvals desk instead of leaving them on an empty "choose a provider". */
/* THE HEADER BAR THAT SAYS WHOSE PAGE THIS IS. Its own function because it has two callers and
   they used to disagree: boot() drew it, and returnToMe() sent an admin with no schedule of their
   own to the approvals desk WITHOUT going through boot() — so the bar stayed up, still announcing
   somebody they had just stopped looking at. Anything that changes ME calls this. */
function viewBar(){
  const vb=document.querySelector('#viewingBanner');
  if(onBehalf()||visitingOn()){
    if(!vb){
      const d=el('div','viewbar');d.id='viewingBanner';
      document.querySelector('header').appendChild(d);
    }
    // An admin is working ON that person, so their requests and swaps are on screen too. A
    // provider is only reading. Saying which is the difference between the bar being information
    // and the bar being a warning.
    document.querySelector('#viewingBanner').innerHTML=
      '<span>Viewing <b>'+esc(fullOf(ME))+'</b>'+
      (onBehalf()?' — their schedule, requests and swaps':' — schedule only')+'</span>'+
      '<button class="viewx" id="viewBack">Back to mine</button>';
    const bb=document.querySelector('#viewBack');
    if(bb)bb.onclick=returnToMe;
  }else if(vb){vb.remove();}
}
function returnToMe(){
  const mine=ACCT&&ACCT.person;
  if(mine&&whoRoster().includes(mine)){
    ME=mine; try{localStorage.setItem('ccpsa_me',mine);}catch(e){}
    MYREQ=null; boot(); markBar('pick'); go('sched');
    return;
  }
  /* An admin with no schedule of their own — Sam, Zac, AB — has nowhere personal to go back to,
     so "back to mine" means the approvals desk. boot() cannot be used for that: with ME null and
     BOOTED already true it falls through to go(), landing on a tab with nobody selected. So the
     three things boot() would have refreshed are refreshed here, explicitly.
       viewBar()     - or the bar keeps naming the person just left
       accountBar()  - or the button still reads "Nadon's stats" with no Nadon on screen
       adminBar()    - or the segment stays on 'pick' */
  ME=null; try{localStorage.removeItem('ccpsa_me');}catch(e){}
  MYREQ=null; LOADED_FOR=null;
  viewBar(); accountBar(); adminBar();
  showAdminHome();
}
const dOnly=d=>String(d||'').slice(0,10);
/* WHEN THE REQUEST WINDOW OPENS. Requests are for the period that begins when they close —
   that is what the deadline means — so the pickers start there and the counters count there.
   Derived rather than hard-coded to 2027: next quarter this has to move on its own, and a
   literal would have to be remembered by somebody. */
function reqStart(){
  const d=(CFG&&CFG.deadline)||'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  const last=(DATA.dates||[]).slice(-1)[0];
  return last?isoAdd(last,1):realTodayISO();
}
function reqYear(){ return +reqStart().slice(0,4); }
function daysLeft(){
  if(!CFG||!CFG.deadline)return null;
  // Reads the same "today" as everything else, so a simulated date moves the countdown too.
  const now=new Date(todayISO()+'T00:00:00'), dl=new Date(CFG.deadline+'T00:00:00');
  return Math.ceil((dl-now)/86400000);
}
function chipList(arr,cls,onX){
  if(!arr||!arr.length)return '<span class="muted" style="font-size:12px">none yet</span>';
  return arr.slice().sort().map(d=>`<span class="pillx ${cls}" data-d="${d}">${fmtD(d)}${onX?'<b>×</b>':''}</span>`).join('');
}

let REQSAVED=null;
function reqSavedHTML(){
  if(!REQSAVED||Date.now()-REQSAVED.at>90000)return '';
  const t=new Date(REQSAVED.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return `<div class="savedbar">✓ Saved${REQSAVED.who&&onBehalf()?' for '+esc(fullOf(REQSAVED.who)):''} at ${t}</div>`;
}
function renderReq(){
  const pane=$('#pane-req');
  if(!ME){pane.innerHTML='<div class="empty" style="margin-top:22px">Choose a provider first.</div>';return;}

  // Locked after the deadline: the whole form is replaced, per the spec.
  if(CFG&&CFG.locked){
    pane.innerHTML=`<div class="lockcard">
      <div class="lockicon">🔒</div>
      <h2>Requests are closed</h2>
      <p>The deadline for this block passed on <b>${CFG.deadline?fmtD(CFG.deadline):'the posted date'}</b>.</p>
      <p class="big">If you have a late request, please reach out to <b>${esc(CFG.lateContact||'Dr. Nadon')}</b> directly.</p>
      <p class="muted">Anything you submitted before the deadline is still on file and is shown below.</p>
    </div>
    <h2 class="sec">What I asked for</h2><div id="reqRead"></div>`;
    renderReqRead($('#reqRead'));
    return;
  }

  const rq=MYREQ||{}, off=rq.off||[], cme=rq.cme||[], nonoc=rq.no_noc||[], on=rq.on||[];
  const allow=(CFG&&CFG.allowance)||50;
  /* THE YEAR BEING REQUESTED FOR, not the year it happens to be.
     This read new Date().getFullYear() — 2026 — and counted only off-days in that year. But
     requests close 1 January 2027 and are FOR what comes after, so every date anybody entered
     was filtered straight back out: "0 days off asked for", "50 of 50 left", however many they
     had saved. The counters looked broken because they were counting a different year from the
     one the form collects.
     The window opens when requests close, which is the rule the deadline already states. */
  const rs=reqStart(), ry=reqYear();
  const usedThisYear=off.filter(d=>d.slice(0,4)===String(ry)).length;
  const left=Math.max(0,allow-usedThisYear);
  const dl=daysLeft();

  // Moonlighters do not request time off — they offer availability and a shift target.
  // Client 8/17 #3: "for Moonlighters, this is completely separate".
  if(((DATA.providers[ME]||{}).cat||'')==='Moonlighter'){ renderMoonReq(pane,rq,dl); return; }
  pane.innerHTML=`
    ${onBehalf()?`<div class="behalf">You are editing <b>${esc(fullOf(ME))}</b>'s requests.
      Anything you save here is filed under their name.</div>`:''}
    ${reqSavedHTML()}
    ${CFG&&CFG.deadline?`<div class="deadline ${dl!==null&&dl<=7?'soon':''}">
      <b>Requests close ${fmtD(CFG.deadline)}</b>
      <span>${dl===null?'':dl<0?'closed':dl===0?'today — midnight Mountain':dl+' day'+(dl===1?'':'s')+' left'}</span>
    </div>`:''}

    <div class="balance">
      <div><span class="n">${usedThisYear}</span><span class="l">days off asked for in ${ry}</span></div>
      <div><span class="n">${left}</span><span class="l">of ${allow} left</span></div>
      <div><span class="n">${cme.length}</span><span class="l">CME days (no cap)</span></div>
    </div>
    <p class="muted" style="margin:2px 0 14px">Your allowance resets 1 January and unused days don’t carry over.
    CME is tracked separately and never counts against it.
    <b>Please do not request more than 14 consecutive days off without notifying Dr. Nadon for
    approval.</b></p>

    <h2 class="sec">Request Off</h2>
    <div class="addrow"><input type="date" id="offDate" aria-label="date" min="${rs}" max="${ry}-12-31" value="${rs}"><button class="btn" id="offAdd">Add</button></div>
    <div class="addhint" id="offHint"></div>
    <div class="chips" id="offChips">${chipList(off,'off',1)}</div>

    <h2 class="sec">Request CME</h2>
    <div class="addrow"><input type="date" id="cmeDate" aria-label="date" min="${rs}" max="${ry}-12-31" value="${rs}"><button class="btn" id="cmeAdd">Add</button></div>
    <div class="addhint" id="cmeHint"></div>
    <div class="chips" id="cmeChips">${chipList(cme,'cme',1)}</div>

    <h2 class="sec">Request No Nights</h2>
    <div class="addrow"><input type="date" id="nnDate" aria-label="date" min="${rs}" max="${ry}-12-31" value="${rs}"><button class="btn" id="nnAdd">Add</button></div>
    <div class="addhint" id="nnHint"></div>
    <div class="chips" id="nnChips">${chipList(nonoc,'nn',1)}</div>

    <h2 class="sec">Priority holiday</h2>
    <p class="muted" style="margin-top:0">You may claim <b>one</b> holiday a year as your guaranteed 4-day block.</p>
    <div class="segx" id="holSeg">
      ${[['','none'],['thanksgiving','Thanksgiving'],['christmas','Christmas'],['newyear','New Year']]
        .map(([k,l])=>`<button data-h="${k}" class="${(rq.holiday||'')===k?'on':''}">${l}</button>`).join('')}
    </div>

    <div class="savebar">
      <button class="btn primary" id="reqSave">Save my requests</button>
      <span id="reqMsg" class="muted"></span>
    </div>
    <div id="reqErr"></div>`;

  /* THE PICKER OPENS ON THE WINDOW, NOT ON TODAY. A bare date input opens at the current month
     however its min is set, so everyone was landing on August 2026 and scrolling forward five
     months to reach the block they are requesting for. Prefilled with the first day of the
     window instead.
     iOS's own "Reset" clears the field, which is why the empty case below still matters and
     still has to say something useful rather than looking broken. */
  const add=(inputId,arr,tag)=>{
    const el=$('#'+inputId), hint=$('#'+tag+'Hint');
    if(!el.value){                       // silence next to a big button reads as "broken"
      if(hint)hint.textContent='Pick a date first, then press Add.';
      el.focus(); if(el.showPicker)try{el.showPicker();}catch(e){}
      return;
    }
    const v=el.value;
    if(arr.includes(v)){ if(hint)hint.textContent=fmtD(v)+' is already on the list.'; return; }
    arr.push(v);
    el.value=''; MYREQ={...rq,off,cme,no_noc:nonoc,on}; renderReq();
  };
  $('#offAdd').onclick=()=>add('offDate',off,'off');
  $('#cmeAdd').onclick=()=>add('cmeDate',cme,'cme');
  $('#nnAdd').onclick=()=>add('nnDate',nonoc,'nn');
  const wire=(sel,arr)=>$$(sel+' .pillx',pane).forEach(c=>c.onclick=()=>{
    const i=arr.indexOf(c.dataset.d); if(i>=0)arr.splice(i,1);
    MYREQ={...rq,off,cme,no_noc:nonoc,on}; renderReq();});
  wire('#offChips',off); wire('#cmeChips',cme); wire('#nnChips',nonoc);
  $$('#holSeg button',pane).forEach(b=>b.onclick=()=>{
    MYREQ={...rq,off,cme,no_noc:nonoc,on,holiday:b.dataset.h||null}; renderReq();});

  $('#reqSave').onclick=async()=>{
    const msg=$('#reqMsg'), errBox=$('#reqErr');
    msg.textContent='saving…'; errBox.innerHTML='';
    try{
      const who=onBehalf();
      const body={off,cme,no_noc:nonoc,on,holiday:(MYREQ&&MYREQ.holiday)||null};
      if(who)body.person=who;
      const r=await api('/requests',{method:'POST',body:JSON.stringify(body)});
      MYREQ=r.requests;
      // renderReq() rebuilds the pane, which destroyed this very element and every trace that
      // the save had happened — the button looked dead even though the server had taken it.
      REQSAVED={at:Date.now(),who:r.person};
      renderReq();
    }catch(e){
      msg.textContent='';
      const probs=(e.payload&&e.payload.problems)||[e.message];
      errBox.innerHTML=`<div class="errbox"><b>That didn’t save</b><ul>${probs.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
    }

}

/* ---------- coverage requests ----------
   Client 8/17 #2: asking everyone who *can* take the shift is the good path, so it leads.
   Picking one person stays available but is the secondary choice. First accept wins; only then
   is an admin asked. */
let COVER=[];
async function loadCoverage(){

  paintSwapDot();
