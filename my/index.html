<title>Scheduling Wizard · CCPSA</title>
<script>
/* HOW AN INSTALLED APP GETS A NEW VERSION.
   An app on a home screen is almost never "loaded" — it is resumed. It can sit for weeks
   without a single page load, which is why "check on load" left people on an old build until
   they deleted and reinstalled it. The check that matters is the one when the app comes back to
   the FOREGROUND; that is the only moment it reliably happens. */
if('serviceWorker' in navigator){
  // Was this page already under a worker's control? If not, the very first activation fires
  // controllerchange too — reloading there means every fresh install reloads itself the instant
  // it opens, which looks like the app crashing on launch.
  var HADSW=!!navigator.serviceWorker.controller, swreloaded=false, swpending=false;

  // Never yank the page out from under someone: a reload mid-sentence loses what they typed.
  function swBusy(){
    var a=document.activeElement||{};
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||''))return true;
    return !!document.querySelector('.sheet.on,.modal.on,dialog[open]');
  }
  function swApply(){
    if(swreloaded)return;
    if(document.visibilityState!=='visible'||swBusy()){swpending=true;return;}
    swreloaded=true; location.reload();
  }
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!HADSW){HADSW=true;return;}   // first install, nothing to replace
    swApply();
  });

  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
    setInterval(function(){reg.update();},900000);        // and every 15 min if left open
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState!=='visible')return;
      if(swpending){swreloaded=true;location.reload();return;}  // deferred from earlier
      reg.update();                                      // the check that actually catches it
    });
    window.addEventListener('focus',function(){reg.update();});
    // A worker that installed but is waiting for every tab to close would never take over on a
    // phone, where the app is suspended rather than closed. Tell it to go ahead.
    if(reg.waiting)reg.waiting.postMessage('skipWaiting');
    reg.addEventListener('updatefound',function(){
      var w=reg.installing; if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller)w.postMessage('skipWaiting');
      });
    });
  }).catch(function(){});
}
</script>
<style>
/* ---------- COLOUR ----------
   Everything on screen is drawn from these tokens, and the two themes are two sets of values
   for them. That is the only way a second theme stays true: a component that reaches for a
   literal is a component that will be unreadable in the theme its author was not looking at.

   Dark is the default because a schedule gets checked at 3am on a night shift, and a white
   screen at 3am is genuinely unpleasant. Light follows the phone's own setting unless somebody
   overrides it, because that setting is already their answer to this question.

   --card, --ok/--warn/--bad and their -ink partners were literals scattered through the sheet
   before this. One of them, var(--card) on the holiday chips, was never defined at all. */
:root{
  color-scheme:dark;
  --chrome:rgba(14,22,33,.92);      /* sticky header / tab bar, translucent over content */
  --chrome-solid:#0E1621;
  --ground:#0E1621; --panel:#16212E; --panel2:#1C2A3A; --line:#24374A; --line2:#31485F;
  --ink:#E8EEF4; --dim:#8AA0B4; --faint:#6F94B3;   /* 4.55:1 at worst — AA for small text */
  --signal:#35D6A4; --amber:#FBBF24; --alert:#FF6B6B;
  --card:#1C2A3A;                 /* a raised surface inside a panel */
  --chip:#35D6A4; --chip-ink:#06231A;      /* a chosen chip: the accent, not a darker dark */
  --ok:rgba(53,214,164,.14);   --ok-ink:#9BF0D5;
  --warn:rgba(251,191,36,.14); --warn-ink:#FCD98A;
  --bad:rgba(255,107,107,.14); --bad-ink:#FFC9C9;
  --info:rgba(96,165,250,.14); --info-ink:#C3DBFF;
  --info-line:rgba(96,165,250,.42); --info-strong:#EAF2FF; --info-soft:#A9C8F0;
  --test:rgba(180,83,9,.14); --test-ink:#FFD9A8;
  --shadow:rgba(0,0,0,.34);
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabh:60px;
}

/* Light. The accent darkens: a mint that reads well on near-black is close to invisible on
   white, so the token changes rather than the components that use it. */
:root[data-theme="light"]{
  color-scheme:light;
  --chrome:rgba(255,255,255,.92); --chrome-solid:#FFFFFF;
  --ground:#F4F7FA; --panel:#FFFFFF; --panel2:#F0F4F8; --line:#DCE5EE; --line2:#C3D2E0;
  --ink:#0F1D2B; --dim:#4A5A6B; --faint:#42586D;
  --signal:#0A7A57; --amber:#8A5C06; --alert:#C2352F;
  --card:#F0F4F8; --muted:#5A6B7D;
  --chip:#0A7A57; --chip-ink:#FFFFFF;
  --ok:rgba(14,159,115,.12);   --ok-ink:#0A6E50;
  --warn:rgba(180,121,11,.14); --warn-ink:#7A5207;
  --bad:rgba(194,53,47,.10);   --bad-ink:#8E2420;
  --info:rgba(37,99,235,.10);  --info-ink:#1D4ED8;
  --info-line:rgba(37,99,235,.30); --info-strong:#12328C; --info-soft:#2A4E9B;
  --test:rgba(180,83,9,.12); --test-ink:#7A3E05;
  --shadow:rgba(15,29,43,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* THE SHELL IS A FLEX COLUMN, NOT A SCROLLING DOCUMENT.
   The tab bar sat above the bottom of the screen on Swaps and nowhere else, and two attempts to
   fix it as a position:fixed element failed: the bar is a direct child of body with no
   transformed ancestor, and forcing the document to a full screen height changed nothing. What
   the failures have in common is that both trusted iOS to resolve bottom:0 against the viewport
   on a page shorter than the screen -- which is the one case that only ever arises on Swaps.

   So the bar no longer relies on that. header / main / nav are flex items in a column exactly one
   viewport tall; the bar is the last item, placed by layout, and the only thing that can move it
   is the height of the box above it. There is nothing left for a viewport quirk to get wrong.

   The scroll moves from the document to main. Everything overlaid -- sheets, scrim, gate, toast --
   is still position:fixed against the viewport and is unaffected.

   THE HEIGHT IS 100dvh, NOT 100%. Placing the bar by layout only moves the question: the column
   has to be exactly as tall as the screen. height:100% chains from html, and on the reporting
   device it resolved SHORT -- the bar landed on every tab where it used to land on Swaps alone,
   which is the same fault wearing a different hat. 100dvh is measured against the viewport
   itself rather than an ancestor, with 100vh ahead of it for anything that does not know dvh.
   In an installed app the two are equal; there is no browser chrome to shrink one of them. */
/* AT LEAST A SCREEN TALL, IN CSS, AT LAYOUT TIME.
   iOS in standalone resolves bottom:0 against the DOCUMENT when the document is shorter than the
   viewport, so the tab bar sits at the end of the content instead of on the glass. padShort()
   fixes that by measuring and padding — but measuring happens after a layout, so there is a
   window where the short page has already been laid out and the bar has already been placed
   wrong. Safari then animates it back down as the page grows, which is the slow slide Sam sees
   going Home -> Providers: the admin home is tall, the pane behind it is nearly empty, and the
   document collapses for a moment before the spacer lands.
   A min-height cannot be late. It is applied in the same layout pass that places the bar, so
   there is no first frame where the document is short and nothing to animate back from.
   min- rather than height, so a long page still grows. padShort() stays: it also covers content
   that arrives after a fetch, and belt-and-braces here costs nothing. */
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;
     min-height:100vh;                 /* for anything that does not know dvh */
     min-height:100dvh;                /* the viewport as it actually is, chrome included */
     padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--signal)}

/* ---------- shell ---------- */
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
body.wide .wrap{max-width:1500px}
.pdrop{position:fixed;z-index:60;width:min(330px,calc(100vw - 24px));
  background:var(--panel);border:1px solid var(--line2);border-radius:13px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.pdrop .pds{position:sticky;top:0;background:var(--panel);padding:9px;border-bottom:1px solid var(--line)}
.pdrop input{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;
  background:var(--panel2);color:var(--ink);font:inherit;font-size:14px}
.pdrop input:focus{outline:2px solid var(--signal);outline-offset:-1px}
.pdlist{max-height:min(58vh,420px);overflow:auto;-webkit-overflow-scrolling:touch}
.pdrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;
  border:0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--ink);font:inherit;
  font-size:14px;text-align:left;cursor:pointer}
.pdrow:hover,.pdrow:focus{background:var(--panel2)}
.pdrow.on{background:rgba(53,214,164,.13)}
.pdrow .av{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;
  place-items:center;font-size:10px;font-weight:700;color:var(--dim);flex:0 0 auto}
.pdrow.on .av{background:var(--signal);color:#06231A}
.pdnone{padding:14px 12px;font-size:13px;color:var(--dim)}
/* THE PAGE STARTS UNDER THE CLOCK. viewport-fit=cover hands us the whole screen including the
   area behind the status bar, and nothing here ever gave it back — so "⚡ SCHEDULING WIZARD" was
   drawn into the wifi, battery and time. env(safe-area-inset-top) is 0 in a browser tab and ~47px
   on an installed iPhone app, so this costs nothing where it is not needed. */
/* Sticks BELOW the test banner, not underneath it. On the test copy body::before is also
   sticky at top:0 with z-index 9999, so both pinned to the same line and the banner won.
   In portrait its text wraps to two lines (33px) and swallowed the header completely,
   which read as the header not being fixed at all; in landscape it is one line (17px) and
   the header showed, which is why it looked like an orientation bug. --bannerh is 0 in
   production, where there is no banner, so this costs nothing there. */
header.top{position:sticky;top:var(--bannerh, 0px);z-index:30;background:var(--chrome);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
  padding-top:var(--hdrsafe, env(safe-area-inset-top))}
.topin{padding:11px 14px;display:flex;align-items:center;gap:10px;min-height:34px}

.mark{background:var(--mark) center/contain no-repeat;display:block;flex:0 0 auto;
      aspect-ratio:79/176;width:auto}
.brand .mark{height:24px}   /* 19px turned the hat and the S to mush; 24 is the smallest that
                               still reads as the mark rather than a smudge */
.siLogo .mark{height:46px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand b{color:var(--dim);font-weight:700}
.whoami{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;cursor:pointer}
.whoami .nm{font-size:13.5px;font-weight:700}
.whoami .chev{color:var(--dim);font-size:11px}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:600}
h2.sec{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:22px 0 12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- next shift hero ---------- */
.hero{margin-top:16px;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:linear-gradient(155deg,var(--panel2),var(--panel))}
.hero .spine{height:5px;background:var(--dim)}
.hero .in{padding:18px 18px 20px}
.hero .when{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:700}
.hero .unit{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:8px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.hero .sub{color:var(--dim);font-size:13.5px;margin-top:5px}
.hero .date{font-family:var(--mono);font-size:15px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .date .t{color:var(--dim);font-size:13px}
.dotU{width:13px;height:13px;border-radius:4px;flex:none}

/* ---------- week strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.sday{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 3px 8px;text-align:center;min-height:66px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sday .dw{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.sday .dn{font-family:var(--mono);font-size:15px;font-weight:700;line-height:1}
.sday.today{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset}
.chip{width:26px;height:8px;border-radius:3px;background:var(--line2)}
.chip.off{background:transparent;border:1px dashed var(--line2)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1}
.tile .v small{font-size:14px;color:var(--dim);font-weight:600}
.tile .f{font-size:11.5px;color:var(--dim);margin-top:4px}
.bar{height:4px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:3px}

/* ---------- month calendar ---------- */
.month{margin-top:16px;border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden}
.month h4{margin:0;padding:11px 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-weight:600;
  display:flex;justify-content:space-between}
.month h4 b{color:var(--ink);font-weight:700}
/* Manage access. One row per person, and the row is the unit that matters — the chips have to be
   readable at a glance next to the name, because the question is always "who is stuck". */
/* THE ACCESS SCREEN. 65 rows, read on a phone at the moment somebody cannot sign in — so it
   filters, it puts the people who need attention at the top, and the row lays itself out
   sideways when there is room and stacks when there is not. The three actions are NOT equal:
   Unlock gives access back and is the common one; Close account takes it away and is styled to
   be harder to hit by accident. */
/* A REAL FIELD STYLE. There was none: `class="in"` is the hero/gate container, not an input, so
   every box on this screen and in its confirm sheet was a raw browser control. .fld is the form
   primitive the rest of these screens should use too. */
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld > label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--dim)}
.fld input{width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:11px;
  background:var(--panel2);color:var(--ink);font-size:16px;font-family:inherit;
  transition:border-color .12s,box-shadow .12s}
.fld input::placeholder{color:var(--faint)}
.fld input:focus{outline:none;border-color:var(--signal);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 22%,transparent)}
.fld .hint{font-size:12px;color:var(--faint);line-height:1.5}
.fld.bad input{border-color:var(--alert)}

/* Search: the icon sits inside the box, and a clear button appears once there is something to
   clear — at 65 names you retype this more than once. */
.accsearch{position:relative;margin:12px 0 10px}
.accsearch input{width:100%;padding:12px 38px 12px 40px;border:1px solid var(--line2);
  border-radius:12px;background:var(--panel2);color:var(--ink);font-size:16px;font-family:inherit;
  transition:border-color .12s,box-shadow .12s}
.accsearch input::placeholder{color:var(--faint)}
.accsearch input:focus{outline:none;border-color:var(--signal);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 22%,transparent)}
.accsearch .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;
  height:17px;color:var(--faint);pointer-events:none}
.accsearch .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;
  background:transparent;color:var(--faint);font-size:17px;cursor:pointer;padding:5px 8px;
  border-radius:8px;line-height:1}
.accsearch .clr:hover{color:var(--ink);background:var(--panel)}

/* Filters as one segmented control rather than four loose pills. */
.acctabs{display:flex;gap:3px;padding:3px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.acctabs::-webkit-scrollbar{display:none}
.acctab{flex:1 1 auto;border:0;background:transparent;color:var(--dim);border-radius:9px;
  padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:background .12s,color .12s}
.acctab .n{font-weight:500;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
.acctab:hover:not(:disabled):not(.on){color:var(--ink)}
.acctab.on{background:var(--chip);color:var(--chip-ink)}
.acctab.on .n{opacity:.8}
.acctab:disabled{opacity:.35;cursor:default}
.acclist{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.accrow{border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  display:flex;flex-direction:column;gap:9px;border-left:3px solid transparent}
.accrow.needs{border-left-color:#F87171;background:#F871710A}
.accrow.pending{border-left-color:#FBBF24}
.accrow.off{opacity:.6;border-left-color:var(--line)}
.accmain{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.accwho{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 190px}
.accwho b{font-size:15px;letter-spacing:-.01em}
.accsub{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accchips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.achip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--dim);
  white-space:nowrap}
.achip.bad{border-color:#F8717155;color:#F87171;background:#F871711A}
.achip.warn{border-color:#FBBF2455;color:#FBBF24;background:#FBBF241A}
.accact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* .btn is width:100% everywhere else in this app, which is right for a stacked sheet and wrong
   for a row of three. Sized to their own text here, and only here. */
.accact .btn.sm{width:auto;flex:0 0 auto;white-space:nowrap}
.accact .quiet{border-color:transparent;color:var(--dim)}
.accact .quiet:hover{border-color:#F8717155;color:#F87171}
.accnote{font-size:12px;color:var(--dim);font-style:italic}
.accnone{padding:18px 4px;color:var(--dim);font-size:13px;text-align:center}
/* On a phone the chips always take their own line. Left to wrap naturally they sat beside a
   short name and under a long one, so the same list looked like two different designs. */
@media(max-width:559px){ .accchips{flex-basis:100%} }
/* Wide enough to read it on a laptop: identity left, state and actions right. */
@media(min-width:560px){
  .accrow{flex-direction:row;align-items:center;gap:14px}
  .accmain{flex:1 1 auto;align-items:center;flex-wrap:nowrap}
  .accact{flex:0 0 auto;justify-content:flex-end}
}
/* THE CONFIRM SHEET. It asks for a password and a typed name, and it used to do that with two
   unstyled boxes under a paragraph — the same weight whether you were giving access back or
   taking it away. Who it is about goes first, what will happen to them second, and the
   destructive one is coloured all the way through rather than only on its button. */
.cabox{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--panel2)}
.cabox.danger{border-color:rgba(255,107,107,.4);background:var(--bad)}
.cawho{display:flex;gap:11px;align-items:center}
.caav{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:15px;background:var(--panel);color:var(--dim);
  border:1px solid var(--line2)}
.cabox.danger .caav{background:rgba(255,107,107,.16);color:var(--bad-ink);
  border-color:rgba(255,107,107,.4)}
.cawho b{font-size:15.5px;display:block;line-height:1.25}
.cawhat{font-size:12px;color:var(--dim);letter-spacing:.01em}
.cabox.danger .cawhat{color:var(--bad-ink)}
.cadesc{margin:11px 0 0;font-size:13px;line-height:1.6;color:var(--dim)}
.cabox.danger .cadesc{color:var(--bad-ink)}

/* WHAT TO TELL THEM. A toast disappears; the instruction an admin has to relay should not. */
.accsay{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:4px}
.accsay h4{margin:0 0 6px;font-size:14px}
.accsay p{margin:0 0 8px;font-size:13.5px;color:var(--dim)}
.accsay .copyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.accsay code{background:var(--soft,#0000000d);padding:5px 9px;border-radius:7px;font-size:12.5px;
  word-break:break-all}
.btn.sm{padding:6px 10px;font-size:12.5px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:9px}
.dow.we{color:var(--faint)}
.dow{font-family:var(--mono);font-size:calc(11px * var(--calscale, 1));color:var(--dim);text-align:center;padding:2px 0 4px;letter-spacing:.05em}
.cell{min-height:calc(52px * var(--calscale, 1));border-radius:8px;background:var(--panel2);padding:4px 3px 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border:1px solid transparent}
.cell.blank{background:transparent;cursor:default}
/* The ring is drawn inside the border box so a highlighted day does not shift its neighbours,
   and it sits over the unit colour rather than replacing it — today still shows what you are on. */
.cell.today{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset}
.cell.today .n{color:var(--signal);font-weight:700}
/* LARGER TYPE IN THE MONTH GRID (Aaron, 2026-08-25). Seeing a whole month at once is the
   feature people liked, so the cap is that it must still fit: seven columns on a 320px phone
   with no horizontal scroll. Date 11->12.5px, shift chip 8->9.5px and 15->17px tall, and the
   cell grows to match rather than clipping the chip. */
.cell .n{font-family:var(--mono);font-size:calc(12.5px * var(--calscale, 1));color:var(--dim);line-height:1}
.cell.on .n{color:var(--ink);font-weight:700}
.cell.sel{border-color:var(--signal)}
.cell .blk{width:100%;height:calc(17px * var(--calscale, 1));border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:calc(9.5px * var(--calscale, 1));font-weight:700;color:var(--ground);overflow:hidden;white-space:nowrap;padding:0 1px}
/* The label sits in its own element so it can be condensed without squashing the chip:
   a transform on .blk would scale the coloured box too. */
.blk .bt{display:block;white-space:nowrap;transform-origin:center center}
.cell .blk.noc{font-size:8px;letter-spacing:0}
.cell .blk.cme{background:rgba(96,165,250,.22);border:1px solid rgba(96,165,250,.55);color:var(--info-ink);
  letter-spacing:.04em}
.cell .blk.split{background-image:none}
.cell .req{position:absolute;top:2px;right:3px;font-size:8px;color:var(--signal)}
.cell .rl{width:5px;height:5px;border-radius:50%;background:#F0ABFC}

/* ---------- lists ---------- */
.row{display:flex;gap:11px;align-items:center;padding:11px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;margin-top:7px}
.row .sp{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:30px}
.row .d{font-family:var(--mono);font-size:12.5px;color:var(--dim);width:58px;flex:none}
.row>span:not(.sp):not(.d):not(.rt){min-width:0}
.row .t{font-weight:700;font-size:14px;display:block}
.row .s{font-size:11.5px;color:var(--dim);margin-top:2px;display:block;line-height:1.45}
.row .rt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}

/* ---------- buttons ---------- */
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:12px 15px;font-size:14px;
  font-weight:700;cursor:pointer;text-decoration:none;width:100%}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:var(--chip-ink)}
.btn.gho{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:grid;gap:8px;margin-top:10px}
.btnrow.two{grid-template-columns:1fr 1fr}
.btnrow.three{grid-template-columns:1fr 1fr 1fr}

/* ---------- week view ----------
   Seven rows down the page, so a day gets the full width and the shift can be set at a size the
   month grid physically cannot reach. Everything scales from --calscale like the grid does, but
   from a much larger base: the point of this view is that the words are big.
   No condensing here and none needed — the constraint the grid fights is column width, and a row
   has the whole screen. */
.wknav{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.wkspan{flex:1;text-align:center;line-height:1.25}
.wkspan b{display:block;font-size:calc(17px * var(--calscale,1));letter-spacing:-.01em}
.wkspan span{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.wkarrow{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line2);
  background:var(--panel);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.wkarrow[disabled]{opacity:.32;cursor:default}
.wkbtns{display:flex;justify-content:center;margin-bottom:10px}
.wkbtns .btn{padding:7px 16px;font-size:13px}

.wklist{display:flex;flex-direction:column;gap:8px}
.wkrow{display:flex;gap:12px;align-items:stretch;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:12px 13px;cursor:pointer}
.wkrow.today{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset}
.wkday{flex:none;width:calc(52px * var(--calscale,1));text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:1px}
.wkday b{display:block;font-family:var(--mono);font-size:calc(12px * var(--calscale,1));
  color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.wkday span{display:block;font-size:calc(26px * var(--calscale,1));font-weight:800;
  line-height:1.05;letter-spacing:-.02em}
.wkbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.wkshift{border-left:4px solid var(--line2);padding-left:11px}
.wkname{font-size:calc(19px * var(--calscale,1));font-weight:750;line-height:1.2;
  letter-spacing:-.01em;overflow-wrap:anywhere}
.wkmeta{font-size:calc(12.5px * var(--calscale,1));color:var(--dim);margin-top:2px;line-height:1.35}
.wkoff{font-size:calc(16px * var(--calscale,1));color:var(--faint);font-weight:600}
.wkoff.cme{color:var(--info-ink)}
.wkrole{font-size:calc(12px * var(--calscale,1));color:var(--dim)}

/* ---------- pills / notes ---------- */
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 8px;
  border-radius:999px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.06em}
.pill.ok{color:var(--signal);border-color:rgba(53,214,164,.45);background:rgba(53,214,164,.1)}
.pill.warn{color:var(--amber);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.09)}
.note{color:var(--dim);font-size:12.5px;line-height:1.55;margin-top:9px}
.empty{border:1px dashed var(--line2);border-radius:13px;padding:22px 16px;text-align:center;color:var(--dim);
  font-size:13.5px;margin-top:10px}

/* ---------- tab bar ---------- */
/* THE BAR MUST SIT ON THE BOTTOM EDGE, ALWAYS.
   Reported floating above the bottom on the Swaps tab — the one tab whose content is often
   shorter than the screen. It could not be reproduced in a simulator, where it measures flush on
   all four, so this removes the two things that plausibly differ on a real iPhone:

   · backdrop-filter on a position:fixed element. On iOS this promotes the bar to its own
     compositing layer and is a known source of it being mispositioned or left behind during
     scroll. The background is 92% opaque over an almost identical ground, so the blur was
     costing a rendering quirk for an effect nobody can see. Solid now.
   · A PAGE SHORTER THAN THE SCREEN, which is the likely one. Swaps is the only tab whose content
     does not fill a phone — 844px against 844px of viewport, where Now/Schedule/Requests run
     1057-2144px. iOS in standalone resolves bottom:0 against the DOCUMENT when the document is
     shorter than the viewport, so the bar sits at the end of the content with dead space beneath
     it. min-height makes every page at least a screen tall, which removes the case entirely;
     min- rather than height, so a long page still grows instead of being clipped at one screen.

   The safe-area padding stays — it keeps the labels off the home indicator — but the background
   now runs to the physical bottom edge, so the bar reads as anchored rather than hovering. */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--chrome-solid);border-top:1px solid var(--line);
  padding-bottom:max(env(safe-area-inset-bottom), 4px)}
.tabsin{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--signal)}
/* A count on the tab, because an ask that nobody notices is an ask that goes unanswered. It sits
   on the icon rather than the label so it reads the same however long the word is. */
.tabic{position:relative;display:inline-flex}
.tabdot{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--alert);color:#fff;font:700 10px/16px var(--sans);
  text-align:center;box-shadow:0 0 0 2px var(--chrome-solid)}
.pane{display:none}.pane.on{display:block}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,10,17,.6);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line2);max-width:600px;margin:0 auto;transform:translateY(102%);
  transition:transform .22s cubic-bezier(.32,.72,0,1);max-height:86vh;overflow:auto;
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .hd{padding:14px 18px 0;display:flex;align-items:flex-start;gap:10px}
.sheet .bd{padding:12px 18px 18px}
.sheet .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex:none;
  /* A round button needs its glyph centred by the box, not by the font: the default baseline
     and the button's own padding put the ✕ high and to the left of the circle. */
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:9px auto 0}

/* ---------- gate (identity) ---------- */
#gate{display:none;position:fixed;inset:0;z-index:60;background:var(--ground);overflow:auto;padding:30px 16px 40px}
#gate .in{max-width:420px;margin:0 auto}
#gate h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:18px 0 6px}
.plist{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.pitem{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.pitem:last-child{border-bottom:0}
.pitem .av{width:32px;height:32px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--signal);flex:none}
.pitem .nm{font-weight:700;font-size:14.5px}
.pitem .ct{font-size:11.5px;color:var(--dim);margin-top:1px}
#gateSearch{width:100%;margin-top:14px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;
  padding:13px 14px;font-size:16px;outline:none}
#gateSearch:focus{border-color:var(--signal)}

/* ---------- date picker (requests) ---------- */
.pickmo{margin-top:12px}
.pick7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.pcell{aspect-ratio:1;border-radius:8px;background:var(--panel2);border:1px solid transparent;
  font-family:var(--mono);font-size:12px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pcell.blank{background:transparent;cursor:default}
.pcell.sel{background:var(--signal);color:#06231A;font-weight:800}
.pcell.has{outline:1px solid var(--line2)}
select.sel2{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:12px 13px;font-size:16px;margin-top:8px}
textarea.ta{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:12px 13px;
  font-size:15px;min-height:78px;margin-top:8px;resize:vertical;font-family:var(--sans)}

@media(min-width:620px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .hero .unit{font-size:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- PRINT ----------
   Printing this used to produce the SCREEN: a dark background at full ink, the test banner, the
   home-screen nudge, "Next 7 days", "Who's on" — everything except a schedule you could pin up.
   What comes out now is one thing, the shifts this person is working, on white paper.

   Built as its own block (#printOnly) rather than by hiding parts of the app, because the app is
   a phone layout — cards, a hero, a bottom tab bar — and no amount of hiding turns that into
   something worth printing. */
@media print{
  body{display:block!important}body>*:not(#printOnly){display:none!important}
  body{background:#fff!important;color:#000!important;padding:0!important;margin:0!important}
  body::before{display:none!important}      /* the orange TEST banner is a screen device */
  #printOnly{display:block!important;position:static!important;left:auto!important;
    width:auto!important;height:auto!important;overflow:visible!important;
    font:11pt/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#000}
  #printOnly h1{font-size:15pt;margin:0 0 1mm}
  #printOnly .pmeta{font-size:9.5pt;color:#333;margin:0 0 5mm;padding-bottom:2mm;border-bottom:2px solid #000}
  #printOnly h2{font-size:11.5pt;margin:6mm 0 1.5mm;padding-bottom:1mm;border-bottom:1px solid #999}
  #printOnly table{width:100%;border-collapse:collapse;font-size:10pt}
  #printOnly thead{display:table-header-group}
  #printOnly tr{break-inside:avoid;page-break-inside:avoid}
  #printOnly th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.4px;
    color:#444;border-bottom:1px solid #999;padding:1mm 2mm}
  #printOnly td{padding:1.1mm 2mm;border-bottom:1px solid #ddd;vertical-align:top}
  #printOnly td.pd{white-space:nowrap;width:34mm}
  #printOnly td.pt{white-space:nowrap;width:30mm;color:#333}
  #printOnly .we td{background:#f2f2f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printOnly .pnote{margin-top:6mm;font-size:8.5pt;color:#444}
  @page{margin:14mm}
}
/* Out of the flow entirely, not merely invisible. A hidden block still participates in enough
   of the layout on iOS that returning from the print sheet left the page a different width,
   with content running off the side. It is also emptied on afterprint, so nothing of the
   printed version survives the moment it was needed. */
#printOnly{display:none;position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
/* accessibility: visible focus for keyboard users; calm for reduced-motion users */
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.derow{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  margin-bottom:12px}
.dek{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.deval{font-size:32px;font-weight:800;line-height:1.1;margin:2px 0 3px;
  display:flex;align-items:baseline;gap:9px}
/* The number worked is the fact; the difference from contract is a note on it. Sized so the
   headline reads as "45, and that is level" rather than as a bare "0" nobody can place. */
.dedelta{font-size:15px;font-weight:700;letter-spacing:.01em}
.desub{font-size:12.5px;color:var(--dim)}
.chev{opacity:.65;font-size:10px}
.nudge{border-color:var(--line2)}
/* (.gobar was the "View request / Later" prompt. A notification tap goes straight to the thing
   now, so nothing renders one — the rules went with it.) */
.testgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.testgrid .btn{font-size:12.5px;padding:8px 6px}
.setrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.setrow:last-of-type{border-bottom:0}
.setk{color:var(--dim)}
.setv{text-align:right}
.cvlist{margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cvrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);
  cursor:pointer;font-size:14px}
.cvrow:last-child{border-bottom:0}
.cvrow input{width:19px;height:19px;accent-color:var(--signal);flex:none}
.cvnm{flex:1}
.cvpush{font-size:12px;color:var(--dim)}
.minorrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.minorrow a{color:var(--dim);text-decoration:underline}
.icsmore summary{font-size:11.5px;color:var(--dim);cursor:pointer}
.siOr{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--dim);font-size:12px}
.siOr::before,.siOr::after{content:'';flex:1;height:1px;background:var(--line)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---- live request + swap UI ---- */
.savedbar{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;
  padding:9px 12px;font-size:13.5px;font-weight:600;margin:0 0 12px}
.behalf{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;
  padding:9px 12px;font-size:13px;margin:0 0 12px;line-height:1.45}
.deadline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--info);border:1px solid var(--info-line);color:var(--info-ink);
  border-radius:12px;padding:11px 14px;margin:4px 0 12px;font-size:13.5px}
.deadline b{color:var(--info-strong)}
.deadline span{color:var(--info-soft)}
.deadline.soon{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.5);color:#FFE6B0}
.deadline.soon b{color:#FFF1D0}
.deadline.soon span{color:#F0C97A}
.balance{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.balance>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.balance .n{display:block;font-size:22px;font-weight:700}
.balance .l{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.addrow{display:flex;gap:8px;margin:6px 0 8px;align-items:stretch}
.addrow input{flex:1 1 auto;min-width:150px;padding:12px;border:1px solid var(--line2);
  border-radius:10px;font-size:15px;background:var(--panel2);color:var(--ink);
  font-family:inherit}
.addrow input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
/* TWO FIXES FOR THE SAME PROBLEM, CANCELLING EACH OTHER OUT. The date field carried
   `color-scheme:dark`, which is what makes the browser draw its own calendar icon light — and
   then inverted that icon back to black. On a dark ground the result was a black icon nobody
   could see. The invert dated from before color-scheme was set on :root.
   Nothing here now: :root already declares color-scheme and switches it with the theme, so the
   icon, the picker popup and the spinners all follow along in BOTH directions. Hard-coding it
   per element was also why these fields stayed dark in light mode. */
.addrow input::-webkit-calendar-picker-indicator{opacity:.75;cursor:pointer}
.addrow .btn{width:auto;flex:0 0 auto;padding:12px 20px}
.addhint{font-size:12.5px;color:var(--amber);margin:-2px 0 8px;min-height:1px}
/* WHO TO ASK — the names scroll, the button does not.
   The sheet itself scrolls, so a list of fifty-eight colleagues pushed "Send to 2" below the
   fold and you had to scroll past everybody to find out how to send. The list gets its own
   scroll and a ceiling; the actions sit under it and stay put. */
#cvWho{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:12px;padding:2px 12px 6px;margin-top:6px}
/* the group a name belongs to should still be visible once you have scrolled into it */
#cvWho .cvhead{position:sticky;top:0;z-index:1;background:var(--panel);
  margin:0;padding:11px 0 5px}
.cvactions{position:sticky;bottom:0;background:var(--panel);padding-top:12px;margin-top:0;
  border-top:1px solid var(--line)}
.cvactions .btnrow{margin-top:10px}

/* who to ask — one list, split by whether the rules allow it */
.cvload,.cvnone{font-size:13px;color:var(--dim);padding:10px 2px}
.cvhead{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:14px 0 4px;display:flex;align-items:center;gap:7px}
.cvhead:first-child{margin-top:6px}
.cvhead.warn{color:var(--amber)}
.cvhead.bad{color:var(--alert)}
.cvn{font-family:var(--mono);font-size:10.5px;color:var(--faint);background:var(--panel2);
  border:1px solid var(--line);border-radius:20px;padding:1px 7px;letter-spacing:0}
.cvrow{display:flex;align-items:center;gap:10px;padding:9px 2px;
  border-bottom:1px solid var(--line);cursor:pointer}
.cvrow:last-child{border-bottom:0}
.cvrow input{appearance:none;width:20px;height:20px;flex:none;cursor:pointer;
  border:1.5px solid var(--line2);border-radius:6px;background:var(--panel2);
  display:grid;place-content:center}
.cvrow input:checked{background:var(--signal);border-color:var(--signal)}
.cvrow input:checked::after{content:'';width:10px;height:5px;border:2px solid var(--ground);
  border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.cvrow input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.cvnm{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* not selectable — shown so nobody wonders where a colleague went, with the reason */
.cvrow.off{cursor:default;padding-left:30px}
.cvrow.off .cvnm{color:var(--dim)}
.cvbad{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.cvbad>summary{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;
  padding:4px 0}
.cvbad>summary::-webkit-details-marker{display:none}
.cvbad>summary::before{content:'▸';font-size:10px;transition:transform .15s}
.cvbad[open]>summary::before{transform:rotate(90deg)}

/* archived requests — a closed drawer, deliberately quieter than everything above it */
.arch{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.arch>summary{font-size:13px;color:var(--dim);cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px;padding:4px 0}
.arch>summary::-webkit-details-marker{display:none}
.arch>summary::before{content:'▸';color:var(--faint);font-size:11px;transition:transform .15s}
.arch[open]>summary::before{transform:rotate(90deg)}
.arch>summary:hover{color:var(--ink)}
.archn{font-family:var(--mono);font-size:11px;color:var(--faint);
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.archbody{margin-top:10px;display:flex;flex-direction:column;gap:1px}
.archrow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;
  padding:9px 2px;border-bottom:1px solid var(--line)}
.archrow:last-child{border-bottom:0}
.archk{font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.archw{min-width:0;font-size:13.5px;line-height:1.4}
.archw b{font-weight:620;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.archwho{display:block;color:var(--dim);font-size:12.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.arch>summary::before{transition:none}}
.icsmore{margin-top:9px}
.icsmore summary{font-size:12.5px;color:var(--dim);cursor:pointer}
/* Sits in an account row, so it matches the row's type rather than a form field's. */
.qrow{display:flex;align-items:center;gap:9px;margin-top:10px}
.qlbl{font-size:12px;color:var(--dim);white-space:nowrap}
.qrow .acsel{flex:1}
.acsel{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:9px;padding:7px 9px;font:600 13px var(--sans);flex:none;cursor:pointer}
.accttheme{background:transparent;border:1px solid var(--line);color:var(--dim);
  width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.acctbuild{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em;
  margin-left:auto;margin-right:10px;white-space:nowrap}
.testdate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 14px;
  border-top:1px solid var(--line);background:var(--test)}
.testdate .tdl{font-size:12px;color:var(--test-ink);font-weight:700}
.testdate .tdi{padding:5px 8px;border:1px solid var(--line2);border-radius:8px;
  background:var(--panel2);color:var(--ink);font:inherit;
  font-size:16px}   /* the test-site date picker zoomed the page like any other small field */
.testdate .tdb{font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:26px}
.pillx{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  font-size:13px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  cursor:pointer;user-select:none}
.pillx b{opacity:.65;font-weight:700}
.pillx:hover b,.pillx:active b{opacity:1;color:#fff}
.pillx.off{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.45);color:#FFC2C2}
.pillx.cme{background:rgba(96,165,250,.15);border-color:rgba(96,165,250,.45);color:var(--info-ink)}
.pillx.nn{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.45);color:#DCD1FF}
.pillx.on{background:rgba(53,214,164,.15);border-color:rgba(53,214,164,.5);color:var(--ok-ink)}
/* Two balanced rows, and the tick takes up its space whether or not it is showing. As a wrapping
   flex row the four chips sized themselves to their words, so ticking one made it wider and shoved
   the others onto a different line — the row rearranging itself under the finger that just tapped
   it. Equal columns and a reserved marker mean choosing changes the colour and nothing else. */
.segx{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.segx button{padding:9px 10px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;font-size:13px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:5px;min-height:38px}
.segx button::before{content:'✓';font-weight:800;visibility:hidden;flex:none}
/* Selected read as "slightly different dark" against the panel behind it — on a phone in a
   corridor that is no signal at all. It is the accent now, with a tick, so a glance answers
   "which one is chosen". */
.segx button.on{background:var(--chip);color:var(--chip-ink);border-color:var(--chip);font-weight:700}
.segx button.on::before{visibility:visible}
.savebar{display:flex;align-items:center;gap:12px;margin:16px 0 8px}
.btn.primary{background:var(--chip);color:var(--chip-ink);border-color:var(--chip)}
.btn.warnbtn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.errbox{background:var(--bad);border:1px solid rgba(255,107,107,.45);color:var(--bad-ink);

.errbox b{color:#FFE1E1}
.errbox ul{margin:6px 0 0 18px}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;margin-top:14px}
.lockicon{font-size:34px}
.lockcard h2{margin:8px 0 6px;font-size:19px}
.lockcard .big{font-size:15px;margin-top:10px}
.rdrow{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.rdrow span:first-child{color:var(--muted)}
.swapform{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:8px}
.swapform .l{font-size:12px;color:var(--muted);margin-top:4px}
.swapform select,.swapform input,.inp{padding:11px;border:1px solid var(--line2);border-radius:10px;
  font-size:15px;background:var(--panel2);color:var(--ink);font-family:inherit;
  width:100%}
.swapform select:focus,.swapform input:focus,.inp:focus{outline:2px solid var(--signal);
  outline-offset:-1px;border-color:var(--signal)}
.swcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.swtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.swwho{font-size:12.5px;color:var(--muted);margin-top:3px}
.swprob,.swrule{margin-top:8px;font-size:12.5px;border-radius:10px;padding:8px 10px}
.swprob,.swrule.bad{background:var(--bad);border:1px solid rgba(255,107,107,.45);color:var(--bad-ink)}
.swrule.ok{background:var(--ok);border:1px solid rgba(53,214,164,.5);color:var(--ok-ink)}
.swact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.chg{border-left:3px solid var(--warn,#FBBF24);background:rgba(251,191,36,.07)}
.chgh{font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.chgl{margin:0 0 8px;padding-left:18px;line-height:1.65}
.chgl li{margin:2px 0}
.sm{font-size:12px}

.lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:10px 0 5px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:10px 12px;font:inherit;
  /* 16px is the threshold below which iOS zooms the page on focus and does not zoom back.
     Every field a physician types into has to clear it — a note, a date, a search box. */
  font-size:16px}
.edlist{margin-top:8px}
.edrow{display:grid;grid-template-columns:12px 1fr auto 12px;gap:10px;align-items:center;width:100%;
  text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:11px 12px;margin-bottom:6px;font:inherit;cursor:pointer}
.edrow:hover{border-color:var(--line2)}
.edu{font-weight:600;font-size:13.5px}
.edw{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.cpick{cursor:pointer;font:inherit;font-size:12.5px}
.cpick.on{background:var(--signal);border-color:var(--signal);color:var(--ground);font-weight:600}
.shh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.lgh{font-weight:600;font-size:13.5px}
.tagw{font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:#fff7ed;color:#9a3412;
  border:1px solid #fdba74;border-radius:999px;padding:1px 7px;margin-left:6px}
.tagc{font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:rgba(251,191,36,.12);
  color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:1px 7px;margin-left:6px}
.lnk{background:none;border:0;color:var(--signal);font:inherit;font-size:12px;cursor:pointer;
  padding:0 0 0 8px;text-decoration:underline}
.muted{color:var(--dim)}
.toastbox{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:86vw;text-align:center}
.toastbox.on{opacity:1;transform:translateX(-50%) translateY(0)}

.inst{border-left:3px solid var(--signal)}
.steps{margin:10px 0 0;padding-left:20px;line-height:1.85;font-size:13.5px}
.steps li{margin:4px 0}
.ic{font-family:var(--mono);border:1px solid var(--line2);border-radius:5px;padding:0 5px;margin-left:2px}

body.locked header,body.locked main,body.locked .tabs{display:none}
.signin{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;padding:22px;z-index:90}
.siCard{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:22px}
.siLogo{font-size:26px}
.siH{font-family:var(--mono);font-size:20px;margin:8px 0 2px;font-weight:600}
.siSub{color:var(--dim);font-size:13px;margin-bottom:6px}
.siL{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:14px 0 5px}
.siI{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:12px;font:inherit;font-size:16px}
.siI:focus{outline:2px solid var(--signal);outline-offset:1px}
/* Belt and braces for anything typed into that does not carry .inp or .siI. */
input,select,textarea{font-size:16px}
.siB{width:100%;margin-top:16px;background:var(--signal);border:0;color:var(--ground);font:inherit;
  font-weight:700;font-size:15px;border-radius:10px;padding:13px;cursor:pointer}

  background:var(--panel2);border:1px solid var(--line2);color:var(--dim)}

.siMsg.bad{border-color:var(--alert);color:var(--bad-ink);background:rgba(248,113,113,.1)}

  color:var(--ink);font:inherit;font-size:14px;border-radius:10px;padding:11px;cursor:pointer}
.siQr{background:#fff;padding:10px;border-radius:12px;display:grid;place-items:center;margin:12px 0}

.siHint{font-size:12px;color:var(--dim);margin-top:7px;text-align:center}
.siKey{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:var(--faint);
  background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;padding:10px;
  display:block;width:100%;text-align:center;cursor:pointer;margin-top:10px}
.siKey:active{background:var(--panel)}

.siCard{position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.34);
  border-radius:18px;padding:24px 22px;animation:siRise .22s ease-out}
.siCard::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,#FF6B6B,#FFC94D,var(--signal),#60A5FA,#818CF8,#F472B6);opacity:.85}
@keyframes siRise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.siCard{animation:none}}
.siLogo{font-size:22px;line-height:1}
.siH{font-family:var(--mono);font-size:23px;margin:10px 0 2px;font-weight:600;letter-spacing:-.025em}
.siSub{color:var(--dim);font-size:12.5px;margin-bottom:2px;letter-spacing:.01em}

.siI:hover{border-color:var(--line2)}

.ab.on{background:var(--signal);border-color:var(--signal);color:var(--ground);font-weight:650}

.pweye:hover{background:rgba(127,145,165,.14)}
.signin .pweye{color:var(--signal)}

.gatetop{display:flex;gap:8px;margin-bottom:14px}
.gback{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font:inherit;

.admwrap{padding:0}

body.adminmode main{padding-bottom:0}

/* full-bleed dashboard: escape the 600px reading column */

/* ---------- admin home: the approvals desk ----------
   An admin with no schedule of their own had nowhere of their own to land — either a physician's
   page or a dashboard iframe, neither of which is theirs. This is: everything waiting on a
   decision, in one column, with the two buttons next to each thing. */
.homewrap{padding:16px 0 26px}
.hgreet{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:2px 0 3px}
.hsub{color:var(--dim);font-size:13px;line-height:1.5;margin-bottom:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:10px}
.qk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-weight:700;margin-bottom:5px}
.qt{font-size:15px;font-weight:650;line-height:1.35}
.qw{color:var(--dim);font-size:13px;line-height:1.5;margin-top:4px}
.qrule{font-size:12px;margin-top:7px;padding:6px 9px;border-radius:8px;line-height:1.45}
.qrule.ok{background:var(--ok);color:var(--ok-ink)}
.qrule.bad{background:var(--bad);color:var(--bad-ink)}
.qact{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.qact .btn{flex:1 1 104px;min-height:40px;width:auto}
.hzero{border:1px dashed var(--line2);border-radius:13px;padding:30px 18px;text-align:center}
.hzero .zt{font-size:15px;color:var(--ink);font-weight:650;margin-bottom:4px}
.hzero .zs{color:var(--dim);font-size:13px;line-height:1.5}
.hlinks{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.hlinks .btn{flex:1 1 150px;min-height:42px;width:auto}
/* The count is the whole point of the button — an admin should not have to open the page to
   learn there is nothing on it. */
.abadge{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;
  background:var(--alert);color:#fff;font-size:10.5px;font-weight:750;line-height:17px}
.ab.on .abadge{background:var(--ground);color:var(--signal)}

/* The bar now carries a control, so it is a row rather than a line of text. gap + wrap because
   a long full name on a 320px phone must push the button to a second line rather than squeeze it
   below a thumb's worth of height. */
.viewbar{padding:7px 14px;background:var(--ok);border-top:1px solid var(--line);
  color:var(--dim);font-size:12.5px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.viewbar b{color:var(--ink)}
.viewx{flex:none;background:var(--ground);border:1px solid var(--line);border-radius:999px;
  color:var(--ink);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;
  min-height:32px}
.viewx:hover{border-color:var(--signal);color:var(--signal)}

/* --card and --muted were used by the swap pane but never defined, so those cards had no
   background and their names inherited a colour meant for a light surface — invisible on the
   dark ground. Alias them to the real tokens rather than hunting every use. */
:root{--card:var(--panel);--muted:#8A9BAD}
/* the rule verdicts were light-mode boxes (near-white) with light text on top */
.swprob{background:rgba(248,113,113,.12)!important;border:1px solid var(--alert)!important;color:var(--bad-ink)!important}
.swrule.bad{background:rgba(248,113,113,.12)!important;border:1px solid var(--alert)!important;color:var(--bad-ink)!important}
.swrule.ok{background:rgba(74,222,128,.12)!important;border:1px solid var(--signal)!important;color:#86EFAC!important}
.swwho{color:var(--dim)}
.swcard{background:var(--panel);border:1px solid var(--line)}

.acctbar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line)}
/* A control, so it reads as one: the account name beside it is plain text and stays quiet. */
.acctwho{font-size:12px;color:var(--ink);background:transparent;border:0;text-align:left;
  cursor:pointer;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:600;flex:0 1 auto}
.acctwho:hover{color:var(--signal)}
