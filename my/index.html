<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-title" content="Scheduling Wizard">
<title>Scheduling Wizard · CCPSA</title>
<script>
/* HOW AN INSTALLED APP GETS A NEW VERSION.
   An app on a home screen is almost never "loaded" — it is resumed. It can sit for weeks
   without a single page load, which is why "check on load" left people on an old build until
   they deleted and reinstalled it. The check that matters is the one when the app comes back to
   the FOREGROUND; that is the only moment it reliably happens. */
if('serviceWorker' in navigator){
  // Was this page already under a worker's control? If not, the very first activation fires
  // controllerchange too — reloading there means every fresh install reloads itself the instant
  // it opens, which looks like the app crashing on launch.
  var HADSW=!!navigator.serviceWorker.controller, swreloaded=false, swpending=false;

  // Never yank the page out from under someone: a reload mid-sentence loses what they typed.
  function swBusy(){
    var a=document.activeElement||{};
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||''))return true;
    return !!document.querySelector('.sheet.on,.modal.on,dialog[open]');
  }
  function swApply(){
    if(swreloaded)return;
    if(document.visibilityState!=='visible'||swBusy()){swpending=true;return;}
    swreloaded=true; location.reload();
  }
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!HADSW){HADSW=true;return;}   // first install, nothing to replace
    swApply();
  });

  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
    setInterval(function(){reg.update();},900000);        // and every 15 min if left open
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState!=='visible')return;
      if(swpending){swreloaded=true;location.reload();return;}  // deferred from earlier
      reg.update();                                      // the check that actually catches it
    });
    window.addEventListener('focus',function(){reg.update();});
    // A worker that installed but is waiting for every tab to close would never take over on a
    // phone, where the app is suspended rather than closed. Tell it to go ahead.
    if(reg.waiting)reg.waiting.postMessage('skipWaiting');
    reg.addEventListener('updatefound',function(){
      var w=reg.installing; if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller)w.postMessage('skipWaiting');
      });
    });
  }).catch(function(){});
}
</script>
<style>
/* ---------- COLOUR ----------
   Everything on screen is drawn from these tokens, and the two themes are two sets of values
   for them. That is the only way a second theme stays true: a component that reaches for a
   literal is a component that will be unreadable in the theme its author was not looking at.

   Dark is the default because a schedule gets checked at 3am on a night shift, and a white
   screen at 3am is genuinely unpleasant. Light follows the phone's own setting unless somebody
   overrides it, because that setting is already their answer to this question.

   --card, --ok/--warn/--bad and their -ink partners were literals scattered through the sheet
   before this. One of them, var(--card) on the holiday chips, was never defined at all. */
:root{
  color-scheme:dark;
  --chrome:rgba(14,22,33,.92);      /* sticky header / tab bar, translucent over content */
  --chrome-solid:#0E1621;
  --ground:#0E1621; --panel:#16212E; --panel2:#1C2A3A; --line:#24374A; --line2:#31485F;
  --ink:#E8EEF4; --dim:#8AA0B4; --faint:#6F94B3;   /* 4.55:1 at worst — AA for small text */
  --signal:#35D6A4; --amber:#FBBF24; --alert:#FF6B6B;
  --card:#1C2A3A;                 /* a raised surface inside a panel */
  --chip:#35D6A4; --chip-ink:#06231A;      /* a chosen chip: the accent, not a darker dark */
  --ok:rgba(53,214,164,.14);   --ok-ink:#9BF0D5;
  --warn:rgba(251,191,36,.14); --warn-ink:#FCD98A;
  --bad:rgba(255,107,107,.14); --bad-ink:#FFC9C9;
  --info:rgba(96,165,250,.14); --info-ink:#C3DBFF;
  --info-line:rgba(96,165,250,.42); --info-strong:#EAF2FF; --info-soft:#A9C8F0;
  --test:rgba(180,83,9,.14); --test-ink:#FFD9A8;
  --shadow:rgba(0,0,0,.34);
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabh:60px;
}

/* Light. The accent darkens: a mint that reads well on near-black is close to invisible on
   white, so the token changes rather than the components that use it. */
:root[data-theme="light"]{
  color-scheme:light;
  --chrome:rgba(255,255,255,.92); --chrome-solid:#FFFFFF;
  --ground:#F4F7FA; --panel:#FFFFFF; --panel2:#F0F4F8; --line:#DCE5EE; --line2:#C3D2E0;
  --ink:#0F1D2B; --dim:#4A5A6B; --faint:#42586D;
  --signal:#0A7A57; --amber:#8A5C06; --alert:#C2352F;
  --card:#F0F4F8; --muted:#5A6B7D;
  --chip:#0A7A57; --chip-ink:#FFFFFF;
  --ok:rgba(14,159,115,.12);   --ok-ink:#0A6E50;
  --warn:rgba(180,121,11,.14); --warn-ink:#7A5207;
  --bad:rgba(194,53,47,.10);   --bad-ink:#8E2420;
  --info:rgba(37,99,235,.10);  --info-ink:#1D4ED8;
  --info-line:rgba(37,99,235,.30); --info-strong:#12328C; --info-soft:#2A4E9B;
  --test:rgba(180,83,9,.12); --test-ink:#7A3E05;
  --shadow:rgba(15,29,43,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--signal)}

/* ---------- shell ---------- */
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
body.wide .wrap{max-width:1500px}
.pdrop{position:fixed;z-index:60;width:min(330px,calc(100vw - 24px));
  background:var(--panel);border:1px solid var(--line2);border-radius:13px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.pdrop .pds{position:sticky;top:0;background:var(--panel);padding:9px;border-bottom:1px solid var(--line)}
.pdrop input{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;
  background:var(--panel2);color:var(--ink);font:inherit;font-size:14px}
.pdrop input:focus{outline:2px solid var(--signal);outline-offset:-1px}
.pdlist{max-height:min(58vh,420px);overflow:auto;-webkit-overflow-scrolling:touch}
.pdrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;
  border:0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--ink);font:inherit;
  font-size:14px;text-align:left;cursor:pointer}
.pdrow:hover,.pdrow:focus{background:var(--panel2)}
.pdrow.on{background:rgba(53,214,164,.13)}
.pdrow .av{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;
  place-items:center;font-size:10px;font-weight:700;color:var(--dim);flex:0 0 auto}
.pdrow.on .av{background:var(--signal);color:#06231A}
.pdnone{padding:14px 12px;font-size:13px;color:var(--dim)}
header.top{position:sticky;top:0;z-index:30;background:var(--chrome);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topin{padding:11px 14px;display:flex;align-items:center;gap:10px}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.brand b{color:var(--ink)}
.whoami{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;cursor:pointer}
.whoami .nm{font-size:13.5px;font-weight:700}
.whoami .chev{color:var(--dim);font-size:11px}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:600}
h2.sec{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:22px 0 12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- next shift hero ---------- */
.hero{margin-top:16px;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:linear-gradient(155deg,var(--panel2),var(--panel))}
.hero .spine{height:5px;background:var(--dim)}
.hero .in{padding:18px 18px 20px}
.hero .when{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:700}
.hero .unit{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:8px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.hero .sub{color:var(--dim);font-size:13.5px;margin-top:5px}
.hero .date{font-family:var(--mono);font-size:15px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .date .t{color:var(--dim);font-size:13px}
.dotU{width:13px;height:13px;border-radius:4px;flex:none}

/* ---------- week strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.sday{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 3px 8px;text-align:center;min-height:66px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sday .dw{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.sday .dn{font-family:var(--mono);font-size:15px;font-weight:700;line-height:1}
.sday.today{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset}
.chip{width:26px;height:8px;border-radius:3px;background:var(--line2)}
.chip.off{background:transparent;border:1px dashed var(--line2)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1}
.tile .v small{font-size:14px;color:var(--dim);font-weight:600}
.tile .f{font-size:11.5px;color:var(--dim);margin-top:4px}
.bar{height:4px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:3px}

/* ---------- month calendar ---------- */
.month{margin-top:16px;border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden}
.month h4{margin:0;padding:11px 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-weight:600;
  display:flex;justify-content:space-between}
.month h4 b{color:var(--ink);font-weight:700}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:9px}
.dow{font-family:var(--mono);font-size:9.5px;color:var(--dim);text-align:center;padding:2px 0 4px;letter-spacing:.05em}
.cell{min-height:46px;border-radius:8px;background:var(--panel2);padding:4px 3px 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border:1px solid transparent}
.cell.blank{background:transparent;cursor:default}
/* The ring is drawn inside the border box so a highlighted day does not shift its neighbours,
   and it sits over the unit colour rather than replacing it — today still shows what you are on. */
.cell.today{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset}
.cell.today .n{color:var(--signal);font-weight:700}
.cell .n{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1}
.cell.on .n{color:var(--ink);font-weight:700}
.cell.sel{border-color:var(--signal)}
.cell .blk{width:100%;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:8px;font-weight:700;color:var(--ground);overflow:hidden;white-space:nowrap}
.cell .blk.noc{font-size:8px;letter-spacing:0}
.cell .blk.cme{background:rgba(96,165,250,.22);border:1px solid rgba(96,165,250,.55);color:var(--info-ink);
  letter-spacing:.04em}
.cell .blk.split{background-image:none}
.cell .req{position:absolute;top:2px;right:3px;font-size:8px;color:var(--signal)}
.cell .rl{width:5px;height:5px;border-radius:50%;background:#F0ABFC}

/* ---------- lists ---------- */
.row{display:flex;gap:11px;align-items:center;padding:11px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;margin-top:7px}
.row .sp{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:30px}
.row .d{font-family:var(--mono);font-size:12.5px;color:var(--dim);width:58px;flex:none}
.row>span:not(.sp):not(.d):not(.rt){min-width:0}
.row .t{font-weight:700;font-size:14px;display:block}
.row .s{font-size:11.5px;color:var(--dim);margin-top:2px;display:block;line-height:1.45}
.row .rt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}

/* ---------- buttons ---------- */
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:12px 15px;font-size:14px;
  font-weight:700;cursor:pointer;text-decoration:none;width:100%}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:var(--chip-ink)}
.btn.gho{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:grid;gap:8px;margin-top:10px}
.btnrow.two{grid-template-columns:1fr 1fr}

/* ---------- pills / notes ---------- */
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 8px;
  border-radius:999px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.06em}
.pill.ok{color:var(--signal);border-color:rgba(53,214,164,.45);background:rgba(53,214,164,.1)}
.pill.warn{color:var(--amber);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.09)}
.note{color:var(--dim);font-size:12.5px;line-height:1.55;margin-top:9px}
.empty{border:1px dashed var(--line2);border-radius:13px;padding:22px 16px;text-align:center;color:var(--dim);
  font-size:13.5px;margin-top:10px}

/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--chrome);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabsin{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--signal)}
.pane{display:none}.pane.on{display:block}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,10,17,.6);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line2);max-width:600px;margin:0 auto;transform:translateY(102%);
  transition:transform .22s cubic-bezier(.32,.72,0,1);max-height:86vh;overflow:auto;
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .hd{padding:14px 18px 0;display:flex;align-items:flex-start;gap:10px}
.sheet .bd{padding:12px 18px 18px}
.sheet .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex:none;
  /* A round button needs its glyph centred by the box, not by the font: the default baseline
     and the button's own padding put the ✕ high and to the left of the circle. */
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:9px auto 0}

/* ---------- gate (identity) ---------- */
#gate{display:none;position:fixed;inset:0;z-index:60;background:var(--ground);overflow:auto;padding:30px 16px 40px}
#gate .in{max-width:420px;margin:0 auto}
#gate h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:18px 0 6px}
.plist{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.pitem{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.pitem:last-child{border-bottom:0}
.pitem .av{width:32px;height:32px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--signal);flex:none}
.pitem .nm{font-weight:700;font-size:14.5px}
.pitem .ct{font-size:11.5px;color:var(--dim);margin-top:1px}
#gateSearch{width:100%;margin-top:14px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;
  padding:13px 14px;font-size:16px;outline:none}
#gateSearch:focus{border-color:var(--signal)}

/* ---------- date picker (requests) ---------- */
.pickmo{margin-top:12px}
.pick7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.pcell{aspect-ratio:1;border-radius:8px;background:var(--panel2);border:1px solid transparent;
  font-family:var(--mono);font-size:12px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pcell.blank{background:transparent;cursor:default}
.pcell.sel{background:var(--signal);color:#06231A;font-weight:800}
.pcell.has{outline:1px solid var(--line2)}
select.sel2{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:12px 13px;font-size:16px;margin-top:8px}
textarea.ta{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:12px 13px;
  font-size:15px;min-height:78px;margin-top:8px;resize:vertical;font-family:var(--sans)}

@media(min-width:620px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .hero .unit{font-size:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- PRINT ----------
   Printing this used to produce the SCREEN: a dark background at full ink, the test banner, the
   home-screen nudge, "Next 7 days", "Who's on" — everything except a schedule you could pin up.
   What comes out now is one thing, the shifts this person is working, on white paper.

   Built as its own block (#printOnly) rather than by hiding parts of the app, because the app is
   a phone layout — cards, a hero, a bottom tab bar — and no amount of hiding turns that into
   something worth printing. */
@media print{
  body>*:not(#printOnly){display:none!important}
  body{background:#fff!important;color:#000!important;padding:0!important;margin:0!important}
  body::before{display:none!important}      /* the orange TEST banner is a screen device */
  #printOnly{display:block!important;position:static!important;left:auto!important;
    width:auto!important;height:auto!important;overflow:visible!important;
    font:11pt/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#000}
  #printOnly h1{font-size:15pt;margin:0 0 1mm}
  #printOnly .pmeta{font-size:9.5pt;color:#333;margin:0 0 5mm;padding-bottom:2mm;border-bottom:2px solid #000}
  #printOnly h2{font-size:11.5pt;margin:6mm 0 1.5mm;padding-bottom:1mm;border-bottom:1px solid #999}
  #printOnly table{width:100%;border-collapse:collapse;font-size:10pt}
  #printOnly thead{display:table-header-group}
  #printOnly tr{break-inside:avoid;page-break-inside:avoid}
  #printOnly th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.4px;
    color:#444;border-bottom:1px solid #999;padding:1mm 2mm}
  #printOnly td{padding:1.1mm 2mm;border-bottom:1px solid #ddd;vertical-align:top}
  #printOnly td.pd{white-space:nowrap;width:34mm}
  #printOnly td.pt{white-space:nowrap;width:30mm;color:#333}
  #printOnly .we td{background:#f2f2f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printOnly .pnote{margin-top:6mm;font-size:8.5pt;color:#444}
  @page{margin:14mm}
}
/* Out of the flow entirely, not merely invisible. A hidden block still participates in enough
   of the layout on iOS that returning from the print sheet left the page a different width,
   with content running off the side. It is also emptied on afterprint, so nothing of the
   printed version survives the moment it was needed. */
#printOnly{display:none;position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
/* accessibility: visible focus for keyboard users; calm for reduced-motion users */
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.derow{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  margin-bottom:12px}
.dek{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.deval{font-size:32px;font-weight:800;line-height:1.1;margin:2px 0 3px;
  display:flex;align-items:baseline;gap:9px}
/* The number worked is the fact; the difference from contract is a note on it. Sized so the
   headline reads as "45, and that is level" rather than as a bare "0" nobody can place. */
.dedelta{font-size:15px;font-weight:700;letter-spacing:.01em}
.desub{font-size:12.5px;color:var(--dim)}
.chev{opacity:.65;font-size:10px}
.nudge{border-color:var(--line2)}
/* Above the tab bar, not over the content being read. */
.gobar{position:fixed;left:10px;right:10px;z-index:60;
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 12px 30px var(--shadow);padding:11px 13px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
.gobar .gobtns{margin-left:auto;display:flex;gap:8px}
.gobar .btn{padding:7px 12px;font-size:13px;width:auto}
.testgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.testgrid .btn{font-size:12.5px;padding:8px 6px}
.setrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.setrow:last-of-type{border-bottom:0}
.setk{color:var(--dim)}
.setv{text-align:right}
.cvlist{margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cvrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);
  cursor:pointer;font-size:14px}
.cvrow:last-child{border-bottom:0}
.cvrow input{width:19px;height:19px;accent-color:var(--signal);flex:none}
.cvnm{flex:1}
.cvpush{font-size:12px;color:var(--dim)}
.minorrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.minorrow a{color:var(--dim);text-decoration:underline}
.icsmore summary{font-size:11.5px;color:var(--dim);cursor:pointer}
.siOr{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--dim);font-size:12px}
.siOr::before,.siOr::after{content:'';flex:1;height:1px;background:var(--line)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---- live request + swap UI ---- */
.savedbar{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;
  padding:9px 12px;font-size:13.5px;font-weight:600;margin:0 0 12px}
.behalf{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;
  padding:9px 12px;font-size:13px;margin:0 0 12px;line-height:1.45}
.deadline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--info);border:1px solid var(--info-line);color:var(--info-ink);
  border-radius:12px;padding:11px 14px;margin:4px 0 12px;font-size:13.5px}
.deadline b{color:var(--info-strong)}
.deadline span{color:var(--info-soft)}
.deadline.soon{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.5);color:#FFE6B0}
.deadline.soon b{color:#FFF1D0}
.deadline.soon span{color:#F0C97A}
.balance{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.balance>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.balance .n{display:block;font-size:22px;font-weight:700}
.balance .l{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.addrow{display:flex;gap:8px;margin:6px 0 8px;align-items:stretch}
.addrow input{flex:1 1 auto;min-width:150px;padding:12px;border:1px solid var(--line2);
  border-radius:10px;font-size:15px;background:var(--panel2);color:var(--ink);
  color-scheme:dark;font-family:inherit}
.addrow input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
.addrow input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.75;cursor:pointer}
.addrow .btn{width:auto;flex:0 0 auto;padding:12px 20px}
.addhint{font-size:12.5px;color:var(--amber);margin:-2px 0 8px;min-height:1px}
.icsmore{margin-top:9px}
.icsmore summary{font-size:12.5px;color:var(--dim);cursor:pointer}
.accttheme{background:transparent;border:1px solid var(--line);color:var(--dim);
  width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.acctbuild{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em;
  margin-left:auto;margin-right:10px;white-space:nowrap}
.testdate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 14px;
  border-top:1px solid var(--line);background:var(--test)}
.testdate .tdl{font-size:12px;color:var(--test-ink);font-weight:700}
.testdate .tdi{padding:5px 8px;border:1px solid var(--line2);border-radius:8px;
  background:var(--panel2);color:var(--ink);font:inherit;color-scheme:dark;
  font-size:16px}   /* the test-site date picker zoomed the page like any other small field */
.testdate .tdb{font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:26px}
.pillx{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  font-size:13px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  cursor:pointer;user-select:none}
.pillx b{opacity:.65;font-weight:700}
.pillx:hover b,.pillx:active b{opacity:1;color:#fff}
.pillx.off{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.45);color:#FFC2C2}
.pillx.cme{background:rgba(96,165,250,.15);border-color:rgba(96,165,250,.45);color:var(--info-ink)}
.pillx.nn{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.45);color:#DCD1FF}
.pillx.on{background:rgba(53,214,164,.15);border-color:rgba(53,214,164,.5);color:var(--ok-ink)}
/* Two balanced rows, and the tick takes up its space whether or not it is showing. As a wrapping
   flex row the four chips sized themselves to their words, so ticking one made it wider and shoved
   the others onto a different line — the row rearranging itself under the finger that just tapped
   it. Equal columns and a reserved marker mean choosing changes the colour and nothing else. */
.segx{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.segx button{padding:9px 10px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;font-size:13px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:5px;min-height:38px}
.segx button::before{content:'✓';font-weight:800;visibility:hidden;flex:none}
/* Selected read as "slightly different dark" against the panel behind it — on a phone in a
   corridor that is no signal at all. It is the accent now, with a tick, so a glance answers
   "which one is chosen". */
.segx button.on{background:var(--chip);color:var(--chip-ink);border-color:var(--chip);font-weight:700}
.segx button.on::before{visibility:visible}
.savebar{display:flex;align-items:center;gap:12px;margin:16px 0 8px}
.btn.primary{background:var(--chip);color:var(--chip-ink);border-color:var(--chip)}
.btn.warnbtn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.errbox{background:var(--bad);border:1px solid rgba(255,107,107,.45);color:var(--bad-ink);
  border-radius:12px;padding:12px 14px;margin-top:8px;font-size:13px}
.errbox b{color:#FFE1E1}
.errbox ul{margin:6px 0 0 18px}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;margin-top:14px}
.lockicon{font-size:34px}
.lockcard h2{margin:8px 0 6px;font-size:19px}
.lockcard .big{font-size:15px;margin-top:10px}
.rdrow{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.rdrow span:first-child{color:var(--muted)}
.swapform{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:8px}
.swapform .l{font-size:12px;color:var(--muted);margin-top:4px}
.swapform select,.swapform input,.inp{padding:11px;border:1px solid var(--line2);border-radius:10px;
  font-size:15px;background:var(--panel2);color:var(--ink);font-family:inherit;color-scheme:dark;
  width:100%}
.swapform select:focus,.swapform input:focus,.inp:focus{outline:2px solid var(--signal);
  outline-offset:-1px;border-color:var(--signal)}
.swcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.swtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.swwho{font-size:12.5px;color:var(--muted);margin-top:3px}
.swprob,.swrule{margin-top:8px;font-size:12.5px;border-radius:10px;padding:8px 10px}
.swprob,.swrule.bad{background:var(--bad);border:1px solid rgba(255,107,107,.45);color:var(--bad-ink)}
.swrule.ok{background:var(--ok);border:1px solid rgba(53,214,164,.5);color:var(--ok-ink)}
.swact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.chg{border-left:3px solid var(--warn,#FBBF24);background:rgba(251,191,36,.07)}
.chgh{font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.chgl{margin:0 0 8px;padding-left:18px;line-height:1.65}
.chgl li{margin:2px 0}
.sm{font-size:12px}

.lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:10px 0 5px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:10px 12px;font:inherit;
  /* 16px is the threshold below which iOS zooms the page on focus and does not zoom back.
     Every field a physician types into has to clear it — a note, a date, a search box. */
  font-size:16px}
.edlist{margin-top:8px}
.edrow{display:grid;grid-template-columns:12px 1fr auto 12px;gap:10px;align-items:center;width:100%;
  text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:11px 12px;margin-bottom:6px;font:inherit;cursor:pointer}
.edrow:hover{border-color:var(--line2)}
.edu{font-weight:600;font-size:13.5px}
.edw{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.cpick{cursor:pointer;font:inherit;font-size:12.5px}
.cpick.on{background:var(--signal);border-color:var(--signal);color:var(--ground);font-weight:600}
.shh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.lgh{font-weight:600;font-size:13.5px}
.tagw{font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:#fff7ed;color:#9a3412;
  border:1px solid #fdba74;border-radius:999px;padding:1px 7px;margin-left:6px}
.tagc{font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:rgba(251,191,36,.12);
  color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:1px 7px;margin-left:6px}
.lnk{background:none;border:0;color:var(--signal);font:inherit;font-size:12px;cursor:pointer;
  padding:0 0 0 8px;text-decoration:underline}
.muted{color:var(--dim)}
.toastbox{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--tabh) + 18px);
  background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:86vw;text-align:center}
.toastbox.on{opacity:1;transform:translateX(-50%) translateY(0)}

.inst{border-left:3px solid var(--signal)}
.steps{margin:10px 0 0;padding-left:20px;line-height:1.85;font-size:13.5px}
.steps li{margin:4px 0}
.ic{font-family:var(--mono);border:1px solid var(--line2);border-radius:5px;padding:0 5px;margin-left:2px}

body.locked header,body.locked main,body.locked .tabs{display:none}
.signin{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;padding:22px;z-index:90}
.siCard{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:22px}
.siLogo{font-size:26px}
.siH{font-family:var(--mono);font-size:20px;margin:8px 0 2px;font-weight:600}
.siSub{color:var(--dim);font-size:13px;margin-bottom:6px}
.siL{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:14px 0 5px}
.siI{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:12px;font:inherit;font-size:16px}
.siI:focus{outline:2px solid var(--signal);outline-offset:1px}
/* Belt and braces for anything typed into that does not carry .inp or .siI. */
input,select,textarea{font-size:16px}
.siB{width:100%;margin-top:16px;background:var(--signal);border:0;color:var(--ground);font:inherit;
  font-weight:700;font-size:15px;border-radius:10px;padding:13px;cursor:pointer}
.siMsg{display:none;margin-top:12px;font-size:13px;border-radius:9px;padding:9px 11px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--dim)}
.siMsg.on{display:block}
.siMsg.bad{border-color:var(--alert);color:var(--bad-ink);background:rgba(248,113,113,.1)}
.siNote{color:var(--faint);font-size:12px;margin-top:14px;line-height:1.5}
.siNote a{color:var(--signal)}

.siStep{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-top:10px}
.siLead{font-size:13.5px;color:var(--dim);margin:6px 0 4px;line-height:1.5}
.siCode{font-family:var(--mono);letter-spacing:.34em;text-align:center;font-size:23px}
.siGhost{width:100%;margin-top:9px;background:transparent;border:1px solid var(--line2);
  color:var(--ink);font:inherit;font-size:14px;border-radius:10px;padding:11px;cursor:pointer}
.siQr{background:#fff;padding:10px;border-radius:12px;display:grid;place-items:center;margin:12px 0}
.siQr img{display:block;width:190px;height:190px;image-rendering:pixelated}
.siHint{font-size:12px;color:var(--dim);margin-top:7px;text-align:center}
.siKey{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:var(--faint);
  background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;padding:10px;
  display:block;width:100%;text-align:center;cursor:pointer;margin-top:10px}
.siKey:active{background:var(--panel)}

.siCard{position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.34);
  border-radius:18px;padding:24px 22px;animation:siRise .22s ease-out}
.siCard::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,#FF6B6B,#FFC94D,var(--signal),#60A5FA,#818CF8,#F472B6);opacity:.85}
@keyframes siRise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.siCard{animation:none}}
.siLogo{font-size:22px;line-height:1}
.siH{font-family:var(--mono);font-size:23px;margin:10px 0 2px;font-weight:600;letter-spacing:-.025em}
.siSub{color:var(--dim);font-size:12.5px;margin-bottom:2px;letter-spacing:.01em}
.siI{border-radius:11px;padding:13px 14px;transition:border-color .15s}
.siI:hover{border-color:var(--line2)}
.siI::placeholder{color:var(--faint)}
.siB{transition:transform .06s ease,filter .15s;font-size:15.5px;padding:14px}
.siB:active{transform:translateY(1px)}
.siB:hover{filter:brightness(1.06)}
.siGhost:hover{border-color:var(--line2)}

/* secondary actions read as secondary here too */
.siGhost{opacity:.92;font-size:13.5px;padding:12px}
.siGhost:hover{opacity:1;background:rgba(255,255,255,.03)}
.siCard .siNote{font-size:11.5px;line-height:1.5;margin-top:14px}
.siL{font-size:9.5px;letter-spacing:.13em;margin:15px 0 5px}

.admbar{display:flex;gap:6px;padding:8px 14px 10px;border-top:1px solid var(--line)}
.ab{flex:1;background:var(--panel2);border:1px solid var(--line2);color:var(--dim);
  font:inherit;font-size:12.5px;border-radius:9px;padding:8px 6px;cursor:pointer}
.ab.on{background:var(--signal);border-color:var(--signal);color:var(--ground);font-weight:650}
.admwrap{padding:18px 16px}
.pitem .nm{font-size:15px}

.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:64px;width:100%}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:auto;margin:0;background:transparent;border:0;cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;letter-spacing:.02em;padding:6px 9px;border-radius:7px}
.pweye:hover{background:rgba(127,145,165,.14)}
.signin .pweye{color:var(--signal)}

.gatetop{display:flex;gap:8px;margin-bottom:14px}
.gback{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font:inherit;
  font-size:13px;border-radius:9px;padding:8px 14px;cursor:pointer}
.gback:hover{border-color:var(--line2)}

.admwrap{padding:0}
#admFrame{width:100%;height:calc(100vh - 118px);border:0;background:#f1f5f9;display:block}
.admload{padding:22px 16px;color:var(--dim);font-size:14px}
body.adminmode main{padding-bottom:0}

/* full-bleed dashboard: escape the 600px reading column */
body.adminmode .wrap{max-width:none;padding:0}
body.adminmode main{padding:0}
#admWrap{width:100vw;margin-left:calc(50% - 50vw);padding:0}
#admFrame{width:100%;border:0;background:#f1f5f9;display:block}
/* touch: let the frame own its own scrolling and keep controls thumb-sized */
#admWrap{-webkit-overflow-scrolling:touch}
.ab{min-height:40px}
.gback{min-height:40px}
@media (max-width:700px){
  .admload{padding:18px 14px}
}

/* ---------- admin home: the approvals desk ----------
   An admin with no schedule of their own had nowhere of their own to land — either a physician's
   page or a dashboard iframe, neither of which is theirs. This is: everything waiting on a
   decision, in one column, with the two buttons next to each thing. */
.homewrap{padding:16px 0 26px}
.hgreet{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:2px 0 3px}
.hsub{color:var(--dim);font-size:13px;line-height:1.5;margin-bottom:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:10px}
.qk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-weight:700;margin-bottom:5px}
.qt{font-size:15px;font-weight:650;line-height:1.35}
.qw{color:var(--dim);font-size:13px;line-height:1.5;margin-top:4px}
.qrule{font-size:12px;margin-top:7px;padding:6px 9px;border-radius:8px;line-height:1.45}
.qrule.ok{background:var(--ok);color:var(--ok-ink)}
.qrule.bad{background:var(--bad);color:var(--bad-ink)}
.qact{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.qact .btn{flex:1 1 104px;min-height:40px;width:auto}
.hzero{border:1px dashed var(--line2);border-radius:13px;padding:30px 18px;text-align:center}
.hzero .zt{font-size:15px;color:var(--ink);font-weight:650;margin-bottom:4px}
.hzero .zs{color:var(--dim);font-size:13px;line-height:1.5}
.hlinks{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.hlinks .btn{flex:1 1 150px;min-height:42px;width:auto}
/* The count is the whole point of the button — an admin should not have to open the page to
   learn there is nothing on it. */
.abadge{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;
  background:var(--alert);color:#fff;font-size:10.5px;font-weight:750;line-height:17px}
.ab.on .abadge{background:var(--ground);color:var(--signal)}

.viewbar{padding:7px 14px;background:var(--ok);border-top:1px solid var(--line);
  color:var(--dim);font-size:12.5px}
.viewbar b{color:var(--ink)}

/* --card and --muted were used by the swap pane but never defined, so those cards had no
   background and their names inherited a colour meant for a light surface — invisible on the
   dark ground. Alias them to the real tokens rather than hunting every use. */
:root{--card:var(--panel);--muted:#8A9BAD}
/* the rule verdicts were light-mode boxes (near-white) with light text on top */
.swprob{background:rgba(248,113,113,.12)!important;border:1px solid var(--alert)!important;color:var(--bad-ink)!important}
.swrule.bad{background:rgba(248,113,113,.12)!important;border:1px solid var(--alert)!important;color:var(--bad-ink)!important}
.swrule.ok{background:rgba(74,222,128,.12)!important;border:1px solid var(--signal)!important;color:#86EFAC!important}
.swwho{color:var(--dim)}
.swcard{background:var(--panel);border:1px solid var(--line)}

.acctbar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line)}
.acctwho{font-family:var(--mono);font-size:12px;color:var(--dim);flex:1;overflow:hidden;
  background:transparent;border:0;text-align:left;cursor:pointer;padding:0;
  text-overflow:ellipsis;white-space:nowrap}
.acctout{background:transparent;border:1px solid var(--line2);color:var(--ink);font:inherit;
  font-size:12px;border-radius:8px;padding:6px 12px;min-height:34px;cursor:pointer}
.acctout:hover{border-color:var(--line2)}

.mgrid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mrow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px}
.mrow>span:first-child{flex:1;font-size:14px}
.minp{width:74px;background:var(--ground);border:1px solid var(--line2);color:var(--ink);
  border-radius:9px;padding:9px;font:inherit;font-size:16px;text-align:center}
.mnote{font-size:11.5px;color:var(--faint);min-width:96px;text-align:right}
.msg{display:none;margin-top:10px;font-size:13px;border-radius:9px;padding:9px 11px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--dim)}
.msg.on{display:block}
.msg.ok{border-color:var(--signal);color:#86EFAC}
.msg.bad{border-color:var(--alert);color:var(--bad-ink)}

.wk7{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.w7d{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.w7d.today{border-color:var(--signal)}
.w7h{display:flex;flex-direction:column;line-height:1.25}
.w7h b{font-size:13px}
.w7h span{font-size:11px;color:var(--faint);font-family:var(--mono)}
.w7b{display:flex;flex-wrap:wrap;gap:5px}
.w7s{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid;
  border-radius:7px;padding:4px 9px}
.w7r{font-size:11.5px;background:transparent;border:1px dashed var(--line2);border-radius:7px;
  padding:3px 8px;color:var(--dim)}
.w7off{font-size:12.5px;color:var(--faint)}
.daynav{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-weight:400;
  font-size:12.5px;color:var(--dim);font-family:var(--mono)}
.navb{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font:inherit;
  font-size:15px;line-height:1;border-radius:8px;min-width:34px;min-height:34px;cursor:pointer}
.navb:hover{border-color:var(--line2)}
.sec{display:flex;align-items:center}
.onrow{display:grid;grid-template-columns:9px 128px 1fr;gap:9px;align-items:baseline;
  padding:7px 0;border-bottom:1px solid var(--line)}
.onrow:last-child{border-bottom:0}
.onrow.isrole .onshift{color:var(--dim);font-style:italic}
.ondot{width:9px;height:9px;border-radius:3px;align-self:center}
.onshift{font-size:12.5px;font-weight:600}
.onwho{font-size:13px;color:var(--dim)}

.gpick{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.gp{cursor:pointer;font-size:12px;padding:5px 10px}
.gp.on{background:var(--signal);border-color:var(--signal);color:var(--ground);font-weight:650}
.gwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
.gtab{border-collapse:collapse;font-size:11px;min-width:100%}
.gtab th.gn{position:sticky;left:0;background:var(--panel);text-align:left;padding:6px 10px;
  font-size:12px;font-weight:600;white-space:nowrap;border-right:1px solid var(--line2);z-index:2}
.gh{padding:4px 3px;font-weight:500;color:var(--faint);font-family:var(--mono);font-size:10px;
  border-bottom:1px solid var(--line)}
.gh span{display:block;font-size:8px;opacity:.7}
.gh.we,.gc.we{background:rgba(255,255,255,.03)}
.gc{padding:5px 4px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);
  color:var(--ink);font-size:10.5px}
.stackblk{margin-top:14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:4px;margin-top:6px}
.scell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;
  min-height:42px;display:flex;flex-direction:column;gap:2px}
.scell.we{background:rgba(255,255,255,.02)}
.sd{font-family:var(--mono);font-size:10px;color:var(--faint)}
.ss{font-size:10.5px;line-height:1.25}

<div id="gate"><div class="in">
  <div class="gatetop" id="gateTop"></div>
  <div class="eyebrow">CCPSA · Q4 2026</div>
  <h1 id="gateH">Physicians</h1>
  <div class="note" style="margin-top:2px" id="gateNote">Choose whose schedule to open.</div>
  <label class="sr" for="gateSearch">Search by name</label>
  <input id="gateSearch" type="search" placeholder="Search by name" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="plist" id="gateList"></div>
</div></div>

<script>
// The schedule is NOT in this file. It is fetched from the API for the signed-in person, so a
// downloaded copy of this page is worth nothing and access can be revoked server-side.
let DATA=null;
window.__portalBooted=true;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const d2=iso=>new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10));
const dowOf=iso=>(d2(iso).getDay()+6)%7;
const fmtD=iso=>{const d=d2(iso);return DOW[dowOf(iso)]+', '+MON[d.getMonth()]+' '+d.getDate();};
const fmtLong=iso=>{const d=d2(iso);return DOW[dowOf(iso)]+', '+MONL[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();};
const isoAdd=(iso,n)=>{const d=d2(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
// WHAT DAY IS IT. Almost every screen turns on this — the next shift, what is highlighted,
// whether requests are still open. On the test site it can be moved, so a date months away can
// be looked at without waiting for it. Production has no such control and always reads the clock.
const realTodayISO=()=>new Date().toISOString().slice(0,10);
function testToday(){
  if(typeof TEST_BUILD==='undefined'||!TEST_BUILD)return null;
  try{ return localStorage.getItem('__today')||null; }catch(e){ return null; }
}
const todayISO=()=>testToday()||realTodayISO();
const META=s=>DATA.meta[s]||{label:s,sub:'',kind:'other',color:'#7C8FA6'};
/* THE INK ON A COLOURED CHIP FOLLOWS THE CHIP, NOT THE THEME. These were drawn with the page's
   own background colour as the text — near-black on dark, which works on a bright unit colour
   and fails on a dim one, and near-white in light mode, which fails on nearly all of them. The
   unit colours are fixed by the client and cannot be re-picked, so the text has to be chosen
   per chip: black on a light colour, white on a dark one. */
function chipLum(hex){
  const h=String(hex||'').replace('#','');
  if(h.length!==6)return 1;
  const v=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255)
    .map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));
  return .2126*v[0]+.7152*v[1]+.0722*v[2];
}
// Both ratios are worked out and the better one wins, rather than guessing where the crossover
// sits. A guessed threshold of .42 put white on the mid-tone reds and blues, where black is
// nearly three times the contrast — the real crossover is about .18.
function chipInk(hex){
  const L=chipLum(hex);
  return ((L+.05)/.05) >= (1.05/(L+.05)) ? '#0B1220' : '#FFFFFF';
}
// An Admin block on a meeting day is the meeting. Everywhere the portal names a shift it asks
// this first, so the answer cannot differ between the calendar, the day sheet and the list.
const mtgTag=(person,iso)=>((DATA.adminMtg||{})[iso]||{})[person]||null;
// Is this Admin block a scheduled event, or contract time the solver placed? Only the first
// belongs on a schedule. The admin dashboard has always hidden the second; the physician's own
// app was showing it as "Protected time", which is a tag for something nobody attends.
const isRealShift=(person,iso,shift)=>
  shift!=='Admin' || ((DATA.adminShown||{})[iso]||[]).includes(person);
function shiftLabel(person,iso,shift,short){
  if(shift==='Admin'){
    // "Admin" is a category in the solver, not a thing anyone is asked to attend. On the day of
    // a managing-team or triad meeting it IS that meeting and should say so; the rest is
    // protected time the solver placed to fill a contract. Either way the physician should not
    // be reading the word Admin off their own calendar and wondering what it means.
    const t=mtgTag(person,iso);
    if(t)return (short?(DATA.mtgShort||{}):(DATA.mtgLong||{}))[t]||t;
    return short?'Protected':'Protected time';
  }
  const m=META(shift);
  return short?(m.short||m.label):m.label;
}
const isICU=s=>DATA.icu.includes(s), isNOC=s=>DATA.noc.includes(s);
const f1=x=>Number.isInteger(x)?x:Math.round(x*100)/100;
/* Day equivalents to a tenth, for display only.
   A contract of 0.33 admin days a month times three blocks is 0.99, so a physician who is
   exactly level reads as 57.99 worked against 54 — hundredths of a shift that mean nothing to
   anybody and make a headline number look broken. The difference shown is worked-minus-contract
   AFTER both are rounded, so the three numbers on screen always agree with each other. */
const deN=x=>{const r=Math.round(x*10)/10; return Number.isInteger(r)?r:r.toFixed(1);};

/* ---------- identity ----------
   Identity is whoever the SERVER says you are. It used to come from decrypting a slot in the
   page, which meant the page had to contain everyone's schedule for anyone to read their own. */
let ACCT=null, ADMIN_HTML=null, ROLE='doctor', CAN_SWITCH=false, ME=null;
function setIdentity(person,role,label){
  ROLE=role||'doctor';
  // The account key is the last resort, not the name: it reads as "sam" or "Greco". The API
  // sends the label from the accounts table; a physician falls back to their own full name.
  ACCT={person,role:ROLE,label:label||fullOf(person)||person};
  CAN_SWITCH=(ROLE==='admin');
  // A physician is fixed to themselves. An admin who is also a physician (Nadon) opens on their
  // OWN schedule with a toggle to the admin view; an admin who is not (Sam) has no schedule of
  // their own, so they go straight to the admin view.
  ME=(person&&DATA.people.includes(person))?person:null;
  // Signing in should land on a SCHEDULE, not a dashboard — for an admin too. Nadon has a
  // schedule of their own; Sam, Zac and AB do not, so they resume whoever they were last
  // looking at. The admin view is then something you choose, not where you are dropped.
  if(!ME && ROLE==='admin'){
    try{ const last=localStorage.getItem('ccpsa_me');
         if(last && DATA.people.includes(last)) ME=last; }catch(e){}
  }
  // (IS_ADMIN_ONLY used to live here. It was computed once at sign-in and never again, so it
  // still said "admin only" after a physician had been chosen — boot() then bounced back to the
  // admin view. boot() asks !ME directly now.)
}
let BOOTED=false;

function initials(n){const p=DATA.providers[n]||{};return ((p.first||n)[0]+n[0]).toUpperCase();}
const firstOf=n=>((DATA.providers[n]||{}).first||n);
const fullOf=n=>{const p=DATA.providers[n]||{};return p.first?p.first+' '+n:n;};
function renderGate(filter){
  const list=$('#gateList');list.innerHTML='';
  const q=(filter||'').trim().toLowerCase();
  const ppl=DATA.people.filter(n=>!q||n.toLowerCase().includes(q)||((DATA.providers[n].first||'').toLowerCase().includes(q)));
  if(!ppl.length){list.innerHTML='<div style="padding:16px;color:var(--dim);font-size:13.5px">No one by that name. Check the spelling, or ask Sam to add you.</div>';return;}
  ppl.forEach(n=>{
    const p=DATA.providers[n];
    // Names only. Employed / APP / moonlighter / partner is a contracting distinction and has
    // no business on a screen whose only job is "open this person's schedule".
    const b=el('button','pitem',`<span class="av">${esc(initials(n))}</span>
      <span><span class="nm">${esc(p.first?p.first+' '+n:n)}</span></span>`);
    b.onclick=()=>{
      ME=n;try{localStorage.setItem('ccpsa_me',n);}catch(e){}   // survives a reload too
      MYREQ=null;
      const tab=(CUR&&CUR!=='admin')?CUR:'now';
      closeGate();
      hideAdminView();                 // viewing a physician is not the admin view
      boot();
      markBar('pick');
      go(tab);
    };
    list.appendChild(b);
  });
}
// The picker is a full-screen overlay (z-index above the header), so the admin toggle is
// painted over while it is open — you could get in but not back out. It carries its own way
// back, mirroring whatever the toggle offers.
let GATE_FROM=null;
function openGate(){
  GATE_FROM=document.querySelector('#admWrap.on')?'admin':'mine';
  const top=$('#gateTop');
  if(top){
    // The same three controls, not a lone back arrow: the overlay covers the header, so the
    // toggle has to exist here or it looks like it vanished.
    top.innerHTML=(ROLE==='admin'
        ?'<button class="gback" data-g="home">Home</button>'+
         '<button class="gback" data-g="admin">Admin view</button>':'')+
      '<button class="gback on" data-g="pick">Physicians</button>';
    top.querySelectorAll('.gback').forEach(bt=>bt.onclick=()=>{
      const v=bt.dataset.g;
      if(v==='pick')return;
      closeGate();
      if(v==='home'){showAdminHome();markBar('home');}
      else if(v==='admin'){showAdminView();markBar('admin');}
      else{hideAdminView();if(ME){boot();}markBar('pick');}
    });
  }
  $('#gate').style.display='block';$('#gateSearch').value='';renderGate('');
}
function closeGate(){$('#gate').style.display='none';}

/* ---------- switch physician, from the chip ---------- */
function closePicker(){
  const d=document.querySelector('.pdrop');
  if(d){ if(d._place)window.removeEventListener('resize',d._place); d.remove(); }
}
function togglePicker(){
  if(document.querySelector('.pdrop')){ closePicker(); return; }
  const chip=document.querySelector('#whoami');
  const d=el('div','pdrop');
  d.innerHTML='<div class="pds"><input id="pdq" type="search" placeholder="Search physicians" '+
              'autocapitalize="none" spellcheck="false"></div><div class="pdlist" id="pdl"></div>';
  document.body.appendChild(d);
  // Anchored to the chip itself. It used to hang off the header element, which put it below the
  // whole header — under the toggle bar, nowhere near the thing that was clicked.
  const place=()=>{
    const r=chip.getBoundingClientRect();
    d.style.top=Math.round(r.bottom+6)+'px';
    d.style.right=Math.max(8,Math.round(window.innerWidth-r.right))+'px';
  };
  place();
  window.addEventListener('resize',place);
  d._place=place;
  const paint=q=>{
    const t=(q||'').trim().toLowerCase();
    const ppl=DATA.people.filter(nm=>!t||nm.toLowerCase().includes(t)||
      ((DATA.providers[nm]||{}).first||'').toLowerCase().includes(t));
    const box=document.querySelector('#pdl');
    if(!ppl.length){ box.innerHTML='<div class="pdnone">Nobody by that name.</div>'; return; }
    box.innerHTML=ppl.map(nm=>`<button class="pdrow${nm===ME?' on':''}" data-p="${esc(nm)}">
        <span class="av">${esc(initials(nm))}</span><span>${esc(fullOf(nm))}</span></button>`).join('');
    box.querySelectorAll('.pdrow').forEach(b=>b.onclick=()=>{
      const nm=b.dataset.p;
      closePicker();
      if(nm===ME)return;                       // already on them; nothing to reload
      ME=nm; try{localStorage.setItem('ccpsa_me',nm);}catch(e){}
      MYREQ=null;
      const tab=(CUR&&CUR!=='admin')?CUR:'now';
      hideAdminView(); boot(); markBar('pick'); go(tab);
    });
  };
  paint('');
  const q=document.querySelector('#pdq');
  q.addEventListener('input',ev=>paint(ev.target.value));
  q.addEventListener('keydown',ev=>{
    if(ev.key==='Escape'){ closePicker(); return; }
    if(ev.key==='Enter'){ const first=document.querySelector('.pdrow'); if(first)first.click(); }
  });
  setTimeout(()=>q.focus(),40);
  // Clicking anywhere else closes it, which is what a menu does.
  setTimeout(()=>document.addEventListener('click',function once(ev){
    if(!ev.target.closest('.pdrop')&&!ev.target.closest('#whoami')){ closePicker(); }
    if(!document.querySelector('.pdrop'))document.removeEventListener('click',once);
  }),0);
}
function restoreFromGate(){
  if(GATE_FROM==='admin'){showAdminView();markBar('admin');}
  else{hideAdminView();markBar(ME?'pick':'home');if(!ME)showAdminHome();}
  // (openGate is kept only as the sign-in-time chooser; switching always uses the menu.)
}
function markBar(v){
  document.querySelectorAll('.ab').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
}
$('#gateSearch').addEventListener('input',e=>renderGate(e.target.value));
$('#whoami').onclick=e=>{
  // Switching physician is picking from a list, not going somewhere. It used to open a
  // full-screen page that replaced everything on screen and had to carry its own way back.
  if(CAN_SWITCH){ e.stopPropagation(); togglePicker(); return; }
  const who=(ACCT&&ACCT.label)||fullOf(ME)||'—';
  sheet('Your account',`
    <div class="row" style="margin-top:0"><span class="sp" style="background:var(--signal)"></span>
      <span><span class="t">${esc(who)}</span><span class="s">${ROLE==='admin'?'Administrator — full dashboard access':'Signed in'}</span></span></div>
    ${ME?`<div class="row"><span class="sp" style="background:var(--line2)"></span>
      <span><span class="t">Viewing</span><span class="s">${esc(fullOf(ME))}’s schedule</span></span></div>`:''}
    <div class="btnrow">
      ${CAN_SWITCH?'<button class="btn" id="acSwitch">View another physician</button>':''}
      <button class="btn gho" id="acOut">Sign out</button>
    </div>`);
  const sw=$('#acSwitch');if(sw)sw.onclick=()=>{closeSheet();openGate();};
  $('#acOut').onclick=()=>{
    try{localStorage.removeItem('__code');localStorage.removeItem('ccpsa_me');
        localStorage.removeItem('__dev');sessionStorage.clear();}catch(e){}
    location.reload();
  };
};

/* ---------- my data ---------- */
const dayOf=(n,iso)=>(DATA.day[n]||{})[iso]||null;
// When a shift starts, so a day's shifts read in the order they are worked. The schedule stores
// them in whatever order the solver produced, which put a 7pm night ahead of the 7am day shift
// beside it.
function startHour(sh){
  const h=DATA.kindHours[(META(sh)||{}).kind];
  return h ? h[0] : 7;                       // no clock time (Admin) sits with the day
}
function byTime(a,b){
  if(a.iso!==b.iso) return a.iso<b.iso?-1:1;
  return startHour(a.shift)-startHour(b.shift) ||
         String(a.shift).localeCompare(String(b.shift));
}
function myShifts(n){                       // [{iso, shift, meta}], in the order they are worked
  const out=[];
  DATA.dates.forEach(iso=>{const a=dayOf(n,iso);
    if(a)a.s.forEach(s=>{ if(isRealShift(n,iso,s)) out.push({iso,shift:s,m:META(s)}); });});
  return out.sort(byTime);
}
function counts(n){
  const c={icu:0,swing:0,noc:0,clinic:0,proc:0,jeop:0,admin:0,combo:0,wknd:0,worked:0};
  DATA.dates.forEach(iso=>{
    const a=dayOf(n,iso);if(!a)return;
    let hasD=false,hasN=false,real=false;
    a.s.forEach(s=>{const k=META(s).kind;
      if(k==='icu'){c.icu++;hasD=true;real=true;}
      else if(k==='noc'){c.noc++;hasN=true;real=true;}
      else if(k==='swing'){c.swing++;real=true;}
      else if(k==='clinic'){c.clinic++;real=true;}
      else if(k==='proc'){c.proc++;real=true;}
      else if(k==='jeop'){c.jeop++;}
      else if(k==='admin'&&s!=='IP Backup'){c.admin++;}
    });
    if(hasD&&hasN)c.combo++;
    if(real){c.worked++;if(dowOf(iso)>=5)c.wknd++;}
  });
  return c;
}
function targets(n){
  const p=DATA.providers[n]||{}, bm=p.bm||3;
  const t=v=>typeof v==='number'?Math.round(v*bm):null;
  return {day:t(p.icu),noc:t(p.noc),clinic:t(p.clinic),admin:typeof p.admin==='number'?p.admin*bm:null};
}
function deBalance(n){
  const c=counts(n),p=DATA.providers[n]||{},bm=p.bm||3;
  const adm=typeof p.admin==='number'?p.admin*bm:0;
  const worked=c.icu+c.swing+2*c.noc+c.clinic+c.proc+adm;
  const nn=k=>typeof p[k]==='number'?p[k]:0;
  /* MOONLIGHTERS HAVE NO CONTRACTED TOTAL. Their fields are all null — they pick up nights
     rather than owing a quarter's worth of them. Treating a missing contract as a contract of
     zero made every night they worked look like an overage: three nights, six day equivalents,
     reported as "+6 above contract". There is nothing to be above. */
  const hasContract=['icu','noc','clinic','admin'].some(k=>typeof p[k]==='number');
  const contract=(nn('icu')+2*nn('noc')+nn('clinic')+nn('admin'))*bm;
  return {worked:f1(worked), contract:f1(contract), bal:f1(worked-contract),
          hasContract, nights:c.noc};
}

/* ---------- add to home screen ----------
   Doctors check the schedule on a phone between cases, so the portal should live on the home
   screen next to their other apps, not in a browser tab behind twelve others. Installing also
   makes it open full-screen and keeps them signed in.
   The steps differ per platform and there is no way to trigger the iOS one from script, so we
   detect the platform and show the actual taps. Android/Chrome can be offered a real button. */
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /android/i.test(navigator.userAgent);
const IS_PHONE = IS_IOS || IS_ANDROID || window.matchMedia('(max-width: 820px)').matches;
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e;
  const b = $('#instBtn'); if (b) b.hidden = false; });

function installSteps(){
  if(IS_IOS) return `<ol class="steps">
      <li>Tap the <b>Share</b> button at the bottom of Safari
        <span class="ic">&#xFE0E;⬆︎</span></li>

  if(IS_ANDROID) return `<ol class="steps">
      <li>Tap the <b>⋮</b> menu at the top right of Chrome</li>
      <li>Tap <b>Add to Home screen</b> (or <b>Install app</b>)</li>
      <li>Tap <b>Add</b> to confirm</li>

  return `<ol class="steps">
      <li>Open <b>${esc(location.host)}/my/</b> on your phone</li>

      <li><b>Android:</b> ⋮ menu → Add to Home screen</li>
    </ol>
    <div class="note">On a computer you can bookmark this page instead.</div>`;
}
function openInstall(){
  sheet('Add to your home screen',
    `<div class="sub">Add it to your home screen and it opens full-screen, signed in, like an app.</div>
    ${installSteps()}
    <div class="btnrow">
      ${IS_IOS?'':'<button class="btn pri" id="instBtn" hidden>Install</button>'}

  const b=$('#instBtn');

function dismissInstall(){ try{localStorage.setItem('ccpsa_inst','1');}catch(e){} }
function installCard(){

/* ---------- who is on, for one day ----------
   Every shift and layered role for a date, in the order they are worked. This is the landing
   view: people open the app to see who they are working with. */
let DAYVIEW=null;
// Today is usually outside the block you are looking at (we build a quarter ahead), so clamp
// into it rather than showing an empty day.
function inBlockDay(iso){
  if(!DATA||!DATA.dates.length)return iso;
  if(DATA.dates.includes(iso))return iso;
  return iso<DATA.dates[0]?DATA.dates[0]:DATA.dates[DATA.dates.length-1];
}

/* ---------- block statistics ----------
   The contract tiles and day-equivalent balance used to sit on the home page. They are
   reference numbers you check occasionally, not something you open the app for, so they moved
   here behind your profile (client 8/17 #4). */
function blockStatsHTML(){
  if(!ME)return '<div class="empty">No physician selected.</div>';
  const c=counts(ME), tg=targets(ME), de=deBalance(ME);
  const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
  const dayN=c.icu+c.swing;
  /* DAY EQUIVALENTS GO FIRST. This was the last line of a sheet called "Block statistics",
     behind an unlabelled name chip — Sam went looking for it and could not find it. It is the
     number a physician actually wants from this screen, so it is the headline. */
  return `<div class="derow">
      <div class="dek">Day equivalents</div>
      ${de.hasContract
        ? (()=>{const w=deN(de.worked), c=deN(de.contract), d=Math.round((w-c)*10)/10;
                return `<div class="deval">${w}<span class="dedelta" style="color:${
                  d===0?'var(--dim)':(d>0?'#FBBF24':'#35D6A4')}">${
                  d===0?'level':(d>0?'+'+deN(d):'\u2212'+deN(Math.abs(d)))}</span></div>
                <div class="desub">worked, against a contract of <b>${c}</b>${
                  d===0?'':(d>0?' — above it':' — below it')}</div>`;})()
        : `<div class="deval">${deN(de.worked)}</div>
           <div class="desub">${de.nights?`<b>${de.nights}</b> night${de.nights===1?'':'s'} at 2 day
             equivalents each. `:''}Moonlighters have no contracted total to measure against.</div>`}
    </div>
    <div class="tiles">
    <div class="tile"><div class="k">Day shifts</div><div class="v">${dayN}${tg.day!=null?` <small>/ ${tg.day}</small>`:''}</div>
      <div class="f">ICU ${c.icu}${c.swing?` + swing ${c.swing}`:''}</div>
      ${tg.day!=null?`<div class="bar"><i style="width:${pct(dayN,tg.day)}%"></i></div>`:''}</div>
    <div class="tile"><div class="k">Nights</div><div class="v">${c.noc}${tg.noc!=null?` <small>/ ${tg.noc}</small>`:''}</div>
      <div class="f">${c.combo?c.combo+' as 24-hour':'&nbsp;'}</div>
      ${tg.noc!=null?`<div class="bar"><i style="width:${pct(c.noc,tg.noc)}%"></i></div>`:''}</div>
    <div class="tile"><div class="k">Clinic</div><div class="v">${c.clinic+c.proc}${tg.clinic?` <small>/ ${tg.clinic}</small>`:''}</div>
      <div class="f">${c.proc?c.proc+' EBUS':'&nbsp;'}</div></div>
    <div class="tile"><div class="k">Weekend days</div><div class="v">${c.wknd}</div>
      <div class="f">${c.worked} days on service</div></div>
  </div>
  <div class="note">Every off and CME day you asked for was granted this block.</div>`;
}

/* ---------- clinic staff ----------
   Client 8/17: clinic staff need to see every day and who is on each clinic that day, and
   nothing else. No personal schedule, no requests, no swaps — so this is its own view rather
   than the physician app with pieces hidden. */
const CLINIC_UNITS=['West Clinic','North Clinic','South Clinic','Central Clinic',
                    'Goodland Clinic','RHC-SAN','SAH EBUS','Porter EBUS'];
let CLINICDAY=null;
function clinicDayHTML(iso){
  if(!DATA.dates.includes(iso))return '<div class="empty">Outside this block.</div>';
  const rows=CLINIC_UNITS.map(u=>{
    const who=DATA.people.filter(p=>((DATA.day[p]||{})[iso]||{s:[]}).s.includes(u));
    return `<div class="onrow${who.length?'':' isrole'}">
      <span class="ondot" style="background:${who.length?META(u).color:'var(--line2)'}"></span>
      <span class="onshift">${esc(META(u).label||u)}</span>
      <span class="onwho">${who.length?who.map(x=>esc(fullOf(x))).join(', '):'<i>not running</i>'}</span></div>`;

/* ---------- stacked group view (admins) ----------
   Client 8/17: "sometimes the admin just wants to select a group of docs and see what their
   schedules look like stacked". Two shapes, because they answer different questions:
     grid    names down the left, dates across the top — who is on, at a glance, for a month
     stacked each person's calendar in turn — how one person's month actually reads
*/
let GSEL=new Set(), GMODE='grid', GMONTH=null;
function groupMonths(){const o=[];DATA.dates.forEach(i=>{const k=i.slice(0,7);if(!o.includes(k))o.push(k);});return o;}
function renderGroup(){
  const main=document.querySelector('main');
  let pane=document.querySelector('#pane-group');
  if(!pane){pane=el('section','pane');pane.id='pane-group';main.appendChild(pane);}
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-group'));
  document.querySelector('.tabs').style.display='none';
  const months=groupMonths(); GMONTH=GMONTH||months[0];
  const chosen=[...GSEL];
  pane.innerHTML=`
    <h2 class="sec">Compare physicians</h2>
    <div class="note" style="margin-top:0">Pick people, then choose how to look at them.</div>
    <div class="gpick" id="gPick">${DATA.people.map(p=>
      `<button class="pill gp${GSEL.has(p)?' on':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
    <div class="btnrow">
      <button class="btn${GMODE==='grid'?' pri':''}" data-gm="grid">Grid</button>
      <button class="btn${GMODE==='stack'?' pri':''}" data-gm="stack">Stacked calendars</button>
      <select class="inp" id="gMonth" style="max-width:150px">${months.map(m=>
        `<option value="${m}"${m===GMONTH?' selected':''}>${MONL[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')}</select>
      <button class="btn" id="gClear">Clear</button>
    </div>
    <div id="gBody">${chosen.length?(GMODE==='grid'?groupGrid(chosen):groupStack(chosen))
      :'<div class="empty">Choose one or more physicians above.</div>'}</div>`;
  pane.querySelectorAll('.gp').forEach(b=>b.onclick=()=>{
    const p=b.dataset.p; GSEL.has(p)?GSEL.delete(p):GSEL.add(p); renderGroup();});
  pane.querySelectorAll('[data-gm]').forEach(b=>b.onclick=()=>{GMODE=b.dataset.gm;renderGroup();});
  $('#gMonth').onchange=e=>{GMONTH=e.target.value;renderGroup();};
  $('#gClear').onclick=()=>{GSEL.clear();renderGroup();};
}
function groupGrid(people){
  const days=DATA.dates.filter(d=>d.slice(0,7)===GMONTH);
  const head=days.map(d=>`<th class="gh${dowOf(d)>=5?' we':''}">${d2(d).getDate()}<span>${DOW[dowOf(d)][0]}</span></th>`).join('');
  const rows=people.map(p=>`<tr><th class="gn">${esc(fullOf(p))}</th>${
    days.map(d=>{
      const a=(DATA.day[p]||{})[d];
      const sh=a&&a.s&&a.s.length?a.s[0]:null;
      const m=sh?META(sh):null;
      return `<td class="gc${dowOf(d)>=5?' we':''}"${sh?` style="background:${m.color}22;border-left:2px solid ${m.color}"`:''}
        title="${sh?esc(a.s.map(x=>META(x).label).join(' + ')):''}">${sh?esc(m.short||m.label):''}</td>`;
    }).join('')}</tr>`).join('');
  return `<div class="gwrap"><table class="gtab"><thead><tr><th class="gn"></th>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function groupStack(people){
  return people.map(p=>{
    const days=DATA.dates.filter(d=>d.slice(0,7)===GMONTH);
    const cells=days.map(d=>{
      const a=(DATA.day[p]||{})[d];
      const sh=a&&a.s&&a.s.length?a.s[0]:null;
      const m=sh?META(sh):null;
      return `<div class="scell${dowOf(d)>=5?' we':''}"${sh?` style="border-left:3px solid ${m.color}"`:''}>
        <span class="sd">${d2(d).getDate()}</span>
        <span class="ss">${sh?esc(shiftLabel(p,d,sh,true)):''}</span></div>`;
    }).join('');
    return `<div class="stackblk"><div class="lgh">${esc(fullOf(p))}</div>
      <div class="sgrid">${cells}</div></div>`;
  }).join('');
}

function whosOnHTML(iso){
  if(!DATA.dates.includes(iso))
    return '<div class="empty">Outside this block.</div>';
  const rows=[];
  DATA.people.forEach(p=>{
    const a=(DATA.day[p]||{})[iso];
    if(!a)return;
    (a.s||[]).forEach(sh=>{ if(isRealShift(p,iso,sh)) rows.push({sh,p,role:false}); });
    (a.r||[]).forEach(r=>rows.push({sh:r,p,role:true}));
  });
  if(!rows.length)return '<div class="empty">Nobody scheduled.</div>';
  // Everything worked in daylight first, then the swing, then the nights. Day Jeopardy and
  // Admin used to fall into a catch-all that sorted BELOW the night shifts, which read as though
  // they ran overnight.
  const ORDER={icu:0,clinic:1,proc:1,jeop:2,admin:3,swing:4,noc:5};
  const order=sh=>{const k=(META(sh)||{}).kind;return ORDER[k]!==undefined?ORDER[k]:6;};
  const byShift={};
  rows.forEach(r=>{(byShift[r.sh]=byShift[r.sh]||{role:r.role,who:[]}).who.push(r.p);});
  return Object.keys(byShift)
    .sort((a,b)=>order(a)-order(b)||String(a).localeCompare(String(b)))
    .map(sh=>{
      const m=META(sh), g=byShift[sh];
      return `<div class="onrow${g.role?' isrole':''}">
        <span class="ondot" style="background:${g.role?'var(--line2)':m.color}"></span>
        <span class="onshift">${esc(g.role?((DATA.roles[sh]||{}).label||sh):m.label)}</span>
        <span class="onwho">${g.who.map(x=>esc(fullOf(x))).join(', ')}</span></div>`;
    }).join('');
}
function wireDayNav(){
  const lab=$('#dayLabel'), box=$('#onToday');
  if(!lab||!box)return;
  const set=iso=>{DAYVIEW=iso;lab.textContent=fmtD(iso);box.innerHTML=whosOnHTML(iso);};
  const cur=()=>DAYVIEW||inBlockDay(todayISO());
  const p=$('#dayPrev'), n=$('#dayNext');
  if(p)p.onclick=()=>set(isoAdd(cur(),-1));
  if(n)n.onclick=()=>set(isoAdd(cur(),1));
}

/* THE NOW PAGE IS WHERE PEOPLE ACTUALLY LOOK. The subscription lives at the bottom of the
   schedule tab, which is a tab away and below a quarter of shifts. Offered here as well, once,

  let off=false; try{off=localStorage.getItem('ccpsa_subnudge')==='off';}catch(e){}
  if(off)return '';
  const whose=onBehalf()?fullOf(ME):null;
  return `<div class="swcard nudge" id="subNudge">
    <div class="lgh">${whose?'Put '+esc(whose)+"'s shifts in a calendar":'Put your shifts in your calendar'}</div>
    <div class="sub">They stay up to date on their own — a swap or a change reaches your calendar
      without you doing anything.</div>
    <div class="btnrow">
      <a class="btn pri" id="nudgeGo" href="${icsAbsolute().replace(/^https?:/,'webcal:')}">Subscribe</a>
      <button class="btn" id="nudgeNo">No thanks</button>
    </div>
  </div>`;
}
function wireNudge(){
  const no=$('#nudgeNo'), go=$('#nudgeGo');

                   const n=$('#subNudge'); if(n)n.remove(); };

function renderNow(){
  const pane=$('#pane-now');
  if(!ME){pane.innerHTML=`<div class="empty" style="margin-top:22px">Choose a physician to see a personal schedule.
    <div class="btnrow"><button class="btn pri" id="pickWho">Choose physician</button></div></div>`;
    $('#pickWho').onclick=openGate;return;}
  const t=todayISO();
  const all=myShifts(ME).sort(byTime);
  const next=all.find(s=>s.iso>=t)||all[0];
  const c=counts(ME),tg=targets(ME),de=deBalance(ME);
  let html=changeBanner();          // anything the scheduling lead changed goes first
  html+=installCard();              // ...then the home-screen nudge, until they act on it
  if(next){
    const m=next.m,days=Math.round((d2(next.iso)-d2(t))/864e5);
    const when=days<0?'First shift of the block':days===0?'Today':days===1?'Tomorrow':`In ${days} days`;
    const kindTxt=m.kind==='noc'?'Overnight · 7pm–7am':m.kind==='icu'?'Day shift · 7am–7pm':
                  m.kind==='swing'?'Swing · 1pm–11pm':m.kind==='clinic'?'Clinic · 8am–5pm':
                  m.kind==='admin'?'Protected time':m.kind==='jeop'?'Backup':'';
    const a=dayOf(ME,next.iso), also=a.s.filter(s=>s!==next.shift), roles=a.r||[];
    html+=`<div class="hero"><div class="spine" style="background:${m.color}"></div><div class="in">
      <div class="when">${esc(when)}</div>
      <div class="unit"><span class="dotU" style="background:${m.color};width:15px;height:15px"></span>${
        esc(shiftLabel(ME,next.iso,next.shift,false))}</div>
      <div class="sub">${esc(m.sub)}</div>
      ${also.length?`<div class="sub" style="margin-top:7px">Also that day: ${also.map(s=>esc(META(s).label)).join(' · ')}</div>`:''}
      ${roles.length?`<div class="sub" style="margin-top:5px;color:#F0ABFC">◆ ${roles.map(r=>esc((DATA.roles[r]||{label:r}).label)).join(' · ')}</div>`:''}
      <div class="date mono"><span>${esc(fmtLong(next.iso))}</span><span class="t">${esc(kindTxt)}</span></div>
    </div></div>`;
  }else{
    html+=`<div class="empty">No shifts scheduled this block.</div>`;
  }
  // week strip
  const start=(all.length&&t>DATA.dates[DATA.dates.length-1])?DATA.dates[0]
             :(t<DATA.dates[0]?DATA.dates[0]:t);
  html+=`<h2 class="sec">Next 7 days</h2><div class="wk7">`;
  for(let i=0;i<7;i++){
    const iso=isoAdd(start,i);
    const a=dayOf(ME,iso);
    const inBlock=DATA.dates.includes(iso);
    // A coloured pill told you *that* you worked, never *what* — which is the one thing you
    // want at a glance (client 8/17 #4).
    const wshown=(a?a.s:[]).filter(sh=>isRealShift(ME,iso,sh))
      .sort((x,y)=>startHour(x)-startHour(y));
    const names=wshown.length
      ? wshown.map(sh=>`<span class="w7s" style="border-left-color:${META(sh).color}">${esc(shiftLabel(ME,iso,sh,false))}</span>`).join('')
      : `<span class="w7off">${inBlock?'Off':'—'}</span>`;
    const roles=(a&&a.r&&a.r.length)
      ? a.r.map(r=>`<span class="w7r">${esc((DATA.roles[r]||{label:r}).label||r)}</span>`).join('') : '';
    html+=`<div class="w7d${iso===t?' today':''}" data-iso="${iso}">
      <div class="w7h"><b>${DOW[dowOf(iso)]}</b><span>${MON[d2(iso).getMonth()]} ${d2(iso).getDate()}</span></div>
      <div class="w7b">${names}${roles}</div></div>`;
  }
  html+='</div>';
  // Who is on, for the day you are looking at — with arrows to walk the block. The contract
  // tiles moved to Block Statistics (under your profile), because this is what people open the
  // app to find (client 8/17 #4).
  html+=`<h2 class="sec">Who's on <span class="daynav">
      <button class="navb" id="dayPrev" aria-label="Previous day">‹</button>
      <span id="dayLabel">${esc(fmtD(DAYVIEW||inBlockDay(t)))}</span>
      <button class="navb" id="dayNext" aria-label="Next day">›</button></span></h2>
    <div id="onToday">${whosOnHTML(DAYVIEW||inBlockDay(t))}</div>`;
  html+=subscribeNudge();     // after the schedule itself, before the footnote
  html+=`<div class="note">Every off and CME day you asked for was granted this block.</div>`;

function subscribeCard(){
