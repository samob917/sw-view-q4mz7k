<title>CCPSA Schedule — sign in</title>
<style>
 html{-webkit-text-size-adjust:100%}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:linear-gradient(135deg,#0b4a6f,#0e7490);min-height:100vh;min-height:100dvh;
      display:flex;align-items:center;justify-content:center}
 .card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(2,32,54,.45);
       padding:38px 42px;width:340px;max-width:calc(100vw - 32px);box-sizing:border-box;
       text-align:center}
 @media(max-width:430px){.card{padding:28px 20px;border-radius:14px}}
 .logo{font-size:34px}h1{font-size:19px;color:#0f172a;margin:10px 0 2px}
 .sub{font-size:13px;color:#64748b;margin-bottom:22px}
 /* 16px minimum: below that, iOS Safari auto-zooms on focus and the page stays zoomed/shifted */
 input[type=password]{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;
       border:1.5px solid #e2e8f0;border-radius:10px;outline:none;text-align:center}
 input[type=password]:focus{border-color:#0e7490}
 button{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:700;color:#fff;
       background:#0e7490;border:0;border-radius:10px;cursor:pointer}
 button:disabled{opacity:.6}
 .rem{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:14px;
      font-size:12.5px;color:#64748b}
 .err{color:#b91c1c;font-size:13px;min-height:18px;margin-top:10px;font-weight:600}
 .note{font-size:11px;color:#94a3b8;margin-top:16px;line-height:1.5}

<div class="card">
 <div class="logo">⚡</div><h1>Scheduling Wizard</h1>
 <div class="sub">CCPSA Critical Care — 2026 Q4 schedule</div>
 <form id="f"><label for="pw" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</label>
 <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
 <button id="go">Open schedule</button>
 <label class="rem"><input type="checkbox" id="rem" checked> Remember me on this device</label>
 <div class="err" id="err" role="alert" aria-live="assertive"></div></form>
 <div class="note">The schedule is encrypted — this page contains no readable data without the password.
 Need access? Contact Sam at Scheduling Wizard.</div>
</div>
<script>
// Browsers expose crypto.subtle only in a SECURE CONTEXT (https or localhost). Served over
// plain http the whole unlock path is undefined, so the password silently did nothing --
// which reads as "wrong password" to the user. Say so, and offer the https URL.
if(!window.isSecureContext||!(window.crypto&&crypto.subtle)){
  var h=location.host,p=location.pathname;
  document.querySelector('.card').innerHTML=
    '<div class="logo">&#128274;</div><h1>Use the secure link</h1>'+
    '<div class="sub">This page decrypts in your browser, which only works over <b>https</b>.</div>'+
    '<p style="margin:18px 0"><a style="color:#9ec7f5;font-size:15px" href="https://'+h+p+'">'+
    'https://'+h+p+'</a></p>'+
    '<div class="note">If that link is not ready yet, the certificate for this domain is still '+
    'being issued &mdash; it usually takes a few minutes. Nothing is wrong with your password.</div>';
}
</script>

function show(html){

    .then(function(pt){show(new TextDecoder().decode(pt));});

function tryPassword(pw,remember){
